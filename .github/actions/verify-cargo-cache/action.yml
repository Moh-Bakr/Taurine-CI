name: Verify restored Cargo crate archives
description: |
  Re-verifies every restored cargo `.crate` archive against the checksums in the private
  Cargo.lock files (a mismatching or unknown archive is deleted) and reports the cache state.
  The one copy of this check: the Linux, macOS and Windows concern workflows all call it.

inputs:
  sources-dir:
    description: Cargo home directory holding registry/cache (the cargo-home step output)
    required: true
  cache-hit:
    description: The restore step cache-hit output
    required: false
    default: ''
  os-label:
    description: Label for the summary line
    required: true

runs:
  using: composite
  steps:
    - name: Verify restored crate archives against Cargo.lock
      shell: bash
      working-directory: ${{ github.workspace }}/src
      env:
        CARGO_SOURCES_DIR: ${{ inputs.sources-dir }}
        CACHE_HIT: ${{ inputs.cache-hit }}
        OS_LABEL: ${{ inputs.os-label }}
      run: |
        set -euo pipefail
        # One pass: every checksum in every private Cargo.lock goes into a single list, one
        # awk join pairs each restored archive with its expected checksum, and one checksum
        # run checks them all. An archive that is in no lock, or whose hash differs, is
        # deleted, exactly as before; only the per-file process spawning is gone.
        expected="${RUNNER_TEMP}/crate-checksums.txt"
        : > "${expected}"
        while IFS= read -r lock; do
          tr -d '\r' < "${lock}" | awk '
            /^\[\[package\]\]/ { n = ""; v = ""; next }
            /^name = /     { gsub(/"/, "", $3); n = $3 }
            /^version = /  { gsub(/"/, "", $3); v = $3 }
            /^checksum = / { gsub(/"/, "", $3); if (n != "" && v != "") print n "-" v ".crate " $3 }
          ' >> "${expected}"
        done < <(find . -name Cargo.lock -not -path '*/node_modules/*' -not -path '*/target/*')
        kept=0
        dropped=0
        cache_dir="${CARGO_SOURCES_DIR}/registry/cache"
        if [[ -d "${cache_dir}" ]]; then
          find "${cache_dir}" -type f ! -name '*.crate' -delete
          work="${RUNNER_TEMP}/crate-verify"
          rm -rf "${work}"
          mkdir -p "${work}"
          (cd "${cache_dir}" && find . -type f -name '*.crate' -print) > "${work}/restored.txt"
          # The first checksum recorded for a file name wins, as the earlier per-file lookup did.
          awk -v unknown="${work}/unknown.txt" '
            NR == FNR { if (!($1 in want)) want[$1] = $2; next }
            { n = split($0, p, "/"); f = p[n]; if (f in want) print want[f] "  " $0; else print $0 > unknown }
          ' "${expected}" "${work}/restored.txt" > "${work}/check.txt"
          touch "${work}/unknown.txt"
          if command -v sha256sum >/dev/null 2>&1; then sum=(sha256sum); else sum=(shasum -a 256); fi
          (cd "${cache_dir}" && "${sum[@]}" -c "${work}/check.txt" 2>/dev/null || true) > "${work}/result.txt"
          kept="$(grep -c ': OK$' "${work}/result.txt" || true)"
          # Anything the checksum run did not report OK (mismatch, unreadable, missing line).
          awk -v result="${work}/result.txt" '
            BEGIN { while ((getline l < result) > 0) if (l ~ /: OK$/) { sub(/: OK$/, "", l); ok[l] = 1 } }
            { p = substr($0, index($0, "  ") + 2); if (!(p in ok)) print p }
          ' "${work}/check.txt" > "${work}/failed.txt"
          cat "${work}/unknown.txt" "${work}/failed.txt" > "${work}/drop.txt"
          while IFS= read -r crate; do
            if [[ -n "${crate}" ]]; then rm -f -- "${cache_dir}/${crate}"; fi
          done < "${work}/drop.txt"
          dropped="$(wc -l < "${work}/drop.txt" | tr -d ' ')"
        fi
        case "${CACHE_HIT}" in
          true) state='exact hit' ;;
          false) state='restored from an earlier lockfile' ;;
          *) state='miss' ;;
        esac
        echo "cargo-sources: ${state}; ${kept} archives verified, ${dropped} dropped"
        echo "- ${OS_LABEL} Cargo source cache: ${state} (${kept} verified, ${dropped} dropped)" >> "${GITHUB_STEP_SUMMARY}"
