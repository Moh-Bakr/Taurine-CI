name: Scanner concern
description: >
  Runs one security scanner over the checked-out private source and publishes only
  counts, rule ids and public advisory ids: never an excerpt, a matched value or a
  file path. gitleaks (secret scan of the working tree, redacted), npm audit
  signatures, high or critical npm advisories in production dependencies and
  Semgrep findings of ERROR severity fail the concern; the remaining npm advisories,
  the cargo-deny advisories and the other Semgrep severities are advisory-only and
  emit warnings, and cargo-deny's bans, licences and sources checks are enforced
  once deny-policy-fail is true. Tool binaries are pinned release downloads
  verified against a committed SHA-256.

inputs:
  scanner:
    description: >
      all (every scanner, each as its own step), or one of gitleaks, npm-audit, deny, clippy,
      semgrep; or semgrep-container, which only runs the Semgrep container (called before
      drop-root closes Docker) for a later all or semgrep call to report
    required: true
  path:
    description: Directory, relative to the workspace, holding the private source
    required: false
    default: src
  gitleaks-fail:
    description: >
      Whether a gitleaks finding fails the concern. Enforced (true) now that the known
      fixture keys are triaged in the source's allowlist; set to false, in a reviewed
      commit, to go back to warning only. Rule ids and counts only are ever published.
    required: false
    default: 'true'
  deny-policy-fail:
    description: >
      Whether an error from cargo-deny's bans, licenses or sources checks fails the
      concern. False reports the findings (crate names and lint codes) as warnings only;
      true enforces them. Advisories stay advisory-only either way.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install the pinned gitleaks release
      continue-on-error: ${{ inputs.scanner == 'all' }}
      if: ${{ inputs.scanner == 'gitleaks' || inputs.scanner == 'all' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        bin="${RUNNER_TEMP}/scan-bin"
        mkdir -p "${bin}"
        curl --fail --silent --show-error --location --retry 3 -o "${bin}/gitleaks.tar.gz" \
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"${bin}/gitleaks.tar.gz" | sha256sum --check --status
        tar xzf "${bin}/gitleaks.tar.gz" -C "${bin}" gitleaks
        "${bin}/gitleaks" version

    - name: Install the pinned cargo-deny release
      continue-on-error: ${{ inputs.scanner == 'all' }}
      if: ${{ inputs.scanner == 'deny' || inputs.scanner == 'all' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        bin="${RUNNER_TEMP}/scan-bin"
        mkdir -p "${bin}"
        curl --fail --silent --show-error --location --retry 3 -o "${bin}/cargo-deny.tar.gz" \
          https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
        echo '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  '"${bin}/cargo-deny.tar.gz" | sha256sum --check --status
        tar xzf "${bin}/cargo-deny.tar.gz" -C "${bin}" --strip-components 1 cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
        "${bin}/cargo-deny" --version

    - name: Scan for secrets with gitleaks
      id: scan-gitleaks
      continue-on-error: ${{ inputs.scanner == 'all' }}
      if: ${{ inputs.scanner == 'gitleaks' || inputs.scanner == 'all' }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      env:
        GITLEAKS_FAIL: ${{ inputs.gitleaks-fail }}
      run: |
        set -euo pipefail
        trap 'echo "$?" > "${RUNNER_TEMP}/scan-gitleaks.exit"' EXIT
        report="${RUNNER_TEMP}/gitleaks.json"
        config=()
        if [[ -f .gitleaks.toml ]]; then
          config=(--config .gitleaks.toml)
        fi
        # Working-tree scan (no history), values redacted in the report. The raw report
        # stays on the runner; only rule ids and counts are published, never a path.
        set +e
        "${RUNNER_TEMP}/scan-bin/gitleaks" dir . --redact --no-banner --report-format json --report-path "${report}" ${config[@]+"${config[@]}"} >"${RUNNER_TEMP}/gitleaks.log" 2>&1
        status=$?
        set -e
        if [[ "${status}" -ne 0 && "${status}" -ne 1 ]]; then
          echo 'gitleaks: failed to run (detailed output withheld)' >&2
          exit 1
        fi
        total=0
        if [[ -s "${report}" ]]; then
          total="$(jq 'length' "${report}")"
        fi
        {
          echo '## Secret scan (gitleaks)'
          echo
          echo "- Findings: ${total}"
          if [[ "${total}" -gt 0 ]]; then
            echo
            echo '| Rule | Findings |'
            echo '| --- | --- |'
            jq -r 'group_by(.RuleID) | map("| \(.[0].RuleID) | \(length) |") | .[]' "${report}"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"
        if [[ "${total}" -gt 0 ]]; then
          # Rule ids and counts only, in the step log as well as the summary, so a run's
          # triage list can be read without opening the summary.
          echo 'gitleaks per-rule counts:'
          jq -r 'group_by(.RuleID) | map("  \(.[0].RuleID): \(length)") | .[]' "${report}"
          if [[ "${GITLEAKS_FAIL}" == true ]]; then
            echo "gitleaks: ${total} finding(s); rule ids and counts are in the run summary (values and paths withheld)" >&2
            exit 1
          fi
          echo "::warning title=gitleaks::${total} finding(s), warning only while the known fixture keys are triaged; per-rule counts are in the run summary (values and paths withheld)"
          echo "- Mode: warning only (gitleaks-fail is false)" >> "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        echo 'gitleaks: no findings'

    - name: Check npm registry signatures and advisories
      id: scan-npm
      continue-on-error: ${{ inputs.scanner == 'all' }}
      if: ${{ inputs.scanner == 'npm-audit' || inputs.scanner == 'all' }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      run: |
        set -euo pipefail
        trap 'echo "$?" > "${RUNNER_TEMP}/scan-npm.exit"' EXIT
        source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
        failed=0
        failed_prod=0
        {
          echo '## npm audit'
          echo
          echo '| Workspace | Signatures | Advisories (info, low, moderate, high, critical) | Production high or critical |'
          echo '| --- | --- | --- | --- |'
        } >> "${GITHUB_STEP_SUMMARY}"
        for workspace in . taurine-desktop taurine-mobile; do
          [[ -f "${workspace}/package-lock.json" ]] || continue
          log="${RUNNER_TEMP}/npm-signatures-${workspace//\//_}.log"
          sig='verified'
          if ! (cd "${workspace}" && npm audit signatures) >"${log}" 2>&1; then
            sig='FAILED'
            failed=1
            # The registry's own count lines, and each affected package as a name hash only.
            grep -E '^[0-9]+ (packages? (has|have) (an )?(invalid|missing) )' "${log}" | head -5 >&2 || true
            grep -E '^[^ ]+@[0-9][^ ]*$' "${log}" | sed -E 's/@[0-9].*$//' | head -20 | while IFS= read -r sig_name; do echo "  ${workspace} $(name_hash "${sig_name}")"; done >&2 || true
          fi
          counts='unknown'
          if (cd "${workspace}" && npm audit --json) >"${RUNNER_TEMP}/npm-audit.json" 2>/dev/null || [[ -s "${RUNNER_TEMP}/npm-audit.json" ]]; then
            counts="$(jq -r '.metadata.vulnerabilities // {} | "\(.info // 0), \(.low // 0), \(.moderate // 0), \(.high // 0), \(.critical // 0)"' "${RUNNER_TEMP}/npm-audit.json" 2>/dev/null || echo unknown)"
            ids="$(jq -r '[.vulnerabilities[]?.via[]? | objects | .url // empty] | unique | .[]' "${RUNNER_TEMP}/npm-audit.json" 2>/dev/null | head -20 || true)"
            if [[ "${counts}" != '0, 0, 0, 0, 0' && "${counts}" != unknown ]]; then
              echo "::warning title=npm advisories::${workspace}: ${counts} (info, low, moderate, high, critical); advisory-only"
              if [[ -n "${ids}" ]]; then
                printf '%s\n' "${ids}" | sed -E 's#^.*/##; s/^/  advisory: /'
              fi
            fi
          fi
          # Production dependencies only (dev tooling is not shipped): a high or critical
          # advisory here fails the concern. The advisory-only warning above still lists
          # everything, development dependencies included. A result that cannot be read
          # fails closed, as the signature check does. Only a name hash, the severity and the
          # advisory ids are published (no dependency name), with a hint to read the names
          # locally.
          prod='unknown'
          prod_json="${RUNNER_TEMP}/npm-audit-prod.json"
          if (cd "${workspace}" && npm audit --omit=dev --json) >"${prod_json}" 2>/dev/null || [[ -s "${prod_json}" ]]; then
            prod="$(jq -r '.metadata.vulnerabilities | select(. != null) | ((.high // 0) + (.critical // 0))' "${prod_json}" 2>/dev/null || true)"
            [[ -n "${prod}" ]] || prod='unknown'
          fi
          if [[ "${prod}" == unknown ]]; then
            echo "npm audit ${workspace}: the production advisory result could not be read" >&2
            failed_prod=1
          elif [[ "${prod}" -gt 0 ]]; then
            echo "npm audit ${workspace}: ${prod} high or critical advisory finding(s) in production dependencies:" >&2
            npm_audit_detail "${prod_json}" >&2 || true
            echo "  names: run \`npm audit --omit=dev\` in ${workspace} of the private checkout" >&2
            echo "- ${workspace}: names are hashed (8 hex of the name's SHA-256); run \`npm audit --omit=dev\` in ${workspace} of the private checkout to see them" >> "${GITHUB_STEP_SUMMARY}"
            failed_prod=1
          fi
          echo "| ${workspace} | ${sig} | ${counts} | ${prod} |" >> "${GITHUB_STEP_SUMMARY}"
        done
        [[ "${failed}" -eq 0 ]] || { echo 'npm audit signatures: a registry signature check failed (name hashes above)' >&2; exit 1; }
        [[ "${failed_prod}" -eq 0 ]] || { echo 'npm audit: high or critical advisories in production dependencies (name hashes above)' >&2; exit 1; }

    - name: Run Semgrep Community Edition offline (ERROR severity enforced)
      id: scan-semgrep
      continue-on-error: ${{ inputs.scanner == 'all' }}
      if: ${{ inputs.scanner == 'semgrep' || inputs.scanner == 'all' || inputs.scanner == 'semgrep-container' }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      env:
        SCANNER: ${{ inputs.scanner }}
      run: |
        set -euo pipefail
        [[ "${SCANNER}" == semgrep-container ]] || trap 'echo "$?" > "${RUNNER_TEMP}/scan-semgrep.exit"' EXIT
        if [[ ! -d .semgrep/rules ]]; then
          [[ "${SCANNER}" == semgrep-container ]] && exit 0
          echo '- semgrep: no .semgrep/rules in the source; skipped' | tee -a "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        # .semgrepignore is read from the scan root automatically; there is no flag for it.
        report="${RUNNER_TEMP}/semgrep.json"
        container_status="${RUNNER_TEMP}/semgrep-container.status"
        # The official image, pinned by digest (version 1.140.0), run with no network: the
        # rules are the source's own, metrics and version checks are off, and nothing is
        # uploaded. The raw report stays on the runner.
        #
        # The container needs the Docker daemon, which is root-equivalent and is closed by the
        # drop-root composite before any project code runs. So the protected workflow calls
        # this action once with scanner semgrep-container, before drop-root, to run only the
        # container and record its exit status; the semgrep or all call then reads that report.
        # A call with no recorded status runs the container itself (Docker still open).
        if [[ "${SCANNER}" == semgrep-container || ! -f "${container_status}" ]]; then
          image='semgrep/semgrep@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6'
          set +e
          docker pull --quiet "${image}" >/dev/null \
            && docker run --rm --network none -v "${PWD}":/src:ro -v "${RUNNER_TEMP}":/out -w /src "${image}" \
              semgrep scan --config .semgrep/rules --metrics=off --disable-version-check --json --output /out/semgrep.json --quiet . >"${RUNNER_TEMP}/semgrep.log" 2>&1
          status=$?
          set -e
          if [[ "${SCANNER}" == semgrep-container ]]; then
            echo "${status}" > "${container_status}"
            echo "semgrep: container scan finished before root was removed (exit ${status})"
            exit 0
          fi
        else
          status="$(cat "${container_status}")"
        fi
        if [[ ! -s "${report}" ]]; then
          echo "semgrep: produced no report (exit ${status}; detailed output withheld)" >&2
          exit 1
        fi
        total="$(jq '.results | length' "${report}")"
        errors="$(jq '.errors | length' "${report}")"
        if [[ "${errors}" -gt 0 ]]; then
          # Rule or scan errors silently shrink the results (an unsupported rule language
          # drops findings), so they are always surfaced: counts per error type only.
          echo "::warning title=semgrep errors::${errors} rule or scan error(s); findings may be incomplete"
          echo 'semgrep error types:'
          jq -r '.errors | group_by(.type) | map("  \(.[0].type | if type == "array" then .[0] else . end): \(length)") | .[]' "${report}"
        fi
        {
          echo '## Semgrep (offline, ERROR severity enforced)'
          echo
          echo "- Findings: ${total}; scan errors: ${errors}"
          if [[ "${total}" -gt 0 ]]; then
            echo
            echo '| Rule | Findings |'
            echo '| --- | --- |'
            jq -r '.results | group_by(.check_id) | map("| \(.[0].check_id) | \(length) |") | .[]' "${report}"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"
        # ERROR severity is the source's own statement that a rule is a real defect (disabled
        # TLS verification, dynamic code); a finding of that severity fails the concern. INFO
        # and WARNING findings stay warnings, and scan errors above stay warnings too.
        blocking="$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' "${report}")"
        if [[ "${total}" -gt 0 ]]; then
          echo "::warning title=semgrep::${total} finding(s), ${blocking} of ERROR severity"
          echo 'semgrep per-rule counts:'
          jq -r '.results | group_by(.check_id) | map("  \(.[0].check_id) (\(.[0].extra.severity)): \(length)") | .[]' "${report}"
        else
          echo 'semgrep: no findings'
        fi
        if [[ "${blocking}" -gt 0 ]]; then
          echo "semgrep: ${blocking} finding(s) of ERROR severity; rule ids and counts are above (paths and excerpts withheld)" >&2
          exit 1
        fi
    - name: Check Rust advisories and dependency policy with cargo-deny
      id: scan-deny
      continue-on-error: ${{ inputs.scanner == 'all' }}
      if: ${{ inputs.scanner == 'deny' || inputs.scanner == 'all' }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      env:
        DENY_POLICY_FAIL: ${{ inputs.deny-policy-fail }}
      run: |
        set -euo pipefail
        trap 'echo "$?" > "${RUNNER_TEMP}/scan-deny.exit"' EXIT
        source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
        if [[ ! -f deny.toml ]]; then
          echo '- cargo-deny: no deny.toml in the source; skipped' | tee -a "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        if [[ "${DENY_POLICY_FAIL}" == true ]]; then policy_mode='enforced'; else policy_mode='report only'; fi
        {
          echo "## Rust advisories (advisory-only) and dependency policy (${policy_mode}), cargo-deny"
          echo
          echo '| Lockfile | Advisories | Policy errors | Policy warnings |'
          echo '| --- | --- | --- | --- |'
        } >> "${GITHUB_STEP_SUMMARY}"
        total=0
        policy_errors=0
        lock_index=0
        for manifest in Cargo.toml taurine-backend/dbx-core/Cargo.toml taurine-backend/dbx-mongo-shell/Cargo.toml; do
          [[ -f "${manifest}" ]] || continue
          out="${RUNNER_TEMP}/deny-$(echo "${manifest}" | tr '/' '_').jsonl"
          # cargo-deny writes its diagnostics as JSON lines on stderr. Only the advisory id
          # (no crate, no title) and, for policy findings, a name hash are published; the
          # manifest appears as its index in this list, never its path.
          lock_index=$((lock_index + 1))
          lock_label="lock #${lock_index}"
          deny_status=0
          # `--config` is a global option of cargo-deny, so it goes before `check`.
          "${RUNNER_TEMP}/scan-bin/cargo-deny" --manifest-path "${manifest}" --format json --config deny.toml check advisories >/dev/null 2>"${out}" || deny_status=$?
          if [[ "${deny_status}" -gt 1 ]]; then
            # An exit above 1 means the tool did not run its checks (usage, config or
            # fetch error). Its own error log lines carry no source content; published
            # after the shared path and token scrubbing.
            source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
            echo "cargo-deny ${lock_label}: did not complete (exit ${deny_status}); error lines:" >&2
            jq -r 'select(.type == "log") | select(.fields.level == "ERROR") | .fields.message' "${out}" 2>/dev/null | sanitize_stream | head -5 >&2 || true
          fi
          # Total diagnostics and the exit status show the scan really ran (a zero advisory
          # count with zero diagnostics and a failing status would mean it did not).
          echo "cargo-deny ${lock_label}: exit ${deny_status}, $(jq -s '[.[] | select(.type == "diagnostic")] | length' "${out}" 2>/dev/null || echo '?') diagnostics, $(jq -s 'length' "${out}" 2>/dev/null || echo '?') records"
          count="$(jq -s '[.[] | select(.type == "diagnostic") | select(.fields.advisory != null)] | length' "${out}" 2>/dev/null || echo 0)"
          total=$((total + count))
          if [[ "${count}" -gt 0 ]]; then
            echo "::warning title=Rust advisories::${lock_label}: ${count} advisory finding(s); advisory-only"
            deny_advisory_detail "${out}"
          fi

          # The dependency policy: bans (denied and, as configured, duplicate crates), licences
          # (the deny.toml allow-list) and sources (registries and git origins). Same published
          # shape as above: severity, lint code, crate name and version; a diagnostic's message
          # and labels (which can quote a source URL) are never published.
          policy_out="${RUNNER_TEMP}/deny-policy-$(echo "${manifest}" | tr '/' '_').jsonl"
          policy_status=0
          "${RUNNER_TEMP}/scan-bin/cargo-deny" --manifest-path "${manifest}" --format json --config deny.toml check bans licenses sources >/dev/null 2>"${policy_out}" || policy_status=$?
          if [[ "${policy_status}" -gt 1 ]]; then
            source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
            echo "cargo-deny policy ${lock_label}: did not complete (exit ${policy_status}); error lines:" >&2
            jq -r 'select(.type == "log") | select(.fields.level == "ERROR") | .fields.message' "${policy_out}" 2>/dev/null | sanitize_stream | head -5 >&2 || true
            policy_errors=$((policy_errors + 1))
          fi
          perr="$(jq -s '[.[] | select(.type == "diagnostic") | select((.fields.severity // "" | ascii_downcase) == "error")] | length' "${policy_out}" 2>/dev/null || echo 0)"
          pwarn="$(jq -s '[.[] | select(.type == "diagnostic") | select((.fields.severity // "" | ascii_downcase) == "warning")] | length' "${policy_out}" 2>/dev/null || echo 0)"
          echo "cargo-deny policy ${lock_label}: exit ${policy_status}, ${perr} error(s), ${pwarn} warning(s), $(jq -s '[.[] | select(.type == "diagnostic")] | length' "${policy_out}" 2>/dev/null || echo '?') diagnostics"
          echo "  policy diagnostics by severity and lint code:"
          jq -r 'select(.type == "diagnostic") | "\(.fields.severity // "?" | ascii_downcase) \(.fields.code // "-")"' "${policy_out}" 2>/dev/null | sort | uniq -c | sed 's/^/    /' | head -30 || true
          # Which crate, for everything except the duplicate-version noise (counted above): a
          # name hash, never the name.
          deny_policy_detail "${policy_out}" || true
          policy_errors=$((policy_errors + perr))
          echo "| ${lock_label} | ${count} | ${perr} | ${pwarn} |" >> "${GITHUB_STEP_SUMMARY}"
        done
        echo "cargo-deny: ${total} advisory finding(s) in total (advisory-only); ${policy_errors} dependency policy error(s) (${policy_mode})"
        echo 'cargo-deny: crate names are hashed (8 hex of the name SHA-256); run `cargo deny check` in the private checkout with its deny.toml to see them'
        echo '- cargo-deny: crate names are hashed (8 hex of the name SHA-256). Run `cargo deny check` in the private checkout, with its deny.toml, to see them.' >> "${GITHUB_STEP_SUMMARY}"
        if [[ "${policy_errors}" -gt 0 ]]; then
          if [[ "${DENY_POLICY_FAIL}" == true ]]; then
            echo "cargo-deny: ${policy_errors} dependency policy error(s) in bans, licences or sources (lint codes and name hashes above)" >&2
            exit 1
          fi
          echo "::warning title=cargo-deny policy::${policy_errors} dependency policy error(s) in bans, licences or sources; report only (deny-policy-fail is false)"
        fi

    - name: Run the security lints with clippy (warning only)
      id: scan-clippy
      continue-on-error: ${{ inputs.scanner == 'all' }}
      if: ${{ inputs.scanner == 'clippy' || inputs.scanner == 'all' }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      run: |
        set -euo pipefail
        trap 'echo "$?" > "${RUNNER_TEMP}/scan-clippy.exit"' EXIT
        # The lint list is the source's own [workspace.lints] table, read at run time and
        # passed on the command line as warnings, so no crate has to opt in and the list
        # stays in the private repository. Findings are warnings; only a failed build fails.
        flags="$(python3 - <<'PY'
        import tomllib
        with open('Cargo.toml', 'rb') as f:
            lints = tomllib.load(f).get('workspace', {}).get('lints', {})
        out = []
        for name in lints.get('rust', {}):
            out.append('-W ' + name)
        for name in lints.get('clippy', {}):
            out.append('-W clippy::' + name)
        print(' '.join(out))
        PY
        )"
        if [[ -z "${flags}" ]]; then
          echo '- clippy: no [workspace.lints] table in the source; skipped' | tee -a "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        raw="${RUNNER_TEMP}/clippy.jsonl"
        # shellcheck disable=SC2086
        cargo clippy --locked --workspace --exclude taurine-ovpn-sys --exclude taurine-net-conformance \
          --message-format=json -- ${flags} >"${raw}" 2>"${RUNNER_TEMP}/clippy.err" || true
        clippy_failed=0
        if jq -e 'select(.reason == "build-finished") | select(.success == false)' "${raw}" >/dev/null 2>&1; then
          clippy_failed=1
        elif ! jq -e 'select(.reason == "build-finished")' "${raw}" >/dev/null 2>&1; then
          clippy_failed=1
        fi
        if [[ "${clippy_failed}" -eq 1 ]]; then
          source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
          echo "clippy: the build did not finish ($(cargo_test_reason "${RUNNER_TEMP}/clippy.err"); sanitized detail below)" >&2
          # Cargo's own fixed failure shapes from stderr, then the error-level diagnostics
          # from the JSON stream as code, repository-relative path and line only.
          cargo_test_detail "${RUNNER_TEMP}/clippy.err"
          jq -r 'select(.reason == "compiler-message") | .message | select(.level == "error") | select(.spans | length > 0)
            | "  error \(.code.code // "-") \(.spans[0].file_name):\(.spans[0].line_start)"' "${raw}" 2>/dev/null \
            | sanitize_stream | head -20 >&2 || true
          exit 1
        fi
        # Only code, level, repository-relative path and line leave the runner: never the
        # rendered message, the source excerpt or the suggestion.
        findings="${RUNNER_TEMP}/clippy-findings.jsonl"
        jq -c 'select(.reason == "compiler-message") | .message | select(.code != null)
          | select(.spans | length > 0)
          | {code: .code.code, level: .level, path: (.spans[0].file_name | sub("^/.*/work/[^/]+/[^/]+/src/"; "")), line: .spans[0].line_start}' "${raw}" \
          | jq -c --argjson want "$(printf '%s\n' ${flags} | grep -v '^-W$' | sed 's/^/"/; s/$/"/' | paste -sd, - | sed 's/^/[/; s/$/]/')" 'select(.code as $c | $want | index($c))' >"${findings}" || true
        total="$(wc -l <"${findings}" | tr -d ' ')"
        {
          echo '## Security lints (clippy, warning only)'
          echo
          echo "- Findings: ${total}"
          if [[ "${total}" -gt 0 ]]; then
            echo
            echo '| Lint | Findings |'
            echo '| --- | --- |'
            jq -rs 'group_by(.code) | map("| \(.[0].code) | \(length) |") | .[]' "${findings}"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"
        if [[ "${total}" -gt 0 ]]; then
          echo "::warning title=clippy security lints::${total} finding(s), warning only"
          echo 'clippy per-lint counts:'
          jq -rs 'group_by(.code) | map("  \(.[0].code): \(length)") | .[]' "${findings}"
          echo 'clippy findings (code level path:line), first 40:'
          jq -r '"  \(.code) \(.level) \(.path):\(.line)"' "${findings}" | head -40
        else
          echo 'clippy: no findings'
        fi

    - name: Report every scanner and fail if any failed
      if: ${{ always() && inputs.scanner == 'all' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GITLEAKS_OUTCOME: ${{ steps.scan-gitleaks.outcome }}
        NPM_OUTCOME: ${{ steps.scan-npm.outcome }}
        SEMGREP_OUTCOME: ${{ steps.scan-semgrep.outcome }}
        DENY_OUTCOME: ${{ steps.scan-deny.outcome }}
        CLIPPY_OUTCOME: ${{ steps.scan-clippy.outcome }}
      run: |
        set -euo pipefail
        # Each scanner ran as its own step with its own sanitised report; a failure of one
        # did not stop the others. This step lists them with their exit codes and fails the
        # job if any failed (a skipped scanner counts as not run, never as passed).
        failed=0
        {
          echo '## Security scanners'
          echo
          echo '| Scanner | Outcome | Exit |'
          echo '| --- | --- | --- |'
        } >> "${GITHUB_STEP_SUMMARY}"
        for entry in "gitleaks|${GITLEAKS_OUTCOME}|gitleaks" "npm-audit|${NPM_OUTCOME}|npm" "semgrep|${SEMGREP_OUTCOME}|semgrep" "cargo-deny|${DENY_OUTCOME}|deny" "clippy|${CLIPPY_OUTCOME}|clippy"; do
          name="${entry%%|*}"
          rest="${entry#*|}"
          outcome="${rest%%|*}"
          tag="${rest#*|}"
          code="$(cat "${RUNNER_TEMP}/scan-${tag}.exit" 2>/dev/null || echo '-')"
          echo "scanner ${name}: ${outcome} (exit ${code})"
          echo "| ${name} | ${outcome} | ${code} |" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${outcome}" != success ]]; then failed=1; fi
        done
        [[ "${failed}" -eq 0 ]]
