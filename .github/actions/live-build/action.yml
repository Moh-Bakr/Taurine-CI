name: Build the live proof test binaries
description: >
  Builds the cargo test binaries for one live-proof arm, from the arm's definition
  that the arm workflow wrote to the runner's temp directory. A multi-suite arm
  lists its suites in suites.txt, which live-run reads too, so build and run cannot
  drift. Output goes to a runner-local log and only sanitized error excerpts are
  printed; nothing is published.

runs:
  using: composite
  steps:
    - name: Build the engine's proof test binary
      shell: bash
      working-directory: ${{ github.workspace }}/src
      run: |
        set -euo pipefail
        cargo_sanitize() {
          sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' "$1" |
            sed -E "s#${GITHUB_WORKSPACE}/src/##g" |
            sed -E 's#/home/runner/work/.*#<private-path>#g; s#(gh[pousr]_|github_pat_)[A-Za-z0-9_]+#<redacted>#g; s#Bearer [A-Za-z0-9._~+/=-]+#Bearer <redacted>#g' |
            cut -c1-200
        }
        cargo_diagnostic_summary() {
          local log="$1" target="$2" codes="" diagnostic_count="0" coded_count="0" unclassified_count="0"
          diagnostic_count="$(cargo_sanitize "${log}" | grep -Ec '^error(\[E[0-9]{4}\])?:' || true)"
          codes="$(cargo_sanitize "${log}" |
            { grep -E '^error\[E[0-9]{4}\]:' || true; } |
            sed -E 's/^error\[([^]]+)\]:.*/\1/' |
            LC_ALL=C sort | uniq -c |
            awk '{ if (out != "") out = out ","; out = out $2 "=" $1; total += $1 } END { printf "%s\n%s", out, total+0 }')"
          coded_lines="${codes%%$'\n'*}"
          coded_count="${codes##*$'\n'}"
          if (( coded_count > 0 )); then
            unclassified_count=$((diagnostic_count - coded_count))
            if [[ -n "${coded_lines}" ]]; then
              echo "proof-build: compiler diagnostics target=${target} codes=${coded_lines}" >&2
            fi
            if (( unclassified_count > 0 )); then
              echo "proof-build: compiler diagnostics target=${target} code=unclassified count=${unclassified_count}" >&2
            fi
          else
            echo "proof-build: compiler diagnostics target=${target} code=unclassified count=${diagnostic_count}" >&2
          fi
        }
        fixed_target_label() {
          case "$1:$2:$3" in
            pgtls:taurine-db-conformance:dbx_pg_tls_live|tls-legacy:taurine-db-conformance:dbx_pg_tls_live)
              printf '%s' 'dbx_pg_tls_live' ;;
            pgtls:taurine-db-conformance:dbx_pg_mtls_live)
              printf '%s' 'dbx_pg_mtls_live' ;;
            *) printf '%s' 'selected-live-proof-target' ;;
          esac
        }
        # Multi-suite arms run several cargo suites each, the ones
        # scripts/check-db.sh in the private repository lists for that engine.
        # One line per suite, from the arm definition:
        #   <package> <test targets, comma separated> [test-name filter]
        # A single-target arm has no suites and one conformance test target.
        arm="${RUNNER_TEMP}/live-arm.json"
        suites="${RUNNER_TEMP}/suites.txt"
        engine="$(jq -er '.engine' "${arm}")"
        jq -e '
          if .engine == "tls-legacy" then
            .cargo_features == ["taurine-db-dbx/legacy-tls"] and .suites == ["taurine-db-conformance dbx_pg_tls_live legacy"]
          elif .engine == "pgtls" then
            .cargo_features == ["taurine-db-dbx/dbx-pg", "taurine-db-dbx/legacy-tls"] and .suites == ["taurine-db-postgres live_tls", "taurine-db-conformance dbx_pg_tls_live dbx_tls_", "taurine-db-conformance dbx_pg_mtls_live dbx_pg_mtls_"]
          else (.cargo_features // []) == []
          end
        ' "${arm}" >/dev/null || { echo 'proof-build: unreviewed features or DBX suite definition' >&2; exit 1; }
        jq -r '(.suites // [])[]' "${arm}" > "${suites}"
        if jq -e 'any(.suites[]?; . == "taurine-db-conformance dbx_pg_tls_live dbx_tls_" or . == "taurine-db-conformance dbx_pg_tls_live legacy")' "${arm}" >/dev/null; then
          [[ -s taurine-backend/taurine-db-conformance/tests/dbx_pg_tls_live.rs ]] || {
            echo 'proof-build: required DBX TLS integration target is absent at the requested source SHA' >&2
            exit 1
          }
        fi
        if jq -e 'any(.suites[]?; . == "taurine-db-conformance dbx_pg_mtls_live dbx_pg_mtls_")' "${arm}" >/dev/null; then
          [[ -s taurine-backend/taurine-db-conformance/tests/dbx_pg_mtls_live.rs ]] || {
            echo 'proof-build: required DBX mTLS integration target is absent at the requested source SHA' >&2
            exit 1
          }
        fi
        if [[ -s "${suites}" ]]; then
          while read -r pkg targets _; do
            build_args=()
            if [[ "${engine}" == 'tls-legacy' ]]; then
              build_args+=(--features taurine-db-dbx/legacy-tls)
            elif [[ "${engine}" == 'pgtls' && "${targets}" == dbx_pg_mtls_live ]]; then
              build_args+=(--features taurine-db-dbx/dbx-pg --features taurine-db-dbx/legacy-tls)
            fi
            IFS=, read -ra tl <<< "${targets}"
            for t in "${tl[@]}"; do build_args+=(--test "${t}"); done
            if cargo test -p "${pkg}" "${build_args[@]}" --no-run \
              </dev/null >>"${RUNNER_TEMP}/build.log" 2>&1; then
              :
            else
              build_status=$?
              echo 'proof-build: failed; compiler diagnostics follow' >&2
              cargo_diagnostic_summary "${RUNNER_TEMP}/build.log" "$(fixed_target_label "${engine}" "${pkg}" "${targets}")"
              ruby "${GITHUB_WORKSPACE}/.github/policy/build-failure-category.rb" text "$(fixed_target_label "${engine}" "${pkg}" "${targets}")" "${build_status}" <"${RUNNER_TEMP}/build.log" >&2
              exit 1
            fi
          done < "${suites}"
        else
          target="$(jq -er '.target' "${arm}")"
          if cargo test -p taurine-db-conformance --test "${target}" --no-run \
            >"${RUNNER_TEMP}/build.log" 2>&1; then
            :
          else
            build_status=$?
            echo 'proof-build: failed; compiler diagnostics follow' >&2
            cargo_diagnostic_summary "${RUNNER_TEMP}/build.log" "$(fixed_target_label "${engine}" 'taurine-db-conformance' "${target}")"
            ruby "${GITHUB_WORKSPACE}/.github/policy/build-failure-category.rb" text "$(fixed_target_label "${engine}" 'taurine-db-conformance' "${target}")" "${build_status}" <"${RUNNER_TEMP}/build.log" >&2
            exit 1
          fi
        fi
        echo 'proof-build: passed'
