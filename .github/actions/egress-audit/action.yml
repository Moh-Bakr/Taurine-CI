name: Egress audit
description: >
  Records the outbound network destinations a source-bearing job contacts while
  private project code runs, using only tools already on the runner image (no
  third-party Action, no vendor telemetry). Two phases: start, called straight
  after the source-checkout composite (the token is already revoked), and report,
  called last under always(), which publishes the allow-listed host names (any
  other name only as a SHA-256 prefix) and destination ports to the job log and
  summary. Audit only: it never blocks a
  connection and never fails the job. The recorders start as root before the
  drop-root composite removes sudo, and keep running as root; project code no
  longer has root on Linux or macOS, but it can still write the runner-owned
  record files and has administrator rights on Windows, so this is evidence for
  building an allow-list, not a control.

  Coverage per runner: Linux records every DNS answer from systemd-resolved
  (resolvectl monitor) and logs every new outbound connection from the host and
  from Docker containers (iptables/ip6tables LOG); a job container (the Linux
  visual tier) is not covered. macOS captures DNS traffic and outbound TCP SYNs
  on the default interface with the built-in tcpdump. Windows records every DNS
  query through the DNS Client operational event log (names only, no connection
  log).

inputs:
  phase:
    description: start or report
    required: true

runs:
  using: composite
  steps:
    - name: Start the egress audit (Linux, macOS)
      if: ${{ inputs.phase == 'start' && runner.os != 'Windows' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -uo pipefail
        state="${RUNNER_TEMP}/egress-audit"
        mkdir -p "${state}"
        date +%s > "${state}/started"
        coverage=()
        if [[ -f /.dockerenv ]]; then
          echo 'job container: the host network is not visible from inside it' > "${state}/coverage"
          exit 0
        fi
        if ! sudo -n true 2>/dev/null; then
          echo 'no passwordless sudo' > "${state}/coverage"
          exit 0
        fi
        if [[ "${RUNNER_OS}" == 'Linux' ]]; then
          if resolvectl --help 2>/dev/null | grep -q 'monitor'; then
            # Line-buffered so the record survives an abrupt end of the job. The
            # redirect is deliberately the runner user's, so the report can read it.
            # shellcheck disable=SC2024
            sudo -n nohup stdbuf -oL resolvectl monitor --json=short \
              >"${state}/dns.jsonl" 2>"${state}/dns.err" </dev/null &
            echo "$!" > "${state}/dns.pid"
            coverage+=('DNS answers (resolvectl monitor)')
          fi
          logged=0
          for table in iptables ip6tables; do
            # One audit chain, entered from OUTPUT (the host) and DOCKER-USER (containers,
            # such as live-proof servers and the Keel Dock PostgreSQL). Loopback and the
            # Docker bridges are local traffic; only new connections that leave are logged.
            # iptables accepts one -o per rule, hence the RETURN rules.
            sudo -n "${table}" -w -N EGRESS_AUDIT 2>/dev/null || continue
            sudo -n "${table}" -w -A EGRESS_AUDIT -o lo -j RETURN
            sudo -n "${table}" -w -A EGRESS_AUDIT -o docker+ -j RETURN
            sudo -n "${table}" -w -A EGRESS_AUDIT -o br-+ -j RETURN
            if sudo -n "${table}" -w -A EGRESS_AUDIT -m conntrack --ctstate NEW \
              -j LOG --log-prefix 'egress-audit: ' --log-level 6 2>"${state}/${table}.err" \
              && sudo -n "${table}" -w -I OUTPUT 1 -j EGRESS_AUDIT 2>>"${state}/${table}.err"; then
              logged=1
            fi
            if sudo -n "${table}" -w -L DOCKER-USER -n >/dev/null 2>&1; then
              sudo -n "${table}" -w -I DOCKER-USER 1 -j EGRESS_AUDIT 2>/dev/null || true
            fi
          done
          if (( logged )); then
            coverage+=('new outbound connections (iptables LOG)')
          else
            # The iptables error text only, so a missing recorder is diagnosable.
            echo "egress-audit: connection logging unavailable: $(head -c 300 "${state}/iptables.err" 2>/dev/null)"
          fi
        else
          iface="$(route -n get default 2>/dev/null | awk '/interface:/ { print $2; exit }')"
          if [[ -n "${iface}" ]]; then
            # DNS in both directions, IPv4 TCP SYNs, and IPv6 TCP SYNs (no extension headers).
            # shellcheck disable=SC2024
            sudo -n nohup tcpdump -n -l -i "${iface}" -s 512 \
              'udp port 53 or tcp port 53 or (tcp[tcpflags] & (tcp-syn|tcp-ack) == tcp-syn) or (ip6 and ip6[6] == 6 and (ip6[53] & 0x12) == 0x02)' \
              >"${state}/tcpdump.txt" 2>"${state}/tcpdump.err" </dev/null &
            echo "$!" > "${state}/tcpdump.pid"
            coverage+=("DNS and TCP SYNs on ${iface} (tcpdump)")
          fi
        fi
        if (( ${#coverage[@]} )); then
          (IFS=';'; echo "${coverage[*]}") > "${state}/coverage"
        else
          echo 'no recorder could be started' > "${state}/coverage"
        fi
        echo "egress-audit: started ($(cat "${state}/coverage"))"
        exit 0

    - name: Start the egress audit (Windows)
      if: ${{ inputs.phase == 'start' && runner.os == 'Windows' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        $state = Join-Path $env:RUNNER_TEMP 'egress-audit'
        New-Item -ItemType Directory -Force -Path $state | Out-Null
        [DateTime]::UtcNow.ToString('o') | Set-Content (Join-Path $state 'started')
        try {
          # 256 MiB so a long job does not wrap the log.
          wevtutil sl Microsoft-Windows-DNS-Client/Operational /e:true /ms:268435456 /q:true
          if ($LASTEXITCODE -eq 0) { 'DNS queries (DNS Client operational log)' | Set-Content (Join-Path $state 'coverage') }
          else { 'the DNS Client log could not be enabled' | Set-Content (Join-Path $state 'coverage') }
        } catch {
          'the DNS Client log could not be enabled' | Set-Content (Join-Path $state 'coverage')
        }
        Write-Output "egress-audit: started ($(Get-Content (Join-Path $state 'coverage')))"
        exit 0

    - name: Report observed egress (Linux, macOS)
      if: ${{ always() && inputs.phase == 'report' && runner.os != 'Windows' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -uo pipefail
        state="${RUNNER_TEMP}/egress-audit"
        [[ -f "${state}/started" ]] || { echo 'egress-audit: not started in this job'; exit 0; }
        started="$(cat "${state}/started")"
        coverage="$(cat "${state}/coverage" 2>/dev/null || echo unknown)"
        names="${state}/names.txt"; conns="${state}/conns.txt"; map="${state}/map.txt"
        : > "${names}"; : > "${conns}"; : > "${map}"
        # Best effort: once drop-root has removed sudo the root recorders cannot be signalled,
        # so they run on until the runner is discarded and their line-buffered files are read
        # as they stand.
        for pidfile in "${state}/dns.pid" "${state}/tcpdump.pid"; do
          [[ -f "${pidfile}" ]] || continue
          sudo -n kill -INT "$(cat "${pidfile}")" 2>/dev/null || true
        done
        sleep 1
        if [[ "${RUNNER_OS}" == 'Linux' ]]; then
          if [[ -s "${state}/dns.jsonl" ]]; then
            # name<TAB>address for every A/AAAA answer, and every queried name.
            jq -r '
              # IPv6 in the full, uncompressed form the kernel LOG target prints.
              def hexd: . as $d | "0123456789abcdef" | .[$d:$d + 1];
              def addr: if length == 4 then map(tostring) | join(".")
                elif length == 16 then [range(0; 16; 2) as $i | (.[$i] * 256 + .[$i + 1])]
                  | map([(. / 4096 | floor), ((. / 256 | floor) % 16), ((. / 16 | floor) % 16), (. % 16)]
                    | map(hexd) | join("")) | join(":")
                else empty end;
              (.. | objects | select(has("key") and (.address | type) == "array")
                | "\(.key.name)\t\(.address | addr)"),
              (.. | objects | select(has("name") and has("type") and (.name | type) == "string") | "\(.name)\t-")
            ' "${state}/dns.jsonl" 2>/dev/null | sed -E 's/\.(\t)/\1/' | sort -u > "${map}" || true
          fi
          # The kernel LOG lines, from the journal or, failing that, the ring buffer. Root is gone
          # by now (drop-root), so the journal is read as the job user, which the hosted image
          # puts in the systemd-journal and adm groups; sudo stays as the fallback for a job
          # that still has it.
          { journalctl -k -o cat --no-pager --since "@${started}" 2>/dev/null | grep 'egress-audit: ' \
            || sudo -n journalctl -k -o cat --no-pager --since "@${started}" 2>/dev/null | grep 'egress-audit: ' \
            || sudo -n dmesg 2>/dev/null | grep 'egress-audit: '; } \
            | sed -nE 's/.* DST=([^ ]+) .* PROTO=([A-Z0-9]+).* DPT=([0-9]+).*/\1 \2 \3/p' > "${conns}" || true
        else
          if [[ -s "${state}/tcpdump.txt" ]]; then
            awk '
              # Query: "<src>.<port> > <dns>.53: <id>[+] A? name. (n)"
              / > [^ ]+\.53: [0-9]+/ && /\? / {
                for (i = 1; i <= NF; i++) if ($i ~ /\?$/ && i < NF) { n = $(i + 1); sub(/\.$/, "", n); print n "\t-"
                  id = $0; sub(/.*\.53: /, "", id); sub(/[^0-9].*/, "", id); q[id] = n }
                next
              }
              # Answer: "<dns>.53 > <dst>.<port>: <id> 2/0/0 A a.b.c.d, AAAA x:y (n)"
              /\.53 > / {
                id = $0; sub(/.*: /, "", id); sub(/[^0-9].*/, "", id)
                if (!(id in q)) next
                for (i = 1; i < NF; i++) if ($i == "A" || $i == "AAAA") { a = $(i + 1); sub(/,$/, "", a); print q[id] "\t" a }
                next
              }
            ' "${state}/tcpdump.txt" | sort -u > "${map}" || true
            awk '
              /Flags \[S\]/ {
                for (i = 1; i <= NF; i++) if ($i == ">") { d = $(i + 1); sub(/:$/, "", d)
                  p = d; sub(/.*\./, "", p); sub(/\.[^.]*$/, "", d); print d " TCP " p }
              }
            ' "${state}/tcpdump.txt" > "${conns}" || true
          fi
        fi
        # Every name seen (queried, resolved or a CNAME target). The full list stays on the
        # runner: only names on the reviewed allow-list are published; any other name, however
        # it is shaped, is published as a truncated SHA-256 (internal, customer or
        # exfiltration-shaped names must never reach a public log).
        cut -f1 "${map}" | tr '[:upper:]' '[:lower:]' | tr -d ' ' | grep -v '^$' | sort -u > "${names}"
        pats="${state}/patterns.txt"
        if [[ -f "${GITHUB_WORKSPACE}/.github/egress-allowlist.txt" ]]; then
          sed -E 's/#.*//' "${GITHUB_WORKSPACE}/.github/egress-allowlist.txt" | awk 'NF >= 2 { print tolower($2) }' | sort -u > "${pats}"
        else
          : > "${pats}"
        fi
        hash12() {
          if command -v sha256sum >/dev/null 2>&1; then printf '%s' "$1" | sha256sum | cut -c1-12
          else printf '%s' "$1" | shasum -a 256 | cut -c1-12; fi
        }
        # name -> published label: the name itself when an exact entry or a "*.suffix" entry
        # (subdomains only) matches it, else unlisted:<hash>.
        labels="${state}/labels.txt"
        awk 'NR == FNR { p[$1] = 1; next }
          { n = $1; ok = (n in p); s = n
            while (!ok && (i = index(s, ".")) > 0) { s = substr(s, i + 1); if (("*." s) in p) ok = 1 }
            print n, ok }' "${pats}" "${names}" |
          while read -r n ok; do
            if [[ "${ok}" == 1 ]]; then echo "${n} ${n}"; else echo "${n} unlisted:$(hash12 "${n}")"; fi
          done > "${labels}"
        # address -> label, preferring a listed name.
        iplabels="${state}/iplabels.txt"
        awk 'NR == FNR { l[$1] = $2; next }
          { split($0, f, "\t"); n = tolower(f[1]); a = f[2]
            if (a == "-" || !(n in l)) next
            if (!(a in best) || (best[a] ~ /^unlisted:/ && l[n] !~ /^unlisted:/)) best[a] = l[n] }
          END { for (a in best) print a, best[a] }' "${labels}" "${map}" > "${iplabels}"
        report="${state}/report.txt"
        : > "${report}"
        while read -r ip proto port; do
          if [[ "${ip}" =~ ^(127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.|168\.63\.129\.16$|::1$|0000:0000:0000:0000:0000:0000:0000:0001$|fe80:|fd) ]]; then
            label=local
          else
            label="$(awk -v a="${ip}" '$1 == a { print $2; exit }' "${iplabels}")"
            [[ -n "${label}" ]] || label="unresolved:$(hash12 "${ip}")"
          fi
          echo "${label} ${proto}/${port}"
        done < "${conns}" | tr '[:upper:]' '[:lower:]' | sort | uniq -c | awk '{ print $2, $3, $1 }' > "${report}"
        listed="$(awk '$2 !~ /^unlisted:/ { print $2 }' "${labels}")"
        unlisted="$(awk '$2 ~ /^unlisted:/ { print $2 }' "${labels}" | sort -u)"
        # Defence in depth: the shared sanitiser when this job installed it, then only lines
        # made of host-name, label and count characters survive (no fence or markup break-out).
        publish() {
          if [[ -f "${RUNNER_TEMP}/taurine-ci/sanitize.sh" ]]; then
            # shellcheck source=/dev/null
            ( . "${RUNNER_TEMP}/taurine-ci/sanitize.sh" && sanitize_stream )
          else
            cat
          fi | grep -E '^[a-z0-9_.:*/ -]{1,200}$' || true
        }
        n_listed="$(printf '%s\n' "${listed}" | grep -c . || true)"
        n_unlisted="$(printf '%s\n' "${unlisted}" | grep -c . || true)"
        echo "::group::egress-audit (${RUNNER_OS}, audit mode)"
        echo "egress-audit: coverage ${coverage}"
        echo "egress-audit: ${n_listed} allow-listed names, ${n_unlisted} unlisted names (hashed)"
        printf '%s\n' "${listed}" | publish | sed 's/^/egress-audit-name: /'
        printf '%s\n' "${unlisted}" | publish | sed 's/^/egress-audit-unlisted: /'
        publish < "${report}" | sed 's/^/egress-audit-dest: /'
        echo '::endgroup::'
        {
          printf '### Egress audit (audit mode, nothing blocked)\n\n'
          printf -- '- Coverage: %s\n- %d allow-listed host names, %d unlisted (published as a SHA-256 prefix only), %d destination/port pairs\n\n' \
            "${coverage}" "${n_listed}" "${n_unlisted}" "$(wc -l < "${report}" | tr -d ' ')"
          if (( n_listed + n_unlisted > 0 )); then
            printf '<details><summary>Host names</summary>\n\n```\n'
            { printf '%s\n' "${listed}"; printf '%s\n' "${unlisted}"; } | publish | head -n 300
            printf '```\n</details>\n\n'
          fi
          if [[ -s "${report}" ]]; then
            printf '<details><summary>Destinations (label proto/port connections)</summary>\n\n```\n'
            publish < "${report}" | head -n 300
            printf '```\n</details>\n'
          fi
        } >> "${GITHUB_STEP_SUMMARY}"
        exit 0

    - name: Report observed egress (Windows)
      if: ${{ always() && inputs.phase == 'report' && runner.os == 'Windows' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}
      run: |
        $state = Join-Path $env:RUNNER_TEMP 'egress-audit'
        $startedFile = Join-Path $state 'started'
        if (-not (Test-Path $startedFile)) { Write-Output 'egress-audit: not started in this job'; exit 0 }
        $started = [DateTime]::Parse((Get-Content $startedFile), $null, 'RoundtripKind').ToLocalTime()
        $coverage = Get-Content (Join-Path $state 'coverage') -ErrorAction SilentlyContinue
        $names = @()
        try {
          # 3006: a DNS query is called for the name in the first property.
          $names = @(Get-WinEvent -FilterHashtable @{ LogName = 'Microsoft-Windows-DNS-Client/Operational'; Id = 3006; StartTime = $started } -ErrorAction Stop |
            ForEach-Object { "$($_.Properties[0].Value)".ToLowerInvariant().TrimEnd('.') } |
            Where-Object { $_ -match '^[a-z0-9_-]+(\.[a-z0-9_-]+)+$' } | Sort-Object -Unique)
        } catch { $names = @() }
        # The full list stays on the runner: only allow-listed names are published, any other
        # name as a truncated SHA-256 (see the Linux and macOS step).
        $patterns = @()
        $allowFile = Join-Path $env:GITHUB_WORKSPACE '.github/egress-allowlist.txt'
        if (Test-Path $allowFile) {
          $patterns = @(Get-Content $allowFile | ForEach-Object { ($_ -replace '#.*', '').Trim() } |
            Where-Object { $_ } | ForEach-Object { (($_ -split '\s+')[1]).ToLowerInvariant() } | Sort-Object -Unique)
        }
        $sha = [System.Security.Cryptography.SHA256]::Create()
        $listed = @(); $unlisted = @()
        foreach ($n in $names) {
          $ok = $patterns -contains $n
          $s = $n
          while (-not $ok -and $s.Contains('.')) { $s = $s.Substring($s.IndexOf('.') + 1); if ($patterns -contains "*.$s") { $ok = $true } }
          if ($ok) { $listed += $n }
          else {
            $h = -join ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($n)) | ForEach-Object { $_.ToString('x2') })
            $unlisted += "unlisted:$($h.Substring(0, 12))"
          }
        }
        $unlisted = @($unlisted | Sort-Object -Unique)
        # Only host-name and label characters are ever published (no fence or markup break-out).
        $safe = '^[a-z0-9_.:*/ -]{1,200}$'
        $listed = @($listed | Where-Object { $_ -match $safe })
        $unlisted = @($unlisted | Where-Object { $_ -match $safe })
        Write-Output '::group::egress-audit (Windows, audit mode)'
        Write-Output "egress-audit: coverage $coverage"
        Write-Output "egress-audit: $($listed.Count) allow-listed names, $($unlisted.Count) unlisted names (hashed)"
        foreach ($n in $listed) { Write-Output "egress-audit-name: $n" }
        foreach ($n in $unlisted) { Write-Output "egress-audit-unlisted: $n" }
        Write-Output '::endgroup::'
        $summary = @('### Egress audit (audit mode, nothing blocked)', '', "- Coverage: $coverage",
          "- $($listed.Count) allow-listed host names, $($unlisted.Count) unlisted (published as a SHA-256 prefix only); Windows records names, not connections", '')
        if (($listed.Count + $unlisted.Count) -gt 0) {
          $summary += '<details><summary>Host names</summary>'
          $summary += ''
          $summary += '```'
          $summary += @(($listed + $unlisted) | Select-Object -First 300)
          $summary += '```'
          $summary += '</details>'
        }
        $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY
        exit 0
