name: Run result
description: >
  One verdict for a dispatch. Lists the run's concern jobs, compares them with the
  expected list and writes a summary with the exact source SHA, selection mode, a
  table (concern, conclusion) and the verdict. Only an explicit full selection can
  pass as full, and every expected concern must run successfully; a partial selection
  never becomes full merely because every planned concern ran. Any failed or ambiguous
  concern, or no concern running at all, fails this step.

inputs:
  label:
    description: Platform label for the heading
    required: true
  expected-concerns:
    description: JSON array of every concern the workflow can run
    required: true
  required-concerns:
    description: JSON array of concerns that must have run; one that is missing or skipped fails the verdict instead of counting as not selected
    required: false
    default: '[]'
  name-pattern:
    description: Regular expression with a named group concern matching job names
    required: true
  source-sha:
    description: The exact source SHA that was requested
    required: true
  base-sha:
    description: The base SHA a partial selection was computed against, if any
    required: false
    default: ''
  selection-mode:
    description: Explicit dispatch selection contract; only reviewed full mode may attest a full run
    required: true
  github-token:
    description: Token with actions read, for listing the run's jobs
    required: true

runs:
  using: composite
  steps:
    - name: Write the run verdict
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        LABEL: ${{ inputs.label }}
        EXPECTED: ${{ inputs.expected-concerns }}
        REQUIRED: ${{ inputs.required-concerns }}
        NAME_PATTERN: ${{ inputs.name-pattern }}
        REQUESTED_SOURCE_SHA: ${{ inputs.source-sha }}
        BASE_SHA: ${{ inputs.base-sha }}
        SELECTION_MODE: ${{ inputs.selection-mode }}
      run: |
        set -euo pipefail
        case "${SELECTION_MODE}" in
          full|partial) ;;
          *) echo 'run-result rejected invalid selection mode' >&2; exit 1 ;;
        esac
        if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ || ( -n "${BASE_SHA}" && ! "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ) ]]; then
          echo 'run-result rejected invalid source identity' >&2
          exit 1
        fi
        if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$")) and length == (unique | length)' <<<"${EXPECTED}" >/dev/null 2>&1 ||
          ! jq -e --argjson expected "${EXPECTED}" 'type == "array" and all(.[]; . as $c | ($c | type) == "string" and ($c | test("^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$")) and ($expected | index($c) != null)) and length == (unique | length)' <<<"${REQUIRED}" >/dev/null 2>&1; then
          echo 'run-result rejected invalid concern contract' >&2
          exit 1
        fi
        if [[ "${SELECTION_MODE}" == full && -n "${BASE_SHA}" ]]; then
          echo 'run-result rejected full mode with a base SHA' >&2
          exit 1
        fi
        ran="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
          | jq -r --arg re "${NAME_PATTERN}" '.jobs[]
            | select(.name | test($re))
            | [(.name | capture($re).concern), (if .conclusion == null then "running" else .conclusion end)]
            | @tsv' | sort)"
        while IFS=$'\t' read -r matched_concern _; do
          [[ -n "${matched_concern}" ]] || continue
          if ! jq -e --arg c "${matched_concern}" 'index($c) != null' <<<"${EXPECTED}" >/dev/null 2>&1; then
            echo 'run-result rejected an unexpected matching job' >&2
            exit 1
          fi
        done <<<"${ran}"
        if [[ "$(cut -f1 <<<"${ran}" | uniq -d)" != '' ]]; then
          echo 'run-result rejected duplicate matching jobs' >&2
          exit 1
        fi
        not_selected=0
        failed=0
        ran_count=0
        table=''
        while IFS= read -r concern; do
          [[ -n "${concern}" ]] || continue
          conclusion="$(awk -F'\t' -v c="${concern}" '$1 == c { print $2; exit }' <<<"${ran}")"
          if [[ -z "${conclusion}" || "${conclusion}" == skipped ]]; then
            if [[ "${SELECTION_MODE}" == full ]] || jq -e --arg c "${concern}" 'index($c) != null' <<<"${REQUIRED}" >/dev/null 2>&1; then
              # Explicitly requested, or required by full mode, so its absence fails.
              conclusion='REQUIRED BUT DID NOT RUN'
              failed=$((failed + 1))
            else
              conclusion='not selected'
              not_selected=$((not_selected + 1))
            fi
          else
            ran_count=$((ran_count + 1))
            if [[ "${conclusion}" != success ]]; then
              failed=$((failed + 1))
            fi
          fi
          table="${table}| ${concern} | ${conclusion} |"$'\n'
        done < <(jq -r '.[]' <<<"${EXPECTED}")
        selection="${SELECTION_MODE}"
        verdict="PASS (${selection})"
        if [[ "${failed}" -gt 0 ]]; then
          verdict="FAIL (${failed} concern(s) did not succeed)"
        elif [[ "${ran_count}" -eq 0 ]]; then
          verdict='FAIL (no concern ran)'
        fi
        {
          echo "## ${LABEL} result: ${verdict}"
          echo
          echo "- Requested source SHA: \`${REQUESTED_SOURCE_SHA}\`"
          if [[ -n "${BASE_SHA}" ]]; then
            echo "- Base SHA: \`${BASE_SHA}\`"
          fi
          echo "- Selection: ${selection} (${ran_count} ran, ${not_selected} not selected)"
          if [[ "${selection}" == partial ]]; then
            echo '- A partial selection does not admit a merge; only a full run does.'
          fi
          echo
          echo '| Concern | Result |'
          echo '| --- | --- |'
          printf '%s' "${table}"
        } >> "${GITHUB_STEP_SUMMARY}"
        echo "${LABEL}: ${verdict}"
        [[ "${failed}" -eq 0 && "${ran_count}" -gt 0 ]]
