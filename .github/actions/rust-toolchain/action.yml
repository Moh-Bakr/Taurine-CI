name: Rust toolchain and native dependencies
description: >
  Per-OS setup for the Rust concerns: the runner's own rustup components, the
  libclang that bindgen needs, the system libraries each concern links (Homebrew
  bottles or the runner image's vcpkg and LLVM; the Ubuntu archive packages are
  installed earlier, as root, by the root-setup composite), the cargo environment
  (no incremental state, no test debug info, target directory) and the linker
  choice. Runs after root is removed from the job (drop-root) and needs no root
  itself. Installs only from the runner image's own sources, homebrew-core and one
  pinned Chocolatey fallback.

inputs:
  concern:
    description: The concern being set up (taurine-cli, rust-domain, rust-db, rust-net, rust-ovpn, rust-app, rust-dbx)
    required: true
  path:
    description: Directory, relative to the workspace, holding the private source
    required: false
    default: src

runs:
  using: composite
  steps:
    - name: Install the pinned Rust toolchain when the source pins one
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      run: |
        set -euo pipefail
        # The private source may pin its channel and components in rust-toolchain.toml.
        # When it does, install exactly that (rustup reads the file in this directory);
        # otherwise the runner image's default toolchain is used unchanged.
        if [[ -f rust-toolchain.toml || -f rust-toolchain ]]; then
          echo 'rust-toolchain: installing the toolchain pinned by the source'
          rustup toolchain install || rustup show >/dev/null
        else
          echo 'rust-toolchain: no pin in the source; using the runner default'
        fi
        rustc --version
        cargo --version

    - name: Install the pinned cargo-nextest release
      if: ${{ startsWith(inputs.concern, 'rust-app') || inputs.concern == 'rust-db' }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      env:
        CONCERN: ${{ inputs.concern }}
      # The only value written to the path file is the directory the binary was extracted to.
      run: |  # zizmor: ignore[github-env]
        set -euo pipefail
        # Only worth installing when the source carries a nextest profile; the tests fall back
        # to cargo test otherwise. The binary is a pinned release asset verified against a
        # committed SHA-256; nothing floats.
        if [[ ! -f .config/nextest.toml ]]; then
          echo 'nextest: no .config/nextest.toml in the source; tests run with cargo test'
          exit 0
        fi
        version=0.9.146
        case "${RUNNER_OS}" in
          Linux)
            asset="cargo-nextest-${version}-x86_64-unknown-linux-gnu.tar.gz"
            sha=682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428 ;;
          macOS)
            asset="cargo-nextest-${version}-universal-apple-darwin.tar.gz"
            sha=39785160b3c2f6ed9a765049cf4fa79f3b39aa02eb7598a5a0e2a1a0b9ffb9a8 ;;
          Windows)
            asset="cargo-nextest-${version}-x86_64-pc-windows-msvc.zip"
            sha=0fa689815c8157e4633225b6b173184b3d546eb6ffb754c3d0e6ea5973284a20 ;;
          *) echo "nextest: unsupported runner ${RUNNER_OS}" >&2; exit 1 ;;
        esac
        bin="${RUNNER_TEMP}/nextest-bin"
        mkdir -p "${bin}"
        curl --fail --silent --show-error --location --retry 3 -o "${bin}/${asset}" \
          "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${version}/${asset}"
        # The checksum is read from stdin: `sha256sum FILE` prefixes the hash with a backslash
        # when the path contains one (Windows RUNNER_TEMP does), which made a correct download
        # look like a mismatch.
        if command -v sha256sum >/dev/null 2>&1; then
          got="$(sha256sum < "${bin}/${asset}" | cut -d' ' -f1)"
        else
          got="$(shasum -a 256 < "${bin}/${asset}" | cut -d' ' -f1)"
        fi
        if [[ "${got}" != "${sha}" ]]; then
          echo 'nextest: checksum mismatch; refusing to install' >&2
          exit 1
        fi
        if [[ "${RUNNER_OS}" == Windows ]]; then
          powershell.exe -NoProfile -Command "Expand-Archive -Force -Path '$(cygpath -w "${bin}/${asset}")' -DestinationPath '$(cygpath -w "${bin}")'"
        else
          tar -xf "${bin}/${asset}" -C "${bin}"
        fi
        echo "${bin}" >> "${GITHUB_PATH}"
        "${bin}/cargo-nextest" nextest --version | head -n 1

    - name: Set up the Linux Rust toolchain and native dependencies
      if: ${{ runner.os == 'Linux' && (inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-')) }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      env:
        CONCERN: ${{ inputs.concern }}
        OS_LABEL: Linux
      # Every value written to the environment file is a constant or a path the setup
      # itself created or asked the package manager for; the only input, the concern
      # name, is compared against fixed strings and never written.
      run: |  # zizmor: ignore[github-env]
        set -euo pipefail
        # The runner's own rustup, not a third-party action: android-validation
        # and ios-validation already do it this way, and this control plane
        # adds no action it does not have to.
        rustup component add rustfmt clippy

        # taurine-scripting depends on rquickjs with the `bindgen` feature, so
        # this concern needs libclang at build-script runtime. The hosted image
        # ships clang but not reliably the shared library bindgen loads, and
        # the failure surfaces only as an unhelpful `No such file or directory`
        # from Cargo. android-validation carries the same block for the same
        # reason. The crate-test concerns take it too: rquickjs is in the
        # domain and app closures and libsql's bindgen build in the db and app
        # ones, and one shared install is simpler than a per-concern guess.
        #
        # The crate-test concerns reach system libraries `taurine-cli` does
        # not, each named here with the crate that needs it, all from the
        # image's own Ubuntu archive. Measured from the private lockfile and
        # build scripts, not guessed:
        # - libdbus-1-dev: taurine-crypt's default `keychain` feature takes
        #   keyring's `sync-secret-service`, whose libdbus-sys has no vendored
        #   build and finds dbus-1 through pkg-config (store, repo and app
        #   reach it through crypt).
        # - the openvpn3 set: taurine-ovpn-sys compiles vendored openvpn3-core
        #   C++ against these; the list is copied from the private
        #   `docs/architecture/vendored-openvpn3.md` and `ovpn-core.yml`, which
        #   is where it was proven on ubuntu.
        # - the Tauri set: taurine-app and the two shells link wry, i.e.
        #   webkit2gtk-4.1 (which brings gtk3, libsoup3 and javascriptcore),
        #   plus libxdo for muda's accelerators; the list is Tauri's own Linux
        #   prerequisites less the tray indicator, which nothing enables.
        # - fontconfig/freetype/openssl: dbx-core's default `system-fonts`
        #   feature (font-kit) and its tokio-openssl transport.
        # - lld, for the crate-test concerns only: they link over a hundred test
        #   binaries (rust-app alone), and the GNU linker is the slowest part of
        #   that. Selected below through RUSTFLAGS.
        #
        # The packages themselves (the per-concern list) are installed by the root-setup
        # composite, before root is removed from the job and before any project code runs;
        # this step only finds what it installed.

        # Debian/Ubuntu commonly expose this as libclang-18.so.1 rather than an
        # unversioned libclang.so symlink.
        libclang_file="$(find /usr/lib -type f \( -name 'libclang.so*' -o -name 'libclang-*.so*' \) -print -quit)"
        [[ -n "${libclang_file}" ]] || { echo 'libclang shared library is unavailable' >&2; exit 1; }
        echo "LIBCLANG_PATH=$(dirname "${libclang_file}")" >> "${GITHUB_ENV}"

        # The crate-test concerns only, so `taurine-cli` builds exactly as it
        # did. Three settings, all about the runner rather than the code:
        # - no incremental state: nothing is cached, so it is written and
        #   never read again;
        # - no debug info for tests and their dependencies: the repository's
        #   profiles keep line tables for local backtraces, but this workflow
        #   publishes no backtrace (see `cargo_test_detail` below), and
        #   `rust-app` alone links over a hundred binaries that each carry the
        #   whole command tier — that is the disk and link time it saves;
        # - `target/` on the runner's second disk when it has one: hosted
        #   Ubuntu runners mount a larger scratch disk at /mnt, and
        #   `rust-app`/`rust-db` compile closures that crowd the root disk.
        #   It stays on this ephemeral runner like everything else here — it
        #   is never uploaded or cached — and the root disk is the fallback.
        if [[ "${CONCERN}" == rust-* ]]; then
          {
            echo 'CARGO_INCREMENTAL=0'
            echo 'CARGO_PROFILE_DEV_DEBUG=0'
            echo 'CARGO_PROFILE_TEST_DEBUG=0'
          } >> "${GITHUB_ENV}"
          # Link with lld. RUSTFLAGS replaces, rather than merges with, any
          # `build.rustflags` a cargo config in the checkout sets, so the flag is
          # applied only when no checked-out cargo config sets rustflags of its own;
          # otherwise the repository's flags win and the default linker is kept. The
          # linker in use is printed so a run shows which path it took.
          repo_rustflags=0
          while IFS= read -r cargo_config; do
            if [[ -n "${cargo_config}" ]] && grep -qiE 'rustflags' "${cargo_config}"; then
              repo_rustflags=1
            fi
          done < <(find . -maxdepth 4 -type f \( -path '*/.cargo/config' -o -path '*/.cargo/config.toml' \) -not -path '*/node_modules/*' -not -path '*/target/*')
          if [[ "${repo_rustflags}" == 1 || -n "${RUSTFLAGS:-}" ]]; then
            echo 'linker: rustflags are already set; keeping the default linker'
          else
            echo 'RUSTFLAGS=-C link-arg=-fuse-ld=lld' >> "${GITHUB_ENV}"
            ld.lld --version | head -n 1
            echo 'linker: lld (RUSTFLAGS=-C link-arg=-fuse-ld=lld)'
          fi
          # root-setup created it and handed it to the job user when /mnt is mounted.
          if [[ -d /mnt/cargo-target && -w /mnt/cargo-target ]]; then
            echo 'CARGO_TARGET_DIR=/mnt/cargo-target' >> "${GITHUB_ENV}"
          fi
          df -h / /mnt 2>/dev/null || df -h /
        fi

    - name: Set up the macOS Rust toolchain and native dependencies
      if: ${{ runner.os == 'macOS' && (startsWith(inputs.concern, 'rust-')) }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      env:
        CONCERN: ${{ inputs.concern }}
        OS_LABEL: macOS
      # Every value written to the environment file is a constant or a path the setup
      # itself created or asked the package manager for; the only input, the concern
      # name, is compared against fixed strings and never written.
      run: |  # zizmor: ignore[github-env]
        # Homebrew's own bottles, from homebrew-core only (as ios-validation already
        # does for llvm). Homebrew cannot pin a formula version, so these float with
        # the runner image's tap snapshot; each bottle is sha256-verified by brew.
        # Analytics and the auto-update of the tap are off.
        export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1

        rustc --version
        cargo --version

        # Disk. For rust-app and rust-db the root-setup composite has already started the
        # disk reclaim in the background (the Android SDK, every Xcode but the selected one,
        # simulator devices and runtimes), before root was removed from the job; the macOS
        # Rust concern joins it before the first cargo command. Package-manager and user
        # caches are cleared below, after the installs that use them.

        # taurine-scripting's rquickjs `bindgen` feature needs the standalone libclang
        # dylib at build-script runtime, the same reason ios-validation installs llvm.
        brew list llvm >/dev/null 2>&1 || brew install llvm
        llvm_prefix="$(brew --prefix llvm)"
        [[ -f "${llvm_prefix}/lib/libclang.dylib" ]] || { echo 'libclang dylib is unavailable' >&2; exit 1; }
        echo "LIBCLANG_PATH=${llvm_prefix}/lib" >> "${GITHUB_ENV}"

        # openssl@3 and pkg-config: any crate that links the system OpenSSL finds it
        # through pkg-config, and Homebrew's openssl@3 is keg-only (not on the default
        # search path), so its pkgconfig directory is handed over explicitly.
        brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
        brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
        echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "${GITHUB_ENV}"

        # taurine-ovpn-sys compiles vendored openvpn3-core C++ against these; the list
        # is the private docs/architecture/vendored-openvpn3.md macOS install line.
        # `rust-ovpn` builds that crate directly and `rust-net` builds it through
        # taurine-net-conformance, which depends on it, so both concerns take this setup.
        if [[ "${CONCERN}" == rust-ovpn || "${CONCERN}" == rust-net ]]; then
          brew install asio fmt jsoncpp lz4 xxhash

          # openvpn3-core is C++20 and needs a current Apple libc++: the root-setup composite
          # selected the newest working Xcode, before root was removed from the job. The
          # toolchain versions are printed (public tool and formula versions, nothing from
          # the private source) so a failure here is attributable to a compiler or a
          # formula version from the run summary alone.
          xcodebuild -version | head -n 1
          xcrun clang++ --version | head -n 1
          brew list --versions asio fmt jsoncpp lz4 xxhash openssl@3
        fi

        # Same settings as the Linux crate-test concerns, about the runner not the
        # code: no incremental state (nothing is cached, so it would be written and
        # never read) and no debug info for tests and their dependencies (this
        # workflow publishes no backtrace, and `rust-app` links over a hundred
        # binaries that each carry the whole command tier).
        {
          echo 'CARGO_INCREMENTAL=0'
          echo 'CARGO_PROFILE_DEV_DEBUG=0'
          echo 'CARGO_PROFILE_TEST_DEBUG=0'
        } >> "${GITHUB_ENV}"

        # Package-manager and user caches, now that the installs above are done with them;
        # the background reclaim root-setup started handles the large trees.
        if [[ "${CONCERN}" == rust-app || "${CONCERN}" == rust-db ]]; then
          rm -rf "${HOME}/Library/Caches"/* 2>/dev/null || true
          brew_cache="$(brew --cache 2>/dev/null || true)"
          if [[ -n "${brew_cache}" && -d "${brew_cache}" ]]; then
            rm -rf "${brew_cache}"/* 2>/dev/null || true
          fi
        fi

        # taurine-crypt's `keychain` feature talks to the real macOS Keychain, and its
        # callers treat a locked or missing keychain as a miss, so a bare runner would
        # pass with the keychain path never exercised. A throwaway, already unlocked
        # keychain in RUNNER_TEMP becomes the user's only search keychain and default,
        # so the real Keychain API is exercised without touching the runner's login
        # keychain, no dialog can wait for an unlock, and nothing outlives the job.
        # The passphrase is random, used on three commands and never printed.
        keychain="${RUNNER_TEMP}/taurine-ci.keychain-db"
        keychain_secret="$(uuidgen)"
        security create-keychain -p "${keychain_secret}" "${keychain}"
        security set-keychain-settings -lut 21600 "${keychain}"
        security unlock-keychain -p "${keychain_secret}" "${keychain}"
        unset keychain_secret
        security list-keychains -d user -s "${keychain}"
        security default-keychain -d user -s "${keychain}"
        security show-keychain-info "${keychain}"

    - name: Set up the Windows Rust toolchain and native dependencies
      if: ${{ runner.os == 'Windows' && (startsWith(inputs.concern, 'rust-')) }}
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.path }}
      env:
        CONCERN: ${{ inputs.concern }}
        OS_LABEL: Windows
      # Every value written to the environment file is a constant or a path the setup
      # itself created or asked the package manager for; the only input, the concern
      # name, is compared against fixed strings and never written.
      run: |  # zizmor: ignore[github-env]
        set -euo pipefail
        rustc --version
        cargo --version

        # Everything here comes from the runner image or from one pinned fallback, and
        # nothing is fetched from an unreviewed source.
        #
        # libclang: taurine-scripting's rquickjs `bindgen` feature needs libclang.dll at
        # build-script runtime. The windows-2022 image ships LLVM; if a future image
        # stops doing so, the pinned Chocolatey package is the fallback rather than a
        # floating install.
        llvm_bin='/c/Program Files/LLVM/bin'
        if [[ ! -f "${llvm_bin}/libclang.dll" ]]; then
          # The installer's SHA-256 is pinned here (LLVM-18.1.8-win64.exe, the digest the
          # Chocolatey package's own install script carries) and Chocolatey is told to
          # verify the download against it, so a changed package script or a replaced release
          # asset fails the install instead of running.
          choco install llvm --version=18.1.8 --no-progress -y \
            --download-checksum-x64=94af030060d88cc17e9f00ef1663ebdc1126b35e16bebdfa1e807984b70abd8f \
            --download-checksum-type-x64=sha256
        fi
        [[ -f "${llvm_bin}/libclang.dll" ]] || { echo 'libclang.dll is unavailable' >&2; exit 1; }

        # Same settings as the Linux crate-test concerns, about the runner not the code:
        # no incremental state, no debug info for tests and their dependencies, and
        # `target/` off the workspace drive. The workspace sits on D:, the small
        # scratch drive, and `rust-app`/`rust-db` compile closures that would fill it;
        # C: has the room. A short path also keeps deep build-script output clear of
        # the 260-character limit. It stays on this ephemeral runner like everything
        # else here and is never uploaded.
        mkdir -p /c/ct
        {
          printf '%s\n' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin'
          echo 'CARGO_INCREMENTAL=0'
          echo 'CARGO_PROFILE_DEV_DEBUG=0'
          echo 'CARGO_PROFILE_TEST_DEBUG=0'
          printf '%s\n' 'CARGO_TARGET_DIR=C:\ct'
          # vcpkg's own telemetry, off: Taurine is telemetry-free and so is its CI.
          echo 'VCPKG_DISABLE_METRICS=1'
        } >> "${GITHUB_ENV}"
        # Link with rust-lld instead of link.exe for the crate-test concerns, which link over a
        # hundred test binaries (rust-app alone). The target-specific linker variable leaves
        # any RUSTFLAGS and checked-out cargo config untouched; rustc still takes the MSVC
        # library paths from the installed Visual Studio and finds rust-lld in its own
        # sysroot. The packaging smoke build (a Tauri build with resources and a manifest)
        # keeps link.exe until lld is proven on it.
        if [[ "${CONCERN}" != rust-packaging ]]; then
          echo 'CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=rust-lld.exe' >> "${GITHUB_ENV}"
          echo 'linker: rust-lld (CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER)'
        else
          echo 'linker: link.exe (packaging build)'
        fi
        # Disk. C: holds the target directory. For the heavy concerns, reclaim the Android
        # SDK and other large image content no Rust concern reads when C: is under 40 GiB
        # free, and print the free space before and after.
        free_gib() { df -BG /c | awk 'NR==2 {gsub("G", "", $4); print $4}'; }
        echo "disk before reclaim: $(free_gib) GiB free on C:"
        if [[ ( "${CONCERN}" == rust-app* || "${CONCERN}" == rust-db ) && "$(free_gib)" -lt 40 ]]; then
          rm -rf /c/Android "/c/Program Files (x86)/Android" /c/Users/runneradmin/AppData/Local/Android 2>/dev/null || true
          rm -rf /c/ProgramData/chocolatey/lib/ghc* /c/ProgramData/chocolatey/lib/mingw 2>/dev/null || true
          rm -rf /c/hostedtoolcache/windows/Java_* /c/hostedtoolcache/windows/PyPy 2>/dev/null || true
          echo "disk after reclaim: $(free_gib) GiB free on C:"
        fi
        df -h /c /d 2>/dev/null || df -h
