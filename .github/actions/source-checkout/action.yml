name: Check out the exact private source
description: >
  Mints a short-lived read-only token for the private source repository, checks
  out the exact requested commit into a subdirectory, verifies the repository
  identity and the checked-out SHA, and revokes the token before any project
  command can run. The token is never an output of this action.

inputs:
  source-sha:
    description: Exact 40-character commit SHA to check out
    required: true
  app-client-id:
    description: Client ID of the source-reader GitHub App
    required: true
  app-private-key:
    description: Private key of the source-reader GitHub App
    required: true
  repository-id:
    description: Numeric ID the source repository must have
    required: true
  repository-owner:
    description: Owner of the source repository
    required: true
  repository-name:
    description: Name of the source repository
    required: true
  path:
    description: Directory, relative to the workspace, to check the source out into
    required: false
    default: src
  fetch-depth:
    description: History depth to fetch (1 for the commit only, 0 for all history)
    required: false
    default: '1'
  filter:
    description: Partial-clone filter (for example blob:none) to keep deep history cheap
    required: false
    default: ''
  check-protected-ancestry:
    description: >
      'true' to ask, while the token is still live, whether the requested SHA is reachable from
      a protected private branch (develop, uat or main). The answer is the protected-ancestor
      output, which gates every cache save: a feature-branch SHA may restore a cache but never
      write one.
    required: false
    default: 'false'

# The single output is a fixed true/false answer written after the token is revoked and the
# runner's pending step outputs are cleared, so the token can never leave through it.
outputs:
  protected-ancestor:
    description: "'true' when the checked-out SHA is on develop, uat or main of the source repository; otherwise 'false'"
    value: ${{ steps.verify.outputs.protected-ancestor }}

runs:
  using: composite
  steps:
    - name: Validate the protected context and the requested SHA
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        REQUESTED_SOURCE_SHA: ${{ inputs.source-sha }}
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
          echo 'The private source may only be read from the protected main branch' >&2
          exit 1
        fi
        if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
          echo 'source-sha must be a full 40-character hexadecimal commit SHA' >&2
          exit 1
        fi

    - name: Mint read-only private-source token
      id: mint
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ${{ inputs.repository-owner }}
        repositories: ${{ inputs.repository-name }}
        permission-contents: read
        # Deliberate: the token is revoked explicitly by the verification step below, before any project command, and that step fails closed; the action's own end-of-job revoke would leave it live while project code runs.
        skip-token-revoke: true  # zizmor: ignore[github-app]

    - name: Check out exact private source SHA
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository-owner }}/${{ inputs.repository-name }}
        ref: ${{ inputs.source-sha }}
        token: ${{ steps.mint.outputs.token }}
        fetch-depth: ${{ inputs.fetch-depth }}
        filter: ${{ inputs.filter }}
        persist-credentials: false
        path: ${{ inputs.path }}
        submodules: false
        lfs: false

    - name: Verify identity, exact checkout, and revoke source token
      id: verify
      if: always()
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        SOURCE_TOKEN: ${{ steps.mint.outputs.token }}
        REQUESTED_SOURCE_SHA: ${{ inputs.source-sha }}
        SOURCE_REPOSITORY_ID: ${{ inputs.repository-id }}
        SOURCE_REPOSITORY_OWNER: ${{ inputs.repository-owner }}
        SOURCE_REPOSITORY_NAME: ${{ inputs.repository-name }}
        CHECKOUT_PATH: ${{ inputs.path }}
        CHECK_PROTECTED_ANCESTRY: ${{ inputs.check-protected-ancestry }}
      run: |
        set -euo pipefail
        set +x
        failed=0
        requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
        if [[ -z "${SOURCE_TOKEN}" ]]; then
          echo 'No source token was minted; refusing to continue' >&2
          exit 1
        fi
        # One retry policy for every call: five attempts, two seconds apart, for up
        # to a minute. A transient API error must not fail a validation or, worse,
        # leave the revocation unattempted.
        api() {
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors \
            -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' "$@"
        }
        if ! identity="$(api "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
          echo 'The configured source repository identity could not be resolved' >&2
          failed=1
        elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
          echo 'The configured source repository identity did not match' >&2
          failed=1
        fi
        if ! checked_out_sha="$(git -C "${CHECKOUT_PATH}" rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"; then
          echo 'The private source checkout did not complete' >&2
          failed=1
        elif [[ "${checked_out_sha}" != "${requested_sha}" ]]; then
          echo 'The checked-out commit does not match source-sha' >&2
          failed=1
        fi
        if ! api_sha="$(api "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/${requested_sha}" | jq -er '.sha | ascii_downcase')" || [[ "${api_sha}" != "${requested_sha}" ]]; then
          echo 'The requested source SHA was not resolved from the configured repository' >&2
          failed=1
        fi
        # Protected ancestry, asked with the same contents-read token before it is revoked:
        # the compare of <branch>...<sha> is `identical` or `behind` exactly when the SHA is
        # the branch tip or one of its ancestors. A missing branch, an API error or anything
        # else answers false (fail closed), never fails the validation itself.
        protected_ancestor=false
        if [[ "${CHECK_PROTECTED_ANCESTRY}" == true && "${failed}" -eq 0 ]]; then
          for branch in develop uat main; do
            status="$(curl --fail --silent --retry 3 --retry-delay 2 --retry-max-time 30 \
              -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/compare/${branch}...${requested_sha}?per_page=1" 2>/dev/null \
              | jq -r '.status // empty' 2>/dev/null || true)"
            if [[ "${status}" == identical || "${status}" == behind ]]; then
              protected_ancestor=true
              echo "protected ancestry: the source SHA is on ${branch}"
              break
            fi
          done
          [[ "${protected_ancestor}" == true ]] || echo 'protected ancestry: the source SHA is on no protected branch; caches may be restored but not saved'
        fi
        if ! api -X DELETE "${GITHUB_API_URL}/installation/token"; then
          echo 'Source token revocation failed; refusing to execute project code' >&2
          failed=1
        fi
        unset SOURCE_TOKEN
        git -C "${CHECKOUT_PATH}" config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
        git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
        git config --global --unset-all credential.helper 2>/dev/null || true
        find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
        # Written after the clear above, and only ever the literal true or false.
        if [[ "${protected_ancestor}" == true ]]; then
          echo 'protected-ancestor=true' >> "${GITHUB_OUTPUT}"
        else
          echo 'protected-ancestor=false' >> "${GITHUB_OUTPUT}"
        fi
        [[ "${failed}" -eq 0 ]]
