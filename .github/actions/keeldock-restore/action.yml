name: KeelDock sub-step library and locked restore
description: >
  Installs the shared sub-step helpers to the runner temp directory, empties the result tables and
  runs the locked restore of the solution, the first sub-step every KeelDock concern shares. Runs
  after the source is checked out and the token revoked; publishes nothing.

runs:
  using: composite
  steps:
    - name: Install the sub-step library
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/keeldock"
        cat > "${RUNNER_TEMP}/keeldock/substeps.sh" <<'KD_SUBSTEP_LIBRARY'
        # shellcheck shell=bash
        # Sub-step bookkeeping shared by every KeelDock concern step (sourced). The result tables are
        # TSV files under RUNNER_TEMP; a step that fails a sub-step records it and carries on, and the
        # summary step fails the concern at the end if any row is FAIL or skipped.
        # Licences that fail the supply-chain concern: SPDX ids, `*` as a prefix wildcard.
        SBOM_DENIED_LICENSES='AGPL-*,GPL-*,SSPL-*,BUSL-*,CC-BY-NC-*,Elastic-*'
        results="${RUNNER_TEMP}/substeps.tsv"
        suite_rows="${RUNNER_TEMP}/suite-totals.tsv"
        failed_names="${RUNNER_TEMP}/failed-tests.tsv"
        test_times="${RUNNER_TEMP}/test-times.tsv"
        any_failed=0
        # awk: durations as the runner prints them ("1m 17s 566ms", "23s", "508ms") to seconds, -1 if unparseable.
        secs_awk='function secs(d,  p, k, i, v, t, ok) { k = split(d, p, " "); t = 0; ok = 0
          for (i = 1; i <= k; i++) { v = p[i] + 0
            if (p[i] ~ /^[0-9.]+ms$/) { t += v / 1000; ok = 1 } else if (p[i] ~ /^[0-9.]+s$/) { t += v; ok = 1 }
            else if (p[i] ~ /^[0-9.]+m$/) { t += v * 60; ok = 1 } else if (p[i] ~ /^[0-9.]+h$/) { t += v * 3600; ok = 1 } }
          return ok ? t : -1 }'
        strip_ansi() { sed -E $'s/\033\\[[0-9;]*[[:alpha:]]//g'; }
        # Compiler, NuGet and npm diagnostic ids (CS0103, NU1004, EINTEGRITY ...) are public catalogue
        # codes that name the failure class and carry no source; the message after the code does.
        diag_codes() {
          {
            strip_ansi < "$1" | grep -oE '(error|warning) [A-Z]{2,5}[0-9]{3,5}' | awk '{ print $2 }'
            strip_ansi < "$1" | grep -oE '^npm (ERR!|error) code [A-Z0-9_]+' | awk '{ print $4 }'
          } | sort | uniq -c | sort -rn | awk 'NR <= 12' | awk '{ printf "%s%s x%s", (NR > 1 ? ", " : ""), $2, $1 }'
        }
        record() { printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "${results}"; }
        # Replaces an earlier row, so a sub-step found wanting on a follow-up check is never both.
        override() {
          awk -F'\t' -v l="$1" '$1 != l' "${results}" > "${results}.tmp" && mv "${results}.tmp" "${results}"
          record "$1" "$2" "$3"
        }
        passed() { awk -F'\t' -v l="$1" '$1 == l && $2 == "pass" { f = 1 } END { exit !f }' "${results}"; }
        # One sub-step, output captured to a file; the outcome is recorded, the concern fails at the end.
        sub_step() {
          local label="$1" reason_fn="$2"; shift 2
          local log="${RUNNER_TEMP}/${label}.log" reason
          if "$@" >"${log}" 2>&1; then echo "${label}: passed"; record "${label}" pass '-'
          else
            reason="$("${reason_fn}" "${log}")"
            echo "${label}: failed (${reason}; output withheld)" >&2
            record "${label}" FAIL "${reason}"; any_failed=1
          fi
        }
        skip_step() { echo "$1: skipped (${2})"; record "$1" skipped "$2"; any_failed=1; }
        skip_all() { local why="$1"; shift; local l; for l in "$@"; do skip_step "${l}" "${why}"; done; }
        # A sub-step that needs an earlier one: skipped, never silently dropped, when that did not pass.
        after() {
          local dep="$1" label="$2"; shift 2
          if passed "${dep}"; then sub_step "${label}" "$@"; else skip_step "${label}" "${dep} did not pass"; fi
        }
        reason_text() { head -c 300 "$1" | tr '\n' ' '; }
        reason_diag() { echo "$(basename "$1" .log) diagnostic ids: $(diag_codes "$1" || true)"; }
        # Suite assignment, as scripts/run-tests.sh: a suite needs a container runtime exactly when its
        # project has a Testcontainers package reference (not the bare word).
        needs_docker() { grep -Eq '<PackageReference[^>]+Include="Testcontainers' "$1"; }
        structural_suites=' KeelDock.Cloud.ArchitectureTests KeelDock.Cloud.CompatibilityTests KeelDock.Cloud.GraphQLCompositionTests '
        suite_concern() {
          local name; name="$(basename "$1" .csproj)"
          if needs_docker "$1"; then echo db-containers
          elif [[ "${structural_suites}" == *" ${name} "* ]]; then echo structural
          else echo unit; fi
        }
        structural_present() {
          local name p
          for name in ${structural_suites}; do
            p="$(find tests -name "${name}.csproj" | head -n 1)"
            if [[ -z "${p}" || "$(suite_concern "${p}")" != structural ]]; then
              echo "structural suite ${name} is missing or now needs a container runtime"; return 1
            fi
          done
        }
        KD_SUBSTEP_LIBRARY
    - name: Restore the solution from its lock files
      shell: bash
      working-directory: ${{ github.workspace }}/src
      run: |
        # KD_PLATFORM / KD_CONCERN, never PLATFORM: MSBuild turns every environment variable into a
        # property, and Platform=linux makes `dotnet restore` fail with MSB4126 in every child process.
        set -uo pipefail
        source "${RUNNER_TEMP}/keeldock/substeps.sh"
        : > "${results}"; : > "${suite_rows}"; : > "${failed_names}"; : > "${test_times}"
        reason_restore() {
          local codes; codes="$(diag_codes "$1")"
          if grep -q 'NU1004' "$1"; then echo "lock file out of date with the projects (${codes})"
          elif grep -q 'NU1403' "$1"; then echo "package content hash differs from the lock file (${codes})"
          else echo "restore failed (diagnostic ids: ${codes:-none})"; fi
        }
        sub_step restore reason_restore dotnet restore KeelDock.Cloud.slnx --locked-mode
        exit 0
