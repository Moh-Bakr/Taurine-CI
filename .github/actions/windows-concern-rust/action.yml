name: Windows Rust concern runner
description: |
  Runs the Windows Rust concern (crate-test families, packaging, TLS spike) inside the protected
  concern job, after the source is checked out and the token revoked. The reviewed case body of
  windows-validation-concern.yml, moved here by responsibility.

inputs:
  concern:
    description: The Windows validation concern being run
    required: true

runs:
  using: composite
  steps:
    - name: Run the Windows Rust concern
      shell: bash
      working-directory: ${{ github.workspace }}/src
      env:
        CONCERN: ${{ inputs.concern }}
        OS_LABEL: Windows
      run: |
        set -euo pipefail
        source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
        source "${RUNNER_TEMP}/taurine-ci/report.sh"

        # The helpers below are the Linux `rust-*` concerns' own (see
        # linux-validation-concern.yml, which is where the reasoning for each lives),
        # with the changes a macOS or Windows runner needs and nothing else:
        # - carriage returns are stripped before any pattern runs, because Windows
        #   tools end lines with CRLF and the anchored patterns below would never match;
        # - the path rules also cover a Windows drive path, the `\\?\` prefix and the
        #   registry checkout of a dependency, so no absolute runner path is published;
        # - the failure classes a Windows or macOS test binary can add (a missing entry
        #   point or DLL, a stack overflow, a dynamic library that would not load) and a
        #   vcpkg port build failure get their own fixed one-line classification.
        # Everything else, including what is and is not published, is unchanged: only
        # failing test names, `error[Ennnn]` headers with their location, and cargo's
        # own fixed failure shapes leave this runner.



        # Which workspace crates each Rust concern tests on this OS. Every member of the
        # private workspace belongs to a concern, and `rust_coverage_check` (run by
        # `rust-domain`) fails when a member is in none of them, so a crate added later
        # cannot go untested by omission. The database family needs no list: `rust-db`
        # selects it with cargo's own `taurine-db*` package glob.
        rust_domain_packages=(
          taurine-model taurine-atomic taurine-auth taurine-crypt taurine-store
          taurine-repo taurine-replicate taurine-sync taurine-notes taurine-core
          taurine-exec taurine-scripting taurine-mock taurine-git
          # taurine-ade-model and taurine-ade-log return here when the ADE crates land on develop; they are unfinished work on feat/ade-first-run + feat/ade-models.
          taurine-transport-fs taurine-transport-git taurine-transport-wifi
          taurine-cli
        )

        rust_net_packages=(taurine-peer-sys taurine-net taurine-net-conformance)
        rust_ovpn_packages=(taurine-ovpn-sys)
        rust_app_packages=(taurine-app taurine-desktop taurine-mobile)

        rust_coverage_check() {
          local members member missing=0
          if ! members="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r' | sort -u)" || [[ -z "${members}" ]]; then
            echo 'error: failed to load the workspace member list' >&2
            return 1
          fi
          while IFS= read -r member; do
            case " ${rust_domain_packages[*]} ${rust_net_packages[*]} ${rust_ovpn_packages[*]} ${rust_app_packages[*]} " in
              *" ${member} "*) continue ;;
            esac
            # The dbx member crates and the OpenSSL door (Stage 1 task 1.5) are
            # Linux-tested: `rust-dbx` and `rust-tls-openssl` stay Linux concerns
            # because dbx-core's engine and protocol tests are platform-neutral.
            # This OS compiles the `cfg(windows)` storage and credential paths
            # through the `rust-domain` library check below.
            [[ "${member}" == taurine-db* || "${member}" == dbx-* || "${member}" == taurine-tls-openssl ]] && continue
            echo "error: workspace member ${member} is tested by no ${OS_LABEL} Rust concern" >&2
            missing=1
          done <<<"${members}"
          return "${missing}"
        }

        # vcpkg reads openvpn3's own `vcpkg.json`, which arrives with the pinned tree,
        # so this runs after the vendor fetch. The static-md triplet is the one
        # `taurine-ovpn-sys`'s build script prefers: a dynamic triplet would leave
        # OpenSSL's and jsoncpp's DLLs in vcpkg's own `bin/`, which is on nobody's PATH,
        # so every test binary would compile, link and then fail to start.
        windows_ovpn_dependencies() {
          local vcpkg_bin
          if command -v vcpkg >/dev/null 2>&1; then
            vcpkg_bin=vcpkg
          elif [[ -x "${VCPKG_INSTALLATION_ROOT:-}/vcpkg.exe" ]]; then
            vcpkg_bin="${VCPKG_INSTALLATION_ROOT}/vcpkg.exe"
          else
            echo 'error: vcpkg is not available on this runner image' >&2
            return 1
          fi
          cd vendor/openvpn3-core
          "${vcpkg_bin}" install --triplet x64-windows-static-md --disable-metrics
        }

        # `--locked`: the committed Cargo.lock is what was reviewed and what the Linux
        # contracts concern's advisory sweep audits. `--no-fail-fast`: every failing
        # target is reported in one dispatch. No `--features`: each crate is tested as
        # its manifest builds it, as on Linux. Env-gated live suites print SKIPPED and
        # pass when their variable is unset; the live servers belong to live-proofs.yml.
        case "${CONCERN}" in
          rust-domain)
            # The same crates as Linux, plus taurine-cli, whose exit codes and paths
            # are the part a user on this OS can observe. taurine-crypt links the real
            # Windows Credential Manager here (its default `keychain` feature,
            # windows-native), then is tested again without the feature, which is the
            # build a machine with no keychain gets.
            run_deferred rust-coverage rust_coverage_check
            run_deferred rust-crypt-no-keychain-tests \
              cargo test --locked --no-fail-fast --package taurine-crypt --no-default-features
            # The test selection guards on workspace membership, the same way
            # the dbx-core keyring check below does: a crate registered above
            # before the branch that carries it (taurine-ade-model and
            # taurine-ade-log arrived that way) would otherwise fail the whole
            # concern with "package ID specification did not match any
            # packages". The packages that are members keep the single combined
            # `cargo test` invocation exactly as before; each absent one
            # records its own skip row. The member list load is fail-closed: a
            # manifest cargo cannot read fails the concern rather than reading
            # as an absence.
            if ! domain_members="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r' | sort -u)" || [[ -z "${domain_members}" ]]; then
              echo 'error: failed to load the workspace member list' >&2
              deferred_results+=('rust-domain-tests|failed: not run (the workspace member list could not be loaded)')
              deferred_failed=1
            else
              domain_packages=()
              for domain_registered in "${rust_domain_packages[@]}"; do
                if grep -qx "${domain_registered}" <<<"${domain_members}"; then
                  domain_packages+=("--package=${domain_registered}")
                else
                  echo "rust-domain: skipped: ${domain_registered} is not a workspace member on this branch"
                  deferred_results+=("rust-domain-tests|skipped: ${domain_registered} is not a workspace member on this branch")
                fi
              done
              if [[ "${#domain_packages[@]}" -gt 0 ]]; then
                run_deferred rust-domain-tests \
                  cargo test --locked --no-fail-fast "${domain_packages[@]}"
              else
                echo 'rust-domain: skipped: no registered domain package is a workspace member on this branch'
                deferred_results+=('rust-domain-tests|skipped: no registered domain package is a workspace member on this branch')
              fi
            fi
            # dbx-core has `cfg(windows)` code (the reparse-point-safe key-file open and the
            # windows-native credential backend behind `os-keyring`) that no hosted job
            # compiles. This is a non-test library check of the minimal feature set that
            # still holds the storage and secret-codec modules: `sqlite-bundled` (rusqlite
            # needs its bundled SQLite to build on Windows) plus `os-keyring`, without the
            # default MQ admin and system-fonts features. It covers those two
            # modules' Windows paths and their dependency closure, not the dropped
            # features. No OpenSSL builds here: `legacy-tls` is off (the OpenSSL edge has
            # been feature-gated since task 1.2, and the crate is a workspace member since
            # task 1.5, so this is an ordinary package selection on the root lock).
            # The Perl/NASM PATH below is kept from the days the vendored OpenSSL did
            # build here: if a future feature set re-enters `openssl-sys`'s build script,
            # the first hosted run fails there, and this one command still finds a Perl
            # with the Win32 modules (Strawberry Perl, not Git's msys perl) and NASM —
            # both installed on the image but not on the bash step's PATH.
            # A source still on the pre-membership arrangement (dbx-core in the
            # workspace `exclude` list) has nothing to check — the selection would
            # fail with "package ID specification did not match any packages" — so
            # the sub-step records the absence and moves on; a member that is
            # present is checked exactly as above, and a real failure still fails
            # the concern. The member list load is fail-closed: a manifest cargo
            # cannot read fails the concern rather than reading as an absence.
            keyring_path="/c/Strawberry/perl/bin:/c/Program Files/NASM:${PATH}"
            echo "keyring-check perl: $(PATH="${keyring_path}" command -v perl 2>/dev/null | sanitize_stream || echo none)"
            echo "keyring-check nasm: $(PATH="${keyring_path}" command -v nasm 2>/dev/null | sanitize_stream || echo none)"
            if ! dbx_members="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r' | sort -u)" || [[ -z "${dbx_members}" ]]; then
              echo 'error: failed to load the workspace member list' >&2
              deferred_results+=('rust-dbx-core-keyring-check|failed: not run (the workspace member list could not be loaded)')
              deferred_failed=1
            elif grep -qx 'dbx-core' <<<"${dbx_members}"; then
              run_deferred rust-dbx-core-keyring-check \
                env PATH="${keyring_path}" cargo check --locked --lib --package dbx-core --no-default-features --features sqlite-bundled,os-keyring
            else
              echo 'rust-dbx-core-keyring-check: skipped: dbx-core is not a workspace member on this branch'
              deferred_results+=('rust-dbx-core-keyring-check|skipped: dbx-core is not a workspace member on this branch')
            fi
            # If the vendored OpenSSL build still fails, name the missing tool: the lines
            # published are fixed tool names (perl, nasm, nmake) with a fixed missing class;
            # no diagnostic text is republished.
            if [[ -s "${RUNNER_TEMP}/rust-dbx-core-keyring-check.log" ]] && grep -q 'openssl-sys' "${RUNNER_TEMP}/rust-dbx-core-keyring-check.log" && grep -q 'error: failed to run custom build command' "${RUNNER_TEMP}/rust-dbx-core-keyring-check.log"; then
              echo 'keyring-check build-tool diagnostics:' >&2
              # Allow-list: only a fixed tool name next to a fixed "missing" class is
              # published, never the diagnostic line itself.
              for tool in nasm perl nmake; do
                if grep -iE "${tool}" "${RUNNER_TEMP}/rust-dbx-core-keyring-check.log" | grep -qiE "can't locate|is not recognized|not found|no such file"; then
                  echo "  missing build tool: ${tool}" >&2
                fi
              done
            fi
            ;;
          rust-db)
            # Every `taurine-db*` crate, which on Windows includes the `#[cfg(windows)]`
            # integrated-authentication arm of taurine-db-mssql (tiberius' `winauth`
            # feature) that no other platform compiles.
            db_packages=()
            while IFS= read -r db_package; do
              db_packages+=("--package=${db_package}")
            done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r' | grep '^taurine-db' | sort -u)
            rust_tests rust-db-tests "${db_packages[@]}"
            ;;
          rust-net)
            # The dialer, the egress verifier, the userspace WireGuard conformance
            # suites and taurine-peer-sys, whose Win32 half (GetExtendedTcpTable and
            # the owning process's token) can only execute here. The openvpn3 shim is
            # its own concern, `rust-ovpn`. taurine-net-conformance depends on
            # taurine-ovpn-sys, so this concern compiles that C++ shim too and needs
            # the same vcpkg ports before cargo runs; the install is repeated here
            # rather than shared, because each concern has its own runner.
            run_deferred rust-net-vcpkg windows_ovpn_dependencies
            if [[ "${deferred_failed}" -eq 0 ]]; then
              run_deferred rust-net-tests \
                cargo test --locked --no-fail-fast "${rust_net_packages[@]/#/--package=}"
            else
              deferred_results+=("rust-net-tests|failed: not run (the vcpkg dependency install failed)")
            fi
            ;;
          rust-ovpn)
            # The vendored openvpn3-core shim, compiled with MSVC against vcpkg's
            # static-md ports. A build and its unit tests only: no tunnel has carried
            # traffic on Windows, and this concern does not claim one has.
            run_deferred rust-ovpn-vcpkg windows_ovpn_dependencies
            if [[ "${deferred_failed}" -eq 0 ]]; then
              run_deferred rust-ovpn-tests \
                cargo test --locked --no-fail-fast "${rust_ovpn_packages[@]/#/--package=}"
            else
              deferred_results+=("rust-ovpn-tests|failed: not run (the vcpkg dependency install failed)")
            fi
            ;;
          rust-app-1|rust-app-2)
            # Two nextest partitions of the same package set, as on Linux: measured on
            # Windows, the single concern's compile took 36 minutes and the test run 19, so
            # each leg compiles in full and runs half the tests. `count:N/2` splits
            # deterministically; no compiled output crosses between the jobs. Doctests ride
            # with partition 1.
            export NEXTEST_PARTITION="count:${CONCERN##*-}/2"
            # The command tier both shells call and the two shells' own unit tests.
            # Tauri's `test` feature drives the commands through its mock runtime, so
            # no window or WebView2 process is started.
            if [[ "${CONCERN}" == rust-app-1 ]]; then
              rust_tests rust-app-tests "${rust_app_packages[@]/#/--package=}"
            else
              NEXTEST_DOCTESTS=skip rust_tests rust-app-tests "${rust_app_packages[@]/#/--package=}"
            fi
            ;;
          rust-packaging)
            # Packaging smoke: an unsigned debug build of the desktop app through the Tauri
            # CLI (no installer: NSIS and WiX download their own tools, which this control
            # plane does not fetch), to prove the app still builds as a Tauri binary on
            # Windows. Nothing is signed or uploaded; the output stays on the runner.
            run_deferred rust-packaging-smoke \
              npm --prefix taurine-desktop run tauri -- build --debug --no-bundle --ci
            ;;
          rust-tls-openssl)
            # The OpenSSL door crate — a workspace member since Stage 1 task 1.5,
            # so an ordinary package selection on the root lock. Present only on
            # sources that carry it; otherwise a note and a pass, not a silent
            # skip of a concern the source never had.
            if cargo metadata --no-deps --format-version 1 | grep -q '"name": *"taurine-tls-openssl"'; then
              # The OpenSSL build here is vendored: Strawberry Perl and NASM must come
              # before Git's own perl on PATH (both ship on the image).
              tls_path="/c/Strawberry/perl/bin:/c/Program Files/NASM:${PATH}"
              run_deferred rust-tls-openssl-tests \
                env PATH="${tls_path}" cargo test --locked --package taurine-tls-openssl
            else
              echo "rust-tls-openssl: the source has no taurine-tls-openssl workspace member; nothing to build"
              run_deferred rust-tls-openssl-absent true
            fi
            ;;
          *)
            echo "Unsupported Windows Rust concern: ${CONCERN}" >&2
            exit 2
            ;;
        esac
        finish_deferred
