name: Install the shared concern reporting
description: >
  Writes the shared concern-reporting library (failure classifiers, run_quiet,
  run_deferred, finish_deferred) to the runner's temp directory. Requires the
  sanitize action to have run first. Reads nothing from the private source and
  publishes nothing itself.

runs:
  using: composite
  steps:
    - name: Write the concern reporting library
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "${RUNNER_TEMP}/taurine-ci"
        cat > "${RUNNER_TEMP}/taurine-ci/report.sh" <<'TCI_REPORT_LIBRARY'
        # shellcheck shell=bash
        # Shared concern reporting: the failure classifiers, run_quiet (one command, one
        # published line plus sanitized detail), run_deferred (independent sub-steps, every
        # result reported) and finish_deferred (the summary table and the concern verdict).
        # Requires the sanitize library to be sourced first. The label prefix selects what
        # may be published: cli-* and rust-* get classified, sanitized detail, cargo-audit
        # its advisory ids, mobile-tests and e2e-* a keyword allow-list, anything else only
        # "detailed output withheld".

        cargo_detail() {
          # Same rule as cargo_test_detail (see the POLICY note in the sanitize library): an
          # `error[Ennnn]` is its code and location only, an uncoded error its fixed shape or
          # "(message withheld)"; lint-level notes, rustfmt diffs and smoke lines are fixed shapes.
          cargo_sanitize "$1" | strip_excerpts | awk '
            /^warning: / { block = "warning"; pending = ""; next }
            /^error\[E[0-9]+\]: / { block = "error"; pending = ""; code = $1; sub(/\]:.*$/, "]", code); print code; next }
            /^error: / {
              block = "error"; pending = ""
              if ($0 ~ /^error: (could not compile|aborting due to|test failed|[0-9]+ targets? failed|failed to run custom build command for|linking with |failed to (download|select|get|load|parse|fetch)|no matching package)/) print
              else pending = "yes"
              next
            }
            /^[[:space:]]*--> / {
              if (block == "error") { if (pending != "") print "error: (message withheld)"; pending = ""; print }
              next
            }
            /^[[:space:]]*= note: .*(lint level|-D |-W |deny\(|warn\()/ { print; next }
            /^Diff in / || /^test .* FAILED$/ || /^test result: / || /^failures:$/ || /^smoke: / { print }
          ' | head -40 >&2 || true
        }

        # One line saying which kind of failure it was, so the classification
        # survives even when no diagnostic line clears the allow-list above.
        cargo_reason() {
          local log="$1"
          if grep -qE '^smoke: ' "${log}"; then echo 'the built binary did not meet its documented contract'
          elif grep -qE 'no such command|not installed for the toolchain|clippy-driver' "${log}"; then echo 'missing Rust toolchain component'
          elif grep -qE '^Diff in ' "${log}"; then echo 'rustfmt formatting difference'
          elif grep -qE 'clippy::[a-z_]+' "${log}"; then echo 'clippy lint promoted to an error by --deny warnings'
          elif grep -qE 'implied by .-D warnings.|requested on the command line with .-D warnings.' "${log}"; then echo 'rustc warning promoted to an error by --deny warnings'
          elif grep -qE 'Unable to find libclang|libclang.*[Nn]o such file' "${log}"; then echo 'libclang or bindgen failure'
          elif grep -qE 'failed to run custom build command' "${log}"; then echo 'dependency build script failure'
          elif grep -qE 'test result: FAILED|^failures:$' "${log}"; then echo 'test failure'
          elif grep -qE '^error(\[E[0-9]{4}\])?: |could not compile' "${log}"; then echo 'compilation failure'
          elif grep -qE 'failed to (download|select|get|load|parse)' "${log}"; then echo 'dependency download or resolution failure'
          elif grep -qE 'No space left on device' "${log}"; then echo 'runner disk exhaustion'
          else echo 'command returned non-zero'
          fi
        }

        # On failure the advisory findings are published: the RUSTSEC/CVE
        # id, the crate, and the locked version are public registry facts
        # that name the finding — the same rule the Rust concern follows,
        # publish what names the failure, never what the failure was in.
        # Everything cargo-audit prints around them (the dependency-graph
        # context, the advisory-db fetch log, local paths) stays withheld.
        cargo_audit_detail() {
          sanitize_stream <"$1" |
            grep -E '^error: |^warning: |^Crate: |^Version: |^ID: |^Warning: |^Severity: |^URL: |RUSTSEC-[0-9]{4}-[0-9]{4,}|CVE-[0-9]{4}-[0-9]+' |
            head -40 >&2 || true
        }

        # Fixed, source-free classification for the JavaScript and tool labels (the Rust ones
        # have cargo_test_reason). The text of the output is never published.
        js_reason() {
          local log="$1"
          if grep -Eiq 'out of memory|heap out of memory|JavaScript heap' "${log}"; then echo 'memory exhaustion'
          elif grep -Eiq '(^|[^[:alnum:]])(command not found|is not recognized)' "${log}"; then echo 'missing command'
          elif grep -Eiq '(^|[^[:alnum:]])(cannot find module|module not found|no such file or directory)' "${log}"; then echo 'missing dependency or file'
          elif grep -Eiq 'vendor-openvpn3:|fatal:|sha256|does not apply|could not download' "${log}"; then echo 'pinned vendor fetch or verification failure'
          elif grep -Eiq 'error TS[0-9]+' "${log}"; then echo 'TypeScript compilation failure'
          elif grep -Eiq 'test failed|assertion|failed [0-9]+ test|vitest|^[[:space:]]*FAIL[[:space:]]' "${log}"; then echo 'test failure'
          else echo 'command returned non-zero'
          fi
        }

        # TypeScript diagnostics as code and repository-relative file:line only. The message
        # text of a diagnostic quotes types and identifiers from the source, so it is never
        # published. Backslashes are turned into slashes first so Windows paths survive the
        # path scrubbing.
        ts_diagnostics() {
          tr '\\' '/' <"$1" | sanitize_stream |
            grep -E '^[^ ()]+\([0-9]+,[0-9]+\): error TS[0-9]+' |
            sed -E 's/^([^ ()]+)\(([0-9]+),[0-9]+\): error (TS[0-9]+).*/  \3 \1:\2/' |
            head -40 >&2 || true
        }

        # Failing tests of a JavaScript runner: the `FAIL file > suite > test` lines (file path
        # and test titles, the same identities the test inventory already publishes) plus the
        # runner's own count lines. Assertion messages and received/expected values stay private.
        test_failures() {
          tr '\\' '/' <"$1" | sanitize_stream | strip_excerpts |
            grep -E '^[[:space:]]*FAIL[[:space:]]|^[[:space:]]*(Test Files|Tests)[[:space:]]+[0-9]|^[[:space:]]*[0-9]+ (passed|failed|flaky|skipped)' |
            cut -c1-200 | awk '!seen[$0]++' | head -60 >&2 || true
        }

        # The packaging smoke build (an unsigned Tauri build): which phase failed and a fixed
        # class of the reason. Cargo's own error shapes follow from cargo_test_detail; nothing
        # else from the output is published.
        packaging_detail() {
          local log="$1" phase reason
          if grep -qE 'Running (beforeBuildCommand|before_build_command)|beforeBuildCommand' "${log}" && ! grep -qE '^[[:space:]]*Compiling ' "${log}"; then
            phase='frontend build (beforeBuildCommand)'
          elif grep -qiE 'Bundling|failed to bundle|bundler' "${log}" && grep -qE '^[[:space:]]*Finished ' "${log}"; then
            phase='bundling'
          elif grep -qE '^[[:space:]]*Compiling ' "${log}"; then
            phase='Rust build'
          else
            phase='tauri CLI setup'
          fi
          if grep -qE 'error TS[0-9]+' "${log}"; then reason='TypeScript errors in the frontend build'
          elif grep -qE 'failed to bundle project|Error failed to bundle' "${log}"; then reason='the bundler failed (see tool presence on the image)'
          elif grep -qE 'error: linking with|linker .* not found' "${log}"; then reason='link failure'
          elif grep -qE 'error(\[E[0-9]+\])?: could not compile|error\[E[0-9]+\]' "${log}"; then reason='Rust compilation failure'
          elif grep -qiE 'frontendDist|dist.*(does not exist|not found)' "${log}"; then reason='frontend output directory missing'
          elif grep -qiE 'tauri.conf|invalid configuration|unknown field' "${log}"; then reason='Tauri configuration error'
          elif grep -qiE 'version mismatched|mismatch' "${log}"; then reason='Tauri package version mismatch'
          elif grep -qE 'No space left on device' "${log}"; then reason='runner disk exhaustion'
          else reason='unclassified (output withheld)'
          fi
          echo "packaging phase: ${phase}; reason: ${reason}" >&2
          ts_diagnostics "${log}"
          tauri_version_mismatch "${log}" >&2 || true
          if [[ "${reason}" == 'Tauri package version mismatch' ]]; then tauri_versions_inventory >&2 || true; fi
        }

        # Installed `@tauri-apps/*` npm package versions per install root, and the locked
        # `tauri*` crate versions: package names, repo-relative directories and version numbers
        # only. Shows which install (root, desktop or mobile) the CLI resolved a skewed package
        # from, and whether a global or stray copy exists.
        tauri_versions_inventory() {
          local dir pkg name ver
          echo 'installed @tauri-apps packages (install root: package version):'
          for dir in . taurine-desktop taurine-mobile; do
            for pkg in "${dir}"/node_modules/@tauri-apps/*/package.json; do
              [[ -f "${pkg}" ]] || continue
              name="$(jq -r '.name // "?"' "${pkg}" 2>/dev/null | cut -c1-80)"
              ver="$(jq -r '.version // "?"' "${pkg}" 2>/dev/null | cut -c1-30)"
              echo "  ${dir}: ${name} ${ver}"
            done
          done
          echo 'locked tauri crates (Cargo.lock: name version):'
          awk '/^name = "tauri(-[a-z0-9-]+)?"$/ { n = $3; gsub(/"/, "", n); getline v; gsub(/[^0-9a-zA-Z.+-]/, "", v); sub(/^version/, "", v); print "  " n " " v }' Cargo.lock 2>/dev/null | head -40
          echo "global tauri CLI on PATH: $(command -v tauri >/dev/null 2>&1 && echo yes || echo no)"
          echo "npm global @tauri-apps packages: $(npm ls -g --depth=0 2>/dev/null | grep -c '@tauri-apps' || true)"
        }

        run_quiet() {
          local label="$1"; shift
          local log="${RUNNER_TEMP}/${label}.log"
          local rc=0
          "$@" >"${log}" 2>&1 || rc=$?
          if [[ "${rc}" -eq 0 ]]; then
            if [[ "${label}" == rust-*-tests ]]; then
              # A cargo test run that executes nothing proves nothing (a mis-selected package,
              # a filter that matches no target, a crate whose tests are all ignored). Sum the
              # executed tests over every `test result:` line (passed + failed); fewer than one
              # fails the sub-step. The count is a number, so it is safe to publish.
              # `cargo test` prints `test result: ok. N passed; M failed; ...` per target;
              # cargo-nextest prints one `Summary [..] N tests run: ...` line.
              executed="$(tr -d '\r' <"${log}" | awk '/^test result: / { for (i = 1; i <= NF; i++) { if ($i == "passed;" || $i == "failed;") n += $(i - 1) } } /Summary \[/ { for (i = 1; i < NF; i++) { if ($i == "tests" && $(i + 1) == "run:") n += $(i - 1) } } END { print n + 0 }')"
              flaky="$(tr -d '\r' <"${log}" | grep -c ' FLAKY ' || true)"
              if [[ "${flaky}" -gt 0 ]]; then
                echo "::warning title=flaky tests::${label}: ${flaky} test(s) passed only on retry"
                echo 'flaky tests (retries, test binary and name):'
                nextest_failures "${log}" | grep -E '^FLAKY' | head -40 || true
              fi
              if [[ "${executed}" -lt 1 ]]; then
                echo "${label}: failed (no tests were executed; a test run that runs nothing proves nothing)" >&2
                exit 1
              fi
              echo "${label}: passed (${executed} tests executed)"
            else
              echo "${label}: passed"
            fi
          else
            # Windows tools end lines with CRLF, which would defeat every anchored
            # pattern below; normalise before classifying.
            tr -d '\r' <"${log}" >"${log}.lf" && mv "${log}.lf" "${log}"
            echo "${rc}" >"${log}.exit"
            if [[ "${label}" == cli-* ]]; then
              echo "${label}: failed ($(cargo_reason "${log}"); exit ${rc}; sanitized detail below)" >&2
              cargo_detail "${log}"
            elif [[ "${label}" == rust-* ]]; then
              echo "${label}: failed ($(cargo_test_reason "${log}"); exit ${rc}; sanitized detail below)" >&2
              cargo_test_detail "${log}"
              if [[ "${label}" == rust-packaging-smoke ]]; then
                packaging_detail "${log}"
              fi
              # cargo-nextest: the failing tests, signals, timeouts and flaky retries by name.
              nextest_lines="$(nextest_failures "${log}")"
              if [[ -n "${nextest_lines}" ]]; then
                echo 'nextest failures (status, test binary and name):' >&2
                printf '%s\n' "${nextest_lines}" >&2
                nextest_summary "${log}" >&2 || true
              fi
              # The panicking tests with a fixed class of each panic and its file:line.
              panics="$(panic_summary "${log}")"
              if [[ -n "${panics}" ]]; then
                echo 'panics (test, file:line, class; messages withheld):' >&2
                printf '%s\n' "${panics}" >&2
              fi
            elif [[ "${label}" == cargo-audit ]]; then
              echo "${label}: failed (advisory findings below; exit ${rc}; remaining output withheld)" >&2
              cargo_audit_detail "${log}"
            else
              echo "${label}: failed ($(js_reason "${log}"); exit ${rc}; detailed output withheld)" >&2
            fi
            if [[ "${label}" == *typecheck* ]]; then
              ts_diagnostics "${log}"
            fi
            if [[ "${label}" == desktop-tests-* || "${label}" == mobile-tests ]]; then
              test_failures "${log}"
            fi
            if [[ "${label}" == desktop-vite-build ]]; then
              # Vite's top-level error lines are safe once paths are scrubbed.
              sanitize_stream <"${log}" |
                grep -Ei '(vite|rollup|tailwind|oxide|error|failed|could not|cannot|npm (err|error|warn)|node:internal|module_not_found|enoent|command not found|not cached)' |
                head -20 >&2 || true
            fi
            if [[ "${label}" == dashboard-contracts || "${label}" == orchestrate-verification ]]; then
              test_failures "${log}"
              sanitize_stream <"${log}" | strip_excerpts | grep -E '^(not ok|# (pass|fail|tests))' | head -20 >&2 || true
            fi
            if [[ "${label}" == e2e-* ]]; then
              # The failing specs by name (list reporter lines and annotation titles).
              pw="$(playwright_failures "${log}")"
              if [[ -n "${pw}" ]]; then
                echo 'failing specs (spec > title):' >&2
                printf '%s\n' "${pw}" >&2
              fi
              pwj="$(playwright_json_failures "${RUNNER_TEMP}/test-ids/${label}.json")"
              if [[ -n "${pwj}" ]]; then
                echo 'failing specs from the JSON report:' >&2
                printf '%s\n' "${pwj}" >&2
              fi
            fi
            if [[ "${label}" == bundle-budget || "${label}" == check-bundle ]]; then
              budget_report "${log}" >&2
            fi
            if [[ "${label}" == mobile-tests || "${label}" == e2e-* ]]; then
              # Keep hosted-only diagnostics useful without publishing
              # private source paths or compiler/test output.
              sanitize_stream <"${log}" |
                strip_excerpts |
                grep -Ei '(failed tests|test files|tests[[:space:]]+|assertionerror|expected|received|timed out|(^|[[:space:]])[0-9]+ (passed|failed|flaky|skipped)|(^|[[:space:]])(FAIL|PASS)[[:space:]])' |
                tail -80 >&2 || true
            fi
            exit 1
          fi
        }

        # The crate-test concerns' sub-steps are independent of each other:
        # the coverage check reads only the member list, and each test step
        # builds its own closure. Stopping at the first failure, as
        # `run_quiet` does for every other concern, therefore hides results
        # rather than saving work — a failed `rust-domain-tests` left
        # `rust-coverage` unknown, not passing. So the `rust-*` concerns run
        # each sub-step through `run_deferred`, which runs `run_quiet` in a
        # subshell: the subshell's `exit 1` ends that sub-step only, and the
        # pass line, failure reason and sanitized detail are `run_quiet`'s
        # own, byte for byte — this adds no new publishing path.
        # `finish_deferred` then lists every sub-step's result and fails the
        # concern if any one failed. The list carries only workflow-defined
        # labels and `cargo_test_reason`'s fixed classifications, so it is
        # written to the step summary as well: a failed run's summary says
        # which sub-steps failed without opening the log.
        deferred_results=()
        deferred_failed=0
        run_deferred() {
          local label="$1"; shift
          local status
          # Not `if ( ... )` or `( ... ) || status=$?`: either would run the
          # subshell with errexit suspended, which is not how `run_quiet`
          # runs anywhere else.
          set +e
          ( set -e; run_quiet "${label}" "$@" )
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            deferred_results+=("${label}|passed")
          else
            exit_code="$(cat "${RUNNER_TEMP}/${label}.log.exit" 2>/dev/null || echo '?')"
            if [[ "${label}" == rust-* || "${label}" == cli-* ]]; then
              reason="$(cargo_test_reason "${RUNNER_TEMP}/${label}.log")"
            else
              reason="$(js_reason "${RUNNER_TEMP}/${label}.log" 2>/dev/null || echo 'command returned non-zero')"
            fi
            deferred_results+=("${label}|failed: ${reason} (exit ${exit_code})")
            deferred_failed=1
          fi
        }

        finish_deferred() {
          local entry
          {
            echo "## ${OS_LABEL:-${RUNNER_OS}} ${CONCERN} sub-steps"
            echo
            echo '| Sub-step | Result |'
            echo '| --- | --- |'
            for entry in "${deferred_results[@]}"; do
              echo "| \`${entry%%|*}\` | ${entry#*|} |"
            done
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "${CONCERN} sub-step results:"
          for entry in "${deferred_results[@]}"; do
            echo "  ${entry%%|*}: ${entry#*|}"
          done
          df -h / 2>/dev/null || true
          if [[ "${deferred_failed}" -ne 0 ]]; then
            echo "${CONCERN}: failed (one or more sub-steps failed; each is listed above)" >&2
            exit 1
          fi
        }

        # One place that decides how a crate-test sub-step runs. With cargo-nextest installed
        # and the source carrying a nextest profile named `ci`, the tests run under nextest
        # (retries and a flaky report come from that profile) and the doctests, which nextest
        # does not run, follow as a separate cargo test --doc sub-step. Otherwise it is plain
        # cargo test, exactly as before. Usage: rust_tests <label> <cargo package args...>
        rust_tests() {
          local label="$1"; shift
          if command -v cargo-nextest >/dev/null 2>&1 && [[ -f .config/nextest.toml ]]; then
            # Failing tests are named on their FAIL lines whatever the profile's own verbosity
            # says: ask for them on the command line (status shown while running, repeated in
            # the final list) so a failure is never reduced to counts.
            run_deferred "${label}" cargo nextest run --locked --profile ci --no-fail-fast --status-level fail --final-status-level fail ${NEXTEST_PARTITION:+--partition "${NEXTEST_PARTITION}"} "$@"
            if [[ "${NEXTEST_DOCTESTS:-run}" != skip ]]; then
              run_deferred "${label%-tests}-doctests" cargo test --locked --doc --no-fail-fast "$@"
            fi
          else
            run_deferred "${label}" cargo test --locked --no-fail-fast "$@"
          fi
        }
        TCI_REPORT_LIBRARY
