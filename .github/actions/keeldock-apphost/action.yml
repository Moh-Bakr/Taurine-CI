name: KeelDock AppHost cold-start sub-steps
description: >
  The opt-in apphost-cold-start concern (Linux): a bounded Aspire AppHost cold start. None of its
  output is published. Runs after the locked restore.

runs:
  using: composite
  steps:
    - name: Cold start the AppHost
      shell: bash
      working-directory: ${{ github.workspace }}/src
      run: |
        # KD_PLATFORM / KD_CONCERN, never PLATFORM: MSBuild turns every environment variable into a
        # property, and Platform=linux makes `dotnet restore` fail with MSB4126 in every child process.
        set -uo pipefail
        source "${RUNNER_TEMP}/keeldock/substeps.sh"
        # Bounded cold start: start the AppHost headless and wait up to ten minutes for "Distributed
        # application started" or its dashboard answering HTTP, require a running container, stop it.
        # None of its output is published.
        apphost="$(find src -name '*AppHost*.csproj' -not -path '*/obj/*' | sort | head -n 1)"
        if [[ -z "${apphost}" ]]; then
          echo 'apphost-discovery: failed (no AppHost project found under src)' >&2
          record apphost-discovery FAIL 'no AppHost project found under src'; any_failed=1
        else
          record apphost-discovery pass '-'
          after restore apphost-build reason_diag dotnet build "${apphost}" --no-restore --nologo -v quiet --configuration Release
          if passed apphost-build; then
            apphost_log="${RUNNER_TEMP}/apphost.log"
            export ASPNETCORE_ENVIRONMENT=Development ASPIRE_ALLOW_UNSECURED_TRANSPORT=true
            export ASPNETCORE_URLS=http://127.0.0.1:15888 ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL=http://127.0.0.1:16037
            export ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
            dotnet run --project "${apphost}" --no-build --configuration Release >"${apphost_log}" 2>&1 &
            apphost_pid=$!
            started=0; containers=0
            for _ in $(seq 1 120); do
              kill -0 "${apphost_pid}" 2>/dev/null || break
              if grep -q 'Distributed application started' "${apphost_log}" 2>/dev/null; then started=1; break; fi
              code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 3 http://127.0.0.1:15888/ 2>/dev/null || true)"
              if [[ "${code}" == 200 || "${code}" == 302 ]]; then started=1; break; fi
              sleep 5
            done
            if [[ "${started}" -eq 1 ]]; then sleep 15; containers="$(docker ps -q | wc -l | tr -d ' ')"; fi
            kill "${apphost_pid}" 2>/dev/null || true
            wait "${apphost_pid}" 2>/dev/null || true
            docker ps -q | xargs -r docker rm -f >/dev/null 2>&1 || true
            if [[ "${started}" -eq 1 && "${containers}" -ge 1 ]]; then
              record apphost-start pass "${containers} container(s) running"
            else
              why='did not start within ten minutes, or exited early'
              [[ "${started}" -eq 1 ]] && why='started but no container was running'
              echo "apphost-start: failed (${why}; output withheld)" >&2
              record apphost-start FAIL "${why}"; any_failed=1
            fi
          fi
        fi
        exit 0
