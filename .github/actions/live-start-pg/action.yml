name: Start the PostgreSQL live servers
description: >
  Starts the PostgreSQL 17 servers behind the postgres, pg-dbx (the Dbx route),
  pgtls (TLS plus plain) and bastion (SSH tunnel) arms, and the legacy-protocol
  servers (PG 12/13 TLS 1.0/1.1, PG 17 RSA-kex) the tls-legacy arm will prove.
  Every server image is pinned by digest. Credentials are per-run throwaways for a
  loopback container that dies with the runner, masked before first use and handed
  to the suite only through GITHUB_ENV. Reads the private source only through the
  checked-out tree and publishes nothing.

inputs:
  engine:
    description: Arm to start (postgres, pg-dbx, pgtls, bastion; tls-legacy is ready but not yet rostered)
    required: true

runs:
  using: composite
  steps:
    - name: Start the postgres, pgtls, bastion server and wait for readiness
      shell: bash
      working-directory: ${{ github.workspace }}/src
      env:
        ENGINE: ${{ inputs.engine }}
      run: |
          set -euo pipefail
          ready=0

          case "${ENGINE}" in
            postgres)
              # PostgreSQL 17 (tools/db-lab's `postgres` service), pinned by
              # index digest (tag 17-alpine, resolved 2026-10-04; amd64
              # compressed 0.12 GB). User and database names are the ones the
              # suites hard-code (`taurine` / `payments`); the password is a
              # throwaway generated per run and masked before any use. The
              # lab's seed SQL is mounted from the checked-out source so the
              # fixtures cannot drift from the tests that read them. Ready =
              # a real query over TCP as the real user (the init phase's
              # temporary server listens on the socket only, so a TCP answer
              # means the final server is up).
              [[ -s "${GITHUB_WORKSPACE}/src/tools/db-lab/postgres/init/01-payments.sql" ]] || { echo 'postgres: the lab seed is missing from the source checkout' >&2; exit 1; }
              pg_pass="$(head -c 18 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              echo "::add-mask::${pg_pass}"
              docker run -d --name dbx-postgres \
                -e POSTGRES_USER=taurine -e POSTGRES_DB=payments \
                -e POSTGRES_PASSWORD="${pg_pass}" -e PGPASSWORD="${pg_pass}" \
                -p 127.0.0.1:15432:5432 \
                -v "${GITHUB_WORKSPACE}/src/tools/db-lab/postgres/init:/docker-entrypoint-initdb.d:ro" \
                postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
              for _ in $(seq 1 60); do
                if docker exec dbx-postgres psql -h 127.0.0.1 -U taurine -d payments -c 'select 1' >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                sleep 3
              done
              if (( ready == 0 )); then
                echo 'postgres: no authenticated TCP answer after 3 minutes; log tail below' >&2
                docker logs dbx-postgres 2>&1 | tail -30 >&2 || true
                exit 1
              fi
              version="$(docker exec dbx-postgres psql -h 127.0.0.1 -U taurine -d payments -tAc 'show server_version' 2>/dev/null | head -1)"
              {
                echo "TAURINE_TEST_PG=127.0.0.1:15432"
                echo "TAURINE_TEST_PG_PASSWORD=${pg_pass}"
                echo "PROOF_SERVER_VERSION=PostgreSQL ${version}"
              } >> "${GITHUB_ENV}"
              ;;

            pg-dbx)
              # The same PostgreSQL 17 server the postgres arm proves the legacy
              # route against — the same pinned image (index digest, tag
              # 17-alpine, resolved 2026-10-04) — dialled through the **Dbx
              # route** (plan 25 task 2.5; PG2's live evidence for the Stage-2
              # pilot). No environment switch exists or is needed: the route is
              # selected by the private repository's own Dbx-route suites the
              # way every conformance run selects it, by handing the engine's
              # connect walk the adapter family built over the legacy
              # registration, so both routes cross the same `connect_routed`
              # seam. The login is the one those suites dial (`postgres`,
              # database `postgres` — the lab's corroboration run added exactly
              # this role to the shared server); the password is a throwaway
              # generated per run and masked before any use. The Dbx suites
              # seed their own fixtures, so the lab's payments seed is not
              # mounted here.
              pg_pass="$(head -c 18 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              echo "::add-mask::${pg_pass}"
              docker run -d --name dbx-pg-dbx \
                -e POSTGRES_USER=postgres -e POSTGRES_DB=postgres \
                -e POSTGRES_PASSWORD="${pg_pass}" -e PGPASSWORD="${pg_pass}" \
                -p 127.0.0.1:15432:5432 \
                postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
              for _ in $(seq 1 60); do
                if docker exec dbx-pg-dbx psql -h 127.0.0.1 -U postgres -d postgres -c 'select 1' >/dev/null 2>&1; then
                  ready=1
                  break
                fi
                sleep 3
              done
              if (( ready == 0 )); then
                echo 'pg-dbx: no authenticated TCP answer after 3 minutes; log tail below' >&2
                docker logs dbx-pg-dbx 2>&1 | tail -30 >&2 || true
                exit 1
              fi
              version="$(docker exec dbx-pg-dbx psql -h 127.0.0.1 -U postgres -d postgres -tAc 'show server_version' 2>/dev/null | head -1)"
              {
                echo "TAURINE_TEST_PG=127.0.0.1:15432"
                echo "TAURINE_TEST_PG_PASSWORD=${pg_pass}"
                echo "PROOF_SERVER_VERSION=PostgreSQL ${version}"
              } >> "${GITHUB_ENV}"
              ;;

            pgtls)
              # The two PostgreSQL servers `taurine-db-postgres/tests/live_tls.rs`
              # needs at once (the lab's `postgres-tls` and `postgres-plain`):
              # one presenting a certificate for pg.taurine.test, one with
              # ssl=off. Both from the same pinned image (postgres 17-alpine,
              # index digest, 0.12 GB compressed). The certificate material
              # (CA, leaf, a rogue CA) is minted per run by the source's own
              # tools/db-lab/pgtls/generate.sh into the runner's checkout —
              # git-ignored there, never committed, gone with the runner — and
              # that script verifies the leaf chains to the CA, carries the
              # SAN and EKU, and does not chain to the rogue CA. The lab's
              # entrypoint copies the key into the container with the right
              # ownership. Ready = a TLS session proven by pg_stat_ssl, and a
              # plaintext session proven by `show ssl`.
              lab="${GITHUB_WORKSPACE}/src/tools/db-lab/pgtls"
              [[ -s "${lab}/generate.sh" && -s "${lab}/entrypoint.sh" ]] || { echo 'pgtls: the lab scripts are missing from the source checkout' >&2; exit 1; }
              bash "${lab}/generate.sh" >/dev/null
              for f in ca.crt rogue-ca.crt server.crt server.key; do
                [[ -s "${lab}/${f}" ]] || { echo "pgtls: generate.sh did not produce ${f}" >&2; exit 1; }
              done
              pg_pass="$(head -c 18 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              echo "::add-mask::${pg_pass}"
              docker run -d --name dbx-pgtls \
                -e POSTGRES_USER=taurine -e POSTGRES_DB=payments \
                -e POSTGRES_PASSWORD="${pg_pass}" -e PGPASSWORD="${pg_pass}" \
                -p 127.0.0.1:15433:5432 \
                -v "${lab}:/pgtls-src:ro" \
                --entrypoint /bin/sh \
                postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 \
                /pgtls-src/entrypoint.sh -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
              docker run -d --name dbx-pgplain \
                -e POSTGRES_USER=taurine -e POSTGRES_DB=payments \
                -e POSTGRES_PASSWORD="${pg_pass}" -e PGPASSWORD="${pg_pass}" \
                -p 127.0.0.1:15434:5432 \
                postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 \
                -c ssl=off
              tls_ok=0
              plain_ok=0
              for _ in $(seq 1 60); do
                if (( tls_ok == 0 )) && docker exec dbx-pgtls psql 'host=127.0.0.1 port=5432 user=taurine dbname=payments sslmode=require' -tAc 'select ssl from pg_stat_ssl where pid = pg_backend_pid()' 2>/dev/null | grep -qx t; then
                  tls_ok=1
                fi
                if (( plain_ok == 0 )) && docker exec dbx-pgplain psql -h 127.0.0.1 -U taurine -d payments -tAc 'show ssl' 2>/dev/null | grep -qx off; then
                  plain_ok=1
                fi
                if (( tls_ok == 1 && plain_ok == 1 )); then
                  ready=1
                  break
                fi
                sleep 3
              done
              if (( ready == 0 )); then
                echo "pgtls: not ready after 3 minutes (tls=${tls_ok} plain=${plain_ok}); log tails below" >&2
                docker logs dbx-pgtls 2>&1 | tail -20 >&2 || true
                docker logs dbx-pgplain 2>&1 | tail -20 >&2 || true
                exit 1
              fi
              version="$(docker exec dbx-pgtls psql -h 127.0.0.1 -U taurine -d payments -tAc 'show server_version' 2>/dev/null | head -1)"
              {
                echo "TAURINE_TEST_PG_TLS=127.0.0.1:15433"
                echo "TAURINE_TEST_PG_PLAIN=127.0.0.1:15434"
                echo "TAURINE_TEST_PG_TLS_CA=${lab}/ca.crt"
                echo "TAURINE_TEST_PG_TLS_ROGUE_CA=${lab}/rogue-ca.crt"
                echo "TAURINE_TEST_PG_PASSWORD=${pg_pass}"
                echo "PROOF_SERVER_VERSION=PostgreSQL ${version} (tls + plain)"
              } >> "${GITHUB_ENV}"
              ;;

            bastion)
              # The SSH-tunnel proof: `taurine-app/tests/dbx_connect_live.rs`
              # dials a PostgreSQL through the lab's key-only bastion. Three
              # fixed facts the test hard-codes, reproduced here: the bastion
              # listens on 127.0.0.1:14222, the database is the container named
              # `taurine-db-lab-postgres-1` (its IP on the shared network is the
              # tunnel target — unroutable from the host, so an answer proves
              # the dial went through the bastion), and the client key and host
              # public key are exported to tools/db-lab/bastion-keys/ in the
              # checkout (git-ignored; minted per run by the lab's own init.sh,
              # never committed). The bastion image is the lab's Dockerfile
              # with its base pinned by digest (alpine 3.20, index digest,
              # 3.6 MB compressed) and the lab's init.sh taken from the
              # checked-out source; `apk add openssh-server` comes from Alpine's
              # own package repository, the one unpinned input — recorded, not
              # hidden. PostgreSQL is the same pinned image as the postgres arm.
              lab="${GITHUB_WORKSPACE}/src/tools/db-lab"
              [[ -s "${lab}/bastion/init.sh" ]] || { echo 'bastion: the lab init script is missing from the source checkout' >&2; exit 1; }
              pg_pass="$(head -c 18 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              echo "::add-mask::${pg_pass}"
              docker network create dbx-lab-net
              docker run -d --name taurine-db-lab-postgres-1 --network dbx-lab-net \
                -e POSTGRES_USER=taurine -e POSTGRES_DB=payments \
                -e POSTGRES_PASSWORD="${pg_pass}" -e PGPASSWORD="${pg_pass}" \
                -p 127.0.0.1:15432:5432 \
                -v "${lab}/postgres/init:/docker-entrypoint-initdb.d:ro" \
                postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
              ctx="${RUNNER_TEMP}/bastion-ctx"
              mkdir -p "${ctx}"
              cp "${lab}/bastion/Dockerfile" "${lab}/bastion/init.sh" "${ctx}/"
              # The lab's own Dockerfile, with only its base image swapped for
              # the digest-pinned one; fail if the base line was not the one
              # expected, so the pin cannot silently stop applying.
              sed -E -i 's#^FROM alpine:3\.20$#FROM alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc#' "${ctx}/Dockerfile"
              grep -q '^FROM alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc$' "${ctx}/Dockerfile" \
                || { echo 'bastion: the lab Dockerfile base is no longer alpine:3.20; re-resolve and re-pin it' >&2; exit 1; }
              docker build -q -t dbx-lab-bastion "${ctx}"
              docker volume create dbx-lab-bastion-keys >/dev/null
              docker run -d --name dbx-lab-bastion --network dbx-lab-net \
                -p 127.0.0.1:14222:22 \
                -v dbx-lab-bastion-keys:/keys \
                dbx-lab-bastion
              for _ in $(seq 1 60); do
                if docker exec dbx-lab-bastion sh -c 'test -s /keys/client_ed25519 && test -s /keys/bastion_host_ed25519.pub' 2>/dev/null \
                  && docker exec taurine-db-lab-postgres-1 psql -h 127.0.0.1 -U taurine -d payments -c 'select 1' >/dev/null 2>&1 \
                  && docker exec dbx-lab-bastion sh -c 'nc -z 127.0.0.1 22' 2>/dev/null; then
                  ready=1
                  break
                fi
                sleep 3
              done
              if (( ready == 0 )); then
                echo 'bastion: keys, sshd and the database were not all ready after 3 minutes; log tails below' >&2
                docker logs dbx-lab-bastion 2>&1 | tail -20 >&2 || true
                docker logs taurine-db-lab-postgres-1 2>&1 | tail -20 >&2 || true
                exit 1
              fi
              # Export the key material where the test reads it, owned by the
              # runner user (the key is generated as root inside the container).
              mkdir -p "${lab}/bastion-keys"
              docker cp dbx-lab-bastion:/keys/client_ed25519 "${lab}/bastion-keys/client_ed25519"
              docker cp dbx-lab-bastion:/keys/client_ed25519.pub "${lab}/bastion-keys/client_ed25519.pub"
              docker cp dbx-lab-bastion:/keys/bastion_host_ed25519.pub "${lab}/bastion-keys/bastion_host_ed25519.pub"
              sudo chown -R "$(id -u):$(id -g)" "${lab}/bastion-keys"
              chmod 600 "${lab}/bastion-keys/client_ed25519"
              version="$(docker exec taurine-db-lab-postgres-1 psql -h 127.0.0.1 -U taurine -d payments -tAc 'show server_version' 2>/dev/null | head -1)"
              {
                echo "TAURINE_TEST_PG=127.0.0.1:15432"
                echo "TAURINE_TEST_PG_PASSWORD=${pg_pass}"
                echo "PROOF_SERVER_VERSION=PostgreSQL ${version} behind an OpenSSH bastion (key-only)"
              } >> "${GITHUB_ENV}"
              ;;

            tls-legacy)
              # The legacy-protocol PostgreSQL servers the PG9 live proofs need
              # (plan 25 task 2.5; plan 23 §3.3 and §5): TLS 1.0/1.1 only on
              # the last two legacy-capable majors, and an RSA-key-exchange-only
              # TLS 1.2 peer on PostgreSQL 17 — the two real-server shapes the
              # stack-incompatibility classifier must end honestly (today the
              # one-dial rule is proven against a stand-in wall in the private
              # repository's taurine-db-engine/tests/dbx_route_dial.rs).
              # Images pinned by index digest: tags 12-alpine and 13-alpine,
              # resolved 2026-10-08; the 17-alpine digest is the postgres
              # arm's own pin. Certificate material (CA, leaf for
              # pg.taurine.test, a rogue CA) is minted per run by the source's
              # own tools/db-lab/pgtls/generate.sh — the same script, and the
              # same entrypoint's key-ownership fix, the pgtls arm uses.
              #
              # NO ROSTER ENTRY SELECTS THIS SERVER SET YET: the private
              # repository's PG9 live suite — the real-server shape of that
              # wall — has not landed, and the SKIPPED=fail law forbids adding
              # an arm whose suites do not exist. The env block at the end is
              # the gate contract that suite is expected to read; wiring the
              # roster line is the follow-up once it lands.
              lab="${GITHUB_WORKSPACE}/src/tools/db-lab/pgtls"
              [[ -s "${lab}/generate.sh" && -s "${lab}/entrypoint.sh" ]] || { echo 'tls-legacy: the lab scripts are missing from the source checkout' >&2; exit 1; }
              bash "${lab}/generate.sh" >/dev/null
              for f in ca.crt rogue-ca.crt server.crt server.key; do
                [[ -s "${lab}/${f}" ]] || { echo "tls-legacy: generate.sh did not produce ${f}" >&2; exit 1; }
              done
              pg_pass="$(head -c 18 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              echo "::add-mask::${pg_pass}"
              # PG 12: floor TLSv1, ceiling TLSv1.1 — speaks 1.0–1.1 and
              # nothing else. PG 13: pinned to TLS 1.1 on both sides. The
              # SECLEVEL=0 cipher floor is what lets the image's OpenSSL 3
              # still offer the deprecated protocol's suites. All three
              # servers take the minted certificate, so a future verification
              # assertion has a real chain (and the rogue CA) to work with.
              docker run -d --name dbx-pg12-legacy \
                -e POSTGRES_USER=postgres -e POSTGRES_DB=postgres \
                -e POSTGRES_PASSWORD="${pg_pass}" -e PGPASSWORD="${pg_pass}" \
                -p 127.0.0.1:15435:5432 \
                -v "${lab}:/pgtls-src:ro" \
                --entrypoint /bin/sh \
                postgres@sha256:7c8f4870583184ebadf7f17a6513620aac5f365a7938dc6a6911c1d5df2f481a \
                /pgtls-src/entrypoint.sh -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key \
                  -c ssl_min_protocol_version=TLSv1 -c ssl_max_protocol_version=TLSv1.1 -c 'ssl_ciphers=DEFAULT@SECLEVEL=0'
              docker run -d --name dbx-pg13-legacy \
                -e POSTGRES_USER=postgres -e POSTGRES_DB=postgres \
                -e POSTGRES_PASSWORD="${pg_pass}" -e PGPASSWORD="${pg_pass}" \
                -p 127.0.0.1:15436:5432 \
                -v "${lab}:/pgtls-src:ro" \
                --entrypoint /bin/sh \
                postgres@sha256:fb9065b6e3e213bdc07edd372a5b2a26245840b7fb65d1fd8b6700106d51805c \
                /pgtls-src/entrypoint.sh -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key \
                  -c ssl_min_protocol_version=TLSv1.1 -c ssl_max_protocol_version=TLSv1.1 -c 'ssl_ciphers=DEFAULT@SECLEVEL=0'
              # PG 17 restricted to RSA key exchange: TLS 1.2 only (the pin is
              # what keeps TLS 1.3 out, whose suites ssl_ciphers cannot
              # restrict) over kRSA-only suites. A rustls client shares no
              # key exchange with it — the no-cipher-suite-in-common shape.
              docker run -d --name dbx-pg17-rsakex \
                -e POSTGRES_USER=postgres -e POSTGRES_DB=postgres \
                -e POSTGRES_PASSWORD="${pg_pass}" -e PGPASSWORD="${pg_pass}" \
                -p 127.0.0.1:15437:5432 \
                -v "${lab}:/pgtls-src:ro" \
                --entrypoint /bin/sh \
                postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24 \
                /pgtls-src/entrypoint.sh -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key \
                  -c ssl_min_protocol_version=TLSv1.2 -c ssl_max_protocol_version=TLSv1.2 \
                  -c 'ssl_ciphers=AES128-GCM-SHA256:AES256-GCM-SHA384'
              # Readiness is the server's own wire truth, not a sleep: each
              # proof asks the runner's own openssl — the client tier the
              # suites run on; the postgres images carry no openssl binary —
              # to complete (or fail) the exact handshake the server's pins
              # describe. A completed handshake prints a `Protocol version:`
              # line; an empty answer is a refused one. The explicit
              # -min_protocol/-max_protocol and the SECLEVEL=0 cipher floor
              # overrule the runner's distribution defaults, which would
              # otherwise refuse the legacy protocols client-side — a refusal
              # that says nothing about the server. Probes that must fail are
              # expected to fail; none aborts the step.
              wire() {
                echo | openssl s_client -starttls postgres -connect "127.0.0.1:${1}" -brief "${@:2}" 2>&1 \
                  | sed -n 's/^.*Protocol version: *//p' | head -1 || true
              }
              tls10_ok=0
              tls11_ok=0
              rsakex_ok=0
              auth_ok=0
              for _ in $(seq 1 60); do
                if (( tls10_ok == 0 )); then
                  got="$(wire 15435 -min_protocol TLSv1 -max_protocol TLSv1.1 -cipher 'ALL@SECLEVEL=0')"
                  refused="$(wire 15435 -min_protocol TLSv1.2)"
                  [[ "${got}" == "TLSv1.1" && -z "${refused}" ]] && tls10_ok=1
                fi
                if (( tls11_ok == 0 )); then
                  got="$(wire 15436 -min_protocol TLSv1.1 -max_protocol TLSv1.1 -cipher 'ALL@SECLEVEL=0')"
                  refused="$(wire 15436 -min_protocol TLSv1 -max_protocol TLSv1)"
                  [[ "${got}" == "TLSv1.1" && -z "${refused}" ]] && tls11_ok=1
                fi
                if (( rsakex_ok == 0 )); then
                  got="$(wire 15437 -tls1_2 -cipher AES128-GCM-SHA256)"
                  refused="$(wire 15437 -tls1_2 -cipher ECDHE-RSA-AES128-GCM-SHA256)"
                  [[ "${got}" == "TLSv1.2" && -z "${refused}" ]] && rsakex_ok=1
                fi
                if (( auth_ok == 0 )) && docker exec dbx-pg12-legacy psql -h 127.0.0.1 -U postgres -d postgres -c 'select 1' >/dev/null 2>&1 \
                  && docker exec dbx-pg13-legacy psql -h 127.0.0.1 -U postgres -d postgres -c 'select 1' >/dev/null 2>&1 \
                  && docker exec dbx-pg17-rsakex psql -h 127.0.0.1 -U postgres -d postgres -c 'select 1' >/dev/null 2>&1; then
                  auth_ok=1
                fi
                if (( tls10_ok == 1 && tls11_ok == 1 && rsakex_ok == 1 && auth_ok == 1 )); then
                  ready=1
                  break
                fi
                sleep 3
              done
              if (( ready == 0 )); then
                echo "tls-legacy: not ready after 3 minutes (tls1.0/1.1=${tls10_ok} tls1.1=${tls11_ok} rsakex=${rsakex_ok} auth=${auth_ok}); log tails below" >&2
                docker logs dbx-pg12-legacy 2>&1 | tail -20 >&2 || true
                docker logs dbx-pg13-legacy 2>&1 | tail -20 >&2 || true
                docker logs dbx-pg17-rsakex 2>&1 | tail -20 >&2 || true
                exit 1
              fi
              v12="$(docker exec dbx-pg12-legacy psql -h 127.0.0.1 -U postgres -d postgres -tAc 'show server_version' 2>/dev/null | head -1)"
              v13="$(docker exec dbx-pg13-legacy psql -h 127.0.0.1 -U postgres -d postgres -tAc 'show server_version' 2>/dev/null | head -1)"
              v17="$(docker exec dbx-pg17-rsakex psql -h 127.0.0.1 -U postgres -d postgres -tAc 'show server_version' 2>/dev/null | head -1)"
              {
                echo "TAURINE_TEST_PG_TLS10=127.0.0.1:15435"
                echo "TAURINE_TEST_PG_TLS11=127.0.0.1:15436"
                echo "TAURINE_TEST_PG_RSAKEX=127.0.0.1:15437"
                echo "TAURINE_TEST_PG_TLS_CA=${lab}/ca.crt"
                echo "TAURINE_TEST_PG_TLS_ROGUE_CA=${lab}/rogue-ca.crt"
                echo "TAURINE_TEST_PG_PASSWORD=${pg_pass}"
                echo "PROOF_SERVER_VERSION=PostgreSQL ${v12} (TLS 1.0-1.1 only) / PostgreSQL ${v13} (TLS 1.1 only) / PostgreSQL ${v17} (RSA-kex TLS 1.2 only)"
              } >> "${GITHUB_ENV}"
              ;;

            *)
              echo "Unsupported engine for this composite: ${ENGINE}" >&2
              exit 2
              ;;
          esac
