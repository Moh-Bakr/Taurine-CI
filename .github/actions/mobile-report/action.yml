name: Install the mobile failure reporter
description: >
  Writes the mobile failure-reporting library (mobile_run and its fixed classifiers) to the runner
  temp directory, to be sourced after the shared sanitizers by the Android and iOS concern steps.
  Reads nothing from the private source and publishes nothing.

runs:
  using: composite
  steps:
    - name: Write the mobile failure reporter library
      shell: bash
      run: |
        set -euo pipefail
        cat > "${RUNNER_TEMP}/taurine-ci/mobile-report.sh" <<'TCI_MOBILE_REPORT_LIBRARY'
        # shellcheck shell=bash
        # Mobile failure reporting. Sourced after the shared sanitize library. A failed command
        # publishes one fixed classification, its exit status, and (for Rust errors) the error
        # code with its repository-relative file:line. Message text, source excerpts, symbol
        # names and tool output are never published.

        mobile_reason() {
          local log="$1" reason
          reason="$(cargo_test_reason "${log}")"
          if [[ "${reason}" != 'command returned non-zero' ]]; then echo "${reason}"
          elif grep -qE 'SDK location not found|No version of NDK matched' "${log}"; then echo 'Android SDK or NDK not found'
          elif grep -qE 'Could not (resolve|download|GET)|UnknownHostException|Connection (reset|timed out)' "${log}"; then echo 'dependency download failure (network)'
          elif grep -qE '^> Task [^[:space:]]+ FAILED$|^FAILURE: Build failed' "${log}"; then echo 'Gradle build failure'
          elif grep -qE 'Undefined symbols for architecture' "${log}"; then echo 'link failure: undefined symbols'
          elif grep -qiE 'no such module' "${log}"; then echo 'Swift module not found'
          elif grep -qiE 'code ?sign|provisioning profile' "${log}"; then echo 'code signing or provisioning failure'
          elif grep -qE '[*][*] (BUILD|ARCHIVE) FAILED [*][*]' "${log}"; then echo 'xcodebuild build failure'
          elif grep -qiE 'ETIMEDOUT|ECONNRESET|EAI_AGAIN' "${log}"; then echo 'network failure'
          else echo 'command returned non-zero'
          fi
        }

        # `error[Ennnn]` as the code, with the repository-relative file:line of its `-->` location.
        mobile_error_sites() {
          local sites
          sites="$(sanitize_stream <"$1" | strip_excerpts | awk '
            match($0, /error\[E[0-9][0-9]*\]/) { code = substr($0, RSTART + 6, RLENGTH - 7); next }
            match($0, /--> [^ ]*:[0-9][0-9]*:[0-9][0-9]*/) {
              if (code != "") {
                n = split(substr($0, RSTART + 4, RLENGTH - 4), a, ":")
                print "  " code " " a[1] ":" a[2]
                code = ""
              }
            }
          ' | awk '!seen[$0]++' | head -30)"
          if [[ -n "${sites}" ]]; then
            echo 'Rust errors (code and file:line; messages withheld):' >&2
            printf '%s\n' "${sites}" >&2
          fi
        }

        # Gradle names the failed task on a fixed shape of line; task names are build structure.
        mobile_failed_tasks() {
          local tasks
          tasks="$(tr -d '\r' <"$1" | grep -E '^> Task [^[:space:]]+ FAILED$' | head -10 || true)"
          if [[ -n "${tasks}" ]]; then
            echo 'Gradle tasks that failed:' >&2
            printf '%s\n' "${tasks}" >&2
          fi
        }

        # One command, one published line. Output stays in a runner-local log. A caller may define
        # mobile_extra_detail <label> <log> for fixed, count-only diagnostics of one label.
        mobile_run() {
          local label="$1"; shift
          local log="${RUNNER_TEMP}/${label}.log" rc=0
          "$@" >"${log}" 2>&1 || rc=$?
          if [[ "${rc}" -eq 0 ]]; then
            echo "${label}: passed"
            return 0
          fi
          tr -d '\r' <"${log}" >"${log}.lf" && mv "${log}.lf" "${log}"
          echo "${label}: failed ($(mobile_reason "${log}"); exit ${rc}; sanitized detail below)" >&2
          mobile_error_sites "${log}"
          mobile_failed_tasks "${log}"
          # Tauri refuses mismatched npm/crate pairs; package names and versions only.
          tauri_version_mismatch "${log}" >&2 || true
          if declare -F mobile_extra_detail >/dev/null; then mobile_extra_detail "${label}" "${log}"; fi
          exit 1
        }
        # ---- Test execution (device or simulator) -------------------------------------------
        # Test binaries of one crate (default: the mobile crate) for one target, as built by an
        # earlier `cargo test --no-run`: one absolute path per line (runner-local, never
        # published). An optional test-target name is left out (exclude), or is the only one
        # listed (only); a library's unit-test target is named after the crate, underscored.
        # mobile_test_executables <target> [package] [exclude-target] [only-target]
        mobile_test_executables() {
          local target="$1" package="${2:-taurine-mobile}" exclude="${3:-}" only="${4:-}"
          cargo test --locked --no-run --package "${package}" --target "${target}" --message-format=json 2>/dev/null |
            jq -R -r --arg exclude "${exclude}" --arg only "${only}" '
              fromjson? | select(.reason == "compiler-artifact" and .profile.test == true and .executable != null)
              | select(.target.name != $exclude) | select($only == "" or .target.name == $only) | .executable' |
            sort -u
        }

        # mobile_door_tests <label> <where> <target> <runner>
        # The OpenSSL door crate's own tests on the device, when the door is in the mobile
        # graph for <target> (shell-artefact.sh is sourced first). Its library unit tests (the
        # linked-version policy) and integration tests (ensure_ready, the hardened read-back,
        # the hostile-config child re-exec) run through <runner> with --nocapture, so the fixed
        # `door-roots:` line the roots test prints can be surfaced. `lockfile_policy` is not
        # run on a device: it reads the host Cargo.lock through CARGO_MANIFEST_DIR, a path that
        # does not exist on the device; the host `rust-tls-openssl` concern covers it. When the
        # source carries `public_peer`, its ignored verify-full handshake against a public
        # server is run on its own, with a fixed classification when the device cannot reach
        # it (that failure is not masked). Older sources without the door record one line.
        mobile_door_tests() {
          local label="$1" where="$2" target="$3" door_runner="$4" door version bin line
          local door_bins=() peer_bins=()
          door="$(door_in_graph taurine-mobile "${target}")" || { echo "${label}: the door graph query did not resolve" >&2; exit 1; }
          if [[ "${door}" != present ]]; then
            echo "${label}: taurine-tls-openssl is not in the mobile graph for ${target}; no door tests to run"
            echo "- ${label}: taurine-tls-openssl is not in the mobile graph for ${target}; no door tests to run" >> "${GITHUB_STEP_SUMMARY}"
            return 0
          fi
          mobile_run "${label}-build" cargo test --locked --no-run --package taurine-tls-openssl --target "${target}"
          while IFS= read -r line; do [[ -n "${line}" ]] && door_bins+=("${line}"); done \
            < <(mobile_test_executables "${target}" taurine-tls-openssl lockfile_policy)
          while IFS= read -r line; do [[ -n "${line}" ]] && peer_bins+=("${line}"); done \
            < <(mobile_test_executables "${target}" taurine-tls-openssl '' public_peer)
          for bin in ${door_bins[@]+"${door_bins[@]}"}; do
            version="$(artefact_openssl_version "${bin}")"
            [[ -n "${version}" ]] && break
          done
          echo "${label}: door test binaries link ${version:-no OpenSSL 3.5 version string}"
          echo "- ${label}: door test binaries for ${target} link ${version:-no OpenSSL 3.5 version string}" >> "${GITHUB_STEP_SUMMARY}"
          # door_runner, not runner: mobile_test_execute has its own local `runner`, which bash
          # dynamic scoping would resolve here instead.
          mobile_door_nocapture() { "${door_runner}" "$1" --nocapture; }
          ( mobile_test_execute "${label}" "${where}" mobile_door_nocapture ${door_bins[@]+"${door_bins[@]}"} ) || { mobile_door_lines "${label}"; exit 1; }
          mobile_door_lines "${label}"
          if [[ "${#peer_bins[@]}" -eq 0 ]]; then
            echo "${label}-public-peer: the source has no public_peer test; not run"
            return 0
          fi
          mobile_door_peer() { "${door_runner}" "$1" --ignored --exact verify_full_accepts_a_public_peer_and_refuses_a_wrong_name --nocapture; }
          if ! ( mobile_test_execute "${label}-public-peer" "${where}" mobile_door_peer "${peer_bins[0]}" ); then
            mobile_door_lines "${label}-public-peer"
            if grep -qiE 'failed to lookup address|name or service not known|nodename nor servname|no address associated|temporary failure in name resolution|dns error|connection refused|network is unreachable|connection timed out|timed out|host is unreachable' "${RUNNER_TEMP}/${label}-public-peer-1.log" 2>/dev/null; then
              echo "${label}-public-peer: public peer unreachable from device (resolve or connect error; the handshake was not exercised)" >&2
              echo "- ${label}-public-peer: public peer unreachable from device (resolve or connect error)" >> "${GITHUB_STEP_SUMMARY}"
            fi
            exit 1
          fi
          mobile_door_lines "${label}-public-peer"
        }

        # The door tests' own evidence lines, held to a fixed schema because the test binaries
        # are built from the private source: only `door-roots: (Os|MozillaFallback), N anchors`
        # and `door-public-peer: roots (Os|MozillaFallback), N anchors` (the exact formats the
        # door's tests print), whole lines, at most one per key. Anything else that names a door
        # key is dropped, reported only as `door lines dropped: yes|no`; nothing else is published.
        mobile_door_lines() {
          local label="$1" roots peer dropped line
          cat "${RUNNER_TEMP}/${label}"-[0-9]*.log 2>/dev/null | tr -d '\r' >"${RUNNER_TEMP}/${label}-door-lines.txt" || true
          roots="$(grep -xE 'door-roots: (Os|MozillaFallback), [0-9]{1,5} anchors' "${RUNNER_TEMP}/${label}-door-lines.txt" | head -n 1 || true)"
          peer="$(grep -xE 'door-public-peer: roots (Os|MozillaFallback), [0-9]{1,5} anchors' "${RUNNER_TEMP}/${label}-door-lines.txt" | head -n 1 || true)"
          dropped="$(grep -cE 'door-(roots|public-peer)' "${RUNNER_TEMP}/${label}-door-lines.txt" || true)"
          dropped=$(( ${dropped:-0} - $([[ -n "${roots}" ]] && echo 1 || echo 0) - $([[ -n "${peer}" ]] && echo 1 || echo 0) ))
          for line in "${roots}" "${peer}"; do
            [[ -n "${line}" ]] || continue
            echo "${label}: ${line}"
            echo "- ${label}: ${line}" >> "${GITHUB_STEP_SUMMARY}"
          done
          # One bit, never a source-chosen count.
          line=no
          [[ "${dropped}" -gt 0 ]] && line=yes
          echo "${label}: door lines dropped: ${line}"
          echo "- ${label}: door lines dropped: ${line}" >> "${GITHUB_STEP_SUMMARY}"
          return 0
        }

        # mobile_test_execute <label> <where> <runner> <binary>...
        # Runs each test binary through <runner> (a function taking the binary path), sums the
        # libtest `test result:` lines and publishes counts, binary names (hash removed), failing
        # test names and classified panics. Fail-closed: a failure, a binary that ends without a
        # result line (crash, missing library) or zero executed tests fails the concern. Ignored
        # tests are reported as skipped and never count as executed.
        mobile_test_execute() {
          local label="$1" where="$2" runner="$3"; shift 3
          local verdict bin name log rc counts p f ig n i=0 passed=0 failed=0 skipped=0 binaries=0 bad=0
          local rows=''
          if [[ "$#" -eq 0 ]]; then
            echo "${label}: no test binaries were found (zero tests discovered is a failure)" >&2
            exit 1
          fi
          for bin in "$@"; do
            i=$((i + 1)); binaries=$((binaries + 1))
            name="$(basename "${bin}")"; name="${name%-*}"
            log="${RUNNER_TEMP}/${label}-${i}.log"; rc=0
            "${runner}" "${bin}" >"${log}" 2>&1 || rc=$?
            tr -d '\r' <"${log}" >"${log}.lf" && mv "${log}.lf" "${log}"
            counts="$(awk '/^test result: /{ for (k = 1; k <= NF; k++) { if ($k == "passed;") p += $(k-1); if ($k == "failed;") f += $(k-1); if ($k == "ignored;") g += $(k-1) } n++ } END { print p+0, f+0, g+0, n+0 }' "${log}")"
            read -r p f ig n <<<"${counts}"
            passed=$((passed + p)); failed=$((failed + f)); skipped=$((skipped + ig))
            verdict=ok
            if [[ "${n}" -eq 0 ]]; then verdict="FAILED (exit ${rc}, no result line)"
            elif [[ "${rc}" -ne 0 ]]; then verdict="FAILED (exit ${rc})"; fi
            rows+="| \`${name}\` | ${p} | ${f} | ${ig} | ${verdict} |"$'\n'
            if [[ "${rc}" -ne 0 || "${n}" -eq 0 || "${f}" -gt 0 ]]; then
              bad=$((bad + 1))
              echo "${label}: ${name} failed (exit ${rc}; ${p} passed, ${f} failed, ${n} result line(s))" >&2
              failed_test_names "${log}" | sed 's/^/  failed: /' >&2
              panic_summary "${log}" >&2
            fi
          done
          {
            echo "### ${label}: tests executed on ${where}"
            echo
            echo "- Passed: ${passed}; failed: ${failed}; skipped (ignored): ${skipped}; executed: $((passed + failed)); test binaries: ${binaries}"
            echo
            echo '| Test binary | Passed | Failed | Skipped | Result |'
            echo '| --- | ---: | ---: | ---: | --- |'
            printf '%s' "${rows}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "${label}: ${passed} passed, ${failed} failed, ${skipped} skipped on ${where}"
          if [[ "${bad}" -gt 0 || "${failed}" -gt 0 ]]; then exit 1; fi
          if [[ "$((passed + failed))" -eq 0 ]]; then
            echo "${label}: zero tests were executed (a run that discovers no tests is a failure)" >&2
            exit 1
          fi
        }
        TCI_MOBILE_REPORT_LIBRARY
