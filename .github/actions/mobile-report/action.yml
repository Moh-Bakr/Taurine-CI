name: Install the mobile failure reporter
description: >
  Writes the mobile failure-reporting library (mobile_run and its fixed classifiers) to the runner
  temp directory, to be sourced after the shared sanitizers by the Android and iOS concern steps.
  Reads nothing from the private source and publishes nothing.

runs:
  using: composite
  steps:
    - name: Write the mobile failure reporter library
      shell: bash
      run: |
        set -euo pipefail
        cat > "${RUNNER_TEMP}/taurine-ci/mobile-report.sh" <<'TCI_MOBILE_REPORT_LIBRARY'
        # shellcheck shell=bash
        # Mobile failure reporting. Sourced after the shared sanitize library. A failed command
        # publishes one fixed classification, its exit status, and (for Rust errors) the error
        # code with its repository-relative file:line. Message text, source excerpts, symbol
        # names and tool output are never published.

        mobile_reason() {
          local log="$1" reason
          reason="$(cargo_test_reason "${log}")"
          if [[ "${reason}" != 'command returned non-zero' ]]; then echo "${reason}"
          elif grep -qE 'SDK location not found|No version of NDK matched' "${log}"; then echo 'Android SDK or NDK not found'
          elif grep -qE 'Could not (resolve|download|GET)|UnknownHostException|Connection (reset|timed out)' "${log}"; then echo 'dependency download failure (network)'
          elif grep -qE '^> Task [^[:space:]]+ FAILED$|^FAILURE: Build failed' "${log}"; then echo 'Gradle build failure'
          elif grep -qE 'Undefined symbols for architecture' "${log}"; then echo 'link failure: undefined symbols'
          elif grep -qiE 'no such module' "${log}"; then echo 'Swift module not found'
          elif grep -qiE 'code ?sign|provisioning profile' "${log}"; then echo 'code signing or provisioning failure'
          elif grep -qE '[*][*] (BUILD|ARCHIVE) FAILED [*][*]' "${log}"; then echo 'xcodebuild build failure'
          elif grep -qiE 'ETIMEDOUT|ECONNRESET|EAI_AGAIN' "${log}"; then echo 'network failure'
          else echo 'command returned non-zero'
          fi
        }

        # `error[Ennnn]` as the code, with the repository-relative file:line of its `-->` location.
        mobile_error_sites() {
          local sites
          sites="$(sanitize_stream <"$1" | strip_excerpts | awk '
            match($0, /error\[E[0-9][0-9]*\]/) { code = substr($0, RSTART + 6, RLENGTH - 7); next }
            match($0, /--> [^ ]*:[0-9][0-9]*:[0-9][0-9]*/) {
              if (code != "") {
                n = split(substr($0, RSTART + 4, RLENGTH - 4), a, ":")
                print "  " code " " a[1] ":" a[2]
                code = ""
              }
            }
          ' | awk '!seen[$0]++' | head -30)"
          if [[ -n "${sites}" ]]; then
            echo 'Rust errors (code and file:line; messages withheld):' >&2
            printf '%s\n' "${sites}" >&2
          fi
        }

        # Gradle names the failed task on a fixed shape of line; task names are build structure.
        mobile_failed_tasks() {
          local tasks
          tasks="$(tr -d '\r' <"$1" | grep -E '^> Task [^[:space:]]+ FAILED$' | head -10 || true)"
          if [[ -n "${tasks}" ]]; then
            echo 'Gradle tasks that failed:' >&2
            printf '%s\n' "${tasks}" >&2
          fi
        }

        # One command, one published line. Output stays in a runner-local log. A caller may define
        # mobile_extra_detail <label> <log> for fixed, count-only diagnostics of one label.
        mobile_run() {
          local label="$1"; shift
          local log="${RUNNER_TEMP}/${label}.log" rc=0
          "$@" >"${log}" 2>&1 || rc=$?
          if [[ "${rc}" -eq 0 ]]; then
            echo "${label}: passed"
            return 0
          fi
          tr -d '\r' <"${log}" >"${log}.lf" && mv "${log}.lf" "${log}"
          echo "${label}: failed ($(mobile_reason "${log}"); exit ${rc}; sanitized detail below)" >&2
          mobile_error_sites "${log}"
          mobile_failed_tasks "${log}"
          # Tauri refuses mismatched npm/crate pairs; package names and versions only.
          tauri_version_mismatch "${log}" >&2 || true
          if declare -F mobile_extra_detail >/dev/null; then mobile_extra_detail "${label}" "${log}"; fi
          exit 1
        }
        # ---- Test execution (device or simulator) -------------------------------------------
        # Test binaries of one crate (default: the mobile crate) for one target, as built by an
        # earlier `cargo test --no-run`: one absolute path per line (runner-local, never
        # published). An optional test-target name is left out (exclude), or is the only one
        # listed (only); a library's unit-test target is named after the crate, underscored.
        # mobile_test_executables <target> [package] [exclude-target] [only-target]
        mobile_test_executables() {
          local target="$1" package="${2:-taurine-mobile}" exclude="${3:-}" only="${4:-}"
          cargo test --locked --no-run --package "${package}" --target "${target}" --message-format=json 2>/dev/null |
            jq -R -r --arg exclude "${exclude}" --arg only "${only}" '
              fromjson? | select(.reason == "compiler-artifact" and .profile.test == true and .executable != null)
              | select(.target.name != $exclude) | select($only == "" or .target.name == $only) | .executable' |
            sort -u
        }

        # mobile_door_tests <label> <where> <target> <runner>
        # The OpenSSL door crate's own tests on the device, when the door is in the mobile
        # graph for <target> (shell-artefact.sh is sourced first). Its library unit tests (the
        # linked-version policy) and integration tests (ensure_ready, the hardened read-back,
        # the hostile-config child re-exec) run through <runner> with --nocapture, so the fixed
        # `door-roots:` line the roots test prints can be surfaced. `lockfile_policy` is not
        # run on a device: it reads the host Cargo.lock through CARGO_MANIFEST_DIR, a path that
        # does not exist on the device; the host `rust-tls-openssl` concern covers it. When the
        # source carries `public_peer`, its ignored verify-full handshake against a public
        # server is run on its own, with a fixed classification when the device cannot reach
        # it (that failure is not masked). Older sources without the door record one line.
        mobile_door_tests() {
          local label="$1" where="$2" target="$3" door_runner="$4" door version bin line
          local door_bins=() peer_bins=()
          door="$(door_in_graph taurine-mobile "${target}")" || { echo "${label}: the door graph query did not resolve" >&2; exit 1; }
          if [[ "${door}" != present ]]; then
            echo "${label}: taurine-tls-openssl is not in the mobile graph for ${target}; no door tests to run"
            echo "- ${label}: taurine-tls-openssl is not in the mobile graph for ${target}; no door tests to run" >> "${GITHUB_STEP_SUMMARY}"
            return 0
          fi
          mobile_run "${label}-build" cargo test --locked --no-run --package taurine-tls-openssl --target "${target}"
          while IFS= read -r line; do [[ -n "${line}" ]] && door_bins+=("${line}"); done \
            < <(mobile_test_executables "${target}" taurine-tls-openssl lockfile_policy)
          while IFS= read -r line; do [[ -n "${line}" ]] && peer_bins+=("${line}"); done \
            < <(mobile_test_executables "${target}" taurine-tls-openssl '' public_peer)
          for bin in ${door_bins[@]+"${door_bins[@]}"}; do
            version="$(artefact_openssl_version "${bin}")"
            [[ -n "${version}" ]] && break
          done
          echo "${label}: door test binaries link ${version:-no OpenSSL 3.5 version string}"
          echo "- ${label}: door test binaries for ${target} link ${version:-no OpenSSL 3.5 version string}" >> "${GITHUB_STEP_SUMMARY}"
          # door_runner, not runner: mobile_test_execute has its own local `runner`, which bash
          # dynamic scoping would resolve here instead.
          mobile_door_nocapture() { "${door_runner}" "$1" --nocapture; }
          ( mobile_test_execute "${label}" "${where}" mobile_door_nocapture ${door_bins[@]+"${door_bins[@]}"} ) || { mobile_door_lines "${label}"; exit 1; }
          mobile_door_lines "${label}"
          if [[ "${#peer_bins[@]}" -eq 0 ]]; then
            echo "${label}-public-peer: the source has no public_peer test; not run"
            return 0
          fi
          mobile_door_peer() { "${door_runner}" "$1" --ignored --exact verify_full_accepts_a_public_peer_and_refuses_a_wrong_name --nocapture; }
          if ! ( mobile_test_execute "${label}-public-peer" "${where}" mobile_door_peer "${peer_bins[0]}" ); then
            mobile_door_lines "${label}-public-peer"
            if grep -qiE 'failed to lookup address|name or service not known|nodename nor servname|no address associated|temporary failure in name resolution|dns error|connection refused|network is unreachable|connection timed out|timed out|host is unreachable' "${RUNNER_TEMP}/${label}-public-peer-1.log" 2>/dev/null; then
              echo "${label}-public-peer: public peer unreachable from device (resolve or connect error; the handshake was not exercised)" >&2
              echo "- ${label}-public-peer: public peer unreachable from device (resolve or connect error)" >> "${GITHUB_STEP_SUMMARY}"
            fi
            exit 1
          fi
          mobile_door_lines "${label}-public-peer"
        }

        # The door tests' own evidence lines, held to a fixed schema because the test binaries
        # are built from the private source: only `door-roots: (Os|MozillaFallback), N anchors`
        # and `door-public-peer: roots (Os|MozillaFallback), N anchors` (the exact formats the
        # door's tests print), whole lines, at most one per key. Anything else that names a door
        # key is dropped, reported only as `door lines dropped: yes|no`; nothing else is published.
        mobile_door_lines() {
          local label="$1" roots peer dropped line
          cat "${RUNNER_TEMP}/${label}"-[0-9]*.log 2>/dev/null | tr -d '\r' >"${RUNNER_TEMP}/${label}-door-lines.txt" || true
          roots="$(grep -xE 'door-roots: (Os|MozillaFallback), [0-9]{1,5} anchors' "${RUNNER_TEMP}/${label}-door-lines.txt" | head -n 1 || true)"
          peer="$(grep -xE 'door-public-peer: roots (Os|MozillaFallback), [0-9]{1,5} anchors' "${RUNNER_TEMP}/${label}-door-lines.txt" | head -n 1 || true)"
          dropped="$(grep -cE 'door-(roots|public-peer)' "${RUNNER_TEMP}/${label}-door-lines.txt" || true)"
          dropped=$(( ${dropped:-0} - $([[ -n "${roots}" ]] && echo 1 || echo 0) - $([[ -n "${peer}" ]] && echo 1 || echo 0) ))
          for line in "${roots}" "${peer}"; do
            [[ -n "${line}" ]] || continue
            echo "${label}: ${line}"
            echo "- ${label}: ${line}" >> "${GITHUB_STEP_SUMMARY}"
          done
          # One bit, never a source-chosen count.
          line=no
          [[ "${dropped}" -gt 0 ]] && line=yes
          echo "${label}: door lines dropped: ${line}"
          echo "- ${label}: door lines dropped: ${line}" >> "${GITHUB_STEP_SUMMARY}"
          return 0
        }

        # mobile_test_execute <label> <where> <runner> <binary>...
        # Runs each test binary through <runner> (a function taking the binary path), sums the
        # libtest `test result:` lines and publishes counts, binary names (hash removed), failing
        # test names and classified panics. Fail-closed: a failure, a binary that ends without a
        # result line (crash, missing library) or zero executed tests fails the concern. Ignored
        # tests are reported as skipped and never count as executed.
        mobile_test_execute() {
          local label="$1" where="$2" runner="$3"; shift 3
          local verdict bin name log rc counts p f ig n i=0 passed=0 failed=0 skipped=0 binaries=0 bad=0
          local rows=''
          if [[ "$#" -eq 0 ]]; then
            echo "${label}: no test binaries were found (zero tests discovered is a failure)" >&2
            exit 1
          fi
          for bin in "$@"; do
            i=$((i + 1)); binaries=$((binaries + 1))
            name="$(basename "${bin}")"; name="${name%-*}"
            log="${RUNNER_TEMP}/${label}-${i}.log"; rc=0
            "${runner}" "${bin}" >"${log}" 2>&1 || rc=$?
            tr -d '\r' <"${log}" >"${log}.lf" && mv "${log}.lf" "${log}"
            counts="$(awk '/^test result: /{ for (k = 1; k <= NF; k++) { if ($k == "passed;") p += $(k-1); if ($k == "failed;") f += $(k-1); if ($k == "ignored;") g += $(k-1) } n++ } END { print p+0, f+0, g+0, n+0 }' "${log}")"
            read -r p f ig n <<<"${counts}"
            passed=$((passed + p)); failed=$((failed + f)); skipped=$((skipped + ig))
            verdict=ok
            if [[ "${n}" -eq 0 ]]; then verdict="FAILED (exit ${rc}, no result line)"
            elif [[ "${rc}" -ne 0 ]]; then verdict="FAILED (exit ${rc})"; fi
            rows+="| \`${name}\` | ${p} | ${f} | ${ig} | ${verdict} |"$'\n'
            if [[ "${rc}" -ne 0 || "${n}" -eq 0 || "${f}" -gt 0 ]]; then
              bad=$((bad + 1))
              echo "${label}: ${name} failed (exit ${rc}; ${p} passed, ${f} failed, ${n} result line(s))" >&2
              failed_test_names "${log}" | sed 's/^/  failed: /' >&2
              panic_summary "${log}" >&2
            fi
          done
          {
            echo "### ${label}: tests executed on ${where}"
            echo
            echo "- Passed: ${passed}; failed: ${failed}; skipped (ignored): ${skipped}; executed: $((passed + failed)); test binaries: ${binaries}"
            echo
            echo '| Test binary | Passed | Failed | Skipped | Result |'
            echo '| --- | ---: | ---: | ---: | --- |'
            printf '%s' "${rows}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "${label}: ${passed} passed, ${failed} failed, ${skipped} skipped on ${where}"
          if [[ "${bad}" -gt 0 || "${failed}" -gt 0 ]]; then exit 1; fi
          if [[ "$((passed + failed))" -eq 0 ]]; then
            echo "${label}: zero tests were executed (a run that discovers no tests is a failure)" >&2
            exit 1
          fi
        }

        # ---- Source-controlled build logic of the mobile native steps -------------------------------
        # Needs tci_sha256, tci_cargo_home, tauri_script_pinned and tauri_cli from shell-config (sourced
        # by the shell-artefact library, which every caller loads). Prints file names and reasons only.

        # Reviewed SHA-256 of every Gradle build-logic file outside buildSrc that the private source
        # tracks under gen/android and `tauri android init` leaves alone (hashes only; no source).
        # Change them only with a reviewed bump of the private files.
        mobile_android_gradle_pinned() {
          printf '%s\n' \
            '780ee423777541b6d7a4f75d7d8da188dc1a92860f70fea09015b03d2e1594c2  app/build.gradle.kts' \
            'f8d6b8ac33de9acbe318595de7be4500fec1009f8ea0edc508fd998cc15294c5  build.gradle.kts' \
            '580de86208e48edae2206e167da024f17794269d296ad46a94d001c6809ba2cb  gradle.properties' \
            '99856053f245337d20d308dbeaf9cd7250ad0c186ebbb6866ab46a6e7005ee19  settings.gradle'
        }

        # Content of the Gradle files the pinned CLI (@tauri-apps/cli 2.12.0) writes during `tauri android
        # build`, NOT during `tauri android init` (init only renders the template project, whose
        # settings.gradle merely applies tauri.settings.gradle). tauri.settings.gradle and
        # app/tauri.build.gradle.kts are written by tauri-build's build script
        # (crates/tauri-build/src/mobile.rs generate_gradle_files, tag tauri-build-v2.5.6) when `tauri
        # android build` runs its "initial build to initialize plugins" (a cargo build, crates/tauri-cli/
        # src/mobile/android/build.rs:195-230 at tag tauri-cli-v2.12.0), one step before the same process
        # starts Gradle (build.rs run_build, apk::build). No CLI flag stops between the two (`skip_bundle`
        # is `#[clap(skip)]`, build.rs:71-72), so the content of these two files cannot be judged before
        # Gradle reads them: CI judges it afterwards, as mode after-build of
        # mobile_android_gradle_pin_check (detection, not prevention; see there).
        # app/tauri.properties is written by the CLI itself (mobile/android/mod.rs:1148-1205), and only
        # when a version is set. The check takes `require` when the files must exist (after the build).
        # Without it none is demanded, but the two build-written Gradle files come as a pair: if one
        # exists, both must, and whatever exists is judged. Every non-blank
        # line must be one the template emits: the autogenerated banner, an include, a projectDir, a
        # dependency, a version property. A projectDir must be an absolute path inside cargo's registry
        # source directory, in the crate directory of the included project itself (<index>/tauri-<ver>/
        # mobile/android for :tauri-android, <index>/<plugin crate>-<ver>/android for a plugin; where the
        # CLI finds the Tauri and plugin android projects, a plugin choosing the subpath, `android` by
        # convention; a git checkout
        # is refused: the private tree has no git dependency that ships an android project), never
        # inside the checkout and never with `..`. Anything else fails closed. Template shapes
        # (tauri-build mobile.rs at tag tauri-build-v2.5.6, and a debug build's output): include ':tauri-android'; project(':tauri-android').
        # projectDir = new File("<cargo>/registry/src/<index>/tauri-<version>/mobile/android");
        # implementation("group:artifact:version") with a group under androidx, com.google.android or
        # app.tauri (the groups the pinned CLI and the tracked plugins emit: androidx.lifecycle today);
        # implementation(project(":x")).
        mobile_android_generated_gradle_check() {
          local root=taurine-mobile/src-tauri/gen/android file name line top home rhome path inc dirs rc=0 pname rel re_rel require="${1:-}"
          case "${require}" in ''|require) ;; *) echo 'generated-gradle: FAILED - unknown argument' >&2; return 1 ;; esac
          local nm='(tauri-android|tauri-plugin-[A-Za-z0-9_.-]+)'
          local re_banner='^// THIS IS AN AUTOGENERATED FILE\. DO NOT EDIT THIS FILE DIRECTLY\.$'
          local re_include="^include ':${nm}'\$"
          local re_dir="^project\\(':${nm}'\\)\\.projectDir = new File\\(\"([^\"]+)\"\\)\$"
          local re_val='^val implementation by configurations$' re_open='^dependencies \{$' re_close='^\}$'
          local re_dep='^  implementation\("(androidx|com\.google\.android|app\.tauri)(\.[A-Za-z0-9_.-]+)?:[A-Za-z0-9_.-]+:[A-Za-z0-9_.+-]+"\)$'
          local re_proj="^  implementation\\(project\\(\":${nm}\"\\)\\)\$"
          local re_prop='^tauri\.android\.version(Name|Code)=[0-9A-Za-z.+-]+$'
          top="$(pwd -P)"; home="$(tci_cargo_home)"; rhome="$(cd "${home}" 2>/dev/null && pwd -P || echo "${home}")"
          case "${home}/" in "${top}/"*) echo 'generated-gradle: FAILED - CARGO_HOME is inside the checkout' >&2; return 1 ;; esac
          case "${rhome}/" in "${top}/"*) echo 'generated-gradle: FAILED - CARGO_HOME is inside the checkout' >&2; return 1 ;; esac
          if [[ -z "${require}" ]]; then
            for name in tauri.settings.gradle app/tauri.build.gradle.kts; do
              if [[ -e "${root}/${name}" || -L "${root}/${name}" ]]; then require=pair; fi
            done
          fi
          for name in tauri.settings.gradle app/tauri.build.gradle.kts app/tauri.properties; do
            file="${root}/${name}"
            if [[ ! -f "${file}" || -L "${file}" ]]; then
              [[ "${name}" == app/tauri.properties && ! -e "${file}" && ! -L "${file}" ]] && continue
              [[ -z "${require}" && ! -e "${file}" && ! -L "${file}" ]] && continue
              echo "generated-gradle: FAILED - ${name} is missing or a link" >&2; rc=1; continue
            fi
            if ! tr -d '\0' <"${file}" | cmp -s - "${file}"; then
              echo "generated-gradle: FAILED - ${name}: a NUL byte" >&2; rc=1; continue
            fi
            if grep -qE 'include(Build|Flat)' "${file}"; then
              echo "generated-gradle: FAILED - ${name}: an included build" >&2; rc=1; continue
            fi
            inc=''; dirs=''
            while IFS= read -r line || [[ -n "${line}" ]]; do
              [[ -n "${line//[[:space:]]/}" ]] || continue
              case "${name}" in
                tauri.settings.gradle)
                  if [[ "${line}" =~ ${re_banner} ]]; then continue; fi
                  if [[ "${line}" =~ ${re_include} ]]; then inc="${inc}${BASH_REMATCH[1]} "; continue; fi
                  if [[ "${line}" =~ ${re_dir} ]]; then
                    pname="${BASH_REMATCH[1]}"; dirs="${dirs}${pname} "; path="${BASH_REMATCH[2]}"
                    case "${path}" in
                      *..*|*[\$\`\\]*) echo "generated-gradle: FAILED - ${name}: a projectDir with a relative or special path" >&2; rc=1; continue ;;
                      "${home}/registry/src/"*) rel="${path#"${home}/registry/src/"}" ;;
                      "${rhome}/registry/src/"*) rel="${path#"${rhome}/registry/src/"}" ;;
                      *) echo "generated-gradle: FAILED - ${name}: a projectDir outside cargo's registry source directory" >&2; rc=1; continue ;;
                    esac
                    # <index>/<crate>-<version>/<android project>: the crate directory is the included
                    # project's own crate (tauri for :tauri-android, the plugin crate otherwise), never
                    # another registry crate.
                    semver='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?'
                    if [[ "${pname}" == tauri-android ]]; then
                      re_rel="^[^/]+/tauri-${semver}/mobile/android\$"
                    else
                      re_rel="^[^/]+/${pname//./\\.}-${semver}/android\$"
                    fi
                    [[ "${rel}" =~ ${re_rel} ]] || { echo "generated-gradle: FAILED - ${name}: a projectDir that is not the included project's own crate directory in cargo's registry" >&2; rc=1; continue; }
                    continue
                  fi ;;
                app/tauri.build.gradle.kts)
                  if [[ "${line}" =~ ${re_banner} || "${line}" =~ ${re_val} || "${line}" =~ ${re_open} || "${line}" =~ ${re_close} || "${line}" =~ ${re_dep} || "${line}" =~ ${re_proj} ]]; then continue; fi ;;
                app/tauri.properties)
                  if [[ "${line}" =~ ${re_banner} || "${line}" =~ ${re_prop} ]]; then continue; fi ;;
              esac
              echo "generated-gradle: FAILED - ${name}: a line the pinned CLI template does not emit" >&2; rc=1
            done <"${file}"
            if [[ "${name}" == tauri.settings.gradle && "$(printf '%s\n' ${inc} | LC_ALL=C sort)" != "$(printf '%s\n' ${dirs} | LC_ALL=C sort)" ]]; then
              echo "generated-gradle: FAILED - ${name}: an include without its projectDir, or the reverse" >&2; rc=1
            fi
          done
          return "${rc}"
        }

        # The four pinned files, by SHA-256, plus the includeBuild guard (before and after the build).
        mobile_android_gradle_pinned_hash_check() {
          local root=taurine-mobile/src-tauri/gen/android sum file rc=0
          while read -r sum file; do
            [[ -n "${file}" ]] || continue
            if [[ ! -f "${root}/${file}" || -L "${root}/${file}" ]]; then
              echo "gradle-pin: FAILED - missing file: ${file} (or it is a link)" >&2; rc=1
            elif [[ "$(tci_sha256 "${root}/${file}")" != "${sum}" ]]; then
              echo "gradle-pin: FAILED - ${file}: hash mismatch" >&2; rc=1
            elif grep -qE "include(Build|Flat).*(\.\.|['\"]/)" "${root}/${file}"; then
              echo "gradle-pin: FAILED - ${file}: an included build leaves gen/android" >&2; rc=1
            fi
          done < <(mobile_android_gradle_pinned)
          return "${rc}"
        }

        # Everything under gen/android is on an allow-list, else refused (so a tracked local.properties
        # with sdk.dir/ndk.dir, a .gradle/ configuration, an init script, a second settings file or a
        # version catalog cannot slip past a pattern that did not think of it):
        # - the four pinned build files (SHA-256, above);
        # - buildSrc/* (verified by mobile_android_buildsrc_pin_check) and the wrapper files and gradlew
        #   scripts (gradle_wrapper_check);
        # - editor/ignore/ProGuard files by exact name, and the template's app/src/main manifest,
        #   resources (xml/png/webp) and Kotlin/Java sources: application code and data, not build logic;
        # - after init only: the generated Gradle files (if present), app/proguard-tauri.pro, app/src/main/
        #   assets/tauri.conf.json and the ten template files in a `generated/` source directory (the CLI
        #   rewrites them; any other name there is refused).
        # local.properties and .gradle are refused anywhere, in both modes. No link, special file, hard
        # link, control character in a name or init.d directory; no parent of the root may be a link. A
        # find that errors (an unreadable directory) fails the check. includeBuild/includeFlat leaving
        # the root in a pinned or generated file is refused as well.

        # Modes (what the pinned CLI has written at that point):
        # - before-init: the tracked project only.
        # - after-init: the tracked project plus what `tauri android init` renders (generated Kotlin
        #   sources, proguard-tauri.pro, assets/tauri.conf.json). The two Gradle files the build
        #   writes (tauri.settings.gradle, app/tauri.build.gradle.kts) do not exist yet; one that is
        #   present anyway has its content judged now, none is demanded.
        # - after-build: only after the throwaway CI build. Cargo and Gradle have then left build
        #   outputs under gen/android, so the tree scan is not run; the pinned files must still match
        #   their hashes and the generated Gradle files must exist and match the CLI template.
        #   RESIDUAL RISK (detection only): the CLI writes tauri.settings.gradle and
        #   app/tauri.build.gradle.kts and starts Gradle in one process, so Gradle has already built
        #   from them when this runs. What bounds that: their content comes from the
        #   `DEP_*_ANDROID_LIBRARY_PATH` values cargo derives from the locked dependency graph's
        #   `links` build-script output (tauri-build mobile.rs); the graph is Cargo.lock-pinned, the
        #   door crates are verified, and the settings/build/buildSrc/wrapper Gradle logic and the
        #   Gradle user-home files are pinned or refused before the build; and cargo build scripts,
        #   the real source of that content, already run arbitrary code earlier in the same command.
        #   The build is a throwaway CI build: nothing it produces ships, and a failure here fails
        #   the job.
        mobile_android_gradle_pin_check() {
          local mode="$1" root=taurine-mobile/src-tauri/gen/android path out file rel rc=0 gen_ok
          case "${mode}" in before-init|after-init|after-build) ;; *) echo 'gradle-pin: FAILED - unknown mode' >&2; return 1 ;; esac
          for path in taurine-mobile taurine-mobile/src-tauri taurine-mobile/src-tauri/gen "${root}"; do
            if [[ -L "${path}" || ! -d "${path}" ]]; then
              echo "gradle-pin: FAILED - ${path} is missing or a link" >&2; return 1
            fi
          done
          [[ "$(cd "${root}" && pwd -P)" == "$(pwd -P)/${root}" ]] || { echo 'gradle-pin: FAILED - gen/android resolves through a link' >&2; return 1; }
          if [[ "${mode}" == after-build ]]; then
            mobile_android_gradle_pinned_hash_check || return 1
            mobile_android_generated_gradle_check require
            return
          fi
          out="$(find "${root}" -name '*[[:cntrl:]]*')" || { echo 'gradle-pin: FAILED - gen/android could not be scanned' >&2; return 1; }
          [[ -z "${out}" ]] || { echo 'gradle-pin: FAILED - a file name holds a control character' >&2; return 1; }
          out="$(find "${root}" ! -type f ! -type d)" || { echo 'gradle-pin: FAILED - gen/android could not be scanned' >&2; return 1; }
          [[ -z "${out}" ]] || { echo 'gradle-pin: FAILED - gen/android holds a link or special file' >&2; return 1; }
          out="$(find "${root}" -type f -links +1)" || { echo 'gradle-pin: FAILED - gen/android could not be scanned' >&2; return 1; }
          [[ -z "${out}" ]] || { echo 'gradle-pin: FAILED - gen/android holds a hard-linked file' >&2; return 1; }
          out="$(find "${root}" \( -iname local.properties -o -iname .gradle -o -name init.d \))" || { echo 'gradle-pin: FAILED - gen/android could not be scanned' >&2; return 1; }
          if [[ -n "${out}" ]]; then
            while IFS= read -r file; do echo "gradle-pin: FAILED - refused: ${file#"${root}"/}" >&2; done <<<"${out}"
            return 1
          fi
          out="$(find "${root}" -type f)" || { echo 'gradle-pin: FAILED - gen/android could not be scanned' >&2; return 1; }
          while IFS= read -r file; do
            [[ -n "${file}" ]] || continue
            rel="${file#"${root}"/}"
            gen_ok=0
            case "${rel}" in
              app/build.gradle.kts|build.gradle.kts|gradle.properties|settings.gradle) continue ;;
              buildSrc/*|gradle/wrapper/gradle-wrapper.jar|gradle/wrapper/gradle-wrapper.properties|gradlew|gradlew.bat) continue ;;
              .editorconfig|.gitignore|app/.gitignore|app/proguard-rules.pro|app/src/main/AndroidManifest.xml) continue ;;
              app/src/main/java/*/generated/*)
                if [[ "${mode}" == after-init ]]; then
                  case "${rel##*/}" in
                    RustWebViewClient.kt|PermissionHelper.kt|WryActivity.kt|Rust.kt|RustWebView.kt|RustWebChromeClient.kt|TauriActivity.kt|Logger.kt|Ipc.kt|proguard-wry.pro) gen_ok=1 ;;
                  esac
                fi
                [[ "${gen_ok}" -eq 1 ]] && continue ;;
              app/src/main/java/*.kt|app/src/main/java/*.java|app/src/main/res/*.xml|app/src/main/res/*.png|app/src/main/res/*.webp) continue ;;
              tauri.settings.gradle|app/tauri.build.gradle.kts|app/tauri.properties|app/proguard-tauri.pro|app/src/main/assets/tauri.conf.json)
                [[ "${mode}" == after-init ]] && continue ;;
            esac
            echo "gradle-pin: FAILED - unexpected file: ${rel}" >&2; rc=1
          done <<<"${out}"
          [[ "${rc}" -eq 0 ]] || return 1
          mobile_android_gradle_pinned_hash_check || return 1
          [[ "${mode}" == after-init ]] || return 0
          mobile_android_generated_gradle_check
        }

        # The Tauri build hooks. `tauri <platform> build` would run the source-chosen beforeBuildCommand
        # (the frontend build, with the source's Vite config) after every check and before Gradle/Xcode,
        # so CI runs that build itself first (mobile_frontend_build) and starts the CLI with both hooks
        # switched off (mobile_tauri_build). This check stays because it proves what CI's frontend step
        # stands for: the effective config is the base tauri.conf.json alone (the CLI also merges
        # tauri.<platform>.conf.json, .json5 and Tauri.toml on its own, which could move frontendDist or
        # add features), its beforeBuildCommand is exactly `npm run build`, and no bundle hook is
        # configured. The prebuild/postbuild refusal and the bundle-hook refusal are redundant while the
        # override is in place; they stay so that a removed override cannot reopen the hole silently.
        mobile_tauri_hooks_check() {
          local src=taurine-mobile/src-tauri conf pkg=taurine-mobile/package.json file rc=0 out
          conf="${src}/tauri.conf.json"
          [[ -f "${conf}" && ! -L "${conf}" ]] || { echo 'tauri-hooks: FAILED - tauri.conf.json is missing' >&2; return 1; }
          out="$(find "${src}" -maxdepth 1 \( -iname 'tauri.*conf*' -o -iname 'tauri*.toml' \))" || { echo 'tauri-hooks: FAILED - src-tauri could not be scanned' >&2; return 1; }
          while IFS= read -r file; do
            [[ -n "${file}" && "$(basename "${file}")" != tauri.conf.json ]] || continue
            echo "tauri-hooks: FAILED - extra Tauri config file: $(basename "${file}")" >&2; rc=1
          done <<<"${out}"
          if ! jq -e '(.build // {}) as $b | ($b.beforeBuildCommand == "npm run build") and (($b.beforeBundleCommand // "") == "")' "${conf}" >/dev/null 2>&1; then
            echo 'tauri-hooks: FAILED - beforeBuildCommand is not exactly `npm run build`, or beforeBundleCommand is set' >&2; rc=1
          fi
          if [[ ! -f "${pkg}" ]] || ! jq -e '((.scripts // {}) | has("prebuild") or has("postbuild") | not)' "${pkg}" >/dev/null 2>&1; then
            echo 'tauri-hooks: FAILED - the shell package.json has a prebuild/postbuild script (or is missing)' >&2; rc=1
          fi
          return "${rc}"
        }

        # mobile_frontend_build <shell> <platform: android|ios> <debug: true|false>: the frontend build
        # the CLI's beforeBuildCommand would have run (`npm run build` in the shell), started by CI so
        # that nothing source-controlled runs between the last pin check and Gradle/Xcode. Same
        # environment as the CLI gave its hook: no TAURI_* or npm_config_* from the job, CI-owned empty
        # npm user/global config, only the shell's own `build` script (no pre/post scripts), plus the
        # TAURI_ENV_* values the CLI sets for a hook.
        mobile_frontend_build() {
          local shell="$1" platform="$2" debug="$3" name unset_args=() empty="${RUNNER_TEMP}/taurine-ci/empty-npmrc" extra=()
          tauri_script_pinned "${shell}" "$(pwd -P)" || return 1
          mkdir -p "${RUNNER_TEMP}/taurine-ci" && : >"${empty}-user" && : >"${empty}-global"
          for name in $(compgen -e | grep -iE '^(TAURI_|npm_config_)' || true); do unset_args+=(-u "${name}"); done
          extra=("TAURI_ENV_PLATFORM=${platform}")
          [[ "${debug}" == true ]] && extra+=("TAURI_ENV_DEBUG=true")
          ( cd "${shell}" && exec env ${unset_args[@]+"${unset_args[@]}"} npm_config_userconfig="${empty}-user" npm_config_globalconfig="${empty}-global" "${extra[@]}" \
              npm run --ignore-scripts build )
        }

        # mobile_tauri_build <shell> <tauri arguments...>: tauri_cli with both build hooks switched off by
        # a config override. Relied on (Tauri CLI 2.12.0): the config schema allows null for
        # build.beforeBuildCommand and build.beforeBundleCommand, `--config` JSON is merged as a JSON
        # merge patch (null removes the key), and a build run with this override printed no
        # `Running beforeBuildCommand` line where the same build without it did (checked offline against
        # that CLI with a scratch project; an empty string behaved the same).
        TCI_NO_HOOKS_CONFIG='{"build":{"beforeBuildCommand":null,"beforeBundleCommand":null}}'
        mobile_tauri_build() {
          local shell="$1"; shift
          tauri_cli "${shell}" "$@" --config "${TCI_NO_HOOKS_CONFIG}"
        }
        # mobile_build_hooks_log_check <build log>: detective control. The CLI is started with both
        # hooks switched off; if its log still shows either hook running, the override stopped
        # working (a CLI change, a config merge) and the build is refused. Colour codes are removed
        # first; the match is on the CLI's own message (`Running beforeBuildCommand ...`). The log is
        # read in full before matching: `grep -q` in a pipeline would stop at the first match, and
        # under pipefail the writer's SIGPIPE would turn an early hook line into a pass.
        mobile_build_hooks_log_check() {
          local log="$1" clean
          [[ -f "${log}" ]] || { echo 'build-hooks: FAILED - the build log is missing' >&2; return 1; }
          clean="$(sed $'s/\x1b\\[[0-9;]*[A-Za-z]//g' "${log}" | tr -d '\r')" ||
            { echo 'build-hooks: FAILED - the build log could not be read' >&2; return 1; }
          if grep -qE 'Running before(Build|Bundle)Command' <<<"${clean}"; then
            echo 'build-hooks: FAILED - the build log shows a Tauri build hook running although both are switched off' >&2
            return 1
          fi
        }

        # mobile_frontend_host_check: the frontend build runs as the job user BEFORE the checks and can
        # write outside the checkout. This refuses what that could plant for Gradle and cargo: an init
        # script or properties file in the Gradle user home, and a cargo config under CARGO_HOME or
        # ~/.cargo (CI writes none, so any file is refused). Not covered: edits to the extracted
        # ${CARGO_HOME}/registry/src plugin projects, which would need a content pin of every crate.
        mobile_frontend_host_check() {
          local guh="${GRADLE_USER_HOME:-${HOME}/.gradle}" ch file rc=0
          ch="$(tci_cargo_home)"
          for file in "${guh}/init.d" "${guh}"/init.gradle* "${guh}/gradle.properties" "${HOME}/.gradle/init.d" "${HOME}"/.gradle/init.gradle* "${HOME}/.gradle/gradle.properties"; do
            if [[ -e "${file}" || -L "${file}" ]]; then
              echo "frontend-host: FAILED - the frontend build left a Gradle user-home file: ${file##*/}" >&2; rc=1
            fi
          done
          for file in "${ch}/config" "${ch}/config.toml" "${HOME}/.cargo/config" "${HOME}/.cargo/config.toml"; do
            if [[ -e "${file}" || -L "${file}" ]]; then
              echo "frontend-host: FAILED - a cargo config exists that CI did not write: ${file##*/}" >&2; rc=1
            fi
          done
          return "${rc}"
        }
        TCI_MOBILE_REPORT_LIBRARY
