name: KeelDock NuGet cache verification
description: >
  Re-hashes every restored .nupkg archive (SHA-512, base64, the form packages.lock.json records)
  and keeps only those equal to the lock file's contentHash for that id and version, as a flat local
  feed. Everything else restored (the extracted package folders, NuGet's own metadata and anything
  unlisted) is deleted, so no restored file is ever used as extracted: the locked restore re-extracts
  each package from a verified archive and checks the lock hash again itself (NU1403). Runs on a miss
  too, so the feed directory always exists. Prints counts only.

inputs:
  cache-hit:
    description: The cache-hit output of the restore step
    required: false
  platform:
    description: linux, macos or windows
    required: true

outputs:
  feed:
    description: The local feed directory holding only the verified .nupkg archives (may be empty)
    value: ${{ steps.verify.outputs.feed }}

runs:
  using: composite
  steps:
    - name: Verify restored NuGet packages against the lock files
      id: verify
      shell: bash
      working-directory: ${{ github.workspace }}/src
      env:
        CACHE_HIT: ${{ inputs.cache-hit }}
        KD_PLATFORM: ${{ inputs.platform }}
      run: |
        set -euo pipefail
        pkgs="${HOME}/.nuget/packages"
        feed="${RUNNER_TEMP}/nuget-verified-feed"
        rm -rf "${feed}"
        mkdir -p "${feed}"
        echo "feed=${feed}" >> "${GITHUB_OUTPUT}"
        if [[ ! -d "${pkgs}" ]]; then
          echo "- ${KD_PLATFORM} NuGet package cache: miss" >> "${GITHUB_STEP_SUMMARY}"
          exit 0
        fi
        # Lock files: id, resolved version and content hash per package, lower-cased as NuGet names
        # folders and archives.
        expected="${RUNNER_TEMP}/nuget-expected.tsv"
        : > "${expected}"
        while IFS= read -r -d '' lock; do
          jq -r '.dependencies[]? | to_entries[] | select(.value.contentHash != null and .value.resolved != null) | [(.key | ascii_downcase), (.value.resolved | ascii_downcase), .value.contentHash] | @tsv' "${lock}" >> "${expected}"
        done < <(find . -name packages.lock.json -not -path '*/node_modules/*' -print0)
        sort -u "${expected}" -o "${expected}"
        restored="$(find "${pkgs}" -mindepth 3 -maxdepth 3 -name '*.nupkg' | wc -l | tr -d ' ')"
        kept=0
        while IFS=$'\t' read -r id version hash; do
          # Lock values become path components: only NuGet's id and version alphabet is accepted.
          [[ "${id}" =~ ^[a-z0-9][a-z0-9._-]*$ && "${version}" =~ ^[a-z0-9][a-z0-9.+-]*$ ]] || continue
          archive="${pkgs}/${id}/${version}/${id}.${version}.nupkg"
          [[ -f "${archive}" && ! -L "${archive}" ]] || continue
          actual="$(openssl dgst -sha512 -binary "${archive}" | openssl base64 -A)"
          if [[ "${actual}" == "${hash}" ]]; then
            mv -- "${archive}" "${feed}/${id}.${version}.nupkg"
            kept=$((kept + 1))
          fi
        done < "${expected}"
        # Nothing restored is used as extracted: the folders, metadata and any unlisted or
        # mismatching archive go, and NuGet extracts every package afresh from the verified feed.
        rm -rf "${pkgs}"
        dropped=$((restored - kept))
        case "${CACHE_HIT}" in true) state='exact hit' ;; false) state='restored from an earlier lock-file set' ;; *) state='miss' ;; esac
        echo "nuget-packages: ${state}; ${kept} archives re-hashed and verified, ${dropped} dropped"
        echo "- ${KD_PLATFORM} NuGet package cache: ${state} (${kept} archives re-hashed and verified, ${dropped} dropped)" >> "${GITHUB_STEP_SUMMARY}"
