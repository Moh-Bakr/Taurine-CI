name: KeelDock sub-step summary
description: >
  Publishes the sub-step table, per-suite totals and durations, slowest suites and tests, failing
  test names (names only), vulnerable packages and SBOM tallies, then fails the concern if any
  sub-step failed or was skipped.

inputs:
  concern:
    description: The KeelDock concern being run
    required: true
  platform:
    description: linux, macos or windows
    required: true

runs:
  using: composite
  steps:
    - name: Publish the sub-step summary and fail on any failed sub-step
      shell: bash
      working-directory: ${{ github.workspace }}/src
      env:
        KD_CONCERN: ${{ inputs.concern }}
        KD_PLATFORM: ${{ inputs.platform }}
      run: |
        set -uo pipefail
        source "${RUNNER_TEMP}/keeldock/substeps.sh"
        # Summary: sub-step table, per-suite totals and durations, slowest suites and tests, failing
        # test names, vulnerable packages, SBOM tallies.
        {
          echo "### ${KD_CONCERN} sub-steps — ${KD_PLATFORM}"; echo
          echo '| Sub-step | Result | Reason |'; echo '|---|---|---|'
          awk -F'\t' '{ printf "| `%s` | %s | %s |\n", $1, $2, $3 }' "${results}"
          if [[ -s "${suite_rows}" ]]; then
            echo; echo "### Suites — ${KD_CONCERN} on ${KD_PLATFORM}"; echo
            echo '| Suite | Result | Tests | Failed | Duration | Reason |'; echo '|---|---|---:|---:|---:|---|'
            awk -F'\t' '{ printf "| `%s` | %s | %s | %s | %s | %s |\n", $1, $2, $3, $4, ($6 == "-" ? "-" : $6 "s"), $5 }' "${suite_rows}"
            awk -F'\t' '$3 != "-" { t += $3; f += $4 } END { printf "\n**%d tests, %d failed.**\n", t, f }' "${suite_rows}"
            if awk -F'\t' '$6 != "-" { f = 1 } END { exit !f }' "${suite_rows}"; then
              echo; echo '**Slowest suites:**'; echo
              awk -F'\t' '$6 != "-"' "${suite_rows}" | sort -t$'\t' -k6,6 -g -r | awk 'NR <= 5' | awk -F'\t' '{ printf "- `%s`: %ss\n", $1, $6 }'
            fi
          fi
          if [[ -s "${test_times}" ]]; then
            echo; echo '**Slowest tests (names only):**'; echo
            sort -t$'\t' -k3,3 -g -r "${test_times}" | awk 'NR <= 5' | awk -F'\t' '{ printf "- `%s` (`%s`): %ss\n", $2, $1, $3 }'
          fi
          if [[ -s "${RUNNER_TEMP}/vulnerable.tsv" ]]; then
            echo; echo '### Vulnerable packages (name hash, advisory, severity)'; echo
            while IFS=$'\t' read -r vp_id vp_ver vp_adv vp_sev; do
              printf -- '- `%s`: %s, %s\n' "$(printf '%s' "${vp_id}" | sha256sum | cut -c1-8)" "${vp_adv}" "${vp_sev}"
            done < "${RUNNER_TEMP}/vulnerable.tsv"
            echo; echo 'Names are hashed (8 hex of the SHA-256); run `dotnet list package --vulnerable --include-transitive` in the private checkout to see them.'
          fi
          if [[ -s "${RUNNER_TEMP}/sbom.tsv" ]]; then
            echo; echo '### SBOM (CycloneDX; summary only, the BOM is not published)'; echo
            echo "**$(grep -c . "${RUNNER_TEMP}/sbom.tsv") components.** Denied licences: \`${SBOM_DENIED_LICENSES}\`."; echo
            echo '| Licence | Components |'; echo '|---|---:|'
            cut -f2 "${RUNNER_TEMP}/sbom.tsv" | sort | uniq -c | sort -rn | awk 'NR <= 15' | awk '{ c = $1; $1 = ""; sub(/^ /, ""); printf "| `%s` | %d |\n", $0, c }'
            if awk -F'\t' '$3 == 1 { f = 1 } END { exit !f }' "${RUNNER_TEMP}/sbom.tsv"; then
              echo; echo '**Denied:**'
              while IFS=$'\t' read -r sb_name sb_lic sb_denied; do
                [[ "${sb_denied}" == 1 ]] || continue
                printf -- '- `%s`: %s\n' "$(printf '%s' "${sb_name%@*}" | sha256sum | cut -c1-8)" "${sb_lic}"
              done < "${RUNNER_TEMP}/sbom.tsv"
              echo; echo 'Component names are hashed (8 hex of the SHA-256); run the SBOM tool in the private checkout to see them.'
            fi
          fi
          if [[ -s "${failed_names}" ]]; then
            echo; echo '### Failing tests (names only)'; echo
            awk -F'\t' '{ printf "- `%s`: `%s`\n", $1, $2 }' "${failed_names}"
          fi
        } >> "${GITHUB_STEP_SUMMARY}"
        # Failed when any sub-step row is FAIL or skipped (the steps above never fail on their own).
        if awk -F'\t' '$2 == "FAIL" || $2 == "skipped" { f = 1 } END { exit !f }' "${results}"; then any_failed=1; fi
        if [[ "${any_failed}" -ne 0 ]]; then
          echo "${KD_CONCERN}: failed (one or more sub-steps failed or were skipped; each is listed above)" >&2
          exit 1
        fi
