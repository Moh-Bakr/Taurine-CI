name: Linux JavaScript concern runner
description: |
  Runs the Linux JavaScript concerns: contracts, frontend build and bundle budget, desktop test shards, desktop quality and mobile quality inside the protected concern job, after the source is checked
  out and the token revoked. Behaviour is the reviewed case body of
  linux-validation-concern.yml, moved here by responsibility (one family per action).
  It does nothing for a concern outside its family.

inputs:
  concern:
    description: The Linux validation concern being run
    required: true
  machete-fail:
    description: >
      Whether an unused dependency found by cargo-machete fails the contracts concern. True
      (the default) enforces them; false reports the findings as a warning only. Only the
      Taurine-owned crates are scanned; the vendored and adopted trees are excluded below. A
      real false positive is listed in the private manifest's [package.metadata.cargo-machete] ignored table, with
      a comment saying why, never here.
    required: false
    default: 'true'

  require-all-locks-audit:
    description: >
      Whether the private source must carry the reviewed all-locks advisory helper
      (scripts/audit-all-locks.sh). The workflow passes true exactly when the checked-out SHA is
      on a protected private branch (develop, uat or main): such a SHA without the helper fails
      the contracts concern. A feature or plan SHA without it falls back to the per-lock sweep
      alone and says so in a fixed-shape notice (transition only).
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Run the JavaScript concern
      shell: bash
      working-directory: ${{ github.workspace }}/src
      env:
        CONCERN: ${{ inputs.concern }}
        OS_LABEL: Linux
        MACHETE_FAIL: ${{ inputs.machete-fail }}
        REQUIRE_ALL_LOCKS_AUDIT: ${{ inputs.require-all-locks-audit }}
      run: |
        set -euo pipefail
        source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
        source "${RUNNER_TEMP}/taurine-ci/report.sh"

        case "${CONCERN}" in
          contracts)
            # Every sub-step runs and is reported (the checks are independent: a failed
            # contracts check must not hide the wire check, the package tests or the
            # advisory sweep), through the same deferred reporting as the Rust concerns.
            run_deferred contracts-check npm run check:contracts
            run_deferred wire-check npm run check:wire
            # The flaky-test quarantine list must have no expired entry, and the third-party
            # notices must match the lockfiles; both are static checks of the source.
            run_deferred quarantine-check npm run check:quarantine
            # The notices generator runs `cargo metadata --offline`, so every crate of every
            # graph it reads must already be downloaded: a developer machine has them, a fresh
            # runner does not, which is why this passed locally and failed here. Since the
            # dbx membership (Stage 1 task 1.5) the generator reads the root graph only — the
            # door crate joined the workspace, its standalone lock is gone, and the extra
            # manifest list is empty — so fetch every committed Cargo.lock's graph anyway,
            # the same enumeration the advisory sweep below uses: it cannot drift from the
            # set of locks the source commits, and it keeps covering whatever standalone
            # graphs a future source carries. Per-lock failures are noted, not fatal (the
            # third-party-source cache completion above does the same): some committed locks
            # are not fetchable manifests at all, and a missing graph the generator does read
            # fails closed one sub-step later, at notices-check.
            run_deferred notices-fetch bash -c '
              set -euo pipefail
              while IFS= read -r lock; do
                manifest="$(dirname "${lock}")/Cargo.toml"
                [[ -f "${manifest}" ]] || continue
                if ! cargo fetch --locked --manifest-path "${manifest}"; then
                  echo "notices-fetch: ${lock}: could not be fetched completely (detail withheld)" >&2
                fi
              done < <(find . -name Cargo.lock -not -path "*/target/*" -not -path "*/node_modules/*" | sort)
            '
            run_deferred notices-check npm run check:notices
            if [[ "${deferred_results[*]}" == *"notices-check|failed"* ]]; then
              # Say why: whether the graph could not be read at all, or how many crate and
              # licence lines differ, each as a hash (dependency names are not published).
              echo 'notices diagnostics:' >&2
              if ! cargo metadata --format-version 1 --offline >/dev/null 2>"${RUNNER_TEMP}/notices-meta.err"; then
                echo '  cargo metadata --offline failed: the crates are not all downloaded (see notices-fetch)' >&2
              else
                cp THIRD-PARTY-NOTICES "${RUNNER_TEMP}/notices.before" 2>/dev/null || : > "${RUNNER_TEMP}/notices.before"
                if node scripts/third-party-notices.mjs >/dev/null 2>&1; then
                  diff <(grep -E '^- \*\*|^- [A-Za-z0-9@/_.-]+ [0-9]' "${RUNNER_TEMP}/notices.before" | sort) \
                       <(grep -E '^- \*\*|^- [A-Za-z0-9@/_.-]+ [0-9]' THIRD-PARTY-NOTICES | sort) |
                    grep -E '^[<>]' | while IFS= read -r diff_line; do
                      if [[ "${diff_line:0:1}" == '<' ]]; then side=committed; else side=generated; fi
                      echo "  ${side} $(name_hash "${diff_line:2}")"
                    done | head -40 >&2 || true
                  echo '  entries are hashed (8 hex of the line SHA-256); run `npm run check:notices` in the private checkout to see them' >&2
                  cp "${RUNNER_TEMP}/notices.before" THIRD-PARTY-NOTICES
                else
                  echo '  the notices generator itself failed' >&2
                fi
              fi
            fi
            run_deferred packages-tests npm run test:packages -- \
              --reporter=default --reporter=json \
              --outputFile.json="${RUNNER_TEMP}/test-ids/packages.json"

            # Supply-chain sweep (milestone-1 audit, tooling-gap finding;
            # coverage widened per the 2026-10-02 security conformance
            # audit): the RustSec advisory database is swept against EVERY
            # Cargo.lock committed to the private source on every
            # contracts concern. The
            # scanner is the RustSec project's own release tarball, pinned
            # here to an exact version AND an exact sha256 recorded in this
            # file — a changed or moved release fails the checksum gate
            # instead of being silently installed, so this step cannot
            # float. No Rust toolchain is pulled in for it: a scanner that
            # could compile anything is also a step that could execute
            # anything, and this one only needs to read a lock file.
            # Unmaintained-crate warnings (rustls-pemfile, paste) are
            # recorded acceptances tracked in the private repository and do
            # not fail the concern. Vulnerabilities and unsound advisories
            # fail it: cargo-audit otherwise treats unsoundness as a warning.
            run_deferred cargo-audit-install bash -c '
              set -euo pipefail
              bin_dir="${RUNNER_TEMP}/cargo-audit-bin"
              mkdir -p "${bin_dir}"
              tgz="${RUNNER_TEMP}/cargo-audit-v0.22.2.tgz"
              curl --fail --silent --show-error --retry 2 --location \
                --output "${tgz}" \
                "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz"
              echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  ${tgz}" | sha256sum --check --status
              tar -xzf "${tgz}" -C "${bin_dir}"
              "${bin_dir}/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" --version
            '
            # Accepted advisories are recorded in exactly one place: the
            # reviewed `.cargo/audit.toml` committed at the root of the
            # private source, which cargo-audit picks up automatically from
            # its working directory. This workflow hard-codes no advisory
            # ids, so the suppression list and its review record cannot
            # drift apart across the repository boundary: an entry removed
            # from that baseline un-suppresses CI on the next run (fail
            # closed), and a finding the baseline does not name fails the
            # concern. Each entry's crate, locked version, dependency path,
            # rationale and review-by note live in the baseline itself,
            # beside the lock it qualifies — the reachability record and
            # the suppression are the same artifact.
            #
            # Why every lock, not just the root one: vendored forks and
            # sub-workspaces commit their own resolved pins (the backend
            # sub-workspaces and the vendored rumqttc fork each carry a
            # Cargo.lock), so sweeping only the workspace root leaves whole
            # dependency sets unscanned. The enumeration is `find`,
            # excluding only build output (target/) and npm's installed
            # tree (node_modules/, gitignored — a lock an npm package
            # ships there is not this repository's resolution). All
            # discovered locks are audited even after one fails, so a
            # single run names every failing lock, and on failure the
            # findings are published exactly as the single-lock sweep
            # published them.
            # The sweep needs the pinned scanner; if its install failed, say so instead of
            # failing a second time on a missing binary.
            if [[ "${deferred_results[*]}" == *"cargo-audit-install|failed"* ]]; then
              run_deferred cargo-audit bash -c 'echo "cargo-audit not run: the pinned scanner did not install" >&2; exit 1'
            else
            run_deferred cargo-audit bash -c '
              set -euo pipefail
              audit_bin="${RUNNER_TEMP}/cargo-audit-bin/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit"
              failed=0
              lock_index=0
              while IFS= read -r lock; do
                lock_index=$((lock_index + 1))
                # Literal CLI arguments, never environment/source-supplied options.
                # This promotes unsound warnings to failures; it does not override
                # advisory IDs ignored by the reviewed private audit.toml.
                if "${audit_bin}" audit --deny unsound --file "${lock}"; then
                  echo "cargo-audit: lock #${lock_index}: passed"
                else
                  echo "error: unaccepted advisory findings in lock #${lock_index}" >&2
                  failed=1
                fi
              done < <(find . -name Cargo.lock -not -path "*/target/*" -not -path "*/node_modules/*" | sort)
              if [[ "${failed}" -ne 0 ]]; then
                echo "error: the committed Cargo.lock advisory sweep failed" >&2
              fi
              exit "${failed}"
            '
            fi

            # Unused dependencies (cargo-machete): text matching over each manifest and its
            # sources, so no compile, no nightly toolchain and seconds to run; every unused
            # crate is compile time on three operating systems. The release is pinned to an
            # exact version and the SHA-256 GitHub records for that asset. Findings are the
            # manifest's repository-relative path and the dependency names (public crate
            # names), never an excerpt. A false positive is acknowledged in the private
            # manifest's `[package.metadata.cargo-machete] ignored` table with a comment, so
            # the list lives beside the dependency it excuses.
            machete_bin="${RUNNER_TEMP}/cargo-machete-bin"
            machete_installed=0
            mkdir -p "${machete_bin}"
            machete_tgz="${RUNNER_TEMP}/cargo-machete-v0.9.2.tar.gz"
            if curl --fail --silent --show-error --retry 2 --location --output "${machete_tgz}" \
                 "https://github.com/bnjbvr/cargo-machete/releases/download/v0.9.2/cargo-machete-v0.9.2-x86_64-unknown-linux-musl.tar.gz" &&
               echo "48200087f54c55aabcd4db4af1e25742b49846c02a1b1bfa134711945b35b2e9  ${machete_tgz}" | sha256sum --check --status &&
               tar -xzf "${machete_tgz}" -C "${machete_bin}" &&
               machete_exe="$(find "${machete_bin}" -type f -name cargo-machete | head -n 1)" && [[ -n "${machete_exe}" ]]; then
              machete_installed=1
            fi
            if [[ "${machete_installed}" -ne 1 ]]; then
              deferred_results+=("cargo-machete|failed: the pinned scanner did not install")
              deferred_failed=1
            else
              # Scan only the Taurine-owned crates: the vendored and adopted third-party trees
              # (vendor/, taurine-backend/vendor/, dbx-core, dbx-mongo-shell, dbx-sqlite-worker)
              # are not ours to prune, and their manifests stay byte-identical to upstream. Each
              # owned crate directory is passed explicitly (never the repository root), so the
              # exclusion lives here rather than in a `.ignore` file that would also hide those
              # trees from code search.
              machete_dirs=()
              while IFS= read -r machete_manifest; do
                machete_manifest="${machete_manifest#./}"
                [[ "${machete_manifest}" == Cargo.toml ]] && continue
                case "${machete_manifest}" in
                  vendor/*|taurine-backend/vendor/*|taurine-backend/dbx-core/*|taurine-backend/dbx-mongo-shell/*|taurine-backend/dbx-sqlite-worker/*) continue ;;
                esac
                machete_dirs+=("$(dirname "${machete_manifest}")")
              done < <(find . -name Cargo.toml -not -path '*/target/*' -not -path '*/node_modules/*' | sort)
              machete_status=0
              if [[ "${#machete_dirs[@]}" -eq 0 ]]; then
                echo "cargo-machete: no owned crate manifests found" >&2
                machete_status=2
              else
                "${machete_exe}" "${machete_dirs[@]}" >"${RUNNER_TEMP}/cargo-machete.out" 2>&1 || machete_status=$?
              fi
              if [[ "${machete_status}" -eq 0 ]]; then
                deferred_results+=("cargo-machete|passed")
              elif [[ "${machete_status}" -eq 1 ]]; then
                # Exit 1 is "unused dependencies found". The report lists, per manifest, the
                # dependency names; paths are repository-relative already (the tool is run
                # from the source root) and pass through the shared scrubbing regardless.
                machete_count="$(grep -cE '^[[:space:]]+[A-Za-z0-9_-]+$' "${RUNNER_TEMP}/cargo-machete.out" || true)"
                # No dependency name and no manifest path are published: each finding is the
                # manifest's index in the sorted manifest list and the dependency's name hash.
                find . -name Cargo.toml -not -path '*/target/*' -not -path '*/node_modules/*' | sed 's#^\./##' | sort > "${RUNNER_TEMP}/cargo-manifests.txt"
                echo "cargo-machete: ${machete_count} unused dependency finding(s) (manifest index, name hash):"
                machete_detail "${RUNNER_TEMP}/cargo-machete.out" "${RUNNER_TEMP}/cargo-manifests.txt" || true
                echo 'cargo-machete: names are hashed (8 hex of the name SHA-256); run `cargo machete` in the private checkout to see them'
                echo '- cargo-machete: names are hashed (8 hex of the name SHA-256). Run `cargo machete` in the private checkout to see them.' >> "${GITHUB_STEP_SUMMARY}"
                if [[ "${MACHETE_FAIL}" == true ]]; then
                  deferred_results+=("cargo-machete|failed: ${machete_count} unused dependency finding(s) (listed above; exit 1)")
                  deferred_failed=1
                else
                  echo "::warning title=cargo-machete::${machete_count} unused dependency finding(s); report only (machete-fail is false)"
                  deferred_results+=("cargo-machete|report only: ${machete_count} unused dependency finding(s)")
                fi
              else
                echo "cargo-machete: did not complete (exit ${machete_status}); output withheld" >&2
                deferred_results+=("cargo-machete|failed: the scanner did not complete (exit ${machete_status})")
                deferred_failed=1
              fi
            fi
            # All-locks advisory audit through the reviewed private helper. The per-lock sweep
            # above is the public floor: it is owned here, runs whatever the private source
            # contains, and always applies --deny unsound. The helper is private-source code,
            # so it can only ADD to that floor (generated vendor locks, refusal of a target or
            # severity filter in the audit policy, lock-byte tamper detection); a helper that
            # exits 0 cannot lower the floor's verdict. It runs here, after the token was
            # revoked and root was dropped, like every other project command: with a cleared
            # environment, the pinned scanner named explicitly (never found on PATH), a 6-minute
            # limit and no argument supplied from the source. The contracts job has a 30-minute
            # timeout (ci-matrix.json); the helper is capped so that, with the earlier
            # sub-steps, the deferred summary is still written. The job timeout is unchanged. Its output is never published:
            # only advisory ids (re-emitted canonically, at most 50) in their RUSTSEC shape and one fixed-shape
            # lockfile count survive. The advisory database is fetched exactly as the sweep
            # above fetches it; this step adds no cache and no new destination.
            #
            # Fail closed on presence: a symlink at `scripts` or at the helper path, or a
            # non-regular file there, fails on every ref (hygiene, not a trust boundary: the
            # source is untrusted either way and could do the same inside the helper). A missing helper fails on a protected SHA (REQUIRE_ALL_LOCKS_AUDIT
            # is anything but the exact string false, so an empty or odd value enforces) so the
            # gate cannot be dropped by deleting the file; on an
            # unprotected SHA it is a fixed-shape transition notice and the sweep alone decides.
            all_locks_helper=scripts/audit-all-locks.sh
            if [[ -L scripts || -L "${all_locks_helper}" || ( -e "${all_locks_helper}" && ! -f "${all_locks_helper}" ) ]]; then
              run_deferred cargo-audit-all-locks bash -c 'echo "cargo-audit-all-locks: the helper path is a symlink or not a regular file" >&2; exit 1'
            elif [[ -f "${all_locks_helper}" ]]; then
              if [[ "${deferred_results[*]}" == *"cargo-audit-install|failed"* ]]; then
                run_deferred cargo-audit-all-locks bash -c 'echo "cargo-audit-all-locks not run: the pinned scanner did not install" >&2; exit 1'
              else
              run_deferred cargo-audit-all-locks bash -c '
                set -euo pipefail
                audit_bin="${RUNNER_TEMP}/cargo-audit-bin/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit"
                out="${RUNNER_TEMP}/audit-all-locks.out"
                rc=0
                # Literal arguments only (no flag: online, like the sweep above); nothing is
                # taken from the source or the environment.
                env -i PATH="${PATH}" HOME="${HOME}" LANG=C.UTF-8 TMPDIR="${RUNNER_TEMP}" \
                  CARGO_AUDIT_BIN="${audit_bin}" \
                  timeout --kill-after=15s 6m bash scripts/audit-all-locks.sh >"${out}" 2>&1 || rc=$?
                # One fixed-shape count line, numbers only; nothing else of the output is kept.
                count_line="$(grep -E "^[0-9]{1,4} lockfile[(]s[)] audited, [0-9]{1,4} failed[.]$" "${out}" | tail -n 1 || true)"
                echo "${count_line}"
                # Advisory ids in their exact public shape only (an id does not encode a crate
                # name); every other line of the helper output stays in the withheld file.
                # The helper indents and cargo-audit pads its labels, so match loosely and re-emit canonically.
                grep -E "^[[:space:]]*ID:[[:space:]]+RUSTSEC-20[12][0-9]-[0-9]{4,5}[[:space:]]*$" "${out}" \
                  | sed -E "s/^[[:space:]]*ID:[[:space:]]+(RUSTSEC-[0-9]{4}-[0-9]{4,5})[[:space:]]*$/ID: \1/" \
                  | sort -u | head -n 50 || true
                if [[ -n "${count_line}" ]]; then
                  echo "- cargo-audit-all-locks: ${count_line}" >> "${GITHUB_STEP_SUMMARY}"
                fi
                if [[ "${rc}" -ne 0 ]]; then
                  echo "error: the all-locks advisory helper failed (exit ${rc})" >&2
                  exit 1
                fi
                # Exit 0 without a count line, with no lock, or with a failure counted is not a
                # pass: fail closed rather than trust a silent or malformed result.
                if ! [[ "${count_line}" =~ ^([0-9]+)\ lockfile.*\ ([0-9]+)\ failed\.$ ]] || [[ "${BASH_REMATCH[1]}" -lt 1 || "${BASH_REMATCH[2]}" -ne 0 ]]; then
                  echo "error: the all-locks advisory helper reported no clean lock count" >&2
                  exit 1
                fi
              '
              fi
            elif [[ "${REQUIRE_ALL_LOCKS_AUDIT}" != false ]]; then
              run_deferred cargo-audit-all-locks bash -c 'echo "error: the all-locks advisory helper is required at a protected source SHA and is absent" >&2; exit 1'
            else
              echo 'cargo-audit-all-locks: helper absent at this unprotected SHA; the per-lock sweep alone applied (transition)'
              deferred_results+=("cargo-audit-all-locks|not run: helper absent at an unprotected SHA (transition; the per-lock sweep applied)")
            fi
            # End of the all-locks advisory audit.
            ;;
          frontend-build-budget)
            # The desktop typecheck runs once, in desktop-quality; it is not repeated here.
            run_quiet vite-preflight bash -c 'test -f taurine-desktop/node_modules/vite/bin/vite.js && test -x taurine-desktop/node_modules/.bin/vite'
            run_quiet desktop-vite-build bash -c 'cd taurine-desktop && npm exec --offline -- vite build'
            run_quiet mobile-build npm --prefix taurine-mobile run build
            run_quiet bundle-budget npm run check:bundle
            ;;
          desktop-shard-1)
            run_quiet desktop-tests-shard-1 npm --prefix taurine-desktop run test -- --shard=1/2 --no-file-parallelism \
              --reporter=default --reporter=json \
              --outputFile.json="${RUNNER_TEMP}/test-ids/desktop-shard-1.json"
            ;;
          desktop-shard-2)
            run_quiet desktop-tests-shard-2 npm --prefix taurine-desktop run test -- --shard=2/2 --no-file-parallelism \
              --reporter=default --reporter=json \
              --outputFile.json="${RUNNER_TEMP}/test-ids/desktop-shard-2.json"
            ;;
          desktop-quality)
            run_quiet desktop-typecheck npm --prefix taurine-desktop run typecheck
            run_quiet desktop-lint npm --prefix taurine-desktop run lint
            ;;
          mobile-quality)
            run_quiet mobile-tests npm --prefix taurine-mobile run test -- --no-file-parallelism \
              --reporter=default --reporter=json \
              --outputFile.json="${RUNNER_TEMP}/test-ids/mobile.json"
            run_quiet mobile-typecheck npm --prefix taurine-mobile run typecheck
            run_quiet mobile-lint npm --prefix taurine-mobile run lint
            ;;
          *)
            # Another family's concern: nothing to do here.
            exit 0
            ;;
        esac
        # Every `rust-*` and contracts branch ran its sub-steps through `run_deferred`;
        # this is where their results are reported and the concern fails if one did.
        if [[ "${CONCERN}" == contracts ]]; then finish_deferred; fi
