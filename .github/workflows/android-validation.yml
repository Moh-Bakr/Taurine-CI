name: Android source validation (protected)

# Manual, protected, source-bearing validation.  The public repository owns
# this workflow, but the source-reader App is scoped to the private Taurine
# repository and the token is revoked before any project command runs.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      rust:
        description: Run the mobile Rust test-target build
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: android-validation-${{ github.workflow }}-${{ inputs.source_sha }}
  # Never cancel a source-bearing run mid-revocation; let the active token
  # cleanup boundary complete before another dispatch starts.
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  # Builds the concern matrix from the `rust` input and reports the choice. It
  # holds no source, token or environment. The mobile Rust test-target build is
  # opt-in, as the Rust concerns are on macOS and Windows: dispatch with
  # `-f rust=true` for plan tips, develop/uat/main tips and mobile-touching branches.
  plan:
    permissions: {}
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Plan Android concerns
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select the concerns and report the Rust cadence
        id: plan
        shell: bash
        env:
          RUST_REQUESTED: ${{ inputs.rust }}
        run: |
          set -euo pipefail
          base='"android-native"'
          {
            echo '## Android Rust concern'
            echo
            echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown} (${RUNNER_OS} ${RUNNER_ARCH})"
            if [[ "${RUST_REQUESTED}" == true ]]; then
              echo "matrix={\"concern\":[${base},\"android-rust\"]}" >> "${GITHUB_OUTPUT}"
              echo '- Requested (rust=true): android-rust is scheduled.'
            else
              echo "matrix={\"concern\":[${base}]}" >> "${GITHUB_OUTPUT}"
              echo '- **Not requested** (rust=false): android-rust was not scheduled. It is neither passed nor failed on this run; dispatch with -f rust=true to run it.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    needs: plan
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Android ${{ matrix.concern }} validation
    environment: source-read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # android-rust (the mobile crate's test targets, compile-only) is added by the
      # `plan` job when rust=true. The emulator-free hosted runner is x86_64, so the
      # aarch64 test binaries are built and linked but cannot be executed here; the
      # host-side Rust tests of the same crate run in the macOS and Linux rust-app
      # concerns.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Start the concern timer
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: start

      - name: Record the runner image
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          {
            echo '### Runner'
            echo
            echo "- Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "- Runner: ${RUNNER_OS} ${RUNNER_ARCH}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate protected dispatch input
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'android-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Check out the exact private source SHA
        id: verified-source
        # Kept as ./ : the policy matches this exact form for the private-source action.
        uses: ./.github/actions/source-checkout  # zizmor: ignore[self-repository]
        with:
          source-sha: ${{ inputs.source_sha }}
          app-client-id: ${{ vars.SOURCE_READER_APP_ID }}
          app-private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          repository-id: ${{ env.SOURCE_REPOSITORY_ID }}
          repository-owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repository-name: ${{ env.SOURCE_REPOSITORY_NAME }}

      - name: Install the shared sanitizers
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/sanitize  # zizmor: ignore[self-repository]

      - name: Install the mobile failure reporter
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/taurine-ci/mobile-report.sh" <<'TCI_MOBILE_REPORT_LIBRARY'
          # shellcheck shell=bash
          # Mobile failure reporting. Sourced after the shared sanitize library. A failed command
          # publishes one fixed classification, its exit status, and (for Rust errors) the error
          # code with its repository-relative file:line. Message text, source excerpts, symbol
          # names and tool output are never published.

          mobile_reason() {
            local log="$1" reason
            reason="$(cargo_test_reason "${log}")"
            if [[ "${reason}" != 'command returned non-zero' ]]; then echo "${reason}"
            elif grep -qE 'SDK location not found|No version of NDK matched' "${log}"; then echo 'Android SDK or NDK not found'
            elif grep -qE 'Could not (resolve|download|GET)|UnknownHostException|Connection (reset|timed out)' "${log}"; then echo 'dependency download failure (network)'
            elif grep -qE '^> Task [^[:space:]]+ FAILED$|^FAILURE: Build failed' "${log}"; then echo 'Gradle build failure'
            elif grep -qE 'Undefined symbols for architecture' "${log}"; then echo 'link failure: undefined symbols'
            elif grep -qiE 'no such module' "${log}"; then echo 'Swift module not found'
            elif grep -qiE 'code ?sign|provisioning profile' "${log}"; then echo 'code signing or provisioning failure'
            elif grep -qE '[*][*] (BUILD|ARCHIVE) FAILED [*][*]' "${log}"; then echo 'xcodebuild build failure'
            elif grep -qiE 'ETIMEDOUT|ECONNRESET|EAI_AGAIN' "${log}"; then echo 'network failure'
            else echo 'command returned non-zero'
            fi
          }

          # `error[Ennnn]` as the code, with the repository-relative file:line of its `-->` location.
          mobile_error_sites() {
            local sites
            sites="$(sanitize_stream <"$1" | strip_excerpts | awk '
              match($0, /error\[E[0-9][0-9]*\]/) { code = substr($0, RSTART + 6, RLENGTH - 7); next }
              match($0, /--> [^ ]*:[0-9][0-9]*:[0-9][0-9]*/) {
                if (code != "") {
                  n = split(substr($0, RSTART + 4, RLENGTH - 4), a, ":")
                  print "  " code " " a[1] ":" a[2]
                  code = ""
                }
              }
            ' | awk '!seen[$0]++' | head -30)"
            if [[ -n "${sites}" ]]; then
              echo 'Rust errors (code and file:line; messages withheld):' >&2
              printf '%s\n' "${sites}" >&2
            fi
          }

          # Gradle names the failed task on a fixed shape of line; task names are build structure.
          mobile_failed_tasks() {
            local tasks
            tasks="$(tr -d '\r' <"$1" | grep -E '^> Task [^[:space:]]+ FAILED$' | head -10 || true)"
            if [[ -n "${tasks}" ]]; then
              echo 'Gradle tasks that failed:' >&2
              printf '%s\n' "${tasks}" >&2
            fi
          }

          # One command, one published line. Output stays in a runner-local log. A caller may define
          # mobile_extra_detail <label> <log> for fixed, count-only diagnostics of one label.
          mobile_run() {
            local label="$1"; shift
            local log="${RUNNER_TEMP}/${label}.log" rc=0
            "$@" >"${log}" 2>&1 || rc=$?
            if [[ "${rc}" -eq 0 ]]; then
              echo "${label}: passed"
              return 0
            fi
            tr -d '\r' <"${log}" >"${log}.lf" && mv "${log}.lf" "${log}"
            echo "${label}: failed ($(mobile_reason "${log}"); exit ${rc}; sanitized detail below)" >&2
            mobile_error_sites "${log}"
            mobile_failed_tasks "${log}"
            # Tauri refuses mismatched npm/crate pairs; package names and versions only.
            tauri_version_mismatch "${log}" >&2 || true
            if declare -F mobile_extra_detail >/dev/null; then mobile_extra_detail "${label}" "${log}"; fi
            exit 1
          }
          TCI_MOBILE_REPORT_LIBRARY

      - name: Prepare Android SDK, JDK, and Rust targets
        if: matrix.concern == 'android-native' || matrix.concern == 'android-rust'
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?The hosted image Android SDK is required}"
          : "${JAVA_HOME_17_X64:?The hosted image JDK 17 installation is required}"
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          # Every Android build input is pinned: the command-line tools archive by
          # SHA-256 (the checksum Google publishes beside the download), and the SDK
          # platform, build-tools and NDK by exact version. Nothing is taken from
          # `cmdline-tools/latest` or the image's preinstalled revisions.
          cmdline_tools_build='15859902'
          cmdline_tools_sha256='4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583'
          cmdline_tools_zip="${RUNNER_TEMP}/commandlinetools.zip"
          curl --fail --silent --show-error --location --retry 3 -o "${cmdline_tools_zip}" \
            "https://dl.google.com/android/repository/commandlinetools-linux-${cmdline_tools_build}_latest.zip"
          echo "${cmdline_tools_sha256}  ${cmdline_tools_zip}" | sha256sum --check --status
          unzip -q "${cmdline_tools_zip}" -d "${RUNNER_TEMP}/android-cmdline-tools"
          sdkmanager_bin="${RUNNER_TEMP}/android-cmdline-tools/cmdline-tools/bin/sdkmanager"
          [[ -x "${sdkmanager_bin}" ]] || { echo 'pinned sdkmanager is unavailable' >&2; exit 1; }
          yes | "${sdkmanager_bin}" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
          # Tauri 2's Android Gradle plugin and bindgen are validated against
          # NDK r27c.  Do not rely on whichever NDK happens to be preinstalled
          # on the hosted image: a newer image can otherwise change the linker
          # layout underneath a source-bearing run.
          local_ndk_version='27.2.12479018'
          "${sdkmanager_bin}" --sdk_root="${ANDROID_HOME}" \
            'platforms;android-36' 'build-tools;36.0.0' "ndk;${local_ndk_version}" >/dev/null
          export NDK_HOME="${ANDROID_HOME}/ndk/${local_ndk_version}"
          ndk_bin="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ndk_sysroot="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          [[ -x "${ndk_bin}/clang" && -d "${ndk_sysroot}" ]] || { echo 'required Android NDK is unavailable' >&2; exit 1; }
          # Some hosted NDK images omit the versioned clang launcher names.
          # Cargo needs a real executable path, so use a runner-local wrapper
          # that supplies the Android target and sysroot to the stable clang.
          linker_wrapper="${RUNNER_TEMP}/aarch64-linux-android-linker"
          printf '%s\n' '#!/usr/bin/env bash' \
            "exec \"${ndk_bin}/clang\" --target=aarch64-linux-android24 --sysroot=\"${ndk_sysroot}\" \"\$@\"" \
            >"${linker_wrapper}"
          chmod 700 "${linker_wrapper}"
          "${linker_wrapper}" --version >/dev/null
          # OpenSSL's Android build helper asks PATH for the target-prefixed
          # binutils names. NDK r27 ships the LLVM implementations without
          # those aliases, so provide runner-local aliases rather than relying
          # on an image-specific PATH.
          android_bin="${RUNNER_TEMP}/android-bin"
          mkdir -p "${android_bin}"
          for tool in ar ranlib strip; do
            ln -s "${ndk_bin}/llvm-${tool}" "${android_bin}/aarch64-linux-android-${tool}"
            ln -s "${ndk_bin}/llvm-${tool}" "${android_bin}/aarch64-linux-android24-${tool}"
          done
          echo "${android_bin}" >> "${GITHUB_PATH}"
          echo "NDK_HOME=${NDK_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_HOME}" >> "${GITHUB_ENV}"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${linker_wrapper}" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_AR=${android_bin}/aarch64-linux-android-ar" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_RANLIB=${android_bin}/aarch64-linux-android-ranlib" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_STRIP=${android_bin}/aarch64-linux-android-strip" >> "${GITHUB_ENV}"
          echo "CC_aarch64_linux_android=${linker_wrapper}" >> "${GITHUB_ENV}"
          echo "AR_aarch64_linux_android=${android_bin}/aarch64-linux-android-ar" >> "${GITHUB_ENV}"
          echo "RANLIB_aarch64_linux_android=${android_bin}/aarch64-linux-android-ranlib" >> "${GITHUB_ENV}"
          echo "STRIP_aarch64_linux_android=${android_bin}/aarch64-linux-android-strip" >> "${GITHUB_ENV}"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--target=aarch64-linux-android24 --sysroot=${ndk_sysroot}" >> "${GITHUB_ENV}"
          # taurine-scripting enables rquickjs bindgen for Android. The
          # hosted Ubuntu image has clang, but not always the libclang shared
          # library that bindgen loads at runtime; missing it surfaces only as
          # the unhelpful `No such file or directory` from Cargo's build script.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libclang-dev
          # Debian/Ubuntu package revisions commonly expose this as
          # libclang-18.so.1 rather than the unversioned libclang.so symlink.
          libclang_file="$(find /usr/lib -type f \( -name 'libclang.so*' -o -name 'libclang-*.so*' \) -print -quit)"
          [[ -n "${libclang_file}" ]] || { echo 'libclang shared library is unavailable' >&2; exit 1; }
          echo "LIBCLANG_PATH=$(dirname "${libclang_file}")" >> "${GITHUB_ENV}"
          rustup target add aarch64-linux-android

      - name: Set up Node.js and install the locked JavaScript dependencies
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/node-setup  # zizmor: ignore[self-repository]
        with:
          root: ${{ matrix.concern != 'android-rust' }}
          desktop: false
          mobile: ${{ matrix.concern != 'android-rust' }}
          vendor-fetch: ${{ matrix.concern == 'android-native' || matrix.concern == 'android-rust' }}

      - name: Regenerate runner-specific Android project metadata
        if: matrix.concern == 'android-native'
        shell: bash
        run: |
          set -euo pipefail
          # The tracked Android project deliberately ignores tauri.settings.gradle,
          # whose path points into the local Cargo registry. Generate it on the
          # runner rather than trusting a developer's absolute path.
          cd taurine-mobile
          rm -f src-tauri/gen/android/tauri.settings.gradle
          source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
          source "${RUNNER_TEMP}/taurine-ci/mobile-report.sh"
          mobile_run android-init npm run android:init -- --ci --skip-targets-install
          if grep -qF '/Users/' src-tauri/gen/android/tauri.settings.gradle; then
            echo 'Android metadata contains a developer-local path' >&2
            exit 1
          fi

      - name: Run isolated Android validation concern
        shell: bash
        env:
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
          source "${RUNNER_TEMP}/taurine-ci/mobile-report.sh"
          case "${CONCERN}" in
            android-native)
              mobile_run android-debug-build npm --prefix taurine-mobile run android:build:debug -- --target aarch64
              ;;
            android-rust)
              # Compile-only: build and link every test target of the mobile crate for
              # the Android triple, so the `cfg(target_os = "android")` code and its
              # tests are type-checked and linked on a hosted runner. They are not
              # executed (no device or emulator here).
              mobile_run android-test-targets cargo test --locked --no-run --package taurine-mobile --target aarch64-linux-android
              ;;
            *)
              echo "Unknown Android validation concern: ${CONCERN}" >&2
              exit 1
              ;;
          esac

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## Android ${CONCERN} validation"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown} (${RUNNER_OS} ${RUNNER_ARCH})"
            echo "- JDK: $("${JAVA_HOME}/bin/java" -version 2>&1 | head -n 1)"
            echo "- Android NDK: $(sed -n 's/^Pkg.Revision *= *//p' "${NDK_HOME}/source.properties")"
            echo "- Android build-tools: $(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -printf '%f ' | xargs -n1 | sort -V | xargs)"
            echo "- Node.js: $(node --version); Rust: $(rustc --version)"
            echo '- Isolated concern passed; no private artifacts were shared between runners'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The job's own wall-clock time, shown next to its result; the timings job
      # tabulates it against a committed baseline.
      - name: Report concern duration
        if: ${{ always() }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: report

  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' }}
    needs: [validate]
    name: Timings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record the runner image
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Runner'
            echo
            echo "- Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "- Runner: ${RUNNER_OS} ${RUNNER_ARCH}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Tabulate timings against the baseline
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: table
          label: Android
          baseline-seconds: '{"android-native":552}'
          name-pattern: '^Android (?<concern>.+) validation$'
          github-token: ${{ github.token }}

  # One verdict for the dispatch: every possible concern is listed, those that did not
  # run as "not selected" (never as passed), and the run fails if any concern that ran
  # did not succeed. PASS (full) is the only verdict that admits a merge.
  result:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' }}
    needs: [validate]
    name: Result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record the runner image
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Runner'
            echo
            echo "- Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "- Runner: ${RUNNER_OS} ${RUNNER_ARCH}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write the run verdict
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/run-result  # zizmor: ignore[self-repository]
        with:
          label: Android
          expected-concerns: '["android-native","android-rust"]'
          name-pattern: '^Android (?<concern>.+) validation$'
          source-sha: ${{ inputs.source_sha }}
          github-token: ${{ github.token }}
