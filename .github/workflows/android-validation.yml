name: Android source validation (protected)

# Manual, protected, source-bearing validation.  The public repository owns
# this workflow, but the source-reader App is scoped to the private Taurine
# repository and the token is revoked before any project command runs.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.workflow }}-${{ inputs.source_sha }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  validate:
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Android app and orchestrate skill validation
    environment: source-read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected dispatch input
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'android-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Mint read-only private-source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact private source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY_OWNER }}/${{ env.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify identity, exact checkout, and revoke source token
        if: always()
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          failed=0
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo 'No source token was minted; refusing to continue' >&2
            exit 1
          fi
          if ! identity="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
            echo 'The configured source repository identity could not be resolved' >&2
            failed=1
          elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || \
            "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || \
            "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
            echo 'The configured source repository identity did not match' >&2
            failed=1
          fi
          if ! checked_out_sha="$(git rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"; then
            echo 'The private source checkout did not complete' >&2
            failed=1
          elif [[ "${checked_out_sha}" != "${requested_sha}" ]]; then
            echo 'The checked-out commit does not match source_sha' >&2
            failed=1
          fi
          if ! api_sha="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/${requested_sha}" | \
            jq -er '.sha | ascii_downcase')" || [[ "${api_sha}" != "${requested_sha}" ]]; then
            echo 'The requested source SHA was not resolved from the configured repository' >&2
            failed=1
          fi
          if ! curl --fail --silent --show-error --retry 2 \
            -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/installation/token"; then
            echo 'Source token revocation failed; refusing to execute project code' >&2
            failed=1
          fi
          unset SOURCE_TOKEN
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all credential.helper 2>/dev/null || true
          find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
          (( failed == 0 ))

      - name: Set up the pinned Node.js release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Prepare Android SDK, JDK, and Rust targets
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?GitHub's Android SDK is required}"
          : "${JAVA_HOME_17_X64:?GitHub's JDK 17 installation is required}"
          export JAVA_HOME="${JAVA_HOME_17_X64}"
          echo "JAVA_HOME=${JAVA_HOME}" >> "${GITHUB_ENV}"
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "${sdkmanager_bin}" ]]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi
          [[ -n "${sdkmanager_bin}" && -x "${sdkmanager_bin}" ]] || { echo 'sdkmanager is unavailable' >&2; exit 1; }
          yes | "${sdkmanager_bin}" --sdk_root="${ANDROID_HOME}" --licenses >/dev/null || true
          "${sdkmanager_bin}" --sdk_root="${ANDROID_HOME}" \
            'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' >/dev/null
          export NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          [[ -x "${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]] || { echo 'required Android NDK is unavailable' >&2; exit 1; }
          echo "NDK_HOME=${NDK_HOME}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${NDK_HOME}" >> "${GITHUB_ENV}"
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "${GITHUB_ENV}"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "${GITHUB_ENV}"
          echo "CC_aarch64_linux_android=${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "${GITHUB_ENV}"
          rustup target add aarch64-linux-android

      - name: Install locked JavaScript and Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"; shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              echo "${label}: failed" >&2
              # Keep diagnostics useful without publishing source snippets or full logs.
              grep -E '^(error(\[[^]]+\])?:|failed to build|could not compile|Caused by:|BUILD FAILED)' "${log}" | tail -20 >&2 || true
              exit 1
            fi
          }
          run_quiet npm-root npm ci --ignore-scripts
          run_quiet npm-desktop npm --prefix taurine-desktop ci --ignore-scripts
          run_quiet npm-mobile npm --prefix taurine-mobile ci --ignore-scripts

      - name: Regenerate runner-specific Android project metadata
        shell: bash
        run: |
          set -euo pipefail
          # The tracked Android project deliberately ignores tauri.settings.gradle,
          # whose path points into the local Cargo registry. Generate it on the
          # runner rather than trusting a developer's absolute path.
          cd taurine-mobile
          run_quiet() { local label="$1"; shift; local log="${RUNNER_TEMP}/${label}.log"; if "$@" >"${log}" 2>&1; then echo "${label}: passed"; else echo "${label}: failed" >&2; exit 1; fi; }
          run_quiet android-init npm run android:init -- --ci --skip-targets-install

      - name: Run Android app and orchestrate skill validation
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"; shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              echo "${label}: failed" >&2
              grep -E '^(error(\[[^]]+\])?:|failed to build|could not compile|Caused by:|BUILD FAILED)' "${log}" | tail -20 >&2 || true
              exit 1
            fi
          }
          run_quiet contracts npm run check:contracts
          run_quiet wire npm run check:wire
          run_quiet packages-tests npm run test:packages
          run_quiet mobile-build npm --prefix taurine-mobile run build
          run_quiet mobile-tests npm --prefix taurine-mobile run test -- --maxWorkers=1 --minWorkers=1
          run_quiet mobile-typecheck npm --prefix taurine-mobile run typecheck
          run_quiet mobile-lint npm --prefix taurine-mobile run lint
          run_quiet android-debug-build npm --prefix taurine-mobile run android:build:debug -- --target aarch64
          run_quiet dashboard-contracts node --test --test-concurrency=1 skills/orchestrate/scripts/__tests__/dashboard.test.mjs
          run_quiet orchestrate-verification node skills/orchestrate/scripts/verify.mjs --json

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo '## Android app and orchestrate skill validation'
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo '- App: Android arm64 debug APK, contracts, wire, tests, typecheck, lint, and frontend build passed'
            echo '- Skill: dashboard contract suite and full release verification passed'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"
