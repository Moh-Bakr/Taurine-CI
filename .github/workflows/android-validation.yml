name: Android source validation (protected)
run-name: Taurine validation ${{ inputs.source_sha }} ${{ inputs.dispatch_key }}

# Manual, protected, source-bearing validation.  The public repository owns
# this workflow, but the source-reader App is scoped to the private Taurine
# repository and the token is revoked before any project command runs.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      dispatch_key:
        description: Full SHA-256 key for this exact control revision and normalized dispatch inputs
        required: true
        type: string
      rust:
        description: Build and run the mobile Rust tests (on an x86_64 emulator)
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  # Each run has its own group: GitHub keeps only one PENDING run per group, so a shared per-SHA
  # group let a later dispatch silently cancel an earlier pending one. Runs are never
  # deduplicated or cancelled; check for an existing run before dispatching (docs/how-ci-works.md).
  # Nothing is shared between runs that a group would protect: caches are first-writer-wins on an
  # exact key, so a race is harmless.
  group: android-validation-${{ inputs.source_sha }}-${{ github.run_id }}
  # Never cancel a source-bearing run mid-revocation; let the active token
  # cleanup boundary complete before another dispatch starts.
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  # Builds the concern matrix from the `rust` input and reports the choice. It
  # holds no source, token or environment. The mobile Rust test build-and-run concern is
  # opt-in, as the Rust concerns are on macOS and Windows: dispatch with
  # `-f rust=true` for plan tips, develop/uat/main tips and mobile-touching branches.
  plan:
    permissions:
      actions: read
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    name: Plan Android concerns
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before any job enters source-read: its deployment branches must be exactly main and
      # untrusted (docs/how-ci-works.md, "Repository settings the owner applies").
      - name: Verify the source-read deployment branches
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/environment-preflight  # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}

      - name: Verify the coordinator dispatch identity
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CI_WORKFLOW_PATH: .github/workflows/android-validation.yml
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CI_NORMALIZED_INPUTS: ${{ format('{{"rust":{0},"source_sha":{1}}}', toJSON(inputs.rust), toJSON(inputs.source_sha)) }}
          CI_DISPATCH_CONTRACT_JSON: ''
          CI_GENERATE_ONLY: 'false'
          CI_CONTROL_REPOSITORY: ${{ github.repository }}
          CI_CONTROL_SHA: ${{ github.sha }}
          CI_CONTROL_REF: ${{ github.ref }}
        run: ruby .github/policy/dispatch-identity.rb

      # One dispatch identity, one run: a queued or in-progress run of this
      # workflow carrying the same dispatch key means the same source SHA and
      # inputs are already being validated, so this duplicate stops here,
      # before any token is minted. Nothing shared with the existing run is
      # changed; it can never be cancelled or evicted by this check. The
      # coordinator's ledger remains the primary dispatch discipline.
      - name: Refuse a duplicate dispatch
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_PATH: .github/workflows/android-validation.yml
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CI_RUN_ID: ${{ github.run_id }}
        run: ruby .github/policy/refuse-duplicate-dispatch.rb


      - name: Select the concerns and report the Rust cadence
        id: plan
        shell: bash
        env:
          RUST_REQUESTED: ${{ inputs.rust }}
        run: |
          set -euo pipefail
          base='"android-native"'
          {
            echo '## Android Rust concern'
            echo
            echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown} (${RUNNER_OS} ${RUNNER_ARCH})"
            if [[ "${RUST_REQUESTED}" == true ]]; then
              echo "matrix={\"concern\":[${base},\"android-rust\"]}" >> "${GITHUB_OUTPUT}"
              echo '- Requested (rust=true): android-rust is scheduled.'
            else
              echo "matrix={\"concern\":[${base}]}" >> "${GITHUB_OUTPUT}"
              echo '- **Not requested** (rust=false): android-rust was not scheduled. It is neither passed nor failed on this run; dispatch with -f rust=true to run it.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    needs: plan
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    name: Android ${{ matrix.concern }} validation
    environment: source-read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # android-rust is added by the `plan` job when rust=true. The aarch64 test targets
      # are built and linked (compile-only); the x86_64 test binaries of the same crate
      # are executed on a KVM-accelerated x86_64 emulator. The crate is cfg(mobile), so
      # its tests exist only on an Android target and cannot run on the host.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Start the concern timer
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: start

      - name: Validate protected dispatch input
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || ( "${GITHUB_REF}" != "refs/heads/main" && "${GITHUB_REF}" != "refs/heads/untrusted" ) ]]; then
            echo 'android-validation must run only from the protected main or untrusted branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Check out the exact private source SHA
        id: verified-source
        # Kept as ./ : the policy matches this exact form for the private-source action.
        uses: ./.github/actions/source-checkout  # zizmor: ignore[self-repository]
        with:
          source-sha: ${{ inputs.source_sha }}
          app-client-id: ${{ vars.SOURCE_READER_APP_ID }}
          app-private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          repository-id: ${{ env.SOURCE_REPOSITORY_ID }}
          repository-owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repository-name: ${{ env.SOURCE_REPOSITORY_NAME }}

      - name: Start the egress audit
        # Audit only: records outbound destinations, never blocks, never fails the job.
        continue-on-error: true
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/egress-audit  # zizmor: ignore[self-repository]
        with:
          phase: start

      # Every step that needs root runs here, before root is removed and before any project
      # code (finding H2; see the root-setup and drop-root composites).
      - name: Run the privileged setup
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/root-setup  # zizmor: ignore[self-repository]
        with:
          concern: ${{ matrix.concern }}

      - name: Remove root before project code
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/drop-root  # zizmor: ignore[self-repository]

      - name: Install the shared sanitizers
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/sanitize  # zizmor: ignore[self-repository]

      - name: Install the mobile failure reporter
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/mobile-report  # zizmor: ignore[self-repository]

      - name: Prepare Android SDK, JDK, and Rust targets
        if: matrix.concern == 'android-native' || matrix.concern == 'android-rust'
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/android-sdk-setup  # zizmor: ignore[self-repository]

      - name: Start the Android emulator in the background
        if: matrix.concern == 'android-rust'
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/android-emulator-tests  # zizmor: ignore[self-repository]
        with:
          phase: boot

      - name: Set up Node.js and install the locked JavaScript dependencies
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/node-setup  # zizmor: ignore[self-repository]
        with:
          root: ${{ matrix.concern != 'android-rust' }}
          desktop: false
          mobile: ${{ matrix.concern != 'android-rust' }}
          vendor-fetch: ${{ matrix.concern == 'android-native' || matrix.concern == 'android-rust' }}

      - name: Regenerate runner-specific Android project metadata
        if: matrix.concern == 'android-native'
        shell: bash
        run: |
          set -euo pipefail
          # The tracked Android project deliberately ignores tauri.settings.gradle,
          # whose path points into the local Cargo registry. Generate it on the
          # runner rather than trusting a developer's absolute path.
          cd taurine-mobile
          rm -f src-tauri/gen/android/tauri.settings.gradle
          source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
          source "${RUNNER_TEMP}/taurine-ci/mobile-report.sh"
          mobile_run android-init npm run android:init -- --ci --skip-targets-install
          if grep -qF '/Users/' src-tauri/gen/android/tauri.settings.gradle; then
            echo 'Android metadata contains a developer-local path' >&2
            exit 1
          fi

      - name: Run isolated Android validation concern
        shell: bash
        env:
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
          source "${RUNNER_TEMP}/taurine-ci/mobile-report.sh"
          case "${CONCERN}" in
            android-native)
              mobile_run android-debug-build npm --prefix taurine-mobile run android:build:debug -- --target aarch64
              ;;
            android-rust)
              # Gate S1's mobile arm (plan 25): the phone links no OpenSSL.
              # `cargo tree --invert openssl-sys` exits non-zero exactly when
              # nothing in the graph depends on it, so the check inverts the
              # exit: a clean run of the invert query IS the failure. The
              # error text is pinned so a broken resolve cannot masquerade as
              # a pass. Cheap, so it runs before the expensive test-target
              # build and fails the concern first.
              gate_log="${RUNNER_TEMP}/android-openssl-absent.log"
              if cargo tree --locked --package taurine-mobile --invert openssl-sys >"${gate_log}" 2>&1; then
                echo "android-openssl-absent: FAILED — openssl-sys is reachable from taurine-mobile (Gate S1, plan 25)" >&2
                exit 1
              fi
              if ! grep -q "did not match any packages" "${gate_log}"; then
                echo "android-openssl-absent: the invert query failed for a reason other than absence (detail withheld)" >&2
                exit 1
              fi
              echo "android-openssl-absent: passed — openssl-sys is not resolvable from taurine-mobile"
              # Compile-only: build and link every test target of the mobile crate for
              # the Android triple, so the `cfg(target_os = "android")` code and its
              # tests are type-checked and linked on a hosted runner. They are executed
              # on the emulator in the next step, for x86_64.
              mobile_run android-test-targets cargo test --locked --no-run --package taurine-mobile --target aarch64-linux-android
              ;;
            *)
              echo "Unknown Android validation concern: ${CONCERN}" >&2
              exit 1
              ;;
          esac

      - name: Run the Rust tests on the emulator
        if: matrix.concern == 'android-rust'
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/android-emulator-tests  # zizmor: ignore[self-repository]
        with:
          phase: run

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## Android ${CONCERN} validation"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown} (${RUNNER_OS} ${RUNNER_ARCH})"
            echo "- JDK: $("${JAVA_HOME}/bin/java" -version 2>&1 | head -n 1)"
            echo "- Android NDK: $(sed -n 's/^Pkg.Revision *= *//p' "${NDK_HOME}/source.properties")"
            echo "- Android build-tools: $(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -printf '%f ' | xargs -n1 | sort -V | xargs)"
            echo "- Node.js: $(node --version); Rust: $(rustc --version)"
            echo '- Isolated concern passed; no private artifacts were shared between runners'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The job's own wall-clock time, shown next to its result; the timings job
      # tabulates it against a committed baseline.
      - name: Report concern duration
        if: ${{ always() }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: report

      - name: Report observed egress
        if: always()
        continue-on-error: true
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/egress-audit  # zizmor: ignore[self-repository]
        with:
          phase: report

  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') }}
    needs: [validate]
    name: Timings
    runs-on: ubuntu-24.04
    # Reporting only: a queued, slow or cancelled timings job must never fail a run whose
    # concerns all passed (run 37342723559 was cancelled while waiting for a runner).
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record the runner image
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Runner'
            echo
            echo "- Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "- Runner: ${RUNNER_OS} ${RUNNER_ARCH}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Tabulate timings against the baseline
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: table
          label: Android
          baseline-seconds: '{"android-native":657,"android-rust":604}'
          name-pattern: '^Android (?<concern>.+) validation$'
          github-token: ${{ github.token }}

  # One verdict for the dispatch: every possible concern is listed, those that did not
  # run as "not selected" (never as passed), and the run fails if any concern that ran
  # did not succeed. PASS (full) is the only verdict that admits a merge.
  result:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') && needs.plan.result == 'success' }}
    needs: [plan, validate]
    name: Result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record the runner image
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Runner'
            echo
            echo "- Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "- Runner: ${RUNNER_OS} ${RUNNER_ARCH}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write the run verdict
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/run-result  # zizmor: ignore[self-repository]
        with:
          label: Android
          expected-concerns: '["android-native","android-rust"]'
          required-concerns: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).concern) }}
          name-pattern: '^Android (?<concern>.+) validation$'
          source-sha: ${{ inputs.source_sha }}
          selection-mode: ${{ inputs.rust && 'full' || 'partial' }}
          github-token: ${{ github.token }}
