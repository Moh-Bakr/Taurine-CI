name: Windows source validation (protected)

# The public control plane owns this dispatch, while each concern independently
# checks out and validates the exact private source SHA on an ephemeral runner.
# Keeping the concerns as separate reusable-workflow jobs makes a slow desktop
# shard unable to block contracts, mobile, bundle-budget, or other app checks.
# Windows deliberately covers app/platform concerns only. The complete
# orchestrate skill and dashboard verification runs on the protected Ubuntu
# workflow, with the macOS app lane retaining its cross-platform skill smoke
# checks.
#
# Cadence. The Rust compile-and-test concerns are the slow part of this
# workflow (a cold MSVC build of the whole closure, up to 150 minutes), so they
# run only when the dispatch asks for them with -f rust=true. Intended use:
# Linux validation on every dispatch (Rust always on there); Windows and macOS
# Rust with `rust=true` for a plan tip before its develop PR, for every
# develop/uat/main tip, and for any branch that touches native or OS-specific
# Rust. A dispatch without it runs the TypeScript concerns exactly as before
# and reports the Rust concerns as "not requested", never as passed.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      rust:
        description: Run the Rust compile+test concerns
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-validation-${{ github.workflow }}-${{ inputs.source_sha }}
  # Never cancel source-bearing jobs: cancellation can interrupt cleanup that
  # revokes a short-lived private-source token in one of the matrix jobs.
  cancel-in-progress: false

jobs:
  validate-input:
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Validate protected dispatch input
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate exact source SHA
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Report the Rust concern cadence
        shell: bash
        env:
          RUST_REQUESTED: ${{ inputs.rust }}
        run: |
          set -euo pipefail
          {
            echo '## Windows Rust concerns'
            echo
            if [[ "${RUST_REQUESTED}" == true ]]; then
              echo '- Requested (rust=true): rust-domain, rust-db, rust-net, rust-ovpn and rust-app run in the validate-rust jobs.'
            else
              echo '- **Not requested** (rust=false): rust-domain, rust-db, rust-net, rust-ovpn and rust-app were not scheduled. They are neither passed nor failed on this run; dispatch with -f rust=true to run them.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    needs: validate-input
    strategy:
      fail-fast: false
      matrix:
        concern:
          - desktop-shard-1
          - desktop-shard-2
          - desktop-quality
          - mobile
          - contracts
          - bundle-budget
    uses: ./.github/workflows/windows-validation-concern.yml
    secrets: inherit
    with:
      source_sha: ${{ inputs.source_sha }}
      concern: ${{ matrix.concern }}

  # The Rust crate-test concerns, each its own reusable-workflow job so a slow
  # one cannot hold the others back. Scheduled only when `rust=true`; a skipped
  # job here means "not requested", as the cadence report above states.
  # rust-ovpn is split from rust-net because its vcpkg dependency build
  # dominates the runtime.
  # rust-dbx is not repeated here: dbx-core's engine and protocol tests
  # are platform-neutral and stay on Linux; its OS-keyring feature is
  # opt-in (not built by `npm run test:dbx-core`), its Postgres tests
  # need a Linux container daemon that Windows hosted runners do not
  # have, and its vendored OpenSSL is a from-source build that needs
  # Perl and NASM on MSVC for code with no Windows-only paths.
  validate-rust:
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' && inputs.rust
    needs: validate-input
    strategy:
      fail-fast: false
      matrix:
        concern:
          - rust-domain
          - rust-db
          - rust-net
          - rust-ovpn
          - rust-app
    uses: ./.github/workflows/windows-validation-concern.yml
    secrets: inherit
    with:
      source_sha: ${{ inputs.source_sha }}
      concern: ${{ matrix.concern }}

  # Tabulates every concern's duration and conclusion for this run and warns when a
  # concern took more than 25% (and more than two minutes) longer than the committed
  # baseline below, in minutes, taken from recent hosted runs. Warning only: it never
  # fails the run, calls no service beyond this repository's own run API with the
  # run's read-only token, and publishes no artifact. A concern with no baseline is
  # listed without a comparison; update the table when a run is a new normal.
  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' }}
    needs: [validate, validate-rust]
    name: Concern timings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Tabulate concern timings against the baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OS_LABEL: Windows
          BASELINE_MINUTES: '{"desktop-shard-1":17,"desktop-shard-2":19,"desktop-quality":5,"mobile":4,"contracts":2,"bundle-budget":2,"rust-ovpn":10}'
          NAME_PATTERN: '^validate(-rust)? \(.+\) / Windows (?<concern>.+)$'
        run: |
          set -euo pipefail
          rows="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            | jq -r --arg re "${NAME_PATTERN}" '.jobs[]
              | select(.started_at != null and .completed_at != null)
              | select(.name | test($re))
              | [(.name | capture($re).concern), (.conclusion // "unknown"),
                 (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor)]
              | @tsv' | sort)"
          {
            echo "## ${OS_LABEL} concern timings"
            echo
            echo '| Concern | Duration | Baseline | Conclusion |'
            echo '| --- | --- | --- | --- |'
          } >> "${GITHUB_STEP_SUMMARY}"
          while IFS=$'\t' read -r concern conclusion seconds; do
            [[ -n "${concern}" ]] || continue
            base="$(jq -r --arg c "${concern}" '.[$c] // empty' <<<"${BASELINE_MINUTES}")"
            shown='none'
            if [[ -n "${base}" ]]; then
              shown="${base}m"
              limit=$(( base * 60 * 125 / 100 ))
              if (( seconds > limit && seconds > base * 60 + 120 )); then
                echo "::warning title=Slow concern::${OS_LABEL} ${concern} took $((seconds / 60))m$((seconds % 60))s against a baseline of ${base}m (more than 25% slower)"
                shown="${base}m (SLOWER)"
              fi
            fi
            printf '| %s | %dm%02ds | %s | %s |\n' "${concern}" $((seconds / 60)) $((seconds % 60)) "${shown}" "${conclusion}" >> "${GITHUB_STEP_SUMMARY}"
          done <<<"${rows}"
