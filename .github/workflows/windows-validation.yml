name: Windows source validation (protected)
run-name: Taurine validation ${{ inputs.source_sha }} ${{ inputs.dispatch_key }}

# The public control plane owns this dispatch, while each concern independently
# checks out and validates the exact private source SHA on an ephemeral runner.
# Keeping the concerns as separate reusable-workflow jobs makes a slow desktop
# shard unable to block contracts, mobile, bundle-budget, or other app checks.
# Windows deliberately covers app/platform concerns only. The complete
# orchestrate skill and dashboard verification runs on the protected Ubuntu
# workflow, with the macOS app lane retaining its cross-platform skill smoke
# checks.
#
# Cadence. The Rust compile-and-test concerns are the slow part of this
# workflow (a cold MSVC build of the whole closure, up to 150 minutes), so they
# run only when the dispatch asks for them with -f rust=true. Intended use:
# Linux validation on every dispatch (Rust always on there); Windows and macOS
# Rust with `rust=true` for a plan tip before its develop PR, for every
# develop/uat/main tip, and for any branch that touches native or OS-specific
# Rust. A dispatch without it runs the TypeScript concerns exactly as before
# and reports the Rust concerns as "not requested", never as passed.
#
# Runner image. `windows_image` selects the hosted image: `windows-2022` (the default and
# the supported baseline) or `windows-2025`. The weekly validation dispatches a windows-2025
# run in addition to the default one; it runs alongside, never gating a merge. MIGRATION
# CRITERION: switch this default to windows-2025 (and drop the 2022 weekly leg) once two
# consecutive weekly windows-2025 runs are fully green. Until then a 2025 failure is a
# finding to fix in the toolchain steps (LLVM, Strawberry Perl, NASM, vcpkg), not a blocker.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      dispatch_key:
        description: Full SHA-256 key for this exact control revision and normalized dispatch inputs
        required: true
        type: string
      rust:
        description: Run the Rust compile+test concerns
        required: false
        default: false
        type: boolean
      windows_image:
        description: Hosted Windows image to run on (windows-2022 is the baseline; windows-2025 is the migration target)
        required: false
        default: windows-2022
        type: choice
        options:
          - windows-2022
          - windows-2025
      only:
        description: Optional comma-separated concern names; when set, exactly those concerns run and everything else is listed as not selected (PASS (partial), which does not admit a merge)
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  # Each run has its own group: GitHub keeps only one PENDING run per group, so a shared per-SHA
  # group let a later dispatch silently cancel an earlier pending one. Runs are never
  # deduplicated or cancelled; check for an existing run before dispatching (docs/how-ci-works.md).
  # Nothing is shared between runs that a group would protect: caches are first-writer-wins on an
  # exact key, so a race is harmless.
  group: windows-validation-${{ inputs.source_sha }}-${{ github.run_id }}
  # Never cancel source-bearing jobs: cancellation can interrupt cleanup that
  # revokes a short-lived private-source token in one of the matrix jobs.
  cancel-in-progress: false

jobs:
  validate-input:
    permissions:
      actions: read
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    name: Validate protected dispatch input
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before any job enters source-read: its deployment branches must be exactly main and
      # untrusted (docs/how-ci-works.md, "Repository settings the owner applies").
      - name: Verify the source-read deployment branches
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/environment-preflight  # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}

      - name: Validate exact source SHA
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Verify the coordinator dispatch identity
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CI_WORKFLOW_PATH: .github/workflows/windows-validation.yml
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CI_NORMALIZED_INPUTS: ${{ format('{{"only":{0},"rust":{1},"source_sha":{2},"windows_image":{3}}}', toJSON(inputs.only), toJSON(inputs.rust), toJSON(inputs.source_sha), toJSON(inputs.windows_image)) }}
          CI_DISPATCH_CONTRACT_JSON: ''
          CI_GENERATE_ONLY: 'false'
          CI_CONTROL_REPOSITORY: ${{ github.repository }}
          CI_CONTROL_SHA: ${{ github.sha }}
          CI_CONTROL_REF: ${{ github.ref }}
        run: ruby .github/policy/dispatch-identity.rb

      # One dispatch identity, one run: a queued or in-progress run of this
      # workflow carrying the same dispatch key means the same source SHA and
      # inputs are already being validated, so this duplicate stops here,
      # before any token is minted. Nothing shared with the existing run is
      # changed; it can never be cancelled or evicted by this check. The
      # coordinator's ledger remains the primary dispatch discipline.
      - name: Refuse a duplicate dispatch
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_PATH: .github/workflows/windows-validation.yml
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CI_RUN_ID: ${{ github.run_id }}
        run: ruby .github/policy/refuse-duplicate-dispatch.rb


      - name: Report the Rust concern cadence
        shell: bash
        env:
          RUST_REQUESTED: ${{ inputs.rust }}
        run: |
          set -euo pipefail
          {
            echo '## Windows Rust concerns'
            echo
            if [[ "${RUST_REQUESTED}" == true ]]; then
              echo '- Requested (rust=true): rust-domain, rust-db, rust-net, rust-ovpn, rust-app-1, rust-app-2 and rust-packaging run in the validate-rust jobs.'
            else
              echo '- **Not requested** (rust=false): rust-domain, rust-db, rust-net, rust-ovpn, rust-app-1, rust-app-2 and rust-packaging were not scheduled. They are neither passed nor failed on this run; dispatch with -f rust=true to run them.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # Builds the concern matrices from the `rust` and `only` inputs, mirroring the macOS
  # plan. It holds no source, token or environment: it only emits the lists of concerns
  # to schedule, so an unrequested or filtered concern never gets a runner at all.
  plan:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    needs: validate-input
    name: Plan Windows concerns
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ts_matrix: ${{ steps.plan.outputs.ts_matrix }}
      rust_matrix: ${{ steps.plan.outputs.rust_matrix }}
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select the concerns and report the Rust cadence
        id: plan
        shell: bash
        env:
          RUST_REQUESTED: ${{ inputs.rust }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          ts='["desktop-shard-1","desktop-shard-2","desktop-quality","mobile","contracts","bundle-budget"]'
          rust='["rust-domain","rust-db","rust-net","rust-ovpn","rust-app-1","rust-app-2","rust-packaging","rust-tls-openssl"]'
          if [[ "${RUST_REQUESTED}" == true ]]; then
            rust_selected="${rust}"
            known="$(jq -cn --argjson t "${ts}" --argjson r "${rust}" '$t + $r')"
          else
            rust_selected='[]'
            known="${ts}"
          fi
          # A surgical `only` dispatch narrows both matrices to exactly the named concerns:
          # a re-run of the one or two concerns a previous run failed, without paying for
          # the rest. The Result job still expects the full list, so every filtered-out
          # concern is reported as "not selected" and the verdict is PASS (partial) — a
          # partial run never admits a merge. An unknown name, or a Rust concern named
          # while rust=false, stops the run here rather than scheduling nothing.
          only_list='[]'
          if [[ -n "${ONLY}" ]]; then
            only_list="$(printf '%s' "${ONLY}" | jq -cR 'split(",") | map(gsub("^ +| +$"; "")) | map(select(length > 0)) | unique')"
            if [[ "$(jq 'length' <<<"${only_list}")" -eq 0 ]]; then
              echo 'only: no concern name given' >&2
              exit 1
            fi
            unknown="$(jq -n -c --argjson only "${only_list}" --argjson known "${known}" '$only - $known | join(",")')"
            if [[ -n "${unknown}" ]]; then
              echo "only: not a Windows concern of this dispatch (unknown name, or rust=false): ${unknown}" >&2
              exit 1
            fi
            select_only='[.[] | select(. as $c | ($only | index($c)) != null)]'
            ts_selected="$(jq -c --argjson only "${only_list}" "${select_only}" <<<"${ts}")"
            if [[ "${RUST_REQUESTED}" == true ]]; then
              rust_selected="$(jq -c --argjson only "${only_list}" "${select_only}" <<<"${rust}")"
            fi
          else
            ts_selected="${ts}"
          fi
          echo "ts_matrix=$(jq -cn --argjson c "${ts_selected}" '{concern: $c}')" >> "${GITHUB_OUTPUT}"
          echo "rust_matrix=$(jq -cn --argjson c "${rust_selected}" '{concern: $c}')" >> "${GITHUB_OUTPUT}"
          {
            echo '## Windows Rust concerns'
            echo
            if [[ "${RUST_REQUESTED}" == true ]]; then
              echo '- Requested (rust=true): rust-domain, rust-db, rust-net, rust-ovpn, rust-app-1, rust-app-2 and rust-packaging run in the validate-rust jobs.'
            else
              echo '- **Not requested** (rust=false): rust-domain, rust-db, rust-net, rust-ovpn, rust-app-1, rust-app-2 and rust-packaging were not scheduled. They are neither passed nor failed on this run; dispatch with -f rust=true to run them.'
            fi
            if [[ "${only_list}" != '[]' ]]; then
              echo "- Only filter active: $(jq -r 'join(", ")' <<<"${only_list}"). Every other concern is not selected; the verdict cannot be PASS (full), which is the only verdict that admits a merge."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    needs: [validate-input, plan]
    strategy:
      fail-fast: false
      # The TypeScript concerns, filtered by the plan job (the `only` input).
      matrix: ${{ fromJSON(needs.plan.outputs.ts_matrix) }}
    # Kept as ./ : the policy workflow pins and matches this exact form for protected reusable calls.
    uses: ./.github/workflows/windows-validation-concern.yml  # zizmor: ignore[self-repository]
    # Exactly the reviewed source-reader key is passed, by name; no other secret reaches the callee.
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
    with:
      source_sha: ${{ inputs.source_sha }}
      concern: ${{ matrix.concern }}
      windows_image: ${{ inputs.windows_image }}

  # The Rust crate-test concerns, each its own reusable-workflow job so a slow
  # one cannot hold the others back. Scheduled only when `rust=true`; a skipped
  # job here means "not requested", as the cadence report above states.
  # rust-ovpn is split from rust-net because its vcpkg dependency build
  # dominates the runtime.
  # rust-dbx is not repeated here: the dbx member crates' engine and
  # protocol tests are platform-neutral and stay on Linux; dbx-core's
  # OS-keyring feature is opt-in (no default build enables it), its
  # Postgres tests need a Linux container daemon that Windows hosted
  # runners do not have, and its vendored OpenSSL is a from-source build
  # that needs Perl and NASM on MSVC for code with no Windows-only
  # paths. This OS compiles the `cfg(windows)` storage and credential
  # paths through the `rust-domain` library check.
  validate-rust:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') && inputs.rust
    needs: [validate-input, plan]
    strategy:
      fail-fast: false
      # The Rust crate-test concerns, filtered by the plan job (the `only` input).
      matrix: ${{ fromJSON(needs.plan.outputs.rust_matrix) }}
    # Kept as ./ : the policy workflow pins and matches this exact form for protected reusable calls.
    uses: ./.github/workflows/windows-validation-concern.yml  # zizmor: ignore[self-repository]
    # Exactly the reviewed source-reader key is passed, by name; no other secret reaches the callee.
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
    with:
      source_sha: ${{ inputs.source_sha }}
      concern: ${{ matrix.concern }}
      windows_image: ${{ inputs.windows_image }}

  # Tabulates every concern's duration and conclusion for this run and warns when a
  # concern took more than 25% (and more than two minutes) longer than the committed
  # baseline below, in seconds: the median of the last several successful jobs (re-based
  # 2026-10-05, before the compiled-dependency cache; re-base again once it lands). Warning only: it never
  # fails the run, calls no service beyond this repository's own run API with the
  # run's read-only token, and publishes no artifact. A concern with no baseline is
  # listed without a comparison; update the table when a run is a new normal.
  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') }}
    needs: [validate, validate-rust]
    name: Timings
    runs-on: ubuntu-24.04
    # Reporting only: a queued, slow or cancelled timings job must never fail a run whose
    # concerns all passed (run 37342723559 was cancelled while waiting for a runner).
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Tabulate timings against the baseline
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: table
          label: Windows
          baseline-seconds: '{"rust-app-1":2740,"rust-app-2":2740,"rust-db":1165,"rust-domain":874,"rust-ovpn":759,"rust-net":595,"rust-packaging":1213,"rust-tls-openssl":58,"desktop-shard-1":1061,"desktop-shard-2":929,"desktop-quality":321,"mobile":287,"contracts":136,"bundle-budget":220}'
          name-pattern: '^validate(-rust)? \(.+\) / Windows (?<concern>.+)$'
          github-token: ${{ github.token }}

  # One verdict for the dispatch: every possible concern is listed, those that did not
  # run as "not selected" (never as passed), and the run fails if any concern that ran
  # did not succeed. PASS (full) is the only verdict that admits a merge.
  result:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') }}
    needs: [validate, validate-rust]
    name: Result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Write the run verdict
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/run-result  # zizmor: ignore[self-repository]
        with:
          label: Windows
          expected-concerns: '["desktop-shard-1","desktop-shard-2","desktop-quality","mobile","contracts","bundle-budget","rust-domain","rust-db","rust-net","rust-ovpn","rust-app-1","rust-app-2","rust-packaging","rust-tls-openssl"]'
          required-concerns: ${{ inputs.rust && '["desktop-shard-1","desktop-shard-2","desktop-quality","mobile","contracts","bundle-budget","rust-domain","rust-db","rust-net","rust-ovpn","rust-app-1","rust-app-2","rust-packaging","rust-tls-openssl"]' || '["desktop-shard-1","desktop-shard-2","desktop-quality","mobile","contracts","bundle-budget"]' }}
          name-pattern: '^validate(-rust)? \(.+\) / Windows (?<concern>.+)$'
          source-sha: ${{ inputs.source_sha }}
          selection-mode: ${{ inputs.rust && 'full' || 'partial' }}
          github-token: ${{ github.token }}
