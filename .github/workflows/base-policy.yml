name: Base policy

# The base-policy half of the public policy gate, called by validate-public-changes.yml (see its
# header for why the base commit's policy is run against a pull request's tree). It lives in a
# workflow of its own to keep the entrypoint under the file-size limit; what it does is unchanged.
#
# It has no secrets, no OIDC permission, no cache or artifact access, and its only trigger is the
# call. The entrypoint's `policy` job requires the result of this whole workflow, so splitting it
# out does not take the base pass off the required status check; `base-policy-result` below keeps
# the two guards that used to be steps of `policy`. A pull request carries its own copy of this
# file, as of every workflow, so none of it defends against a pull request that edits it --
# review is the control for that (docs/how-ci-works.md).
on:
  workflow_call:

permissions: {}

jobs:
  # The base commit's policy, run against this pull request's tree (see the header), in a job of
  # its own.
  #
  # Its own job because the checks in `policy` run this pull request's scripts, and any of them can
  # append to GITHUB_ENV or GITHUB_PATH, write into RUNNER_TEMP, or leave a process running. In one
  # job the base pass had to defend against all of that from inside the same environment. In a
  # separate job it starts on a fresh runner with a fresh RUNNER_TEMP, so nothing those checks
  # exported or left behind reaches it.
  #
  # That is not the same as no pull-request code running here: some base tests extract and run
  # steps from this pull request's own copy of this workflow, inside this job. The steps below
  # limit what that code can do. And because the pull request's copy of this file defines this job
  # too, none of this defends against a pull request that edits it -- review is the control for
  # that (docs/how-ci-works.md).
  #
  # The entrypoint's `policy` job requires the result of this workflow, through base-policy-result.
  # The fixtures that execute the base-policy step. They have a job of their own because that step
  # refuses to run while passwordless sudo is available, and the `policy` job keeps it. Here the
  # sudo rule is shown first, while root is still present, and then root is removed and every other
  # fixture runs, as the step itself would run in the base-policy job.
  base-policy-fixtures:
    permissions:
      contents: read
    name: Test the base-policy step
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before drop-root, while passwordless sudo is still there: the step must refuse to run.
      # --require makes this fail rather than skip if it cannot exercise that.
      - name: Test that the base-policy step refuses to run with passwordless sudo
        shell: bash
        run: bash .github/policy/test-base-policy-sudo.sh --require

      # cron, at, a user systemd manager (hosted ubuntu-24.04 runs one) and sshd start work for the
      # job user outside this job's process tree. Deny the first two and stop the others while root
      # is still available; the base-policy step asserts all of it before every script. sshd is
      # masked so socket activation cannot revive it. Locking ~/.ssh would not do instead: the job
      # user owns its home and could replace the directory.
      - name: Deny the job user cron, at and a user systemd manager
        shell: bash
        run: |
          set -euo pipefail
          user="$(id -un)"
          uid="$(id -u)"
          for tool in cron at; do
            sudo rm -f "/etc/${tool}.allow"
            printf '%s\n' "${user}" | sudo tee -a "/etc/${tool}.deny" > /dev/null
          done
          echo "sshd before: $(systemctl is-active ssh.service ssh.socket 2>&1 | tr '\n' ' ')"
          sudo systemctl mask --now ssh.service ssh.socket 2>/dev/null || true
          echo "sshd after: $(systemctl is-active ssh.service ssh.socket 2>&1 | tr '\n' ' ')"
          if systemctl is-active --quiet ssh.service || systemctl is-active --quiet ssh.socket; then
            echo "::error::ssh is still active after it was masked, so a base script could ssh to localhost"
            exit 1
          fi
          sudo loginctl disable-linger "${user}" || true
          sudo systemctl stop "user@${uid}.service" || true
          echo "user@${uid}.service after: $(systemctl is-active "user@${uid}.service" || true)"
          # Stopping it can leave socket files behind; only a listener that accepts matters.
          for socket in "/run/user/${uid}/bus" "/run/user/${uid}/systemd/private"; do
            echo "listeners on ${socket}: $(sudo ss -xlpn | grep -F -- "${socket}" || echo none)"
            if /usr/bin/ruby --disable-gems -rsocket -e 'UNIXSocket.new(ARGV[0]).close' "${socket}" 2>/dev/null; then
              echo "::error::something still accepts connections at ${socket} after the user manager was stopped"
              exit 1
            fi
          done
          # Nothing a base script starts may attach to the step or its wrapper.
          if [[ "$(cat /proc/sys/kernel/yama/ptrace_scope)" -lt 1 ]]; then
            sudo sysctl -q -w kernel.yama.ptrace_scope=1
          fi
          echo "kernel.yama.ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope)"

      - name: Remove root before the remaining fixtures
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/drop-root  # zizmor: ignore[self-repository]

      # Planted RUBYOPT, RUBYLIB, BASH_ENV and a PATH shim: the step must still reject.
      - name: Test that planted environment cannot make the base policy pass
        shell: bash
        run: bash .github/policy/test-base-policy-env.sh

      # The pin, process containment and loader scrub, each broken by its own fixture.
      - name: Test the base-policy job's pin, process containment and loader scrub
        shell: bash
        run: bash .github/policy/test-base-policy-isolation.sh

      # The root steps above, run with stand-ins for what needs root: ssh still active after the mask fails them.
      - name: Test that the root steps fail if ssh is still active after the mask
        shell: bash
        run: bash .github/policy/test-base-policy-root-step.sh

  base-policy:
    permissions:
      contents: read
    name: Validate against the base policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the base commit's policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-policy
          fetch-depth: 1
          persist-credentials: false

      # cron, at, a user systemd manager (hosted ubuntu-24.04 runs one) and sshd start work for the
      # job user outside this job's process tree. Deny the first two and stop the others while root
      # is still available; the base-policy step asserts all of it before every script. sshd is
      # masked so socket activation cannot revive it. Locking ~/.ssh would not do instead: the job
      # user owns its home and could replace the directory.
      - name: Deny the job user cron, at and a user systemd manager
        shell: bash
        run: |
          set -euo pipefail
          user="$(id -un)"
          uid="$(id -u)"
          for tool in cron at; do
            sudo rm -f "/etc/${tool}.allow"
            printf '%s\n' "${user}" | sudo tee -a "/etc/${tool}.deny" > /dev/null
          done
          echo "sshd before: $(systemctl is-active ssh.service ssh.socket 2>&1 | tr '\n' ' ')"
          sudo systemctl mask --now ssh.service ssh.socket 2>/dev/null || true
          echo "sshd after: $(systemctl is-active ssh.service ssh.socket 2>&1 | tr '\n' ' ')"
          if systemctl is-active --quiet ssh.service || systemctl is-active --quiet ssh.socket; then
            echo "::error::ssh is still active after it was masked, so a base script could ssh to localhost"
            exit 1
          fi
          sudo loginctl disable-linger "${user}" || true
          sudo systemctl stop "user@${uid}.service" || true
          echo "user@${uid}.service after: $(systemctl is-active "user@${uid}.service" || true)"
          # Stopping it can leave socket files behind; only a listener that accepts matters.
          for socket in "/run/user/${uid}/bus" "/run/user/${uid}/systemd/private"; do
            echo "listeners on ${socket}: $(sudo ss -xlpn | grep -F -- "${socket}" || echo none)"
            if /usr/bin/ruby --disable-gems -rsocket -e 'UNIXSocket.new(ARGV[0]).close' "${socket}" 2>/dev/null; then
              echo "::error::something still accepts connections at ${socket} after the user manager was stopped"
              exit 1
            fi
          done
          # Nothing a base script starts may attach to the step or its wrapper.
          if [[ "$(cat /proc/sys/kernel/yama/ptrace_scope)" -lt 1 ]]; then
            sudo sysctl -q -w kernel.yama.ptrace_scope=1
          fi
          echo "kernel.yama.ptrace_scope=$(cat /proc/sys/kernel/yama/ptrace_scope)"

      # Base tests call node, but the step runs them with PATH fixed to the system directories and
      # the runner's node is in /usr/local/bin, which hosted images leave world-writable. So while
      # root is still available, install a copy into /usr/bin, which only root can change.
      - name: Install node where only root can change it
        shell: bash
        run: |
          set -euo pipefail
          node_dest=/usr/bin/node
          if [[ -e "${node_dest}" || -L "${node_dest}" ]]; then
            # Kept only if a real file that it and its directory leave to root alone: a link, or
            # anything a job user could change, would let pull-request code replace node.
            if [[ -n "$(find "${node_dest}" -maxdepth 0 -type f -user root ! -perm -g+w ! -perm -o+w)" &&
                  -n "$(find "$(dirname "${node_dest}")" -maxdepth 0 -type d -user root ! -perm -g+w ! -perm -o+w)" ]]; then
              echo "${node_dest} is already installed and only root can change it; leaving it as it is"
            else
              echo "::error::${node_dest} exists but is a link or can be changed by someone other than root"
              exit 1
            fi
          else
            node_bin="$(readlink -f /usr/local/bin/node)"
            sudo install -o root -g root -m 0755 "${node_bin}" "${node_dest}"
          fi

      # Base tests execute steps from this pull request's copy of the workflow, so its code runs
      # here. Drop sudo and Docker first, with the composite the source jobs use; the step below
      # asserts sudo is gone.
      - name: Remove root before the base policy runs
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/drop-root  # zizmor: ignore[self-repository]

      # The shell is named by absolute path and started in privileged mode with the startup files
      # skipped, so nothing can steer it through BASH_ENV, ENV, SHELLOPTS, an exported function
      # (BASH_FUNC_*), the loader variables, or a bash on a GITHUB_PATH directory before this
      # script runs. The script then pins its own command lookup and guards each base script.
      - name: Run the base commit's policy against this pull request
        shell: /usr/bin/env -u BASH_ENV -u ENV -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          PATH=/usr/bin:/bin:/usr/sbin:/sbin
          set -euo pipefail
          base="${RUNNER_TEMP}/base-policy"
          rm -rf "${base}"
          mv base-policy "${base}"
          # The base scripts the loop below selects, counted in the base checkout before the copy, so a
          # copy or a loop that quietly does nothing is a failure and not a pass.
          count_scripts() {
            local n=0 f
            for f in "$1"/check-*.rb "$1"/check-*.sh "$1"/lint.sh "$1"/test-*.sh "$1"/test-*.rb; do
              if [[ -f "${f}" ]]; then n=$((n + 1)); fi
            done
            echo "${n}"
          }
          expected="$(count_scripts "${base}/.github/policy")"
          [[ "${expected}" -gt 0 ]] || { echo "::error::the base commit has no policy scripts to run"; exit 1; }
          rm -rf .github/policy
          cp -R "${base}/.github/policy" .github/policy
          diff -rq "${base}/.github/policy" .github/policy > /dev/null || { echo "::error::the base policy was not copied faithfully"; exit 1; }

          # Only the allow-listed names reach a base script, or any command this step runs for it.
          # The loader variables are asserted absent below, not merely left out: they change what
          # every process loads before its first instruction.
          ruby_bin=/usr/bin/ruby
          bash_bin=/bin/bash
          for tool in "${ruby_bin}" "${bash_bin}" /usr/bin/env /usr/bin/git; do
            [[ -x "${tool}" ]] || { echo "::error::${tool} is missing, so the base policy cannot run in a clean environment"; exit 1; }
          done
          # Ruby looks in HOME for gems, node for modules, git for config: files planted there by
          # one base test would be loaded by the next. So it is emptied and recreated before every
          # script, at the same path the base commit's own fixtures expect; mkdir without -p fails
          # if anything got there first.
          clean_home="${RUNNER_TEMP}/base-policy-home"
          fresh_home() {
            rm -rf -- "${clean_home}"
            mkdir -m 0700 -- "${clean_home}" || { echo "::error::could not give the base policy an empty HOME"; exit 1; }
          }
          fresh_home
          scrub=(/usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin "HOME=${clean_home}" LANG=C.UTF-8 LC_ALL=C.UTF-8)
          for name in CI GITHUB_ACTIONS GITHUB_API_URL GITHUB_EVENT_NAME GITHUB_REF GITHUB_REPOSITORY GITHUB_SERVER_URL GITHUB_SHA GITHUB_WORKSPACE RUNNER_ARCH RUNNER_OS RUNNER_TEMP; do
            [[ -z "${!name+x}" ]] || scrub+=("${name}=${!name}")
          done
          # Root was removed by the drop-root step before this one. Hosted runners give the job
          # user passwordless sudo, and PR code that a base test executes could otherwise use it to
          # write /etc/ld.so.preload or replace ruby. Fail closed if it is still there.
          if /usr/bin/sudo -n true 2>/dev/null; then
            echo "::error::passwordless sudo is still available, so a base script could act as root"
            exit 1
          fi
          # Nothing outside this job may start work for the job user later: no cron, at, user manager
          # or bus. Asserted now and before every script, so a script that changed any of it is not
          # believed by the next. The tools and runtime directory sit on lines of their own so a
          # fixture can point them at stand-ins.
          crontab_bin=/usr/bin/crontab
          at_bin=/usr/bin/at
          runtime_dir="/run/user/$(id -u)"
          ssh_ports="22"
          ptrace_scope="$(cat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null || echo missing)"
          echo "kernel.yama.ptrace_scope=${ptrace_scope}"
          [[ "${ptrace_scope}" =~ ^[1-3]$ ]] || { echo "::error::kernel.yama.ptrace_scope is ${ptrace_scope}, so a base script could attach to the step"; exit 1; }
          # Processes that could start work outside this job: a job-user systemd manager or bus outside
          # this step's ancestry, and sshd of any uid, since ssh to localhost with a key a script wrote
          # would start a process the subreaper never sees. Names and the real or effective uid are
          # read from /proc.
          deferred_processes='
            ancestry = []
            pid = Process.pid
            while pid > 1
              ancestry << pid
              stat = File.read("/proc/#{pid}/stat") rescue break
              pid = stat[(stat.rindex(")") + 2)..].split(" ")[1].to_i
            end
            names = ["systemd", "(sd-pam)", "dbus-daemon", "dbus-broker", "dbus-broker-launch"]
            sshd = ["sshd", "sshd-session", "sshd-auth"]
            found = Dir.glob("/proc/[0-9]*").filter_map do |dir|
              pid = dir[/\d+/].to_i
              next if ancestry.include?(pid)
              stat = File.read("#{dir}/stat") rescue next
              next if stat[(stat.rindex(")") + 2)..].split(" ")[0] == "Z"
              comm = File.read("#{dir}/comm").chomp rescue next
              next "ssh:#{comm}(#{pid})" if sshd.include?(comm)
              uids = File.read("#{dir}/status")[/^Uid:\s+(\d+)\s+(\d+)/, 0].to_s.scan(/\d+/).map(&:to_i) rescue next
              "#{comm}(#{pid})" if uids.include?(Process.uid) && names.include?(comm)
            end
            ssh, managers = found.partition { |entry| entry.start_with?("ssh:") }
            puts "#{managers.join(" ")}\t#{ssh.map { |entry| entry.delete_prefix("ssh:") }.join(" ")}"
          '
          log_listeners() {
            [[ ! -x /usr/bin/ss ]] || echo "unix listeners of uid $(id -u): $("${scrub[@]}" /usr/bin/ss -xlne 2>/dev/null | grep -F "uid:$(id -u) " || echo none)"
          }
          assert_nothing_deferred() {
            local scan left ssh_left socket
            if [[ -x "${crontab_bin}" ]] && printf '' | "${crontab_bin}" - 2>/dev/null; then
              "${crontab_bin}" -r 2>/dev/null || true
              echo "::error::the job user can still install a crontab, so a base script could leave work for later"
              return 1
            fi
            if [[ -x "${at_bin}" ]] && printf 'true\n' | "${at_bin}" now + 1 hour 2>/dev/null; then
              /usr/bin/atq 2>/dev/null | while read -r job _; do /usr/bin/atrm "${job}" 2>/dev/null || true; done
              echo "::error::the job user can still queue an at job, so a base script could leave work for later"
              return 1
            fi
            for socket in "${runtime_dir}/bus" "${runtime_dir}/systemd/private"; do
              if "${scrub[@]}" "${ruby_bin}" --disable-gems -rsocket -e 'UNIXSocket.new(ARGV[0]).close' "${socket}" 2>/dev/null; then
                log_listeners
                echo "::error::something accepts connections at ${socket}, so a base script could start a unit outside this job"
                return 1
              fi
            done
            # errexit is off in here (the caller runs this under `||`), so a scan that dies prints
            # nothing and would read as "found nothing". It must exit cleanly AND print its separator.
            scan="$("${scrub[@]}" "${ruby_bin}" --disable-gems -e "${deferred_processes}")" || scan=''
            if [[ "${scan}" != *$'\t'* ]]; then
              echo "::error::the process scan did not complete, so nothing can be said about what is running"
              return 1
            fi
            left="${scan%%$'\t'*}"
            ssh_left="${scan#*$'\t'}"
            if [[ -n "${left}" ]]; then
              log_listeners
              echo "::error::a systemd user manager or message bus is running for the job user (${left}), so a base script could start work outside this job"
              return 1
            fi
            if [[ -n "${ssh_left}" ]]; then
              echo "::error::sshd is running (${ssh_left}), so a base script could ssh to localhost and start work outside this job"
              return 1
            fi
            # shellcheck disable=SC2086
            if "${scrub[@]}" "${ruby_bin}" --disable-gems -rsocket -e 'ARGV.each { |port| ["127.0.0.1", "::1"].each { |host| begin; Socket.tcp(host, port.to_i, connect_timeout: 2) { exit 0 }; rescue SystemCallError, SocketError; end } }; exit 1' ${ssh_ports}; then
              echo "::error::something accepts connections on an ssh port (${ssh_ports}), so a base script could ssh to localhost and start work outside this job"
              return 1
            fi
          }
          log_listeners
          assert_nothing_deferred || exit 1
          # Defence in depth: `env -i` already keeps loader variables out; this asserts it.
          loaders="$("${scrub[@]}" /usr/bin/env | grep -E '^(LD_|DYLD_)' || true)"
          [[ -z "${loaders}" ]] || { echo "::error::loader variables reached the base policy environment: ${loaders%%=*}"; exit 1; }

          # What the base policy is, pinned to the base commit's own git objects rather than to
          # whatever is on disk: SHA-256 over each blob's bytes, read out of the base checkout's
          # object store. HEAD of that checkout is the base commit, because the step above checked
          # it out at `ref: base.sha`; reading the commit from the checkout rather than from an
          # expression keeps this script free of template interpolation.
          #
          # The manifest is re-verified before every script, so a base script that rewrote a later
          # one -- or anything it spawned that did -- is caught between them. It is held in this
          # shell's memory and handed to the verifier on stdin, never written to disk: a base script
          # runs as the same user and can see RUNNER_TEMP, so a manifest file there is one more file
          # it could rewrite to match its own edit. It is built and checked by the pinned ruby in
          # the same scrubbed environment as the base scripts, so RUBYOPT cannot steer the check
          # that pins them either.
          # The pin is only as good as the commit it reads, so the checkout's HEAD must be the base
          # commit this pull request names. Arrives through the environment, never interpolated
          # into the script.
          [[ "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the base commit is not a full SHA"; exit 1; }
          checked_out="$("${scrub[@]}" /usr/bin/git -C "${base}" rev-parse --verify HEAD)"
          [[ "${checked_out}" == "${BASE_SHA}" ]] || { echo "::error::the base checkout is ${checked_out}, not the base commit ${BASE_SHA}"; exit 1; }
          pins="$("${scrub[@]}" "${ruby_bin}" --disable-gems -e '
            require "digest"
            require "open3"
            base = ARGV.fetch(0)
            listing, status = Open3.capture2("/usr/bin/git", "-C", base, "ls-tree", "-r", "-z", "HEAD", "--", ".github/policy")
            abort("::error::cannot read the base commit tree") unless status.success?
            rows = listing.split("\0").reject(&:empty?).map do |entry|
              meta, path = entry.split("\t", 2)
              oid = meta.split(" ").fetch(2)
              blob, blob_status = Open3.capture2("/usr/bin/git", "-C", base, "cat-file", "blob", oid)
              abort("::error::cannot read #{path} from the base commit") unless blob_status.success?
              [Digest::SHA256.hexdigest(blob), path]
            end
            abort("::error::the base commit lists no policy files to pin") if rows.empty?
            print rows.sort_by(&:last).map { |digest, path| "#{digest}  #{path}\n" }.join
          ' "${base}")"
          pinned="$(printf '%s\n' "${pins}" | wc -l | tr -d ' ')"
          # The verifier runs while the previous script's HOME is still there, so it loads no gems at
          # all: a planted digest gem could otherwise make every file match. The pin is built the
          # same way, though its HOME is still empty when it runs.
          verify_manifest() {
            printf '%s\n' "${pins}" | "${scrub[@]}" "${ruby_bin}" --disable-gems -e '
              require "digest"
              pinned = STDIN.read.lines.map { |line| line.chomp.split("  ", 2) }.reject { |pair| pair.length != 2 }.to_h { |d, p| [p, d] }
              # FNM_DOTMATCH, so an added hidden file is reported like any other.
              present = Dir.glob(".github/policy/**/*", File::FNM_DOTMATCH).select { |path| File.file?(path) }.sort
              missing = pinned.keys.sort - present
              extra = present - pinned.keys.sort
              unless missing.empty? && extra.empty?
                warn "::error::the base policy on disk does not match the files the base commit pinned" \
                  " (missing: #{missing.join(", ")}; unexpected: #{extra.join(", ")})"
                exit 1
              end
              changed = pinned.reject { |path, digest| Digest::SHA256.hexdigest(File.binread(path)) == digest }
              unless changed.empty?
                warn "::error::a base policy file no longer matches the base commit it was pinned to: #{changed.keys.join(", ")}"
                exit 1
              end
            '
          }
          verify_manifest || exit 1

          # Pull-request code an earlier base test runs could rewrite what a later one reads (a
          # workflow file a test extracts steps from), so the tree is pinned too: every path outside
          # .github/policy with type, mode and SHA-256, plus the git state that decides what git reads
          # or runs. Held in memory, checked before every script, read with ruby alone and never by
          # running git, which an edited .git/config would steer.
          tree_state='
            require "digest"
            require "find"
            rows = []
            record = lambda do |path|
              stat = File.lstat(path)
              kind =
                if stat.symlink? then "link #{File.readlink(path).dump}"
                elsif stat.file? then "file #{(stat.mode & 0o7777).to_s(8)} #{Digest::SHA256.file(path).hexdigest}"
                elsif stat.directory? then "dir #{(stat.mode & 0o7777).to_s(8)}"
                else "other #{stat.ftype}"
                end
              rows << "#{path.delete_prefix("./").dump} #{kind}"
            end
            walk = lambda do |top|
              Find.find(top) do |path|
                if path == "./.github/policy" || path == "./.git"
                  Find.prune
                else
                  record.call(path) unless path == "."
                end
              end
            end
            walk.call(".")
            %w[.git .git/config .git/HEAD .git/packed-refs .git/index].each { |path| record.call("./#{path}") if File.exist?("./#{path}") || File.symlink?("./#{path}") }
            %w[.git/hooks .git/info .git/refs].each { |path| Find.find("./#{path}") { |p| record.call(p) } if File.directory?("./#{path}") && !File.symlink?("./#{path}") }
            current = rows.sort.join("\n")
            if ARGV.first == "verify"
              pinned = STDIN.read.split("\n")
              now = current.split("\n")
              unless now == pinned
                changed = (now - pinned) | (pinned - now)
                paths = changed.map { |line| line.split(" ").first }.uniq.first(10)
                warn "::error::the pull request tree changed while the base policy ran: #{paths.join(", ")}"
                exit 1
              end
            else
              print current
            end
          '
          tree_pin="$("${scrub[@]}" "${ruby_bin}" --disable-gems -e "${tree_state}" pin)"
          verify_tree() {
            printf '%s' "${tree_pin}" | "${scrub[@]}" "${ruby_bin}" --disable-gems -e "${tree_state}" verify
          }

          # Nothing a base script starts may outlive it: a leftover process could re-plant the next
          # script's emptied HOME, rewrite a verified base script, or change a later test's tree.
          # Each script runs under a wrapper that is the child subreaper for everything below it
          # (prctl PR_SET_CHILD_SUBREAPER via Fiddle): orphans are re-parented to it whatever they
          # did -- double fork, setsid, exec with a cleared environment -- and cannot leave its
          # subtree. When the script returns it kills every remaining descendant (found through
          # /proc ppid chains) until two passes find none; any it had to kill fails the script by
          # name, and a script that kills the wrapper fails the step through its status. Linux
          # only, and closed where prctl is missing. A marker in each environment, tried before,
          # is dropped by any exec with a new environment.
          subreaper='
            require "fiddle"
            label = ARGV.shift
            begin
              prctl = Fiddle::Function.new(Fiddle.dlopen(nil)["prctl"], [Fiddle::TYPE_INT] + [Fiddle::TYPE_LONG] * 4, Fiddle::TYPE_INT)
              raise "prctl(PR_SET_CHILD_SUBREAPER) failed" unless prctl.call(36, 1, 0, 0, 0).zero?
              # Not dumpable, so no process of the same user can read or write its memory or attach
              # to it, whatever ptrace_scope says. Descendants are dumpable again after their exec.
              raise "prctl(PR_SET_DUMPABLE) failed" unless prctl.call(4, 0, 0, 0, 0).zero?
            rescue StandardError, Fiddle::DLError => e
              warn "::error::base policy: cannot contain #{label}: #{e.message}"
              exit 125
            end
            child = fork { Process.setsid; exec(*ARGV) }
            _, status = Process.wait2(child)
            me = Process.pid
            left = []
            deadline = Process.clock_gettime(Process::CLOCK_MONOTONIC) + 30
            # Done only after two passes in a row find nothing: a process can fork between the
            # listing and the kill, and its child is only seen by the next pass.
            quiet = 0
            loop do
              if Process.clock_gettime(Process::CLOCK_MONOTONIC) > deadline
                warn "::error::base policy: the processes #{label} started did not settle within 30 seconds"
                exit 125
              end
              parent = {}
              state = {}
              Dir.glob("/proc/[0-9]*/stat").each do |path|
                stat = File.read(path) rescue next
                fields = stat[(stat.rindex(")") + 2)..].split(" ")
                pid = path[/\d+/].to_i
                state[pid] = fields[0]
                parent[pid] = fields[1].to_i
              end
              # A parent missing from the listing exited while it was read: its children may be
              # ours, so a pass that meets one does not count as quiet.
              unknown = false
              found = parent.keys.select do |pid|
                next false if pid == me
                up = pid
                up = parent[up] while parent.key?(up) && up != me && up > 1
                unknown = true unless up == me || up <= 1 || parent.key?(up)
                up == me
              end
              if found.empty? && !unknown
                quiet += 1
                break if quiet >= 2
                sleep 0.05
                next
              end
              quiet = 0
              # Every descendant is killed. A zombie that has exited and only waits to be reaped is
              # not reported as left running -- unless other threads of it still are, which shows
              # its leader as a zombie while the process goes on.
              running = found.reject do |pid|
                %w[Z X].include?(state[pid]) && (Dir.children("/proc/#{pid}/task").length <= 1 rescue true)
              end
              left |= running
              found.each { |pid| Process.kill(:KILL, pid) rescue nil }
              begin
                nil while Process.wait(-1, Process::WNOHANG)
              rescue Errno::ECHILD
              end
              sleep 0.05
            end
            unless left.empty?
              warn "::error::base policy: #{label} left #{left.length} process(es) running when it returned; they were killed"
              exit 125
            end
            exit(status.exitstatus || 128 + status.termsig.to_i)
          '
          run_guarded() {
            fresh_home
            "${scrub[@]}" ${token[@]+"${token[@]}"} "${ruby_bin}" --disable-gems -e "${subreaper}" "${check##*/}" "$@"
          }

          status=0
          executed=0
          for check in .github/policy/check-*.rb .github/policy/check-*.sh .github/policy/lint.sh .github/policy/test-*.sh .github/policy/test-*.rb; do
            [[ -f "${check}" ]] || continue
            verify_manifest || { status=1; break; }
            verify_tree || { status=1; break; }
            assert_nothing_deferred || { status=1; break; }
            executed=$((executed + 1))
            token=()
            if [[ "${check##*/}" == lint.sh && -n "${GH_TOKEN+x}" ]]; then token=("GH_TOKEN=${GH_TOKEN}"); fi
            echo "::group::base policy: ${check##*/}"
            case "${check}" in
              *.rb) run_guarded "${ruby_bin}" "${check}" || { echo "::error::The base commit's ${check##*/} rejects this pull request"; status=1; } ;;
              *) run_guarded "${bash_bin}" --noprofile --norc "${check}" || { echo "::error::The base commit's ${check##*/} rejects this pull request"; status=1; } ;;
            esac
            echo '::endgroup::'
          done
          [[ "${executed}" -eq "${expected}" ]] || { echo "::error::ran ${executed} of ${expected} base policy scripts"; exit 1; }
          verify_manifest || status=1
          rm -rf -- "${clean_home}"
          echo "base policy: ${executed} scripts run against ${pinned} pinned files"
          exit "${status}"

  # The two guards that were steps of the entrypoint's `policy` job, with the same rules: the fixtures
  # job must have passed on every event, and the base-policy job on a pull request (it is skipped
  # elsewhere). A job that did not run is not a job that passed, so a skipped base-policy job on a
  # pull request fails here, and the entrypoint requires this job to have passed.
  base-policy-result:
    permissions: {}
    name: Base policy result
    needs: [base-policy-fixtures, base-policy]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the base-policy fixtures job to have passed
        if: ${{ always() }}
        shell: bash
        env:
          FIXTURES_RESULT: ${{ needs.base-policy-fixtures.result }}
        run: |
          set -euo pipefail
          if [[ "${FIXTURES_RESULT}" != 'success' ]]; then
            echo "::error::the base-policy fixtures job did not pass (result: ${FIXTURES_RESULT})"
            exit 1
          fi
          echo 'base policy: the base-policy fixtures job passed'

      - name: Require the base-policy job to have passed
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_RESULT: ${{ needs.base-policy.result }}
        run: |
          set -euo pipefail
          if [[ "${BASE_RESULT}" != 'success' ]]; then
            echo "::error::the base-policy job did not pass (result: ${BASE_RESULT})"
            exit 1
          fi
          echo 'base policy: the base-policy job passed'
