name: Weekly develop and main validation (scheduled)

# Once a week, validate the private `develop` tip on every platform (Linux, macOS, Windows,
# Android and iOS) and the private `main` tip (the production line) on Linux only, so drift
# is caught even when nobody has dispatched a run. This workflow runs no project
# code and checks out nothing: it only (1) resolves the current develop tip SHA
# with the same short-lived, read-only, contents-only source-reader token the
# protected workflows use, revoking it before anything else happens, and (2)
# dispatches the three protected validation workflows for that exact SHA with
# the run's own token. The dispatched workflows do all the source-bearing work
# under their own protections.
#
# Missed-run check. The dispatch job warns in its summary when the previous scheduled run of
# this workflow is older than 8 days (or absent), so a dropped Monday is noticed on the next
# manual or scheduled run. It cannot fire by itself when no run happens, so also check by
# hand: `gh run list --repo Moh-Bakr/Taurine-CI --workflow weekly-validation.yml
# --event schedule --limit 3` should show a run each Monday after 05:23 UTC. If Monday's is
# missing, dispatch this workflow by hand from the Actions tab or the gh CLI on main (a manual
# dispatch uses the same jobs; set dry_run to only resolve and summarise). A repository with no
# activity for 60 days has its schedules disabled by GitHub; re-enable them under Actions.
on:
  schedule:
    # Monday 05:23 UTC. Off the top of the hour on purpose: GitHub delays or drops scheduled
    # runs at :00 under load.
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Resolve the develop tip, the drift base and the openssl-src note and summarise them, but dispatch no validation runs
        required: false
        default: false
        type: boolean

# Deny by default; each job below declares the one permission it needs.
permissions: {}

concurrency:
  # Each run has its own group: GitHub keeps only one PENDING run per group, so a shared per-SHA
  # group let a later dispatch silently cancel an earlier pending one. Runs are never
  # deduplicated or cancelled; check for an existing run before dispatching (docs/how-ci-works.md).
  # Nothing is shared between runs that a group would protect: caches are first-writer-wins on an
  # exact key, so a race is harmless.
  group: weekly-validation-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  resolve:
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Resolve the private develop tip
    environment: source-read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      base: ${{ steps.resolve.outputs.base }}
      openssl_locked: ${{ steps.resolve.outputs.openssl_locked }}
      main_sha: ${{ steps.resolve.outputs.main_sha }}
    steps:
      - name: Mint read-only private-source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          # Deliberate: the token is revoked explicitly by the next verification step, before any project command, and that step fails closed; the action's own end-of-job revoke would leave it live while project code runs.
          skip-token-revoke: true  # zizmor: ignore[github-app]

      - name: Resolve the develop tip and revoke the source token
        id: resolve
        if: always()
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
        run: |
          set -euo pipefail
          set +x
          failed=0
          sha=''
          base=''
          openssl_locked=''
          main_sha=''
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo 'No source token was minted; refusing to continue' >&2
            exit 1
          fi
          api() {
            curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors \
              -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' "$@"
          }
          if ! identity="$(api "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
            echo 'The configured source repository identity could not be resolved' >&2
            failed=1
          elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
            echo 'The configured source repository identity did not match' >&2
            failed=1
          elif ! sha="$(api "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/develop" | jq -er '.sha | ascii_downcase')" \
            || [[ ! "${sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The develop tip could not be resolved to a full commit SHA' >&2
            failed=1
          fi
          # The production line's tip, validated on Linux only. Best effort: an empty value
          # just skips that run and the summary says so.
          if [[ "${failed}" -eq 0 ]]; then
            main_sha="$(api "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/main" | jq -r '.sha // empty | ascii_downcase' || true)"
            [[ "${main_sha}" =~ ^[0-9a-f]{40}$ ]] || main_sha=''
          fi
          # The develop tip from seven days ago, for the drift check below: the selective run
          # of the week's diff. Best effort; an empty base just skips that run.
          if [[ "${failed}" -eq 0 ]]; then
            since="$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)"
            base="$(api "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits?sha=develop&until=${since}&per_page=1" | jq -r '.[0].sha // empty' || true)"
            [[ "${base}" =~ ^[0-9a-f]{40}$ ]] || base=''
          # The openssl-src versions the private locks pin, for the freshness check below.
          # Version strings only (public registry facts); nothing else from the files is kept.
            for lock in Cargo.lock taurine-backend/dbx-core/Cargo.lock taurine-backend/dbx-mongo-shell/Cargo.lock; do
              found="$(api -H 'Accept: application/vnd.github.raw+json' "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/contents/${lock}?ref=${sha}" 2>/dev/null \
                | awk '/^name = "openssl-src"$/ { getline; gsub(/version = "|"/, ""); print }' | head -n 1 || true)"
              if [[ -n "${found}" ]]; then
                openssl_locked="${openssl_locked}${openssl_locked:+,}${found}"
              fi
            done
          fi
          if ! api -X DELETE "${GITHUB_API_URL}/installation/token"; then
            echo 'Source token revocation failed' >&2
            failed=1
          fi
          unset SOURCE_TOKEN
          find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
          # Explicit, not a bare (( )): errexit does not apply to (( )) in every bash.
          if (( failed != 0 )); then exit 1; fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "base=${base}" >> "${GITHUB_OUTPUT}"
          echo "main_sha=${main_sha}" >> "${GITHUB_OUTPUT}"
          echo "openssl_locked=${openssl_locked}" >> "${GITHUB_OUTPUT}"
          echo "- Resolved private develop tip: \`${sha}\`" >> "${GITHUB_STEP_SUMMARY}"

  dispatch:
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    needs: resolve
    name: Dispatch the protected validations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the protected validations for the resolved SHAs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # The dispatch job checks nothing out, so gh cannot infer the repository from a
          # working tree; name it explicitly.
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
          BASE_SHA: ${{ needs.resolve.outputs.base }}
          MAIN_SHA: ${{ needs.resolve.outputs.main_sha }}
          THIS_RUN_ID: ${{ github.run_id }}
          OPENSSL_LOCKED: ${{ needs.resolve.outputs.openssl_locked }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONTROL_SHA: ${{ github.sha }}
          CONTROL_REF: ${{ github.ref }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          set -euo pipefail
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The resolved source SHA is not a full commit SHA' >&2
            exit 1
          fi
          # Missed-run check: the previous scheduled run of this workflow (not this one) should be
          # at most 8 days old. GitHub drops or disables schedules silently, so warn loudly.
          MISSED_NOTE=''
          previous="$(gh run list --workflow weekly-validation.yml --event schedule --limit 5 --json databaseId,createdAt \
            --jq "[.[] | select(.databaseId != (${THIS_RUN_ID} | tonumber))] | first | .createdAt // empty" || true)"
          if [[ -z "${previous}" ]]; then
            MISSED_NOTE='no earlier scheduled run was found'
          elif (( $(date -u +%s) - $(date -u -d "${previous}" +%s) > 8 * 86400 )); then
            MISSED_NOTE="the last scheduled run was ${previous}, more than 8 days ago; a weekly run was missed"
          fi
          if [[ -n "${MISSED_NOTE}" ]]; then
            echo "::warning title=weekly run missed::${MISSED_NOTE}"
          fi
          if [[ "${DRY_RUN}" == true ]]; then
            echo "dry run: no validation runs dispatched"
          else
            # The resolver checks nothing out. Read the reviewed identity contract and its
            # stdlib-only key calculator from this exact control-plane commit, then use that
            # same contract for every event payload. This keeps scheduled/manual dispatches
            # aligned with the trusted validate-input proof without executing source code.
            if [[ ! "${CONTROL_SHA}" =~ ^[0-9a-fA-F]{40}$ || "${CONTROL_REF}" != refs/heads/main ]]; then
              echo 'The weekly control-plane identity is not the protected main tip' >&2
              exit 1
            fi
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GH_REPO}/contents/.github/ci-matrix.json?ref=${CONTROL_SHA}" \
              > "${RUNNER_TEMP}/ci-matrix.json"
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/${GH_REPO}/contents/.github/policy/dispatch-identity.rb?ref=${CONTROL_SHA}" \
              > "${RUNNER_TEMP}/dispatch-identity.rb"
            # Pass the complete reviewed matrix so the key calculator binds both workflow
            # inputs and the suite catalog at this exact control-plane SHA.
            matrix_json="$(jq -c . "${RUNNER_TEMP}/ci-matrix.json")"
            make_key() {
              local workflow_path="$1" source_sha="$2" normalized_inputs="$3"
              CI_DISPATCH_CONTRACT_JSON="${matrix_json}" \
              CI_WORKFLOW_PATH="${workflow_path}" \
              CI_SOURCE_SHA="${source_sha}" \
              CI_CONTROL_REPOSITORY="${GH_REPO}" \
              CI_CONTROL_SHA="${CONTROL_SHA}" \
              CI_CONTROL_REF="${CONTROL_REF}" \
              CI_NORMALIZED_INPUTS="${normalized_inputs}" \
              CI_GENERATE_ONLY=true ruby "${RUNNER_TEMP}/dispatch-identity.rb"
            }
            linux_inputs="$(jq -cn --arg source "${SOURCE_SHA}" '{source_sha:$source,profile:"full",visual:false,gitleaks_history:false,base_sha:""}')"
            linux_key="$(make_key .github/workflows/linux-validation.yml "${SOURCE_SHA}" "${linux_inputs}")"
            gh workflow run linux-validation.yml --ref main -f "source_sha=${SOURCE_SHA}" -f "dispatch_key=${linux_key}"
            # Drift check: the same week's change also runs through the selector. Compare this
            # run's Result with the full run's: a concern that fails in the full run but was
            # "not selected" here is a gap in ci-matrix.json's rules.
            if [[ -n "${BASE_SHA}" ]]; then
              drift_inputs="$(jq -cn --arg source "${SOURCE_SHA}" --arg base "${BASE_SHA}" '{source_sha:$source,profile:"full",visual:false,gitleaks_history:false,base_sha:$base}')"
              drift_key="$(make_key .github/workflows/linux-validation.yml "${SOURCE_SHA}" "${drift_inputs}")"
              gh workflow run linux-validation.yml --ref main -f "source_sha=${SOURCE_SHA}" -f "base_sha=${BASE_SHA}" -f "dispatch_key=${drift_key}"
            fi
            mac_inputs="$(jq -cn --arg source "${SOURCE_SHA}" '{source_sha:$source,rust:true,flavor:"prod"}')"
            mac_key="$(make_key .github/workflows/macos-validation.yml "${SOURCE_SHA}" "${mac_inputs}")"
            gh workflow run macos-validation.yml --ref main -f "source_sha=${SOURCE_SHA}" -f dispatch_key="${mac_key}" -f rust=true
            windows_inputs="$(jq -cn --arg source "${SOURCE_SHA}" '{source_sha:$source,rust:true,windows_image:"windows-2022"}')"
            windows_key="$(make_key .github/workflows/windows-validation.yml "${SOURCE_SHA}" "${windows_inputs}")"
            gh workflow run windows-validation.yml --ref main -f "source_sha=${SOURCE_SHA}" -f dispatch_key="${windows_key}" -f rust=true
            # Mobile, develop only (the Rust tests on the emulator and the simulator).
            android_inputs="$(jq -cn --arg source "${SOURCE_SHA}" '{source_sha:$source,rust:true}')"
            android_key="$(make_key .github/workflows/android-validation.yml "${SOURCE_SHA}" "${android_inputs}")"
            gh workflow run android-validation.yml --ref main -f "source_sha=${SOURCE_SHA}" -f dispatch_key="${android_key}" -f rust=true
            ios_key="$(make_key .github/workflows/ios-validation.yml "${SOURCE_SHA}" "${android_inputs}")"
            gh workflow run ios-validation.yml --ref main -f "source_sha=${SOURCE_SHA}" -f dispatch_key="${ios_key}" -f rust=true
            # The production line: the main tip, Linux only (full, no base), to keep the cost down.
            if [[ -n "${MAIN_SHA}" && "${MAIN_SHA}" != "${SOURCE_SHA}" ]]; then
              main_inputs="$(jq -cn --arg source "${MAIN_SHA}" '{source_sha:$source,profile:"full",visual:false,gitleaks_history:false,base_sha:""}')"
              main_key="$(make_key .github/workflows/linux-validation.yml "${MAIN_SHA}" "${main_inputs}")"
              gh workflow run linux-validation.yml --ref main -f "source_sha=${MAIN_SHA}" -f "dispatch_key=${main_key}"
            fi
            # The Windows 2025 image, every week, alongside (never instead of) the baseline run.
            # It does not gate anything; two consecutive green weeks switch the default
            # (see the header of windows-validation.yml).
            windows_2025_inputs="$(jq -cn --arg source "${SOURCE_SHA}" '{source_sha:$source,rust:true,windows_image:"windows-2025"}')"
            windows_2025_key="$(make_key .github/workflows/windows-validation.yml "${SOURCE_SHA}" "${windows_2025_inputs}")"
            gh workflow run windows-validation.yml --ref main -f "source_sha=${SOURCE_SHA}" -f dispatch_key="${windows_2025_key}" -f rust=true -f windows_image=windows-2025
          fi
          # openssl-src freshness: warn when a private lock is behind the newest 300.5.x
          # release on crates.io (the OpenSSL 3.5 line the production plan targets). The
          # check only reads the lock versions resolved above and one public registry page.
          if [[ -n "${OPENSSL_LOCKED}" ]]; then
            latest="$(curl --fail --silent --show-error --retry 3 -H 'User-Agent: Taurine-CI openssl-src freshness (github.com/Moh-Bakr/Taurine-CI)' \
              https://crates.io/api/v1/crates/openssl-src/versions \
              | jq -r '[.versions[] | select(.yanked == false) | .num | select(startswith("300.5."))] | sort_by(split("+")[0] | split(".") | map(tonumber)) | last // empty' || true)"
            if [[ -n "${latest}" ]]; then
              behind=0
              IFS=',' read -r -a locked_versions <<<"${OPENSSL_LOCKED}"
              for locked in "${locked_versions[@]}"; do
                lowest="$(printf '%s\n%s\n' "${locked%%+*}" "${latest%%+*}" | sort -V | head -n 1)"
                if [[ "${locked%%+*}" != "${latest%%+*}" && "${lowest}" == "${locked%%+*}" ]]; then
                  echo "::warning title=openssl-src behind::a private lock pins openssl-src ${locked}; the newest 300.5.x release is ${latest}"
                  behind=1
                fi
              done
              suffix=''
              if [[ "${behind}" == 1 ]]; then suffix=' (BEHIND)'; fi
              OPENSSL_NOTE="openssl-src: locks pin ${OPENSSL_LOCKED}; newest 300.5.x is ${latest}${suffix}"
            else
              OPENSSL_NOTE="openssl-src: locks pin ${OPENSSL_LOCKED}; the crates.io lookup returned no 300.5.x release"
            fi
          else
            OPENSSL_NOTE='openssl-src: no lock in the source pins it'
          fi
          {
            echo '## Weekly develop validation'
            echo
            echo "- Source SHA (develop): \`${SOURCE_SHA}\`"
            echo "- Main tip (Linux only): \`${MAIN_SHA:-unresolved}\`"
            if [[ -n "${MISSED_NOTE}" ]]; then echo "- WARNING, missed-run check: ${MISSED_NOTE}"; else echo '- Missed-run check: the previous scheduled run is within 8 days'; fi
            echo "- ${OPENSSL_NOTE}"
            if [[ "${DRY_RUN}" == true ]]; then
              echo '- Dry run: nothing was dispatched'
            else
              echo '- Dispatched: linux-validation (full), macos-validation (rust=true), windows-validation (rust=true), windows-validation on windows-2025 (rust=true, non-gating), android-validation and ios-validation (rust=true), linux-validation for the main tip'
            fi
            if [[ -n "${BASE_SHA}" && "${DRY_RUN}" != true ]]; then
              echo "- Drift check: linux-validation with base_sha \`${BASE_SHA}\` (the week's selective run); compare its Result with the full run's"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # Freshness of the pinned tools (.github/tool-pins.json): warn-only, like the openssl-src
  # note. It reads that committed list and each tool's public release list; it uses no source
  # token, checks nothing out, and never fails the run.
  tool-freshness:
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Pinned tool freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Compare each pinned tool with its newest stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PINS_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The pin list is read from this repository at the run's commit; nothing is checked out.
          pins="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GH_REPO}/contents/.github/tool-pins.json?ref=${PINS_REF}")"
          {
            echo '## Pinned tool freshness'
            echo
            echo '| Tool | Pinned | Newest stable | State |'
            echo '| --- | --- | --- | --- |'
          } >> "${GITHUB_STEP_SUMMARY}"
          behind=0
          while IFS='|' read -r name repo prefix current; do
            latest="$(gh api "repos/${repo}/releases?per_page=100" --jq ".[] | select(.prerelease == false and .draft == false) | .tag_name | select(startswith(\"${prefix}\")) | ltrimstr(\"${prefix}\")" 2>/dev/null \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [[ -z "${latest}" ]]; then
              state='lookup returned no release'
            elif [[ "${latest}" == "${current}" ]]; then
              state='current'
            elif [[ "$(printf '%s\n%s\n' "${current}" "${latest}" | sort -V | head -n 1)" == "${current}" ]]; then
              state='BEHIND'
              behind=$((behind + 1))
              echo "::warning title=pinned tool behind::${name} is pinned to ${current}; the newest stable release is ${latest}"
            else
              state='pin is newer than the newest stable release'
            fi
            echo "| ${name} | ${current} | ${latest:-unknown} | ${state} |" >> "${GITHUB_STEP_SUMMARY}"
          done < <(jq -r '.tools[] | [.name, .repo, .tag_prefix, .current] | join("|")' <<<"${pins}")
          echo "tools behind: ${behind}"
