name: KeelDock Cloud validation concern (protected)

# One operating system per call, on a clean ephemeral runner doing its own exact
# private checkout. No source-bearing artifact, cache or output crosses a job
# boundary, matching the rule the Taurine concerns already follow.

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private keeldock-cloud
        required: true
        type: string
      platform:
        description: linux, macos or windows
        required: true
        type: string

permissions:
  contents: read

env:
  # A different private source from the Taurine concerns. The numeric id is what
  # the identity check below actually verifies, so a repository renamed or
  # swapped underneath this workflow fails rather than being silently accepted.
  SOURCE_REPOSITORY_ID: '1377321992'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: keeldock-cloud
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CI: 'true'

jobs:
  validate:
    name: KeelDock ${{ inputs.platform }}
    environment: source-read
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || (inputs.platform == 'macos' && 'macos-15' || 'windows-2022') }}
    # Linux additionally starts PostgreSQL containers for the persistence and
    # messaging suites; the other two run the structural gates only.
    timeout-minutes: ${{ inputs.platform == 'linux' && 45 || 40 }}
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected call input
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'keeldock-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi
          case "${REQUESTED_PLATFORM}" in
            linux|macos|windows) ;;
            *) echo "Unsupported platform: ${REQUESTED_PLATFORM}" >&2; exit 1 ;;
          esac

      - name: Mint read-only private-source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          # The source-reader app installation must include keeldock-cloud. If it
          # does not, this step fails here — before any checkout — rather than
          # producing a confusing empty working directory later.
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact private source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY_OWNER }}/${{ env.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          # Full history, unlike the Taurine concerns: the SDL snapshot gate runs
          # `git diff --exit-code`, which needs a working index against the
          # checked-out commit. fetch-depth 1 still provides that, but the
          # snapshot check also reports the commit, so the ref must be exact.
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify identity, exact checkout, and revoke source token
        if: always()
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          failed=0
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo 'No source token was minted; refusing to continue' >&2
            exit 1
          fi
          if ! identity="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
            echo 'The configured source repository identity could not be resolved' >&2
            failed=1
          elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
            echo 'The configured source repository identity did not match' >&2
            failed=1
          fi
          if ! checked_out_sha="$(git rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"; then
            echo 'The private source checkout did not complete' >&2
            failed=1
          elif [[ "${checked_out_sha}" != "${requested_sha}" ]]; then
            echo 'The checked-out commit does not match source_sha' >&2
            failed=1
          fi
          if ! api_sha="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/${requested_sha}" | jq -er '.sha | ascii_downcase')" || [[ "${api_sha}" != "${requested_sha}" ]]; then
            echo 'The requested source SHA was not resolved from the configured repository' >&2
            failed=1
          fi
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -X DELETE -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/installation/token"; then
            echo 'Source token revocation failed; refusing to execute project code' >&2
            failed=1
          fi
          unset SOURCE_TOKEN
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all credential.helper 2>/dev/null || true
          find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
          (( failed == 0 ))

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK band is pinned by the source's own global.json, so the
          # toolchain is decided by the commit under test, not by this workflow.
          global-json-file: global.json

      - name: Restore with the committed lock files
        shell: bash
        run: |
          set -euo pipefail
          # --locked-mode: a dependency the lock files do not describe is a
          # failure, not something to resolve quietly. This is also the first
          # real cross-platform signal — the lock files were generated on macOS,
          # so a Linux or Windows mismatch surfaces here.
          if ! dotnet restore KeelDock.Cloud.slnx --locked-mode >"${RUNNER_TEMP}/restore.log" 2>&1; then
            echo 'restore: failed' >&2
            # Restore failures name packages and versions, not source, so the
            # tail is safe to surface and is the whole diagnostic.
            tail -40 "${RUNNER_TEMP}/restore.log" >&2 || true
            exit 1
          fi
          echo 'restore: passed'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install the generated-contract toolchain
        shell: bash
        run: |
          set -euo pipefail
          # Installed before the suite because run-tests.sh checks the generated TypeScript only
          # when node_modules is present and otherwise reports it skipped. Skipped is not passed,
          # and the hosted run is the one that must always check.
          if ! npm --prefix tools/graphql-codegen ci >"${RUNNER_TEMP}/npm-ci.log" 2>&1; then
            echo 'typescript-install: failed' >&2
            exit 1
          fi

      - name: Full suite
        shell: bash
        run: |
          set -euo pipefail
          # Invokes the repository's own runner rather than repeating its suite list. The list
          # used to live here as well, and two copies of "what the full suite is" drift the
          # moment somebody adds a suite and updates one — silently, because a gate nobody runs
          # looks exactly like a gate that passes. The script discovers suites from the
          # filesystem, so a new one is covered on the day it is written.
          #
          # --sanitize strips absolute paths from failure output; assertion text and counts are
          # what makes a hosted failure diagnosable, private checkout layout is not.
          # --no-docker on macOS and Windows: those runners have no Linux container runtime, and
          # the summary below states which platforms therefore proved less.
          args=(--configuration Release --sanitize)
          if [[ "${{ inputs.platform }}" != "linux" ]]; then
            args+=(--no-docker)
          fi

          # Tee'd so the next step can publish per-suite totals. The log still carries
          # everything; what it does not carry is a reader who will scroll ten thousand lines to
          # find out whether a suite quietly stopped existing.
          bash scripts/run-tests.sh "${args[@]}" 2>&1 | tee "${RUNNER_TEMP}/suite.log"

          # PIPESTATUS, not $?: with a pipe, $? is tee's exit code, which is 0 even when the
          # suite failed. This is the one line that decides whether the gate is a gate.
          exit "${PIPESTATUS[0]}"

      - name: Summarise per-suite totals
        # Runs even when the suite failed, because a failing run is exactly when knowing which
        # suite, and how many of its tests, is worth having on the summary rather than in a log.
        if: always()
        shell: bash
        env:
          # Through the environment, not interpolated into the script: a workflow input spliced
          # into a shell body is a script-injection site, and this file already routes every
          # other input this way.
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail

          log="${RUNNER_TEMP}/suite.log"
          if [[ ! -s "${log}" ]]; then
            echo 'suite-totals: no suite output was captured' >&2
            exit 1
          fi

          # Parsed rather than re-derived: the numbers published here are the ones the run
          # actually printed. Re-running anything to produce a summary would let the summary and
          # the gate disagree, which is worse than having no summary.
          awk '
            /^--- SKIP / { name = $3; printf "%s\tskipped\t-\t-\n", name; next }
            /^--- /      { name = substr($0, 5); next }
            /^  total:/     { total = $2 }
            /^  failed:/    { failed = $2
                              if (name != "") { printf "%s\t%s\t%s\t%s\n",
                                                name, (failed == 0 ? "pass" : "FAIL"), total, failed
                                                name = "" } }
          ' "${log}" > "${RUNNER_TEMP}/suite-totals.tsv"

          rows="$(wc -l < "${RUNNER_TEMP}/suite-totals.tsv" | tr -d ' ')"

          # A summary that lists nothing reads exactly like a summary of a clean run. The whole
          # point of publishing totals is to make a shrinking gate visible, so a parse that
          # found no suites fails the job rather than printing an empty table.
          if [[ "${rows}" -eq 0 ]]; then
            echo 'suite-totals: parsed no suites from the run output' >&2
            exit 1
          fi

          discovered="$(grep -E '^Discovered [0-9]+ suite\(s\); ran [0-9]+\.$' "${log}" || true)"
          if [[ -z "${discovered}" ]]; then
            echo 'suite-totals: the run did not report a discovery count' >&2
            exit 1
          fi

          {
            echo "### Suites — ${PLATFORM}"
            echo
            echo '| Suite | Result | Tests | Failed |'
            echo '|---|---|---:|---:|'
            while IFS=$'\t' read -r name result total failed; do
              echo "| \`${name}\` | ${result} | ${total} | ${failed} |"
            done < "${RUNNER_TEMP}/suite-totals.tsv"
            echo
            echo "${discovered}"
            awk -F'\t' '$3 != "-" { t += $3; f += $4 } END { printf "\n**%d tests, %d failed.**\n", t, f }' \
              "${RUNNER_TEMP}/suite-totals.tsv"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Confirm the generated artefacts are committed
        shell: bash
        run: |
          set -euo pipefail
          # The snapshot and fixture tests write their baseline when it is missing and report
          # skipped rather than passing, so a contributor who regenerated and forgot to commit
          # would otherwise get a green build. Checked, never printed: these are private source.
          if ! git diff --quiet -- contracts/; then
            echo 'Generated contracts differ from what is committed. Regenerate and commit:' >&2
            git diff --name-only -- contracts/ >&2
            exit 1
          fi
          echo 'contracts: committed and unchanged'

      - name: Publish the hosts and smoke the Migrator
        shell: bash
        run: |
          set -euo pipefail
          for host in Api Worker Migrator; do
            if ! dotnet publish "src/Hosts/KeelDock.Cloud.${host}" \
              --no-restore --configuration Release \
              --output "${RUNNER_TEMP}/publish/${host}" >"${RUNNER_TEMP}/publish-${host}.log" 2>&1; then
              echo "publish-${host}: failed" >&2
              exit 1
            fi
            echo "publish-${host}: passed"
          done

          # With no connection string configured the Migrator must fail loudly
          # and by name. It is the cheapest possible check that the published
          # artifact is the program we think it is, and it runs identically on
          # all three operating systems.
          set +e
          output="$(dotnet "${RUNNER_TEMP}/publish/Migrator/KeelDock.Cloud.Migrator.dll" 2>&1)"
          migrator_rc=$?
          set -e
          if [[ "${migrator_rc}" -eq 0 ]]; then
            echo 'migrator-smoke: failed (reported success with no database configured)' >&2
            exit 1
          fi
          if ! grep -q 'owner connection string' <<<"${output}"; then
            echo 'migrator-smoke: failed (exited for an unexpected reason)' >&2
            exit 1
          fi
          echo 'migrator-smoke: passed'

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## KeelDock Cloud — ${PLATFORM}"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo "- Runner: \`${RUNNER_OS}\` / \`${RUNNER_ARCH}\`"
            echo '- Restore was locked, build was Release with warnings as errors.'
            echo '- The full suite ran via scripts/run-tests.sh, which discovers suites from the repository.'
            echo '- Generated contracts match what is committed.'
            echo '- API, Worker and Migrator published; Migrator smoke passed.'
            if [[ "${PLATFORM}" == 'linux' ]]; then
              echo '- Container-backed suites ran against a real PostgreSQL instance.'
            else
              echo '- Container-backed suites were NOT run: no Linux container runtime on this platform.'
            fi
            echo '- Source token: revoked before any project code executed.'
            echo '- Outputs: no source files, logs, reports or artifacts published.'
          } >> "${GITHUB_STEP_SUMMARY}"
