name: KeelDock Cloud validation concern (protected)

# One concern on one operating system per call, on a clean ephemeral runner doing its own exact
# private checkout. No source-bearing artifact crosses a job boundary, so every concern restores and
# rebuilds what it needs. Suites are assigned by the rule scripts/run-tests.sh uses (a Testcontainers
# reference means a container runtime), so a new suite lands in a concern the day it is written.
#
#   build-format            Release build (warnings are errors), format check, structural-suite presence.
#   structural | unit       the architecture / compatibility / GraphQL composition suites | every other
#                           suite that needs no container runtime; each then checks the contracts diff.
#   db-containers           (Linux) every suite that references Testcontainers.
#   contracts-publish-smoke TypeScript contract check, publish of Api / Worker / Migrator, Migrator smoke
#                           and, on Linux, the Migrator against a digest-pinned PostgreSQL.
#   supply-chain            (Linux) vulnerable-package scan (warn-only unless the dispatch input
#                           vulnerability_gate is high or critical) and the CycloneDX SBOM with its
#                           denied-licence gate (SBOM_DENIED_LICENSES in the keeldock-restore composite).
#   apphost-cold-start      (Linux, opt-in) bounded Aspire AppHost cold start.
#
# This file owns everything that must run before project code (the protected call input, the token
# mint, the exact private checkout into src/, the identity check and the token revoke) and the
# job-level wiring. Everything after the revoke lives in the keeldock-* composites, one per concern
# plus the restore, summary and proof steps; the private source is checked out into src/ so the
# control plane's local composites stay available after the checkout.

on:
  workflow_call:
    secrets:
      SOURCE_READER_PRIVATE_KEY:
        description: Private key of the source-reader GitHub App for keeldock-cloud
        required: true
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private keeldock-cloud
        required: true
        type: string
      platform:
        description: linux, macos or windows
        required: true
        type: string
      environment:
        description: GitHub environment holding the source-reader App credential (source-read now; keeldock-source-read after the dedicated App exists)
        required: true
        type: string
      concern:
        description: build-format, structural, unit, db-containers, apphost-cold-start or contracts-publish-smoke
        required: true
        type: string
      vulnerability_gate:
        description: none (warn-only), high (fail on High and Critical advisories) or critical (fail on Critical only)
        required: false
        default: none
        type: string
      apphost:
        description: Whether the experimental apphost-cold-start concern may run (it is skipped otherwise)
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # The numeric id is what the identity check verifies, so a renamed or swapped repository fails.
  SOURCE_REPOSITORY_ID: '1377321992'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: keeldock-cloud
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CI: 'true'
  # Testcontainers' resource reaper, pinned by digest (the reference the source's own ci.yml pins). It
  # stays enabled: it removes containers when a test host is killed or times out.
  TESTCONTAINERS_RYUK_CONTAINER_IMAGE: testcontainers/ryuk:0.14.0@sha256:7c1a8a9a47c780ed0f983770a662f80deb115d95cce3e2daa3d12115b8cd28f0

jobs:
  validate:
    permissions:
      contents: read
    # The AppHost cold start is opt-in; a skipped job is "not requested", never a pass.
    if: ${{ inputs.concern != 'apphost-cold-start' || inputs.apphost }}
    name: KeelDock ${{ inputs.platform }} ${{ inputs.concern }}
    environment: ${{ inputs.environment }}
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || (inputs.platform == 'macos' && 'macos-15' || 'windows-2022') }}
    timeout-minutes: ${{ (inputs.concern == 'db-containers' || inputs.concern == 'apphost-cold-start') && 45 || 30 }}
    steps:
      - name: Start the concern timer
        shell: bash
        run: echo "CONCERN_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"

      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected call input
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          REQUESTED_CONCERN: ${{ inputs.concern }}
          REQUESTED_VULN_GATE: ${{ inputs.vulnerability_gate }}
          # This repository's own read-only job token, used only to read main's tip below.
          CONTROL_PLANE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || ( "${GITHUB_REF}" != "refs/heads/main" && "${GITHUB_REF}" != "refs/heads/untrusted" ) ]]; then
            echo 'keeldock-validation must run only from the protected main or untrusted branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi
          case "${REQUESTED_PLATFORM}" in linux|macos|windows) ;; *) echo "Unsupported platform: ${REQUESTED_PLATFORM}" >&2; exit 1 ;; esac
          case "${REQUESTED_CONCERN}" in
            build-format|structural|unit|contracts-publish-smoke) ;;
            db-containers|apphost-cold-start|supply-chain)
              if [[ "${REQUESTED_PLATFORM}" != linux ]]; then
                echo "${REQUESTED_CONCERN} runs on Linux only" >&2
                exit 1
              fi
              ;;
            *) echo "Unsupported concern: ${REQUESTED_CONCERN}" >&2; exit 1 ;;
          esac
          case "${REQUESTED_VULN_GATE}" in none|high|critical) ;; *) echo 'vulnerability_gate must be none, high or critical' >&2; exit 1 ;; esac
          # Ref isolation (the source-checkout composite's rule, inline as the KeelDock policy
          # requires): a run from untrusted must be running exactly main's reviewed workflows.
          if [[ "${GITHUB_REF}" == refs/heads/untrusted ]]; then
            main_sha="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${CONTROL_PLANE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/main" | jq -er '.sha')" \
              || { echo 'untrusted ref: the tip of main could not be read; refusing to continue' >&2; exit 1; }
            if [[ "${main_sha}" != "${GITHUB_SHA}" ]]; then
              echo "untrusted ref: this run's workflows (${GITHUB_SHA}) are not main's tip (${main_sha}); fast-forward untrusted to main, then dispatch again" >&2
              exit 1
            fi
          fi

      - name: Mint read-only private-source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true  # zizmor: ignore[github-app]

      - name: Check out exact private source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY_OWNER }}/${{ env.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          path: src
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify identity, exact checkout, and revoke source token
        id: verified-source
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          failed=0
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo 'No source token was minted; refusing to continue' >&2
            exit 1
          fi
          if ! identity="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
            echo 'The configured source repository identity could not be resolved' >&2
            failed=1
          elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
            echo 'The configured source repository identity did not match' >&2
            failed=1
          fi
          if ! checked_out_sha="$(git -C src rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"; then
            echo 'The private source checkout did not complete' >&2
            failed=1
          elif [[ "${checked_out_sha}" != "${requested_sha}" ]]; then
            echo 'The checked-out commit does not match source_sha' >&2
            failed=1
          fi
          if ! api_sha="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/${requested_sha}" | jq -er '.sha | ascii_downcase')" || [[ "${api_sha}" != "${requested_sha}" ]]; then
            echo 'The requested source SHA was not resolved from the configured repository' >&2
            failed=1
          fi
          # Protected ancestry (the same rule as the source-checkout composite, kept inline as the
          # KeelDock policy requires): the compare of <branch>...<sha> is `identical` or `behind`
          # exactly when the SHA is that branch's tip or an ancestor. Asked with the contents-read
          # token before it is revoked, so it is fixed before any project code runs. A missing
          # branch, an API error or anything else answers false (fail closed); it never fails
          # the validation itself. Only a protected SHA may save the NuGet cache.
          protected_ancestor=false
          if (( failed == 0 )); then
            for branch in develop uat main; do
              status="$(curl --fail --silent --retry 3 --retry-delay 2 --retry-max-time 30 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/compare/${branch}...${requested_sha}?per_page=1" 2>/dev/null | jq -r '.status // empty' 2>/dev/null || true)"
              if [[ "${status}" == identical || "${status}" == behind ]]; then
                protected_ancestor=true
                echo "protected ancestry: the source SHA is on ${branch}"
                break
              fi
            done
            [[ "${protected_ancestor}" == true ]] || echo 'protected ancestry: the source SHA is on no protected branch'
          fi
          # Ref isolation, fail-closed: main runs only protected-ancestry SHAs (see source-checkout).
          if [[ "${GITHUB_REF}" == refs/heads/main && "${failed}" -eq 0 && "${protected_ancestor}" != true ]]; then
            echo 'This source SHA is not on a protected branch of the source repository, so main refuses it.' >&2
            echo 'Dispatch it from the untrusted ref: gh workflow run keeldock-validation.yml --repo Moh-Bakr/Taurine-CI --ref untrusted -f source_sha=<sha>' >&2
            failed=1
          fi
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -X DELETE -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/installation/token"; then
            echo 'Source token revocation failed; refusing to execute project code' >&2
            failed=1
          fi
          unset SOURCE_TOKEN
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all credential.helper 2>/dev/null || true
          find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
          # Written after the clear above, and only ever the literal true or false.
          if [[ "${protected_ancestor}" == true ]]; then
            echo 'protected-ancestor=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'protected-ancestor=false' >> "${GITHUB_OUTPUT}"
          fi
          (( failed == 0 ))

      - name: Start the egress audit
        # Audit only: records outbound destinations, never blocks, never fails the job.
        continue-on-error: true
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/egress-audit  # zizmor: ignore[self-repository]
        with:
          phase: start

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK band comes from the source's own global.json.
          global-json-file: src/global.json

      - name: Set up Node
        if: inputs.concern == 'contracts-publish-smoke'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false

      # NuGet's downloaded third-party packages only (`~/.nuget/packages`): never bin/, obj/, publish
      # output or anything under the private source. The key hashes the lock files, revealing nothing
      # of their contents; one cache per OS serves every concern (all do the same locked restore). The
      # key is computed here, before project code, and the save reuses it (cache-primary-key).
      #
      # DISABLED (2026-10-05, findings H1 and M1): a cache write is authorised by the runner's runtime
      # token, which project code of ANY dispatched SHA can read (it has root on a hosted runner), and
      # every run is on ref main, so an unprotected SHA can plant main's entry directly. Re-hashing the
      # restored packages (below) defeats a tampered package, but not the archive itself: the cache action
      # extracts with `tar -P` relative to the workspace, so a planted archive can write files outside
      # the cached path. Restore and save carry a literal `false &&` (the cache policy enforces it) until
      # unprotected SHAs run from a separate ref whose cache scope main never reads.
      - name: Restore cached NuGet packages
        id: nuget-packages
        if: ${{ false && steps.verified-source.outcome == 'success' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'src/Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Every restored .nupkg is re-hashed (SHA-512, base64) and kept only when it equals the
      # contentHash packages.lock.json records for its id and version; the kept archives become a local
      # feed and everything else restored (the extracted folders and NuGet's own metadata) is deleted,
      # so the locked restore re-extracts each package from a verified archive and checks the lock hash
      # again itself (NU1403). Runs on a miss too, so the feed always exists.
      - name: Verify restored NuGet packages against the lock files
        id: nuget-verify
        uses: ./.github/actions/keeldock-nuget-verify  # zizmor: ignore[self-repository]
        with:
          cache-hit: ${{ steps.nuget-packages.outputs.cache-hit }}
          platform: ${{ inputs.platform }}

      # The Migrator proof runs the published program against a real PostgreSQL, the image and digest
      # the repository's own Testcontainers fixtures use (17.6, about 160 MB, under the 2 GB cap). Started
      # with `docker run` (a job-level `services:` block cannot be per concern), bound to loopback, with a
      # masked random one-run password. It is not removed at the end: Docker is closed to the job by
      # then (drop-root), and the hosted runner, container and volume included, is discarded with the job.
      - name: Start the pinned PostgreSQL for the Migrator proof
        if: inputs.platform == 'linux' && inputs.concern == 'contracts-publish-smoke'
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          echo "KD_PG_PASSWORD=${password}" >> "${GITHUB_ENV}"
          docker run --detach --name kd-postgres \
            --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_PASSWORD="${password}" --env POSTGRES_DB=keeldock \
            'postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929' >/dev/null
          # Ready over TCP (the image's init-time server listens on its socket only), waited for
          # here because Docker closes at drop-root below; the Migrator later reaches it on the
          # published loopback port.
          for _ in $(seq 1 60); do
            if docker exec kd-postgres pg_isready --host 127.0.0.1 --username postgres --dbname keeldock >/dev/null 2>&1; then
              echo 'postgres: started and ready (pinned by digest)'
              exit 0
            fi
            sleep 1
          done
          echo 'postgres: not ready after 60 s' >&2
          exit 1

      # The sub-steps below are one logical step per concern, split by responsibility. Each runs
      # regardless of the others (one that needs an earlier one is reported as skipped, never dropped);
      # full output stays in files under RUNNER_TEMP, and only a fixed reason per sub-step, the runner's
      # own per-suite totals and failing test names are published. Assertion text, stack traces and
      # source excerpts never leave the runner. The summary step fails the concern at the end.
      # Root goes here (finding H2), before the first project command (the solution restore runs
      # MSBuild over the private source). Docker goes with it, except for the two concerns whose
      # project code starts containers itself (Testcontainers, the Aspire AppHost): Docker access
      # is root-equivalent, so for those the summary records that root stays reachable.
      - name: Remove root before project code
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/drop-root  # zizmor: ignore[self-repository]
        with:
          keep-docker: ${{ inputs.concern == 'db-containers' || inputs.concern == 'apphost-cold-start' }}

      - name: Restore the solution and install the sub-step library
        uses: ./.github/actions/keeldock-restore  # zizmor: ignore[self-repository]
        with:
          local-feed: ${{ steps.nuget-verify.outputs.feed }}

      - name: Build and check formatting
        if: inputs.concern == 'build-format'
        uses: ./.github/actions/keeldock-build-format  # zizmor: ignore[self-repository]

      - name: Run the assigned test suites
        if: inputs.concern == 'structural' || inputs.concern == 'unit' || inputs.concern == 'db-containers'
        uses: ./.github/actions/keeldock-test-suites  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}

      - name: Scan vulnerable packages and generate the SBOM
        if: inputs.concern == 'supply-chain'
        uses: ./.github/actions/keeldock-supply-chain  # zizmor: ignore[self-repository]
        with:
          # Vulnerable-package gate, from the dispatch input: none (warn-only), high or critical.
          vulnerability-gate: ${{ inputs.vulnerability_gate }}

      - name: Cold start the Aspire AppHost
        if: inputs.concern == 'apphost-cold-start'
        uses: ./.github/actions/keeldock-apphost  # zizmor: ignore[self-repository]

      - name: Check contracts, publish and run the Migrator
        if: inputs.concern == 'contracts-publish-smoke'
        uses: ./.github/actions/keeldock-contracts-publish  # zizmor: ignore[self-repository]
        with:
          platform: ${{ inputs.platform }}

      - name: Publish the sub-step summary
        id: concern-summary
        uses: ./.github/actions/keeldock-summary  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}
          platform: ${{ inputs.platform }}

      # Disabled with the restore (see above). When re-enabled: saved only from main, only for a source
      # SHA on a protected keeldock-cloud branch (fixed before project code ran), only on a miss (a key
      # is written once), only after the verification and the whole concern passed, and under the key
      # computed before project code, never a hashFiles evaluated after it.
      - name: Save verified NuGet packages
        if: ${{ false && github.ref == 'refs/heads/main' && steps.verified-source.outputs.protected-ancestor == 'true' && steps.nuget-packages.outputs.cache-hit != 'true' && steps.nuget-verify.outcome == 'success' && steps.concern-summary.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.nuget/packages
          key: ${{ steps.nuget-packages.outputs.cache-primary-key }}

      - name: Publish sanitized validation proof
        if: always()
        uses: ./.github/actions/keeldock-proof  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}
          platform: ${{ inputs.platform }}
          source-sha: ${{ inputs.source_sha }}

      # Wall-clock time from the first step, excluding runner queue time.
      - name: Report concern duration
        if: ${{ always() }}
        shell: bash
        run: |
          [[ -n "${CONCERN_STARTED_AT:-}" ]] || exit 0
          e=$(( $(date +%s) - CONCERN_STARTED_AT )); printf '### Concern duration\n\n%dm%02ds from the first step, excluding runner queue time.\n' $((e / 60)) $((e % 60)) >> "${GITHUB_STEP_SUMMARY}"

      - name: Report observed egress
        if: always()
        continue-on-error: true
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/egress-audit  # zizmor: ignore[self-repository]
        with:
          phase: report
