name: KeelDock Cloud validation concern (protected)

# One concern on one operating system per call, on a clean ephemeral runner doing its
# own exact private checkout. No source-bearing artifact or output crosses a job
# boundary, matching the rule the Taurine concerns already follow, so every concern
# restores and rebuilds what it needs.
#
# Concerns (all three operating systems unless stated):
#   build-format            whole-solution Release build (warnings are errors, so every
#                           analyzer gate) and `dotnet format --verify-no-changes`.
#   structural              architecture, contract-compatibility and GraphQL composition /
#                           SDL-snapshot suites, then the generated-contract diff.
#   unit                    every other suite that needs no container runtime.
#   db-containers           (Linux only) every suite that references Testcontainers; the
#                           Docker daemon only the Ubuntu runner has.
#   contracts-publish-smoke generated TypeScript contract check, publish of Api / Worker /
#                           Migrator, and the Migrator smoke.
#
# Suites are assigned by the same rule scripts/run-tests.sh uses to classify them (a
# Testcontainers package reference means a container runtime), so a new suite lands in a
# concern the day it is written: container suites in db-containers, the three named
# structural suites in structural, everything else in unit. None can be assigned to no
# concern, and build-format fails if a named structural suite disappears.

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private keeldock-cloud
        required: true
        type: string
      platform:
        description: linux, macos or windows
        required: true
        type: string
      concern:
        description: build-format, structural, unit, db-containers or contracts-publish-smoke
        required: true
        type: string

permissions:
  contents: read

env:
  # A different private source from the Taurine concerns. The numeric id is what
  # the identity check below actually verifies, so a repository renamed or
  # swapped underneath this workflow fails rather than being silently accepted.
  SOURCE_REPOSITORY_ID: '1377321992'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: keeldock-cloud
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  CI: 'true'

jobs:
  validate:
    name: KeelDock ${{ inputs.platform }} ${{ inputs.concern }}
    environment: source-read
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-24.04' || (inputs.platform == 'macos' && 'macos-15' || 'windows-2022') }}
    # db-containers pulls and starts PostgreSQL containers per suite; every other
    # concern is a build plus a handful of in-process suites.
    timeout-minutes: ${{ inputs.concern == 'db-containers' && 45 || 30 }}
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected call input
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_PLATFORM: ${{ inputs.platform }}
          REQUESTED_CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'keeldock-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi
          case "${REQUESTED_PLATFORM}" in
            linux|macos|windows) ;;
            *) echo "Unsupported platform: ${REQUESTED_PLATFORM}" >&2; exit 1 ;;
          esac
          case "${REQUESTED_CONCERN}" in
            build-format|structural|unit|contracts-publish-smoke) ;;
            db-containers)
              if [[ "${REQUESTED_PLATFORM}" != linux ]]; then
                echo 'db-containers needs a Linux container runtime' >&2
                exit 1
              fi
              ;;
            *) echo "Unsupported concern: ${REQUESTED_CONCERN}" >&2; exit 1 ;;
          esac

      - name: Mint read-only private-source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          # The source-reader app installation must include keeldock-cloud. If it
          # does not, this step fails here — before any checkout — rather than
          # producing a confusing empty working directory later.
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact private source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY_OWNER }}/${{ env.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          # Full history, unlike the Taurine concerns: the SDL snapshot gate runs
          # `git diff --exit-code`, which needs a working index against the
          # checked-out commit. fetch-depth 1 still provides that, but the
          # snapshot check also reports the commit, so the ref must be exact.
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify identity, exact checkout, and revoke source token
        if: always()
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          failed=0
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo 'No source token was minted; refusing to continue' >&2
            exit 1
          fi
          if ! identity="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
            echo 'The configured source repository identity could not be resolved' >&2
            failed=1
          elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
            echo 'The configured source repository identity did not match' >&2
            failed=1
          fi
          if ! checked_out_sha="$(git rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"; then
            echo 'The private source checkout did not complete' >&2
            failed=1
          elif [[ "${checked_out_sha}" != "${requested_sha}" ]]; then
            echo 'The checked-out commit does not match source_sha' >&2
            failed=1
          fi
          if ! api_sha="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/${requested_sha}" | jq -er '.sha | ascii_downcase')" || [[ "${api_sha}" != "${requested_sha}" ]]; then
            echo 'The requested source SHA was not resolved from the configured repository' >&2
            failed=1
          fi
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -X DELETE -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/installation/token"; then
            echo 'Source token revocation failed; refusing to execute project code' >&2
            failed=1
          fi
          unset SOURCE_TOKEN
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all credential.helper 2>/dev/null || true
          find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
          (( failed == 0 ))


      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # The SDK band is pinned by the source's own global.json, so the
          # toolchain is decided by the commit under test, not by this workflow.
          global-json-file: global.json

      - name: Set up Node
        if: inputs.concern == 'contracts-publish-smoke'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # One step, every sub-step reported. Each sub-step runs regardless of the others (one
      # that structurally needs an earlier one is reported as skipped, never silently
      # dropped), the full output of each is kept in files under RUNNER_TEMP that are never
      # printed, and only three kinds of text are published: a fixed reason per sub-step,
      # the per-suite totals the runner itself printed, and the names of failing tests.
      # Assertion text, stack traces and source excerpts never leave the runner. The
      # concern fails at the end, with the table.
      - name: Validate every sub-step
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          CONCERN: ${{ inputs.concern }}
        run: |
          set -uo pipefail

          results="${RUNNER_TEMP}/substeps.tsv"
          suite_rows="${RUNNER_TEMP}/suite-totals.tsv"
          failed_names="${RUNNER_TEMP}/failed-tests.tsv"
          : > "${results}"; : > "${suite_rows}"; : > "${failed_names}"
          any_failed=0

          strip_ansi() { sed -E $'s/\033\\[[0-9;]*[[:alpha:]]//g'; }

          # Compiler, NuGet and npm diagnostic identifiers (CS0103, NU1004, MSB3073,
          # EINTEGRITY ...) are public catalogue codes: they name the class of failure and
          # carry no source. The message after the code does, so it is never published.
          diag_codes() {
            {
              strip_ansi < "$1" | grep -oE '(error|warning) [A-Z]{2,5}[0-9]{3,5}' | awk '{ print $2 }'
              strip_ansi < "$1" | grep -oE '^npm (ERR!|error) code [A-Z0-9_]+' | awk '{ print $4 }'
            } | sort | uniq -c | sort -rn | head -12 | awk '{ printf "%s%s x%s", (NR > 1 ? ", " : ""), $2, $1 }'
          }

          record() { printf '%s\t%s\t%s\n' "$1" "$2" "$3" >> "${results}"; }
          passed() { awk -F'\t' -v l="$1" '$1 == l && $2 == "pass" { f = 1 } END { exit !f }' "${results}"; }

          # Runs one sub-step with its output captured to a file. Never fails the script:
          # the outcome is recorded and the concern fails at the end.
          sub_step() {
            local label="$1" reason_fn="$2"; shift 2
            local log="${RUNNER_TEMP}/${label}.log" reason
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
              record "${label}" pass '-'
            else
              reason="$("${reason_fn}" "${log}")"
              echo "${label}: failed (${reason}; output withheld)" >&2
              record "${label}" FAIL "${reason}"
              any_failed=1
            fi
          }
          skip_step() {
            echo "$1: skipped (${2})"
            record "$1" skipped "$2"
            any_failed=1
          }

          reason_restore() {
            local codes; codes="$(diag_codes "$1")"
            if grep -q 'NU1004' "$1"; then echo "lock file out of date with the projects (${codes})"
            elif grep -q 'NU1403' "$1"; then echo "package content hash differs from the lock file (${codes})"
            else echo "restore failed (diagnostic ids: ${codes:-none})"; fi
          }
          reason_text() { head -c 300 "$1" | tr '\n' ' '; }
          reason_npm() { echo "npm ci diagnostic ids: $(diag_codes "$1" || true)"; }
          reason_build() { echo "build diagnostic ids: $(diag_codes "$1" || true)"; }
          reason_publish() { echo "publish diagnostic ids: $(diag_codes "$1" || true)"; }
          reason_format() { echo 'formatting drift (run dotnet format) or the formatter could not run'; }
          reason_typescript() { echo 'generated TypeScript contract differs from the committed files, or does not typecheck'; }
          reason_smoke() { echo 'Migrator failed for an unexpected reason or reported success with no database'; }
          reason_contracts() { echo "generated contracts differ from the commit ($(grep -c . "$1") area(s) changed; regenerate and commit)"; }

          # ---- Suite assignment ----------------------------------------------------------
          # The rule scripts/run-tests.sh uses: a suite needs a container runtime exactly
          # when its project references Testcontainers. Matched on the package reference
          # itself, not the bare word.
          needs_docker() { grep -Eq '<PackageReference[^>]+Include="Testcontainers' "$1"; }
          structural_suites=' KeelDock.Cloud.ArchitectureTests KeelDock.Cloud.CompatibilityTests KeelDock.Cloud.GraphQLCompositionTests '
          suite_concern() {
            local name; name="$(basename "$1" .csproj)"
            if needs_docker "$1"; then echo db-containers
            elif [[ "${structural_suites}" == *" ${name} "* ]]; then echo structural
            else echo unit; fi
          }
          structural_present() {
            local name p found=0
            for name in ${structural_suites}; do
              found=0
              while IFS= read -r p; do
                if [[ "$(basename "${p}" .csproj)" == "${name}" && "$(suite_concern "${p}")" == structural ]]; then found=1; fi
              done < <(find tests -name '*.csproj')
              if [[ "${found}" -eq 0 ]]; then echo "structural suite ${name} is missing or now needs a container runtime"; return 1; fi
            done
          }

          sub_step restore reason_restore dotnet restore KeelDock.Cloud.slnx --locked-mode

          case "${CONCERN}" in
            build-format)
              if passed restore; then
                sub_step build reason_build dotnet build KeelDock.Cloud.slnx --no-restore --nologo -v quiet --configuration Release
              else
                skip_step build 'restore failed'
              fi
              if passed build; then
                sub_step format reason_format dotnet format KeelDock.Cloud.slnx --verify-no-changes --no-restore
              else
                skip_step format 'build did not pass'
              fi
              sub_step suite-assignment reason_text structural_present
              ;;

            structural|unit|db-containers)
              selected=()
              while IFS= read -r project; do
                if [[ "$(suite_concern "${project}")" == "${CONCERN}" ]]; then selected+=("${project}"); fi
              done < <(find tests -name '*.csproj' | sort)
              echo "${CONCERN}: ${#selected[@]} suite(s) assigned"
              if [[ "${#selected[@]}" -eq 0 ]]; then
                record suites FAIL 'no suite is assigned to this concern (discovery is broken)'
                echo 'suites: failed (no suite is assigned to this concern; discovery is broken)' >&2
                any_failed=1
              else
                if [[ "${CONCERN}" == structural ]]; then sub_step suite-assignment reason_text structural_present; fi

                build_suites() {
                  local project
                  for project in "${selected[@]}"; do
                    dotnet build "${project}" --no-restore --nologo -v quiet --configuration Release || return 1
                  done
                }
                if passed restore; then
                  sub_step build reason_build build_suites
                else
                  skip_step build 'restore failed'
                fi

                if passed build; then
                  suites_total=0; suites_failed=0
                  for project in "${selected[@]}"; do
                    name="$(basename "${project}" .csproj)"
                    log="${RUNNER_TEMP}/suite-${name}.log"
                    clean="${log}.clean"
                    dotnet run --project "${project}" --no-build --configuration Release >"${log}" 2>&1
                    rc=$?
                    strip_ansi < "${log}" | tr -d '\r' > "${clean}"
                    # The last total / failed the runner printed. Colour escapes are stripped
                    # first: the runner colours its summary on a hosted runner and not on a
                    # redirected local stream, which made an anchored match environment-dependent.
                    total="$(grep -oE '^[[:space:]]*total:[[:space:]]*[0-9]+' "${clean}" | tail -1 | grep -oE '[0-9]+$' || true)"
                    failed="$(grep -oE '^[[:space:]]*failed:[[:space:]]*[0-9]+' "${clean}" | tail -1 | grep -oE '[0-9]+$' || true)"
                    # A suite that ran no tests is not a suite that passed: a project whose
                    # tests stopped being discovered reports total 0 and a zero exit code.
                    if [[ -z "${total}" || -z "${failed}" ]]; then
                      result=FAIL; reason='no test summary printed (crash, timeout or build output only)'; total='-'; failed='-'
                    elif [[ "${total}" -eq 0 ]]; then
                      result=FAIL; reason='0 tests discovered; an empty suite is not a passing suite'
                    elif [[ "${failed}" -gt 0 ]]; then
                      result=FAIL; reason="${failed} of ${total} tests failed"
                    elif [[ "${rc}" -ne 0 ]]; then
                      result=FAIL; reason="exit code ${rc} with no failing test"
                    else
                      result=pass; reason='-'
                    fi
                    printf '%s\t%s\t%s\t%s\t%s\n' "${name}" "${result}" "${total}" "${failed}" "${reason}" >> "${suite_rows}"
                    # Failing test identities only: the fully qualified test name, with
                    # theory arguments cut off and every character outside a conservative
                    # identifier set replaced. The assertion text after each name is never read.
                    awk -v suite="${name}" '
                      /^failed / { line = $0; sub(/^failed /, "", line)
                                   sub(/ \([0-9.]+ ?(ms|s|m|h)[^)]*\)$/, "", line)
                                   sub(/\(.*$/, "", line)
                                   gsub(/[^A-Za-z0-9_.+<>,-]/, "?", line)
                                   print suite "\t" substr(line, 1, 200) }
                    ' "${clean}" | head -20 >> "${failed_names}"
                    suites_total=$((suites_total + 1))
                    if [[ "${result}" == pass ]]; then
                      echo "suite ${name}: passed (${total} tests)"
                    else
                      suites_failed=$((suites_failed + 1))
                      echo "suite ${name}: failed (${reason})" >&2
                    fi
                    rm -f "${log}" "${clean}"
                  done
                  if [[ -s "${failed_names}" ]]; then
                    echo 'failing tests (names only):' >&2
                    head -60 "${failed_names}" | awk -F'\t' '{ print "  " $2 }' >&2
                  fi
                  if [[ "${suites_failed}" -eq 0 ]]; then
                    record test-suites pass '-'
                    echo "test-suites: passed (${suites_total} suites)"
                  else
                    record test-suites FAIL "${suites_failed} of ${suites_total} suites failed"
                    any_failed=1
                  fi
                else
                  skip_step test-suites 'build did not pass'
                fi
                # The snapshot and fixture tests write their baseline when it is missing and
                # report skipped rather than passing, so a contributor who regenerated and
                # forgot to commit would otherwise get a green build. Checked, never printed.
                contracts_diff() {
                  if git diff --quiet -- contracts/; then return 0; fi
                  git diff --name-only -- contracts/ | awk -F/ '{ print $2 }' | sort | uniq -c
                  return 1
                }
                sub_step contracts-committed reason_contracts contracts_diff
              fi
              ;;

            contracts-publish-smoke)
              # Installed before the check: the generated TypeScript is verified only when
              # node_modules exists, and skipped is not passed.
              sub_step typescript-install reason_npm npm --prefix tools/graphql-codegen ci
              if passed typescript-install; then
                sub_step typescript-contract reason_typescript npm --prefix tools/graphql-codegen run verify --silent
              else
                skip_step typescript-contract 'npm ci failed'
              fi
              # The publish runs --no-restore, so it needs the restore.
              for host in Api Worker Migrator; do
                if passed restore; then
                  sub_step "publish-${host}" reason_publish dotnet publish "src/Hosts/KeelDock.Cloud.${host}" \
                    --no-restore --configuration Release --output "${RUNNER_TEMP}/publish/${host}"
                else
                  skip_step "publish-${host}" 'restore failed'
                fi
              done
              # With no connection string configured the Migrator must fail loudly and by
              # name. It is the cheapest possible check that the published artifact is the
              # program we think it is.
              migrator_smoke() {
                local output rc
                output="$(dotnet "${RUNNER_TEMP}/publish/Migrator/KeelDock.Cloud.Migrator.dll" 2>&1)"
                rc=$?
                if [[ "${rc}" -eq 0 ]]; then return 10; fi
                grep -q 'owner connection string' <<<"${output}" || return 11
              }
              if passed publish-Migrator; then
                sub_step migrator-smoke reason_smoke migrator_smoke
              else
                skip_step migrator-smoke 'Migrator publish did not pass'
              fi
              ;;
          esac

          # ---- Summary: sub-step table, per-suite totals, failing test names -------------
          {
            echo "### ${CONCERN} sub-steps — ${PLATFORM}"
            echo
            echo '| Sub-step | Result | Reason |'
            echo '|---|---|---|'
            while IFS=$'\t' read -r label result reason; do
              echo "| \`${label}\` | ${result} | ${reason} |"
            done < "${results}"
            echo
            if [[ -s "${suite_rows}" ]]; then
              echo "### Suites — ${CONCERN} on ${PLATFORM}"
              echo
              echo '| Suite | Result | Tests | Failed | Reason |'
              echo '|---|---|---:|---:|---|'
              while IFS=$'\t' read -r name result total failed reason; do
                echo "| \`${name}\` | ${result} | ${total} | ${failed} | ${reason} |"
              done < "${suite_rows}"
              awk -F'\t' '$3 != "-" { t += $3; f += $4 } END { printf "\n**%d tests, %d failed.**\n", t, f }' "${suite_rows}"
            fi
            if [[ -s "${failed_names}" ]]; then
              echo
              echo '### Failing tests (names only)'
              echo
              while IFS=$'\t' read -r suite test; do
                echo "- \`${suite}\`: \`${test}\`"
              done < "${failed_names}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          if [[ "${any_failed}" -ne 0 ]]; then
            echo "${CONCERN}: failed (one or more sub-steps failed or were skipped; each is listed above)" >&2
            exit 1
          fi

      - name: Publish sanitized validation proof
        if: always()
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          PLATFORM: ${{ inputs.platform }}
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          results="${RUNNER_TEMP}/substeps.tsv"
          # A claim is printed only when the sub-step that proves it passed; a run that
          # failed or never started must not read like a clean one.
          proved() { [[ -f "${results}" ]] && awk -F'\t' -v l="$1" '$1 == l && $2 == "pass" { f = 1 } END { exit !f }' "${results}"; }
          {
            echo "## KeelDock Cloud — ${CONCERN} — ${PLATFORM}"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo "- Runner: \`${RUNNER_OS}\` / \`${RUNNER_ARCH}\`"
            proved restore && echo '- Restore was locked.'
            case "${CONCERN}" in
              build-format)
                proved build && echo '- Whole-solution build was Release with warnings as errors.'
                proved format && echo '- Formatting verified.'
                proved suite-assignment && echo '- Every named structural suite exists and needs no container runtime.'
                ;;
              structural|unit)
                proved build && echo '- Suite projects built in Release.'
                proved test-suites && echo "- Every ${CONCERN} suite passed."
                proved contracts-committed && echo '- Generated contracts match what is committed.'
                ;;
              db-containers)
                proved build && echo '- Suite projects built in Release.'
                proved test-suites && echo '- Every container-backed suite passed against real PostgreSQL started through Testcontainers.'
                proved contracts-committed && echo '- Generated contracts match what is committed.'
                ;;
              contracts-publish-smoke)
                proved typescript-contract && echo '- Generated TypeScript contract is current and typechecks.'
                if proved publish-Api && proved publish-Worker && proved publish-Migrator; then
                  echo '- API, Worker and Migrator published.'
                fi
                proved migrator-smoke && echo '- Migrator smoke passed.'
                ;;
            esac
            echo '- Source token: revoked before any project code executed.'
            echo '- Outputs: no source files, logs, reports or artifacts published; failing test names only.'
          } >> "${GITHUB_STEP_SUMMARY}"
