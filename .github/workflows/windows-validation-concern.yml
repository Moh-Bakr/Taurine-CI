name: Windows app validation concern (protected)

# This reusable workflow intentionally contains only app/platform concerns.
# Full orchestrate skill verification is owned by the protected Ubuntu
# orchestrate-validation workflow; macOS continues to provide a cross-platform
# skill smoke check. Keeping the process-heavy release verifier off Windows
# avoids a duplicate native-process suite without weakening required coverage.

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      concern:
        description: Independent validation concern to execute
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  validate:
    name: Windows ${{ inputs.concern }}
    environment: source-read
    runs-on: windows-2022
    # The TypeScript concerns stay on the reviewed 60. The Rust concerns compile
    # their closure cold, because compiled output is never cached in this
    # control plane (only third-party crate sources are):
    # `rust-app` carries DuckDB's C++ amalgamation, Tauri and over a hundred
    # test binaries (about 40 minutes on the Linux runner, and MSVC is slower),
    # `rust-db` the drivers' offline suites, and `rust-ovpn` builds OpenSSL,
    # jsoncpp, lz4, fmt and xxhash from source through vcpkg before it compiles
    # openvpn3 (the private notes record roughly 23 minutes for that alone).
    timeout-minutes: ${{ inputs.concern == 'rust-app' && 150 || (inputs.concern == 'rust-db' || inputs.concern == 'rust-ovpn') && 120 || startsWith(inputs.concern, 'rust-') && 90 || 60 }}
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected dispatch input
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'windows-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Mint read-only private-source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact private source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY_OWNER }}/${{ env.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify identity, exact checkout, and revoke source token
        if: always()
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          failed=0
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo 'No source token was minted; refusing to continue' >&2
            exit 1
          fi
          if ! identity="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
            echo 'The configured source repository identity could not be resolved' >&2
            failed=1
          elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
            echo 'The configured source repository identity did not match' >&2
            failed=1
          fi
          if ! checked_out_sha="$(git rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"; then
            echo 'The private source checkout did not complete' >&2
            failed=1
          elif [[ "${checked_out_sha}" != "${requested_sha}" ]]; then
            echo 'The checked-out commit does not match source_sha' >&2
            failed=1
          fi
          if ! api_sha="$(curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/${requested_sha}" | jq -er '.sha | ascii_downcase')" || [[ "${api_sha}" != "${requested_sha}" ]]; then
            echo 'The requested source SHA was not resolved from the configured repository' >&2
            failed=1
          fi
          if ! curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-max-time 60 --retry-all-errors -X DELETE -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/installation/token"; then
            echo 'Source token revocation failed; refusing to execute project code' >&2
            failed=1
          fi
          unset SOURCE_TOKEN
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all credential.helper 2>/dev/null || true
          find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
          (( failed == 0 ))

      - name: Normalize private source line endings
        shell: bash
        run: |
          set -euo pipefail
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --all --force
          git ls-files -z -- \
            '*.c' '*.cc' '*.cpp' '*.css' '*.csv' '*.h' '*.html' '*.ini' \
            '*.java' '*.js' '*.json' '*.mjs' '*.md' '*.rs' '*.sh' '*.sql' \
            '*.toml' '*.ts' '*.tsx' '*.txt' '*.vue' '*.yml' '*.yaml' |
            xargs -0 -r sed -i 's/\r$//'

      # The Rust concerns need no node_modules, so they skip Node and the three
      # `npm ci` runs, as the Linux ones do. They still need the vendor fetch
      # (their own step below): the workspace root path-depends on
      # vendor/boringtun, and no cargo command loads without it.
      - name: Set up the pinned Node.js release
        if: ${{ !startsWith(inputs.concern, 'rust-') }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Install locked JavaScript dependencies
        if: ${{ !startsWith(inputs.concern, 'rust-') }}
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"
            shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              local reason='command returned non-zero'
              if grep -Eiq '(^|[^[:alnum:]])(command not found|is not recognized)' "${log}"; then
                reason='missing command'
              elif grep -Eiq '(^|[^[:alnum:]])(cannot find module|module not found|no such file or directory)' "${log}"; then
                reason='missing dependency or file'
              elif grep -Eiq 'typescript|ts[0-9]{4}|type error' "${log}"; then
                reason='TypeScript compilation failure'
              elif grep -Eiq 'out of memory|heap out of memory|JavaScript heap' "${log}"; then
                reason='memory exhaustion'
              elif grep -Eiq 'vendor-openvpn3:|fatal:|sha256|does not apply|could not download' "${log}"; then
                reason='pinned vendor fetch or verification failure'
              elif grep -Eiq 'test failed|assertion|failed [0-9]+ test|vitest' "${log}"; then
                reason='test failure'
              fi
              echo "${label}: failed (${reason}; detailed output withheld)" >&2
              if [[ "${label}" == desktop-tests-* || "${label}" == mobile-tests || "${label}" == dashboard-contracts || "${label}" == orchestrate-verification ]]; then
                # The keyword grep below can match a vitest, Jest, or node
                # --test code-frame line whose quoted source happens to
                # contain a keyword, which would publish a private
                # test-source line. The excerpt shapes are therefore dropped
                # before the allow-list: a numbered source line
                # (`12 | code`), the babel/vitest code-frame form whose
                # failing line is marked with a `>` gutter (`> 12 | code`),
                # a caret/underline annotation (`| ^^^^`, `| ___^`, `| |___`),
                # and the bare separator (`|`). The assertion library's own
                # expected/received VALUE lines and pass/fail headers are
                # test expectations, not app source, so they are the
                # publishable diagnostic and stay; only the adjacent raw
                # source lines are removed. Location lines carry no source
                # text and survive.
                strip_excerpts() {
                  sed -E '/^[[:space:]]*([>][[:space:]]*)?[0-9]+[[:space:]]*[|]/d;
                          /^[[:space:]]*[|][[:space:]]*[_^|+>-]/d;
                          /^[[:space:]]*[|][[:space:]]*$/d'
                }
                sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' "${log}" |
                  sed -E 's#([A-Za-z]:)?\\[^ ]+#<private-path>#g; s#/Users/[^ ]+#<private-path>#g; s#/home/runner/work/[^ ]+#<private-path>#g' |
                  strip_excerpts |
                  grep -Ei '(FAIL|PASS|Test Files|Tests|Snapshots|Time|Assertion|Error:|expected|received|timed out|unhandled|ENOENT|EACCES|EPERM|not ok)' |
                  head -20 >&2 || true
              fi
              exit 1
            fi
          }
          run_quiet npm-root npm ci --include=optional --ignore-scripts
          run_quiet npm-desktop npm --prefix taurine-desktop ci --include=optional --ignore-scripts
          run_quiet npm-mobile npm --prefix taurine-mobile ci --include=optional --ignore-scripts

      - name: Set up the Rust toolchain and native dependencies
        if: ${{ startsWith(inputs.concern, 'rust-') }}
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo --version

          # Everything here comes from the runner image or from one pinned fallback, and
          # nothing is fetched from an unreviewed source.
          #
          # libclang: taurine-scripting's rquickjs `bindgen` feature needs libclang.dll at
          # build-script runtime. The windows-2022 image ships LLVM; if a future image
          # stops doing so, the pinned Chocolatey package is the fallback rather than a
          # floating install.
          llvm_bin='/c/Program Files/LLVM/bin'
          if [[ ! -f "${llvm_bin}/libclang.dll" ]]; then
            choco install llvm --version=18.1.8 --no-progress -y
          fi
          [[ -f "${llvm_bin}/libclang.dll" ]] || { echo 'libclang.dll is unavailable' >&2; exit 1; }

          # Same settings as the Linux crate-test concerns, about the runner not the code:
          # no incremental state, no debug info for tests and their dependencies, and
          # `target/` off the workspace drive. The workspace sits on D:, the small
          # scratch drive, and `rust-app`/`rust-db` compile closures that would fill it;
          # C: has the room. A short path also keeps deep build-script output clear of
          # the 260-character limit. It stays on this ephemeral runner like everything
          # else here and is never uploaded.
          mkdir -p /c/ct
          {
            printf '%s\n' 'LIBCLANG_PATH=C:\Program Files\LLVM\bin'
            echo 'CARGO_INCREMENTAL=0'
            echo 'CARGO_PROFILE_DEV_DEBUG=0'
            echo 'CARGO_PROFILE_TEST_DEBUG=0'
            printf '%s\n' 'CARGO_TARGET_DIR=C:\ct'
            # vcpkg's own telemetry, off: Taurine is telemetry-free and so is its CI.
            echo 'VCPKG_DISABLE_METRICS=1'
          } >> "${GITHUB_ENV}"
          df -h /c /d 2>/dev/null || df -h

      - name: Fetch pinned vendored sources
        if: ${{ startsWith(inputs.concern, 'rust-') }}
        shell: bash
        env:
          GIT_CONFIG_COUNT: '2'
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
          GIT_CONFIG_KEY_1: core.longpaths
          GIT_CONFIG_VALUE_1: 'true'
        run: |
          set -euo pipefail
          # `fetch` verifies each download against the sha256 pinned in vendor.lock and
          # applies the reviewed boringtun zeroize patch, so this is a supply-chain check
          # as much as a prerequisite. The environment below keeps the vendored trees
          # byte-identical to what upstream ships: Git for Windows would otherwise check
          # openvpn3-core and tap-windows out with CRLF line endings, which no test and
          # no pinned patch was written against.
          if ! bash scripts/vendor-openvpn3.sh fetch >"${RUNNER_TEMP}/vendor-fetch.log" 2>&1; then
            echo 'vendor-fetch: failed (detailed output withheld)' >&2
            exit 1
          fi
          echo 'vendor-fetch: passed'

      # Third-party crate sources only: cargo's registry index, the downloaded
      # `.crate` archives and the git dependency databases. Never `target/`, never
      # an extracted source tree, never anything under the checked-out private
      # source, so no compiled or private code ever enters a cache. The key is the
      # OS, the concern and a hash of the private Cargo.lock files, which reveals
      # nothing about their contents.
      - name: Locate Cargo home for the third-party source cache
        id: cargo-home
        if: ${{ startsWith(inputs.concern, 'rust-') }}
        shell: bash
        run: |
          set -euo pipefail
          dir="${CARGO_HOME:-${HOME}/.cargo}"
          if command -v cygpath >/dev/null 2>&1; then
            dir="$(cygpath -m "${dir}")"
          fi
          echo "dir=${dir}" >> "${GITHUB_OUTPUT}"

      - name: Restore cached third-party crate sources
        id: cargo-sources
        if: ${{ startsWith(inputs.concern, 'rust-') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cargo-home.outputs.dir }}/registry/index
            ${{ steps.cargo-home.outputs.dir }}/registry/cache
            ${{ steps.cargo-home.outputs.dir }}/git/db
          key: cargo-sources-${{ runner.os }}-${{ inputs.concern }}-${{ hashFiles('Cargo.lock', 'taurine-backend/*/Cargo.lock', 'taurine-backend/vendor/*/Cargo.lock', 'vendor/*/Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-${{ inputs.concern }}-

      # Defence in depth: do not rely on cargo alone to notice a tampered archive.
      # Every restored `.crate` must hash to the checksum recorded for it in a
      # private Cargo.lock; anything that does not match, or is not in a lock at
      # all, is deleted before cargo runs. Only counts are printed.
      - name: Verify restored crate archives against Cargo.lock
        if: ${{ startsWith(inputs.concern, 'rust-') }}
        shell: bash
        env:
          CARGO_SOURCES_DIR: ${{ steps.cargo-home.outputs.dir }}
          CACHE_HIT: ${{ steps.cargo-sources.outputs.cache-hit }}
          OS_LABEL: Windows
        run: |
          set -euo pipefail
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          expected="${RUNNER_TEMP}/crate-checksums.txt"
          : > "${expected}"
          while IFS= read -r lock; do
            tr -d '\r' < "${lock}" | awk '
              /^\[\[package\]\]/ { n = ""; v = ""; next }
              /^name = /     { gsub(/"/, "", $3); n = $3 }
              /^version = /  { gsub(/"/, "", $3); v = $3 }
              /^checksum = / { gsub(/"/, "", $3); if (n != "" && v != "") print n "-" v ".crate " $3 }
            ' >> "${expected}"
          done < <(find . -name Cargo.lock -not -path '*/node_modules/*' -not -path '*/target/*')
          kept=0
          dropped=0
          cache_dir="${CARGO_SOURCES_DIR}/registry/cache"
          if [[ -d "${cache_dir}" ]]; then
            find "${cache_dir}" -type f ! -name '*.crate' -delete
            while IFS= read -r -d '' crate; do
              want="$(awk -v f="$(basename "${crate}")" '$1 == f { print $2; exit }' "${expected}")"
              if [[ -n "${want}" && "$(sha256_of "${crate}")" == "${want}" ]]; then
                kept=$((kept + 1))
              else
                rm -f "${crate}"
                dropped=$((dropped + 1))
              fi
            done < <(find "${cache_dir}" -type f -name '*.crate' -print0)
          fi
          case "${CACHE_HIT}" in
            true) state='exact hit' ;;
            false) state='restored from an earlier lockfile' ;;
            *) state='miss' ;;
          esac
          echo "cargo-sources: ${state}; ${kept} archives verified, ${dropped} dropped"
          echo "- ${OS_LABEL} Cargo source cache: ${state} (${kept} verified, ${dropped} dropped)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run isolated validation concern
        if: ${{ !startsWith(inputs.concern, 'rust-') }}
        shell: bash
        env:
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"
            shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              local reason='command returned non-zero'
              if grep -Eiq '(^|[^[:alnum:]])(command not found|is not recognized)' "${log}"; then reason='missing command'
              elif grep -Eiq '(^|[^[:alnum:]])(cannot find module|module not found|no such file or directory)' "${log}"; then reason='missing dependency or file'
              elif grep -Eiq 'typescript|ts[0-9]{4}|type error' "${log}"; then reason='TypeScript compilation failure'
              elif grep -Eiq 'out of memory|heap out of memory|JavaScript heap' "${log}"; then reason='memory exhaustion'
              elif grep -Eiq 'vendor-openvpn3:|fatal:|sha256|does not apply|could not download' "${log}"; then reason='pinned vendor fetch or verification failure'
              elif grep -Eiq 'test failed|assertion|failed [0-9]+ test|vitest' "${log}"; then reason='test failure'; fi
              echo "${label}: failed (${reason}; detailed output withheld)" >&2
              if [[ "${label}" == desktop-tests-* || "${label}" == mobile-tests || "${label}" == dashboard-contracts || "${label}" == orchestrate-verification ]]; then
                # The keyword grep below can match a vitest, Jest, or node
                # --test code-frame line whose quoted source happens to
                # contain a keyword, which would publish a private
                # test-source line. The excerpt shapes are therefore dropped
                # before the allow-list: a numbered source line
                # (`12 | code`), the babel/vitest code-frame form whose
                # failing line is marked with a `>` gutter (`> 12 | code`),
                # a caret/underline annotation (`| ^^^^`, `| ___^`, `| |___`),
                # and the bare separator (`|`). The assertion library's own
                # expected/received VALUE lines and pass/fail headers are
                # test expectations, not app source, so they are the
                # publishable diagnostic and stay; only the adjacent raw
                # source lines are removed. Location lines carry no source
                # text and survive.
                strip_excerpts() {
                  sed -E '/^[[:space:]]*([>][[:space:]]*)?[0-9]+[[:space:]]*[|]/d;
                          /^[[:space:]]*[|][[:space:]]*[_^|+>-]/d;
                          /^[[:space:]]*[|][[:space:]]*$/d'
                }
                sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' "${log}" |
                  sed -E 's#([A-Za-z]:)?\\[^ ]+#<private-path>#g; s#/Users/[^ ]+#<private-path>#g; s#/home/runner/work/[^ ]+#<private-path>#g' |
                  strip_excerpts |
                  grep -Ei '(FAIL|PASS|Test Files|Tests|Snapshots|Time|Assertion|Error:|expected|received|timed out|unhandled|ENOENT|EACCES|EPERM|not ok)' |
                  head -20 >&2 || true
              fi
              exit 1
            fi
          }
          case "${CONCERN}" in
            desktop-shard-1)
              run_quiet desktop-tests-shard-1 npm --prefix taurine-desktop run test -- --shard=1/2 --maxWorkers=1 --minWorkers=1 \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/desktop-shard-1.json"
              ;;
            desktop-shard-2)
              run_quiet desktop-tests-shard-2 npm --prefix taurine-desktop run test -- --shard=2/2 --maxWorkers=1 --minWorkers=1 \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/desktop-shard-2.json"
              ;;
            mobile)
              run_quiet mobile-build npm --prefix taurine-mobile run build
              run_quiet mobile-tests npm --prefix taurine-mobile run test -- --maxWorkers=1 --minWorkers=1 \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/mobile.json"
              run_quiet mobile-typecheck npm --prefix taurine-mobile run typecheck
              run_quiet mobile-lint npm --prefix taurine-mobile run lint
              ;;
            contracts)
              run_quiet contracts npm run check:contracts
              run_quiet wire npm run check:wire
              run_quiet packages-tests npm run test:packages -- \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/packages.json"
              run_quiet dashboard-contracts node --test --test-concurrency=1 skills/orchestrate/scripts/__tests__/dashboard.test.mjs
              ;;
            bundle-budget)
              # This concern has its own clean runner, so create the same
              # build outputs that the monolithic validator produced before
              # checking the bundle budget. Nothing is uploaded or retained.
              run_quiet desktop-typecheck-build npm --prefix taurine-desktop run typecheck
              run_quiet vite-preflight bash -c 'test -f taurine-desktop/node_modules/vite/bin/vite.js && test -x taurine-desktop/node_modules/.bin/vite'
              run_quiet desktop-vite-build bash -c 'cd taurine-desktop && npm exec --offline -- vite build'
              run_quiet mobile-build npm --prefix taurine-mobile run build
              run_quiet bundle-budget npm run check:bundle
              ;;
            desktop-quality)
              run_quiet desktop-typecheck-build npm --prefix taurine-desktop run typecheck
              run_quiet vite-preflight bash -c 'test -f taurine-desktop/node_modules/vite/bin/vite.js && test -x taurine-desktop/node_modules/.bin/vite'
              run_quiet desktop-vite-build bash -c 'cd taurine-desktop && npm exec --offline -- vite build'
              run_quiet desktop-typecheck npm --prefix taurine-desktop run typecheck
              run_quiet desktop-lint npm --prefix taurine-desktop run lint
              ;;
            *)
              echo "Unsupported validation concern" >&2
              exit 2
              ;;
          esac

      - name: Run isolated Windows Rust concern
        if: ${{ startsWith(inputs.concern, 'rust-') }}
        shell: bash
        env:
          CONCERN: ${{ inputs.concern }}
          OS_LABEL: Windows
        run: |
          set -euo pipefail

          # The helpers below are the Linux `rust-*` concerns' own (see
          # linux-validation-concern.yml, which is where the reasoning for each lives),
          # with the changes a macOS or Windows runner needs and nothing else:
          # - carriage returns are stripped before any pattern runs, because Windows
          #   tools end lines with CRLF and the anchored patterns below would never match;
          # - the path rules also cover a Windows drive path, the `\\?\` prefix and the
          #   registry checkout of a dependency, so no absolute runner path is published;
          # - the failure classes a Windows or macOS test binary can add (a missing entry
          #   point or DLL, a stack overflow, a dynamic library that would not load) and a
          #   vcpkg port build failure get their own fixed one-line classification.
          # Everything else, including what is and is not published, is unchanged: only
          # failing test names, `error[Ennnn]` headers with their location, and cargo's
          # own fixed failure shapes leave this runner.
          workspace_strip='s#^$##'
          if [[ "${GITHUB_WORKSPACE}" != *\\* ]]; then
            workspace_strip="s#${GITHUB_WORKSPACE}/##g"
          fi

          cargo_sanitize() {
            tr -d '\r' <"$1" |
              sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' |
              sed -E 's#\\\\\?\\##g' |
              sed -E 's#[^ ]*[\\/]registry[\\/]src[\\/][^\\/ ]+[\\/]#<registry>/#g' |
              sed -E "${workspace_strip}" |
              sed -E 's#[A-Za-z]:\\ct\\#<target>/#g; s#[A-Za-z]:\\[^ ]*#<private-path>#g' |
              sed -E 's#/Users/[^ ]+#<private-path>#g; s#/private/[^ ]+#<private-path>#g; s#/home/runner/work/[^ ]+#<private-path>#g' |
              cut -c1-200
          }

          # A failed test's captured output (`---- name stdout ----` up to the next
          # `failures:`) is dropped whole, compiler warnings are dropped, an
          # `error[Ennnn]` header is published with its `-->` location, and an uncoded
          # `error:` line only when it is followed by a `-->` location or is one of
          # cargo's own fixed shapes. `error: building <port>:<triplet> failed` is
          # vcpkg's own fixed line naming a public third-party port, never private code.
          cargo_test_detail() {
            cargo_sanitize "$1" | awk '
              /^---- .* (stdout|stderr) ----$/ { in_output = 1; next }
              /^failures:$/ { in_output = 0; next }
              in_output { next }
              /^warning: / { block = "warning"; pending = ""; next }
              /^error\[E[0-9]+\]: / { block = "error"; pending = ""; print; next }
              /^error: building [A-Za-z0-9_.+-]+:[A-Za-z0-9_-]+ failed/ { block = "vcpkg"; pending = ""; print; next }
              /^error: / {
                block = "error"; pending = ""
                if ($0 ~ /^error: (could not compile|test failed, to rerun pass|[0-9]+ targets? failed:|failed to run custom build command for|workspace member |the lock file |linking with |failed to (download|select|get|load|parse|fetch)|no matching package|package ID specification)/) print
                else pending = $0
                next
              }
              /^[[:space:]]*--> / {
                if (block == "error") { if (pending != "") print pending; pending = ""; print }
                next
              }
              /^test .* FAILED$/ || /^test result: FAILED/ || /^[[:space:]]+`-p [^`]+`$/ { print }
            ' | head -80 >&2 || true
          }

          cargo_test_reason() {
            local log="$1"
            if grep -qE '^error: workspace member ' "${log}"; then echo "a workspace member is assigned to no ${OS_LABEL} Rust test concern"
            elif grep -qE 'needs to be updated but --locked was passed|lock file .* needs to be updated' "${log}"; then echo 'committed Cargo.lock is out of date (refused by --locked)'
            elif grep -qE '^error: building .* failed|vcpkg install failed|error: vcpkg' "${log}"; then echo 'vcpkg dependency install failure'
            elif grep -qE 'Unable to find libclang|libclang.*[Nn]o such file' "${log}"; then echo 'libclang or bindgen failure'
            elif grep -qE 'failed to run custom build command' "${log}"; then echo 'dependency or crate build script failure'
            elif grep -qE 'No space left on device|not enough space on the disk|os error 112' "${log}"; then echo 'runner disk exhaustion'
            elif grep -qE '^error: linking with ' "${log}"; then echo 'link failure (missing system library or resource exhaustion)'
            elif grep -qE 'signal: 9|SIGKILL' "${log}"; then echo 'a process was killed (likely memory exhaustion)'
            elif grep -qE '0xc0000139|STATUS_ENTRYPOINT_NOT_FOUND|0xc0000135|STATUS_DLL_NOT_FOUND|Library not loaded' "${log}"; then echo 'a test binary could not start (missing entry point, DLL or dynamic library)'
            elif grep -qE '0xc00000fd|STATUS_STACK_OVERFLOW|has overflowed its stack' "${log}"; then echo 'a test binary overflowed its stack'
            elif grep -qE 'test result: FAILED|^error: test failed|^error: [0-9]+ targets? failed' "${log}"; then echo 'test failure'
            elif grep -qE '^error(\[E[0-9]{4}\])?: |could not compile' "${log}"; then echo 'compilation failure'
            elif grep -qE 'failed to (download|select|get|load|parse|fetch)' "${log}"; then echo 'dependency download or resolution failure'
            else echo 'command returned non-zero'
            fi
          }

          run_quiet() {
            local label="$1"; shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              tr -d '\r' <"${log}" >"${log}.lf" && mv "${log}.lf" "${log}"
              echo "${label}: failed ($(cargo_test_reason "${log}"); sanitized detail below)" >&2
              cargo_test_detail "${log}"
              exit 1
            fi
          }

          # Every sub-step runs and is reported, as in the Linux concerns: the sub-steps
          # are independent, so stopping at the first failure would hide results.
          deferred_results=()
          deferred_failed=0
          run_deferred() {
            local label="$1"; shift
            local status
            set +e
            ( set -e; run_quiet "${label}" "$@" )
            status=$?
            set -e
            if [[ "${status}" -eq 0 ]]; then
              deferred_results+=("${label}|passed")
            else
              deferred_results+=("${label}|failed: $(cargo_test_reason "${RUNNER_TEMP}/${label}.log")")
              deferred_failed=1
            fi
          }

          finish_deferred() {
            local entry
            {
              echo "## ${OS_LABEL} ${CONCERN} sub-steps"
              echo
              echo '| Sub-step | Result |'
              echo '| --- | --- |'
              for entry in "${deferred_results[@]}"; do
                echo "| \`${entry%%|*}\` | ${entry#*|} |"
              done
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "${CONCERN} sub-step results:"
            for entry in "${deferred_results[@]}"; do
              echo "  ${entry%%|*}: ${entry#*|}"
            done
            df -h / 2>/dev/null || true
            if [[ "${deferred_failed}" -ne 0 ]]; then
              echo "${CONCERN}: failed (one or more sub-steps failed; each is listed above)" >&2
              exit 1
            fi
          }

          # Which workspace crates each Rust concern tests on this OS. Every member of the
          # private workspace belongs to a concern, and `rust_coverage_check` (run by
          # `rust-domain`) fails when a member is in none of them, so a crate added later
          # cannot go untested by omission. The database family needs no list: `rust-db`
          # selects it with cargo's own `taurine-db*` package glob.
          rust_domain_packages=(
            taurine-model taurine-atomic taurine-auth taurine-crypt taurine-store
            taurine-repo taurine-replicate taurine-sync taurine-notes taurine-core
            taurine-exec taurine-scripting taurine-mock taurine-git
            taurine-transport-fs taurine-transport-git taurine-transport-wifi
            taurine-cli
          )

          rust_net_packages=(taurine-peer-sys taurine-net taurine-net-conformance)
          rust_ovpn_packages=(taurine-ovpn-sys)
          rust_app_packages=(taurine-app taurine-desktop taurine-mobile)

          rust_coverage_check() {
            local members member missing=0
            if ! members="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r' | sort -u)" || [[ -z "${members}" ]]; then
              echo 'error: failed to load the workspace member list' >&2
              return 1
            fi
            while IFS= read -r member; do
              case " ${rust_domain_packages[*]} ${rust_net_packages[*]} ${rust_ovpn_packages[*]} ${rust_app_packages[*]} " in
                *" ${member} "*) continue ;;
              esac
              [[ "${member}" == taurine-db* ]] && continue
              echo "error: workspace member ${member} is tested by no ${OS_LABEL} Rust concern" >&2
              missing=1
            done <<<"${members}"
            return "${missing}"
          }

          # vcpkg reads openvpn3's own `vcpkg.json`, which arrives with the pinned tree,
          # so this runs after the vendor fetch. The static-md triplet is the one
          # `taurine-ovpn-sys`'s build script prefers: a dynamic triplet would leave
          # OpenSSL's and jsoncpp's DLLs in vcpkg's own `bin/`, which is on nobody's PATH,
          # so every test binary would compile, link and then fail to start.
          windows_ovpn_dependencies() {
            local vcpkg_bin
            if command -v vcpkg >/dev/null 2>&1; then
              vcpkg_bin=vcpkg
            elif [[ -x "${VCPKG_INSTALLATION_ROOT:-}/vcpkg.exe" ]]; then
              vcpkg_bin="${VCPKG_INSTALLATION_ROOT}/vcpkg.exe"
            else
              echo 'error: vcpkg is not available on this runner image' >&2
              return 1
            fi
            cd vendor/openvpn3-core
            "${vcpkg_bin}" install --triplet x64-windows-static-md --disable-metrics
          }

          # `--locked`: the committed Cargo.lock is what was reviewed and what the Linux
          # contracts concern's advisory sweep audits. `--no-fail-fast`: every failing
          # target is reported in one dispatch. No `--features`: each crate is tested as
          # its manifest builds it, as on Linux. Env-gated live suites print SKIPPED and
          # pass when their variable is unset; the live servers belong to live-proofs.yml.
          case "${CONCERN}" in
            rust-domain)
              # The same crates as Linux, plus taurine-cli, whose exit codes and paths
              # are the part a user on this OS can observe. taurine-crypt links the real
              # Windows Credential Manager here (its default `keychain` feature,
              # windows-native), then is tested again without the feature, which is the
              # build a machine with no keychain gets.
              run_deferred rust-coverage rust_coverage_check
              run_deferred rust-crypt-no-keychain-tests \
                cargo test --locked --no-fail-fast --package taurine-crypt --no-default-features
              run_deferred rust-domain-tests \
                cargo test --locked --no-fail-fast "${rust_domain_packages[@]/#/--package=}"
              ;;
            rust-db)
              # Every `taurine-db*` crate, which on Windows includes the `#[cfg(windows)]`
              # integrated-authentication arm of taurine-db-mssql (tiberius' `winauth`
              # feature) that no other platform compiles.
              run_deferred rust-db-tests \
                cargo test --locked --no-fail-fast --package 'taurine-db*'
              ;;
            rust-net)
              # The dialer, the egress verifier, the userspace WireGuard conformance
              # suites and taurine-peer-sys, whose Win32 half (GetExtendedTcpTable and
              # the owning process's token) can only execute here. The openvpn3 shim is
              # its own concern, `rust-ovpn`, because its vcpkg dependency build is by
              # far the slowest step and must not hold these results back.
              run_deferred rust-net-tests \
                cargo test --locked --no-fail-fast "${rust_net_packages[@]/#/--package=}"
              ;;
            rust-ovpn)
              # The vendored openvpn3-core shim, compiled with MSVC against vcpkg's
              # static-md ports. A build and its unit tests only: no tunnel has carried
              # traffic on Windows, and this concern does not claim one has.
              run_deferred rust-ovpn-vcpkg windows_ovpn_dependencies
              if [[ "${deferred_failed}" -eq 0 ]]; then
                run_deferred rust-ovpn-tests \
                  cargo test --locked --no-fail-fast "${rust_ovpn_packages[@]/#/--package=}"
              else
                deferred_results+=("rust-ovpn-tests|failed: not run (the vcpkg dependency install failed)")
              fi
              ;;
            rust-app)
              # The command tier both shells call and the two shells' own unit tests.
              # Tauri's `test` feature drives the commands through its mock runtime, so
              # no window or WebView2 process is started.
              run_deferred rust-app-tests \
                cargo test --locked --no-fail-fast "${rust_app_packages[@]/#/--package=}"
              ;;
            *)
              echo "Unsupported Windows Rust concern: ${CONCERN}" >&2
              exit 2
              ;;
          esac
          finish_deferred

      # Saved only from the protected main branch (every job here already refuses to
      # run elsewhere; the condition repeats it so the write permission is explicit)
      # and only on a miss, so a key is written once and never overwritten.
      - name: Save verified third-party crate sources
        if: ${{ always() && github.ref == 'refs/heads/main' && startsWith(inputs.concern, 'rust-') && steps.cargo-sources.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cargo-home.outputs.dir }}/registry/index
            ${{ steps.cargo-home.outputs.dir }}/registry/cache
            ${{ steps.cargo-home.outputs.dir }}/git/db
          key: cargo-sources-${{ runner.os }}-${{ inputs.concern }}-${{ hashFiles('Cargo.lock', 'taurine-backend/*/Cargo.lock', 'taurine-backend/vendor/*/Cargo.lock', 'vendor/*/Cargo.lock') }}

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## Windows ${CONCERN} validation"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo '- Result: passed'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The sanitized proof above says validation passed; this section names the
      # tests that passed, so a public run shows exactly which tests a SHA
      # exercised. The inventory is repo-relative file paths and test titles,
      # plus status and duration — never test source, fixtures, data values or
      # environment details. The collector (checked out with the source it
      # reports on) re-scans every path and title with the repository's own
      # secret-shape rules and drops rather than publishes anything that
      # matches; it builds the whole section in memory and writes it once, so
      # nothing reaches the summary unless the sanitized render completed. The
      # runner's raw reporter JSON stays in RUNNER_TEMP and is not uploaded.
      - name: Publish test identities exercised by this concern
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          # Only the concerns that ran a JavaScript test suite have an
          # inventory; every other concern leaves its summary as it was.
          case "${CONCERN}" in
            contracts|desktop-shard-1|desktop-shard-2|mobile) ;;
            *) exit 0 ;;
          esac
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          # The collector exits zero even when it cannot collect (fail closed:
          # a fixed "unavailable" line instead of an error or a partial list),
          # but if the collector itself fails to run, publish the same fixed
          # line rather than letting the step turn a green concern red. The
          # section goes to the step log as well as the summary: the summary is
          # what a reader sees, the log is the greppable record of exactly
          # which identities were published to this run.
          section_file="${RUNNER_TEMP}/test-ids/summary-section.md"
          if ! TAURINE_TEST_IDS_DIR="${RUNNER_TEMP}/test-ids" \
            TAURINE_TEST_IDS_ROOT="${GITHUB_WORKSPACE}" \
            taurine-desktop/node_modules/.bin/vite-node scripts/ci/collect-test-ids.ts \
            > "${section_file}"; then
            {
              echo "### Tests exercised by this run"
              echo
              echo "Test inventory unavailable: the collector did not complete."
            } > "${section_file}"
          fi
          cat "${section_file}" >> "${GITHUB_STEP_SUMMARY}"
          cat "${section_file}"
