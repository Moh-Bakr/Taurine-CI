name: Read private source (protected)

# This is deliberately manual and protected. Public pull requests never enter
# this workflow and therefore never receive the source-read environment secret.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to read from the private source repository
        required: true
        type: string

permissions: {}

concurrency:
  # Each run has its own group: GitHub keeps only one PENDING run per group, so a shared per-SHA
  # group let a later dispatch silently cancel an earlier pending one. Runs are never
  # deduplicated or cancelled; check for an existing run before dispatching (docs/how-ci-works.md).
  # Nothing is shared between runs that a group would protect: caches are first-writer-wins on an
  # exact key, so a race is harmless.
  group: private-source-${{ github.workflow }}-${{ inputs.source_sha }}-${{ github.run_id }}
  cancel-in-progress: false

# These identifiers are configuration, not credentials. The repository ID is
# used as an additional guard so the source repository cannot be substituted by
# changing a workflow input. No private repository URL is stored in this file.
env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  # Runs with no environment and no secret, before the job that enters source-read.
  validate-input:
    permissions:
      actions: read
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    name: Verify the source-read environment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before any job enters source-read: its deployment branches must be exactly main and
      # untrusted (docs/how-ci-works.md, "Repository settings the owner applies").
      - name: Verify the source-read deployment branches
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/environment-preflight  # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}

  source-read:
    permissions:
      contents: read
    # workflow_dispatch can be selected on another branch in the UI. Fail
    # closed unless this exact workflow came from the protected default branch.
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    needs: validate-input
    name: Fetch exact private source SHA
    environment: source-read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected dispatch input
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || ( "${GITHUB_REF}" != "refs/heads/main" && "${GITHUB_REF}" != "refs/heads/untrusted" ) ]]; then
            echo 'source-read must run only from the protected main or untrusted branch' >&2
            exit 1
          fi

          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

          printf 'Requested source SHA: %s\n' "${REQUESTED_SOURCE_SHA,,}"

      - name: Check out the exact private source SHA
        id: verified-source
        # Kept as ./ : the policy matches this exact form for the private-source action.
        uses: ./.github/actions/source-checkout  # zizmor: ignore[self-repository]
        with:
          source-sha: ${{ inputs.source_sha }}
          app-client-id: ${{ vars.SOURCE_READER_APP_ID }}
          app-private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          repository-id: ${{ env.SOURCE_REPOSITORY_ID }}
          repository-owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repository-name: ${{ env.SOURCE_REPOSITORY_NAME }}

      # Defence in depth (finding H2): no project code runs in this job, but the rule is
      # uniform, so root goes before anything reads the checkout.
      - name: Remove root before project code
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/drop-root  # zizmor: ignore[self-repository]

      - name: Publish sanitized checkout proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="${REQUESTED_SOURCE_SHA,,}"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo '## Private source checkout'
            echo
            echo 'The protected source-read job checked out the requested exact SHA.'
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo '- Source token: revoked before any project command'
            echo '- Outputs: no source files or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"
