name: Linux source validation (protected)
run-name: Taurine validation ${{ inputs.source_sha }} ${{ inputs.dispatch_key }}

# This is a trusted, manually dispatched dispatcher. Each matrix concern is a
# separate source-bearing runner so a slow test suite cannot block contracts,
# builds, or other independent Linux checks.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      dispatch_key:
        description: Full SHA-256 key for this exact control revision and normalized dispatch inputs
        required: true
        type: string
      profile:
        description: quick runs the fast concerns only (no rust-app, rust-db, rust-dbx, scan-security, a11y or regression e2e tiers) and gives a PASS (partial) verdict; full runs everything
        required: false
        default: full
        type: choice
        options:
          - full
          - quick
      visual:
        description: Also run the Playwright visual tier (e2e-visual). Off by default; turn on once the Linux baselines are committed in the source
        required: false
        default: false
        type: boolean
      gitleaks_history:
        description: Also scan the full git history of source_sha with gitleaks (the opt-in scan-history concern). Report only, never enforcing; publishes counts, rule ids and commit short SHAs
        required: false
        default: false
        type: boolean
      base_sha:
        description: Optional base commit; when set, only the concerns the diff to source_sha affects run (a partial selection, which does not admit a merge)
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  # Each run has its own group: GitHub keeps only one PENDING run per group, so a shared per-SHA
  # group let a later dispatch silently cancel an earlier pending one. Runs are never
  # deduplicated or cancelled; check for an existing run before dispatching (docs/how-ci-works.md).
  # Nothing is shared between runs that a group would protect: caches are first-writer-wins on an
  # exact key, so a race is harmless.
  group: linux-validation-${{ inputs.source_sha }}-${{ github.run_id }}
  # Never cancel a source-bearing run: cancellation can interrupt the cleanup
  # step that revokes the short-lived private-source token.
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  validate-input:
    permissions:
      actions: read
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    name: Validate protected dispatch input
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before any job enters source-read: its deployment branches must be exactly main and
      # untrusted (docs/how-ci-works.md, "Repository settings the owner applies").
      - name: Verify the source-read deployment branches
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/environment-preflight  # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}

      - name: Validate exact source SHA
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          REQUESTED_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi
          if [[ -n "${REQUESTED_BASE_SHA}" && ! "${REQUESTED_BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'base_sha must be empty or a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Verify the coordinator dispatch identity
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CI_WORKFLOW_PATH: .github/workflows/linux-validation.yml
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CI_NORMALIZED_INPUTS: ${{ format('{{"base_sha":{0},"gitleaks_history":{1},"profile":{2},"source_sha":{3},"visual":{4}}}', toJSON(inputs.base_sha), toJSON(inputs.gitleaks_history), toJSON(inputs.profile), toJSON(inputs.source_sha), toJSON(inputs.visual)) }}
          CI_DISPATCH_CONTRACT_JSON: ''
          CI_GENERATE_ONLY: 'false'
          CI_CONTROL_REPOSITORY: ${{ github.repository }}
          CI_CONTROL_SHA: ${{ github.sha }}
          CI_CONTROL_REF: ${{ github.ref }}
        run: ruby .github/policy/dispatch-identity.rb

      # One dispatch identity, one run: a queued or in-progress run of this
      # workflow carrying the same dispatch key means the same source SHA and
      # inputs are already being validated, so this duplicate stops here,
      # before any token is minted. Nothing shared with the existing run is
      # changed; it can never be cancelled or evicted by this check. The
      # coordinator's ledger remains the primary dispatch discipline.
      - name: Refuse a duplicate dispatch
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_PATH: .github/workflows/linux-validation.yml
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CI_RUN_ID: ${{ github.run_id }}
        run: ruby .github/policy/refuse-duplicate-dispatch.rb


  # The concern list lives in .github/ci-matrix.json (one table for the selector, this
  # dispatcher and the result check). The reasons the concerns are split the way they are,
  # kept from the old inline list:
  # The Rust headless runner. It is the artifact CI pipelines outside
  # Taurine actually execute, and until this concern existed nothing
  # hosted compiled it: the CLI's 222 lines of report tests were
  # reachable only from a contributor's laptop.
  #
  # It is its own concern rather than a step in `contracts` because it
  # shares nothing with the JavaScript lanes — no npm install, no
  # node_modules — and folding it in would make every contracts run pay
  # for a Rust toolchain it does not use.
  # The rest of the Rust crate tests. Until these existed `cargo test`
  # ran hosted for `taurine-cli` alone; every other crate's unit and
  # integration tests — taurine-core's included — ran only on a
  # contributor's machine. `cargo test --workspace` is deliberately not
  # one concern: its cold compile is the whole product plus DuckDB,
  # openvpn3 and webkit2gtk, so one slow or broken corner would hold
  # every other crate's result hostage. The split follows the
  # workspace's own seams and its native dependencies, so each concern
  # installs only what its crates link:
  # - rust-domain: storage, sync, scripting, git and transport crates
  #   (the core the command tier is built on);
  # - rust-db: every `taurine-db*` crate, offline — the live conformance
  #   targets skip without a server and stay with live-proofs.yml;
  # - rust-net: the dialer, verifier and openvpn3 shim (C++);
  # - rust-app: the Tauri command tier and both shells (webkit2gtk);
  # - rust-dbx: the excluded `dbx-core`/`dbx-mongo-shell` trees, each on
  #   its own lock.
  # The concern workflow names, with the measured reason, the two test
  # runs no concern makes (`dbx-sqlite-worker`, `vendor/boringtun`
  # standalone), and fails `rust-domain` if a workspace member is added
  # without being assigned to one of these.
  # Browser tiers. Until these existed the Playwright suite ran only on
  # a contributor's laptop, so `verification.md`'s "hosted desktop
  # concern with pointer and keyboard coverage" had no runner behind it.
  # The `visual` project is deliberately absent: its five baselines are
  # darwin-only, so a Linux runner would write new ones and fail for a
  # reason that is not a regression.
  # Kept as ./ : the policy workflow pins and matches this exact form for protected reusable calls.
  plan:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    needs: validate-input
    name: Plan the full concern list
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      timeouts: ${{ steps.plan.outputs.timeouts }}
      expected: ${{ steps.plan.outputs.expected }}
      optin: ${{ steps.plan.outputs.optin }}
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Read the concern list for the profile
        id: plan
        shell: bash
        env:
          PROFILE: ${{ inputs.profile }}
          VISUAL: ${{ inputs.visual }}
          GITLEAKS_HISTORY: ${{ inputs.gitleaks_history }}
        run: |
          set -euo pipefail
          # profile=quick drops the concerns the table marks full_only (the slowest ones);
          # the result job then lists them as not selected and the verdict is partial.
          if [[ "${PROFILE}" == quick ]]; then
            filter='.concerns.linux | to_entries | map(select(.value.full_only != true)) | map(select(.value.opt_in == null))'
          else
            filter='.concerns.linux | to_entries | map(select(.value.opt_in == null))'
          fi
          # An opt-in concern (the visual tier, the gitleaks history scan) joins the list only
          # when its input is true.
          if [[ "${VISUAL}" == true ]]; then
            filter="(${filter}) + (.concerns.linux | to_entries | map(select(.value.opt_in == \"visual\")))"
          fi
          if [[ "${GITLEAKS_HISTORY}" == true ]]; then
            filter="(${filter}) + (.concerns.linux | to_entries | map(select(.value.opt_in == \"gitleaks_history\")))"
          fi
          echo "matrix=$(jq -c "{concern: ((${filter}) | map(.key))}" .github/ci-matrix.json)" >> "${GITHUB_OUTPUT}"
          # The Result job expects every non-opt-in concern, plus the opt-in ones enabled above,
          # so an enabled visual tier that fails (or is skipped) shows in the verdict while a
          # disabled one is not counted.
          expected='.concerns.linux | to_entries | map(select(.value.opt_in == null))'
          if [[ "${VISUAL}" == true ]]; then
            expected="(${expected}) + (.concerns.linux | to_entries | map(select(.value.opt_in == \"visual\")))"
          fi
          if [[ "${GITLEAKS_HISTORY}" == true ]]; then
            expected="(${expected}) + (.concerns.linux | to_entries | map(select(.value.opt_in == \"gitleaks_history\")))"
          fi
          echo "expected=$(jq -c "(${expected}) | map(.key)" .github/ci-matrix.json)" >> "${GITHUB_OUTPUT}"
          # The opt-in concerns this dispatch asked for: they must run (the selector appends
          # them) and the Result fails if one is missing.
          optin='[]'
          if [[ "${VISUAL}" == true ]]; then
            optin="$(jq -c '. + ["e2e-visual"]' <<<"${optin}")"
          fi
          if [[ "${GITLEAKS_HISTORY}" == true ]]; then
            optin="$(jq -c '. + ["scan-history"]' <<<"${optin}")"
          fi
          echo "optin=${optin}" >> "${GITHUB_OUTPUT}"
          # Per-concern timeouts (minutes) come from the same table.
          echo "timeouts=$(jq -c '.concerns.linux | map_values(.timeout)' .github/ci-matrix.json)" >> "${GITHUB_OUTPUT}"

  # Only with a base_sha: a source-bearing job (partial clone, history only) decides which
  # concerns the change affects. Without one this job is skipped and the full list runs.
  select:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') && inputs.base_sha != ''
    needs: [validate-input, plan]
    # Kept as ./ : the policy matches this exact form for protected reusable calls.
    uses: ./.github/workflows/select-concerns.yml  # zizmor: ignore[self-repository]
    # Exactly the reviewed source-reader key is passed, by name; no other secret reaches the callee.
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
    with:
      source_sha: ${{ inputs.source_sha }}
      base_sha: ${{ inputs.base_sha }}
      platform: linux
      include_concerns: ${{ needs.plan.outputs.optin }}

  validate:
    permissions:
      contents: read
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') && needs.validate-input.result == 'success' && needs.plan.result == 'success' && (needs.select.result == 'success' || needs.select.result == 'skipped') }}
    needs: [validate-input, plan, select]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix || needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/linux-validation-concern.yml  # zizmor: ignore[self-repository]
    # Exactly the reviewed source-reader key is passed, by name; no other secret reaches the callee.
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
    with:
      source_sha: ${{ inputs.source_sha }}
      concern: ${{ matrix.concern }}
      timeout_minutes: ${{ fromJSON(needs.plan.outputs.timeouts)[matrix.concern] }}
    # One sanitized evidence projection per concern, keyed by the concern name
    # so the Result job can aggregate the shards of one coverage group.
    outputs:
      evidence_${{ matrix.concern }}: ${{ jobs.validate.outputs.suite_evidence }}

  # Tabulates every concern's duration and conclusion for this run and warns when a
  # concern took more than 25% (and more than two minutes) longer than the committed
  # baseline below, in seconds: the median of the last several successful jobs (re-based
  # 2026-10-05, before the compiled-dependency cache; re-base again once it lands). Warning only: it never
  # fails the run, calls no service beyond this repository's own run API with the
  # run's read-only token, and publishes no artifact. A concern with no baseline is
  # listed without a comparison; update the table when a run is a new normal.
  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') }}
    needs: [validate]
    name: Timings
    runs-on: ubuntu-24.04
    # Reporting only: a queued, slow or cancelled timings job must never fail a run whose
    # concerns all passed (run 37342723559 was cancelled while waiting for a runner).
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Tabulate timings against the baseline
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: table
          label: Linux
          baseline-seconds: '{"rust-app-1":1981,"rust-app-2":2100,"rust-db":839,"rust-dbx":603,"rust-domain":186,"rust-net":124,"rust-packaging":999,"rust-tls-openssl":45,"taurine-cli":206,"scan-security":853,"desktop-shard-1":626,"desktop-shard-2":701,"desktop-quality":161,"mobile-quality":146,"frontend-build-budget":118,"contracts":95,"e2e-critical":744,"e2e-a11y":356,"e2e-regression-1":892,"e2e-regression-2":852,"e2e-regression-3":891,"e2e-regression-4":734,"e2e-visual":192}'
          name-pattern: '^validate \(.+\) / Linux (?<concern>.+)$'
          github-token: ${{ github.token }}

  # One verdict for the dispatch: every possible concern is listed, those that did not
  # run as "not selected" (never as passed), and the run fails if any concern that ran
  # did not succeed. PASS (full) is the only verdict that admits a merge.
  result:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') }}
    needs: [plan, validate, select]
    name: Result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Write the run verdict
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/run-result  # zizmor: ignore[self-repository]
        with:
          label: Linux
          expected-concerns: ${{ needs.plan.outputs.expected }}
          required-concerns: ${{ toJSON(fromJSON(needs.select.outputs.matrix || needs.plan.outputs.matrix).concern) }}
          name-pattern: '^validate \(.+\) / Linux (?<concern>.+)$'
          source-sha: ${{ inputs.source_sha }}
          base-sha: ${{ inputs.base_sha }}
          selection-mode: ${{ inputs.profile == 'full' && inputs.base_sha == '' && 'full' || 'partial' }}
          github-token: ${{ github.token }}

      # One per-feature coverage overview over every sanitized evidence
      # projection the concern jobs exported (selected versus full, executed
      # versus compiled versus skipped). Reporting only: it never changes the
      # verdict above, and it refuses (fails this job) if a projection is not
      # the validator's reviewed shape.
      - name: Aggregate the feature-suite overview
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/suite-overview  # zizmor: ignore[self-repository]
        with:
          evidence: ${{ toJSON(needs.validate.outputs) }}
          label: Linux
