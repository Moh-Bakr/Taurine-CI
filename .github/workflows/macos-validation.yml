name: macOS source validation (protected)

# Manual, protected, source-bearing validation. Pull requests and pushes never
# enter the source-read environment or receive a private-source token.
#
# Cadence. The Rust compile-and-test concerns are the slow part of this
# workflow (a cold build of the whole closure on a three-core runner, up to 120
# minutes), so they run only when the dispatch asks for them with `-f rust=true`.
# Intended use: Linux validation on every dispatch (Rust always on there);
# macOS and Windows Rust with `rust=true` for a plan tip before its develop PR,
# for every develop/uat/main tip, and for any branch that touches native or
# OS-specific Rust. A dispatch without it runs the TypeScript concerns exactly
# as before and reports the Rust concerns as "not requested", never as passed.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      rust:
        description: Run the Rust compile+test concerns
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: macos-validation-${{ github.workflow }}-${{ inputs.source_sha }}
  # Never cancel a source-bearing run: cancellation can interrupt the cleanup
  # step that revokes the short-lived private-source token.
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  # Builds the concern matrix from the `rust` input and reports the choice. It
  # holds no source, token or environment: it only emits the list of concerns
  # to schedule, so an unrequested Rust concern never gets a runner at all.
  plan:
    permissions: {}
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Plan macOS concerns
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select the concerns and report the Rust cadence
        id: plan
        shell: bash
        env:
          RUST_REQUESTED: ${{ inputs.rust }}
        run: |
          set -euo pipefail
          base='"desktop-shard-1","desktop-shard-2","desktop-quality","mobile","bundle-budget","orchestrate-skill"'
          rust='"rust-domain","rust-db","rust-net","rust-ovpn","rust-app","rust-packaging","rust-tls-openssl"'
          {
            echo '## macOS Rust concerns'
            echo
            if [[ "${RUST_REQUESTED}" == true ]]; then
              echo "matrix={\"concern\":[${base},${rust}]}" >> "${GITHUB_OUTPUT}"
              echo '- Requested (rust=true): rust-domain, rust-db, rust-net, rust-ovpn, rust-app and rust-packaging are scheduled.'
            else
              echo "matrix={\"concern\":[${base}]}" >> "${GITHUB_OUTPUT}"
              echo '- **Not requested** (rust=false): rust-domain, rust-db, rust-net, rust-ovpn, rust-app and rust-packaging were not scheduled. They are neither passed nor failed on this run; dispatch with -f rust=true to run them.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    needs: plan
    name: macOS ${{ matrix.concern }} validation
    environment: source-read
    runs-on: macos-15
    # The TypeScript concerns stay on the reviewed 45. The Rust concerns compile
    # their closure cold on a three-core runner, because compiled output is never
    # cached in this control plane (only third-party crate sources are): `rust-app` carries DuckDB's C++ amalgamation, Tauri and
    # over a hundred test binaries (about 40 minutes on the four-core Linux
    # runner), `rust-db` the same drivers' offline suites (about 10 there).
    timeout-minutes: ${{ (matrix.concern == 'rust-app' || matrix.concern == 'rust-packaging') && 120 || matrix.concern == 'rust-db' && 90 || startsWith(matrix.concern, 'rust-') && 60 || 45 }}
    strategy:
      fail-fast: false
      # The concern list comes from the `plan` job: the TypeScript concerns always,
      # plus the Rust crate-test concerns (rust-domain, rust-db, rust-net, rust-ovpn, rust-app,
      # one runner each so a slow one cannot hold the others back) only when the
      # dispatch set rust=true. They are the macOS counterparts of the Linux
      # rust-* concerns. rust-dbx is not repeated here: dbx-core's engine and
      # protocol tests are platform-neutral and stay on Linux; its OS-keyring
      # feature is opt-in (not built by `npm run test:dbx-core`), its Postgres
      # tests need a Docker daemon that macOS hosted runners do not have, and its
      # vendored OpenSSL is a from-source C build with no macOS-only code.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Start the concern timer
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: start

      - name: Validate protected dispatch input
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'macos-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Check out the exact private source SHA
        id: verified-source
        # Kept as ./ : the policy matches this exact form for the private-source action.
        uses: ./.github/actions/source-checkout  # zizmor: ignore[self-repository]
        with:
          source-sha: ${{ inputs.source_sha }}
          app-client-id: ${{ vars.SOURCE_READER_APP_ID }}
          app-private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          repository-id: ${{ env.SOURCE_REPOSITORY_ID }}
          repository-owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repository-name: ${{ env.SOURCE_REPOSITORY_NAME }}

      - name: Install the shared sanitizers
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/sanitize  # zizmor: ignore[self-repository]

      - name: Install the shared concern reporting
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/concern-report  # zizmor: ignore[self-repository]

      - name: Set up Node.js and install the locked JavaScript dependencies
        if: ${{ !startsWith(matrix.concern, 'rust-') || matrix.concern == 'rust-packaging' }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/node-setup  # zizmor: ignore[self-repository]
        with:
          root: true
          desktop: true
          mobile: true
          vendor-fetch: ${{ matrix.concern != 'rust-packaging' }}

      - name: Set up the Rust toolchain and native dependencies
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/rust-toolchain  # zizmor: ignore[self-repository]
        with:
          concern: ${{ matrix.concern }}

      - name: Fetch pinned vendored sources
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        shell: bash
        run: |
          set -euo pipefail
          # `fetch` verifies each download against the sha256 pinned in vendor.lock and
          # applies the reviewed boringtun zeroize patch, so this is a supply-chain check
          # as much as a prerequisite.
          # Up to three attempts: the fetch is idempotent (a partial tree is removed and
          # boringtun is built in a temporary directory), and the four Rust concerns fetch
          # the same three public sources at the same moment, so a throttled or reset
          # download is transient. A failure after the last attempt is classified into a
          # fixed one-line reason; the raw output stays withheld.
          vendor_ok=0
          for attempt in 1 2 3; do
            if bash scripts/vendor-openvpn3.sh fetch >"${RUNNER_TEMP}/vendor-fetch.log" 2>&1; then
              vendor_ok=1
              break
            fi
            echo "vendor-fetch: attempt ${attempt} failed" >&2
            sleep $((attempt * 10))
          done
          if [[ "${vendor_ok}" != 1 ]]; then
            if grep -qE 'could not download' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='boringtun download failed'
            elif grep -qE 'has sha256' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='boringtun checksum mismatch'
            elif grep -qE 'could not extract' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='boringtun extraction failed'
            elif grep -qE 'does not apply' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='boringtun patch did not apply'
            elif grep -qE 'crossbeam-epoch' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='boringtun lock refresh failed'
            elif grep -qE '^fatal:|^error: RPC|unable to access' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='git fetch of a pinned source failed'
            else reason='unclassified'
            fi
            echo "vendor-fetch: failed after 3 attempts (${reason}; detailed output withheld)" >&2
            exit 1
          fi
          echo 'vendor-fetch: passed'

      # Third-party crate sources only: cargo's registry index, the downloaded
      # `.crate` archives and the git dependency databases. Never `target/`, never
      # an extracted source tree, never anything under the checked-out private
      # source, so no compiled or private code ever enters a cache. The key is the
      # OS, the concern and a hash of the private Cargo.lock files, which reveals
      # nothing about their contents.
      - name: Locate Cargo home for the third-party source cache
        id: cargo-home
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        shell: bash
        run: |
          set -euo pipefail
          dir="${CARGO_HOME:-${HOME}/.cargo}"
          if command -v cygpath >/dev/null 2>&1; then
            dir="$(cygpath -m "${dir}")"
          fi
          echo "dir=${dir}" >> "${GITHUB_OUTPUT}"

      - name: Restore cached third-party crate sources
        id: cargo-sources
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cargo-home.outputs.dir }}/registry/index
            ${{ steps.cargo-home.outputs.dir }}/registry/cache
            ${{ steps.cargo-home.outputs.dir }}/git/db
          key: cargo-sources-${{ runner.os }}-${{ matrix.concern }}-${{ hashFiles('src/Cargo.lock', 'src/taurine-backend/*/Cargo.lock', 'src/taurine-backend/vendor/*/Cargo.lock', 'src/vendor/*/Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-${{ matrix.concern }}-

      # Defence in depth: do not rely on cargo alone to notice a tampered archive.
      # Every restored `.crate` must hash to the checksum recorded for it in a
      # private Cargo.lock; anything that does not match, or is not in a lock at
      # all, is deleted before cargo runs. Only counts are printed.
      - name: Verify restored crate archives against Cargo.lock
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        shell: bash
        env:
          CARGO_SOURCES_DIR: ${{ steps.cargo-home.outputs.dir }}
          CACHE_HIT: ${{ steps.cargo-sources.outputs.cache-hit }}
          OS_LABEL: macOS
        run: |
          set -euo pipefail
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum < "$1" | cut -d' ' -f1
            else
              shasum -a 256 < "$1" | cut -d' ' -f1
            fi
          }
          expected="${RUNNER_TEMP}/crate-checksums.txt"
          : > "${expected}"
          while IFS= read -r lock; do
            tr -d '\r' < "${lock}" | awk '
              /^\[\[package\]\]/ { n = ""; v = ""; next }
              /^name = /     { gsub(/"/, "", $3); n = $3 }
              /^version = /  { gsub(/"/, "", $3); v = $3 }
              /^checksum = / { gsub(/"/, "", $3); if (n != "" && v != "") print n "-" v ".crate " $3 }
            ' >> "${expected}"
          done < <(find . -name Cargo.lock -not -path '*/node_modules/*' -not -path '*/target/*')
          kept=0
          dropped=0
          cache_dir="${CARGO_SOURCES_DIR}/registry/cache"
          if [[ -d "${cache_dir}" ]]; then
            find "${cache_dir}" -type f ! -name '*.crate' -delete
            while IFS= read -r -d '' crate; do
              want="$(awk -v f="$(basename "${crate}")" '$1 == f { print $2; exit }' "${expected}")"
              if [[ -n "${want}" && "$(sha256_of "${crate}")" == "${want}" ]]; then
                kept=$((kept + 1))
              else
                rm -f "${crate}"
                dropped=$((dropped + 1))
              fi
            done < <(find "${cache_dir}" -type f -name '*.crate' -print0)
          fi
          case "${CACHE_HIT}" in
            true) state='exact hit' ;;
            false) state='restored from an earlier lockfile' ;;
            *) state='miss' ;;
          esac
          echo "cargo-sources: ${state}; ${kept} archives verified, ${dropped} dropped"
          echo "- ${OS_LABEL} Cargo source cache: ${state} (${kept} verified, ${dropped} dropped)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run isolated macOS validation concern
        if: ${{ !startsWith(matrix.concern, 'rust-') }}
        shell: bash
        env:
          OS_LABEL: macOS
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
          source "${RUNNER_TEMP}/taurine-ci/report.sh"
          case "${CONCERN}" in
            desktop-shard-1)
              run_quiet desktop-tests-shard-1 npm --prefix taurine-desktop run test -- --shard=1/2 --no-file-parallelism \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/desktop-shard-1.json"
              ;;
            desktop-shard-2)
              run_quiet desktop-tests-shard-2 npm --prefix taurine-desktop run test -- --shard=2/2 --no-file-parallelism \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/desktop-shard-2.json"
              ;;
            desktop-quality)
              run_quiet vite-preflight bash -c 'test -f taurine-desktop/node_modules/vite/bin/vite.js && test -x taurine-desktop/node_modules/.bin/vite'
              run_quiet vite-native-preflight bash -c 'cd taurine-desktop && node -e '\''require("vite"); require("rollup"); require("rollup/dist/native.js"); require("@tailwindcss/oxide")'\'''
              run_quiet desktop-vite-build bash -c 'cd taurine-desktop && NODE_OPTIONS=--max-old-space-size=8192 node ./node_modules/vite/bin/vite.js build'
              run_quiet desktop-typecheck npm --prefix taurine-desktop run typecheck
              run_quiet desktop-lint npm --prefix taurine-desktop run lint
              ;;
            mobile)
              run_quiet mobile-build npm --prefix taurine-mobile run build
              run_quiet mobile-tests npm --prefix taurine-mobile run test -- --no-file-parallelism \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/mobile.json"
              run_quiet mobile-typecheck npm --prefix taurine-mobile run typecheck
              run_quiet mobile-lint npm --prefix taurine-mobile run lint
              ;;
            bundle-budget)
              # The checker compares both frontend dist trees. Build them on
              # this isolated runner instead of passing private artifacts.
              run_quiet desktop-vite-build bash -c 'cd taurine-desktop && NODE_OPTIONS=--max-old-space-size=8192 node ./node_modules/vite/bin/vite.js build'
              run_quiet mobile-build npm --prefix taurine-mobile run build
              run_quiet bundle-budget npm run check:bundle
              ;;
            orchestrate-skill)
              run_quiet contracts npm run check:contracts
              run_quiet wire npm run check:wire
              run_quiet packages-tests npm run test:packages -- \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/packages.json"
              run_quiet dashboard-contracts node --test --test-concurrency=1 skills/orchestrate/scripts/__tests__/dashboard.test.mjs
              run_quiet orchestrate-verification node skills/orchestrate/scripts/verify.mjs --json
              ;;
            *)
              echo "Unknown macOS validation concern: ${CONCERN}" >&2
              exit 1
              ;;
          esac

      - name: Run isolated macOS Rust concern
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        shell: bash
        env:
          CONCERN: ${{ matrix.concern }}
          OS_LABEL: macOS
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
          source "${RUNNER_TEMP}/taurine-ci/report.sh"

          # The helpers below are the Linux `rust-*` concerns' own (see
          # linux-validation-concern.yml, which is where the reasoning for each lives),
          # with the changes a macOS or Windows runner needs and nothing else:
          # - carriage returns are stripped before any pattern runs, because Windows
          #   tools end lines with CRLF and the anchored patterns below would never match;
          # - the path rules also cover a Windows drive path, the `\\?\` prefix and the
          #   registry checkout of a dependency, so no absolute runner path is published;
          # - the failure classes a Windows or macOS test binary can add (a missing entry
          #   point or DLL, a stack overflow, a dynamic library that would not load) and a
          #   vcpkg port build failure get their own fixed one-line classification.
          # Everything else, including what is and is not published, is unchanged: only
          # failing test names, `error[Ennnn]` headers with their location, and cargo's
          # own fixed failure shapes leave this runner.



          # Which workspace crates each Rust concern tests on this OS. Every member of the
          # private workspace belongs to a concern, and `rust_coverage_check` (run by
          # `rust-domain`) fails when a member is in none of them, so a crate added later
          # cannot go untested by omission. The database family needs no list: `rust-db`
          # selects it with cargo's own `taurine-db*` package glob.
          rust_domain_packages=(
            taurine-model taurine-atomic taurine-auth taurine-crypt taurine-store
            taurine-repo taurine-replicate taurine-sync taurine-notes taurine-core
            taurine-exec taurine-scripting taurine-mock taurine-git
            taurine-transport-fs taurine-transport-git taurine-transport-wifi
            taurine-cli
          )

          rust_net_packages=(taurine-peer-sys taurine-net taurine-net-conformance)
          rust_ovpn_packages=(taurine-ovpn-sys)
          rust_app_packages=(taurine-app taurine-desktop taurine-mobile)

          rust_coverage_check() {
            local members member missing=0
            if ! members="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r' | sort -u)" || [[ -z "${members}" ]]; then
              echo 'error: failed to load the workspace member list' >&2
              return 1
            fi
            while IFS= read -r member; do
              case " ${rust_domain_packages[*]} ${rust_net_packages[*]} ${rust_ovpn_packages[*]} ${rust_app_packages[*]} " in
                *" ${member} "*) continue ;;
              esac
              [[ "${member}" == taurine-db* ]] && continue
              echo "error: workspace member ${member} is tested by no ${OS_LABEL} Rust concern" >&2
              missing=1
            done <<<"${members}"
            return "${missing}"
          }

          # `--locked`: the committed Cargo.lock is what was reviewed and what the Linux
          # contracts concern's advisory sweep audits. `--no-fail-fast`: every failing
          # target is reported in one dispatch. No `--features`: each crate is tested as
          # its manifest builds it, as on Linux. Env-gated live suites print SKIPPED and
          # pass when their variable is unset; the live servers belong to live-proofs.yml.
          case "${CONCERN}" in
            rust-domain)
              # The same crates as Linux, plus taurine-cli, whose exit codes and paths
              # are the part a user on this OS can observe. taurine-crypt links the real
              # macOS Keychain here (its default `keychain` feature, apple-native) against
              # the throwaway keychain the toolchain step created, then is tested again
              # without the feature, which is the build a machine with no keychain gets.
              run_deferred rust-coverage rust_coverage_check
              run_deferred rust-crypt-no-keychain-tests \
                cargo test --locked --no-fail-fast --package taurine-crypt --no-default-features
              run_deferred rust-domain-tests \
                cargo test --locked --no-fail-fast "${rust_domain_packages[@]/#/--package=}"
              # dbx-core's `os-keyring` feature takes the keyring crate's Apple backend on
              # macOS; no hosted job compiles it (the dbx-core tests run on Linux without
              # the feature). A non-test library check does, without running anything.
              run_deferred rust-dbx-core-keyring-check \
                cargo check --locked --lib --manifest-path taurine-backend/dbx-core/Cargo.toml --features os-keyring
              ;;
            rust-db)
              # Every `taurine-db*` crate. Platform-neutral engines, but the family has
              # `#[cfg(unix)]` socket paths (mongo, mysql, sidecar, engine) that Linux
              # also takes and macOS-only linking of its bundled C (sqlite, duckdb,
              # libsql), which only a macOS compile proves.
              db_packages=()
              while IFS= read -r db_package; do
                db_packages+=("--package=${db_package}")
              done < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r' | grep '^taurine-db' | sort -u)
              rust_tests rust-db-tests "${db_packages[@]}"
              ;;
            rust-net)
              # The dialer, the egress verifier and the conformance suites. The latter
              # depend on the vendored openvpn3 shim, so this concern gets the same C++
              # setup as `rust-ovpn`, which tests the shim crate on its own.
              run_deferred rust-net-tests \
                cargo test --locked --no-fail-fast "${rust_net_packages[@]/#/--package=}"
              ;;
            rust-ovpn)
              # The vendored openvpn3 shim. On macOS openvpn3 compiles its own platform
              # integration (MacDNSWatchdog, ReachabilityTracker, MacSleep) against
              # CoreFoundation, SystemConfiguration, IOKit and Security, which no Linux
              # run can compile. The OpenVPN lab tests are `#[ignore]`d: they need the
              # local lab's servers.
              run_deferred rust-ovpn-tests \
                cargo test --locked --no-fail-fast "${rust_ovpn_packages[@]/#/--package=}"
              ;;
            rust-app)
              # The command tier both shells call and the two shells' own unit tests.
              # Tauri's `test` feature drives the commands through its mock runtime, so
              # no window or WebView process is started; AppKit and WKWebView are what
              # the crates link.
              rust_tests rust-app-tests "${rust_app_packages[@]/#/--package=}"
              ;;
            rust-packaging)
              # Packaging smoke: an unsigned debug build of the desktop app through the Tauri
              # CLI, to prove the app still bundles on this OS. Nothing is signed, notarised
              # or uploaded; the output stays on the runner.
              run_deferred rust-packaging-smoke \
                npm --prefix taurine-desktop run tauri -- build --debug --bundles app --ci
              ;;
            rust-tls-openssl)
              # The standalone OpenSSL TLS spike crate (its own workspace, outside the root
              # one). Present only on sources that carry it; otherwise a note and a pass,
              # not a silent skip of a concern the source never had.
              tls_manifest=taurine-backend/taurine-tls-openssl/Cargo.toml
              if [[ -f "${tls_manifest}" ]]; then
                run_deferred rust-tls-openssl-tests \
                  cargo test --locked --manifest-path "${tls_manifest}"
              else
                echo "rust-tls-openssl: the source has no ${tls_manifest}; nothing to build"
                run_deferred rust-tls-openssl-absent true
              fi
              ;;
            *)
              echo "Unsupported macOS Rust concern: ${CONCERN}" >&2
              exit 2
              ;;
          esac
          finish_deferred

      # Saved only from the protected main branch (every job here already refuses to
      # run elsewhere; the condition repeats it so the write permission is explicit)
      # and only on a miss, so a key is written once and never overwritten.
      - name: Save verified third-party crate sources
        if: ${{ always() && github.ref == 'refs/heads/main' && startsWith(matrix.concern, 'rust-') && steps.cargo-sources.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cargo-home.outputs.dir }}/registry/index
            ${{ steps.cargo-home.outputs.dir }}/registry/cache
            ${{ steps.cargo-home.outputs.dir }}/git/db
          key: cargo-sources-${{ runner.os }}-${{ matrix.concern }}-${{ hashFiles('src/Cargo.lock', 'src/taurine-backend/*/Cargo.lock', 'src/taurine-backend/vendor/*/Cargo.lock', 'src/vendor/*/Cargo.lock') }}

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## macOS ${CONCERN} validation"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo '- Isolated concern passed; no other concern relies on this runner'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The sanitized proof above says validation passed; this section names the
      # tests that passed, so a public run shows exactly which tests a SHA
      # exercised. The inventory is repo-relative file paths and test titles,
      # plus status and duration — never test source, fixtures, data values or
      # environment details. The collector (checked out with the source it
      # reports on) re-scans every path and title with the repository's own
      # secret-shape rules and drops rather than publishes anything that
      # matches; it builds the whole section in memory and writes it once, so
      # nothing reaches the summary unless the sanitized render completed. The
      # runner's raw reporter JSON stays in RUNNER_TEMP and is not uploaded.
      - name: Publish test identities exercised by this concern
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          # Only the concerns that ran a JavaScript test suite have an
          # inventory; every other concern leaves its summary as it was.
          case "${CONCERN}" in
            desktop-shard-1|desktop-shard-2|mobile|orchestrate-skill) ;;
            *) exit 0 ;;
          esac
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          # The collector exits zero even when it cannot collect (fail closed:
          # a fixed "unavailable" line instead of an error or a partial list),
          # but if the collector itself fails to run, publish the same fixed
          # line rather than letting the step turn a green concern red. The
          # section goes to the step log as well as the summary: the summary is
          # what a reader sees, the log is the greppable record of exactly
          # which identities were published to this run.
          section_file="${RUNNER_TEMP}/test-ids/summary-section.md"
          if ! TAURINE_TEST_IDS_DIR="${RUNNER_TEMP}/test-ids" \
            TAURINE_TEST_IDS_ROOT="${GITHUB_WORKSPACE}/src" \
            taurine-desktop/node_modules/.bin/vite-node scripts/ci/collect-test-ids.ts \
            > "${section_file}"; then
            {
              echo "### Tests exercised by this run"
              echo
              echo "Test inventory unavailable: the collector did not complete."
            } > "${section_file}"
          fi
          cat "${section_file}" >> "${GITHUB_STEP_SUMMARY}"
          cat "${section_file}"

      # The job's own wall-clock time, shown next to its result; the timings job
      # tabulates it against a committed baseline.
      - name: Report concern duration
        if: ${{ always() }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: report

  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' }}
    needs: [validate]
    name: Timings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Tabulate timings against the baseline
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: table
          label: macOS
          baseline-seconds: '{"rust-app":2494,"rust-db":660,"rust-domain":384,"rust-ovpn":118,"rust-net":115,"desktop-shard-1":500,"desktop-shard-2":821,"desktop-quality":273,"mobile":170,"bundle-budget":153,"orchestrate-skill":197}'
          name-pattern: '^macOS (?<concern>.+) validation$'
          github-token: ${{ github.token }}

  # One verdict for the dispatch: every possible concern is listed, those that did not
  # run as "not selected" (never as passed), and the run fails if any concern that ran
  # did not succeed. PASS (full) is the only verdict that admits a merge.
  result:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' }}
    needs: [validate]
    name: Result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Write the run verdict
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/run-result  # zizmor: ignore[self-repository]
        with:
          label: macOS
          expected-concerns: '["desktop-shard-1","desktop-shard-2","desktop-quality","mobile","bundle-budget","orchestrate-skill","rust-domain","rust-db","rust-net","rust-ovpn","rust-app","rust-packaging","rust-tls-openssl"]'
          name-pattern: '^macOS (?<concern>.+) validation$'
          source-sha: ${{ inputs.source_sha }}
          github-token: ${{ github.token }}
