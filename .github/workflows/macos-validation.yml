name: macOS source validation (protected)
run-name: Taurine validation ${{ inputs.source_sha }} ${{ inputs.dispatch_key }}

# Manual, protected, source-bearing validation. Pull requests and pushes never
# enter the source-read environment or receive a private-source token.
#
# Cadence. The Rust compile-and-test concerns are the slow part of this
# workflow (a cold build of the whole closure on a three-core runner, up to 120
# minutes), so they run only when the dispatch asks for them with `-f rust=true`.
# Intended use: Linux validation on every dispatch (Rust always on there);
# macOS and Windows Rust with `rust=true` for a plan tip before its develop PR,
# for every develop/uat/main tip, and for any branch that touches native or
# OS-specific Rust. A dispatch without it runs the TypeScript concerns exactly
# as before and reports the Rust concerns as "not requested", never as passed.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      dispatch_key:
        description: Full SHA-256 key for this exact control revision and normalized dispatch inputs
        required: true
        type: string
      rust:
        description: Run the Rust compile+test concerns
        required: false
        default: false
        type: boolean
      flavor:
        description: Build flavour for the rust-packaging smoke (prod, dev or uat)
        required: false
        default: prod
        type: choice
        options:
          - prod
          - dev
          - uat
      only:
        description: Optional comma-separated concern names; when set, exactly those concerns run and everything else is listed as not selected (PASS (partial), which does not admit a merge)
        required: false
        default: ''
        type: string

permissions: {}

# No job caches unless it declares its own cache-mode; the reviewed split is validate-main (write,
# main only) and validate-untrusted (read) (docs/untrusted-readonly-cache.md, section 4.1).
cache-mode: none

concurrency:
  # Each run has its own group: GitHub keeps only one PENDING run per group, so a shared per-SHA
  # group let a later dispatch silently cancel an earlier pending one. Runs are never
  # deduplicated or cancelled; check for an existing run before dispatching (docs/how-ci-works.md).
  # Nothing is shared between runs that a group would protect: caches are first-writer-wins on an
  # exact key, so a race is harmless.
  group: macos-validation-${{ inputs.source_sha }}-${{ github.run_id }}
  # Never cancel a source-bearing run: cancellation can interrupt the cleanup
  # step that revokes the short-lived private-source token.
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  # Builds the concern matrix from the `rust` input and reports the choice. It
  # holds no source, token or environment: it only emits the list of concerns
  # to schedule, so an unrequested Rust concern never gets a runner at all.
  plan:
    permissions:
      actions: read
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    name: Plan macOS concerns
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      long_matrix: ${{ steps.plan.outputs.long_matrix }}
      short_matrix: ${{ steps.plan.outputs.short_matrix }}
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before any job enters source-read: its deployment branches must be exactly main and
      # untrusted (docs/how-ci-works.md, "Repository settings the owner applies").
      - name: Verify the source-read deployment branches
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/environment-preflight  # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}

      - name: Verify the coordinator dispatch identity
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CI_WORKFLOW_PATH: .github/workflows/macos-validation.yml
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CI_NORMALIZED_INPUTS: ${{ format('{{"flavor":{0},"only":{1},"rust":{2},"source_sha":{3}}}', toJSON(inputs.flavor), toJSON(inputs.only), toJSON(inputs.rust), toJSON(inputs.source_sha)) }}
          CI_DISPATCH_CONTRACT_JSON: ''
          CI_GENERATE_ONLY: 'false'
          CI_CONTROL_REPOSITORY: ${{ github.repository }}
          CI_CONTROL_SHA: ${{ github.sha }}
          CI_CONTROL_REF: ${{ github.ref }}
        run: ruby .github/policy/dispatch-identity.rb

      # One dispatch identity, one run: a queued or in-progress run of this
      # workflow carrying the same dispatch key means the same source SHA and
      # inputs are already being validated, so this duplicate stops here,
      # before any token is minted. Nothing shared with the existing run is
      # changed; it can never be cancelled or evicted by this check. The
      # coordinator's ledger remains the primary dispatch discipline.
      - name: Refuse a duplicate dispatch
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_PATH: .github/workflows/macos-validation.yml
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CI_RUN_ID: ${{ github.run_id }}
        run: ruby .github/policy/refuse-duplicate-dispatch.rb


      - name: Select the concerns and report the Rust cadence
        id: plan
        shell: bash
        env:
          RUST_REQUESTED: ${{ inputs.rust }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          base='["desktop-shard-1","desktop-shard-2","desktop-quality","mobile","bundle-budget","orchestrate-skill"]'
          rust='["rust-domain","rust-db","rust-net","rust-ovpn","rust-app-1","rust-app-2","rust-packaging","rust-tls-openssl"]'
          if [[ "${RUST_REQUESTED}" == true ]]; then
            candidates="$(jq -cn --argjson b "${base}" --argjson r "${rust}" '$b + $r')"
          else
            candidates="${base}"
          fi
          # A surgical `only` dispatch narrows the matrix to exactly the named concerns: a
          # re-run of the one or two concerns a previous run failed, without paying for the
          # rest. The Result job still expects the full list, so every filtered-out concern
          # is reported as "not selected" and the verdict is PASS (partial) — a partial run
          # never admits a merge. An unknown name, or a Rust concern named while rust=false,
          # stops the run here rather than scheduling nothing.
          only_list='[]'
          if [[ -n "${ONLY}" ]]; then
            only_list="$(printf '%s' "${ONLY}" | jq -cR 'split(",") | map(gsub("^ +| +$"; "")) | map(select(length > 0)) | unique')"
            if [[ "$(jq 'length' <<<"${only_list}")" -eq 0 ]]; then
              echo 'only: no concern name given' >&2
              exit 1
            fi
            unknown="$(jq -n -c --argjson only "${only_list}" --argjson candidates "${candidates}" '$only - $candidates | join(",")')"
            if [[ -n "${unknown}" ]]; then
              echo "only: not a macOS concern of this dispatch (unknown name, or rust=false): ${unknown}" >&2
              exit 1
            fi
            candidates="$(jq -c --argjson only "${only_list}" '[.[] | select(. as $c | ($only | index($c)) != null)]' <<<"${candidates}")"
          fi
          # The same list split into the long Rust poles (their own dispatcher jobs, defined first,
          # so they claim the scarce macOS runners before the short jobs) and the rest. `matrix`
          # stays the whole list: the Result job requires it.
          long='["rust-db","rust-app-1","rust-app-2","rust-packaging"]'
          echo "long_matrix=$(jq -cn --argjson c "${candidates}" --argjson l "${long}" '{concern: [$c[] | select(. as $x | $l | index($x) != null)]}')" >> "${GITHUB_OUTPUT}"
          echo "short_matrix=$(jq -cn --argjson c "${candidates}" --argjson l "${long}" '{concern: [$c[] | select(. as $x | $l | index($x) == null)]}')" >> "${GITHUB_OUTPUT}"
          {
            echo '## macOS Rust concerns'
            echo
            if [[ "${RUST_REQUESTED}" == true ]]; then
              echo "matrix={\"concern\":${candidates}}" >> "${GITHUB_OUTPUT}"
              echo '- Requested (rust=true): rust-domain, rust-db, rust-net, rust-ovpn, rust-app-1, rust-app-2 and rust-packaging are scheduled.'
            else
              echo "matrix={\"concern\":${candidates}}" >> "${GITHUB_OUTPUT}"
              echo '- **Not requested** (rust=false): rust-domain, rust-db, rust-net, rust-ovpn, rust-app-1, rust-app-2 and rust-packaging were not scheduled. They are neither passed nor failed on this run; dispatch with -f rust=true to run them.'
            fi
            if [[ "${only_list}" != '[]' ]]; then
              echo "- Only filter active: $(jq -r 'join(", ")' <<<"${only_list}"). Every other concern is not selected; the verdict cannot be PASS (full), which is the only verdict that admits a merge."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # The untrusted ref's cache scope must be empty before any untrusted source job runs: nothing may
  # write it (every untrusted job is cache-mode read), so any entry is a planting attempt or a
  # leftover that could shadow main's entry for the same key (docs/untrusted-readonly-cache.md,
  # section 3.3). No source, no environment and no secret: the job's own token, actions: read.
  cache-audit:
    if: ${{ github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/untrusted' && needs.plan.result == 'success' }}
    needs: [plan]
    name: Audit the untrusted cache scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse any entry in the untrusted cache scope
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/cache-scope-audit  # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}
          phase: before

  # The long Rust poles (rust-app-*, rust-db, rust-packaging) in their own jobs, defined first and with
  # no dependency on the short jobs, so they are the first runners claimed on the five-slot macOS
  # pool. GitHub does not honour matrix list order (Taurine survey 8.5). Same reusable concern
  # workflow, secrets and cache-mode halves as the short jobs below; an empty half is skipped by its if.
  validate-long-main:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' && join(fromJSON(needs.plan.outputs.long_matrix).concern, '') != ''
    needs: plan
    strategy:
      fail-fast: false
      # The long-pole concerns from the `plan` job (rust-app-*, rust-db, rust-packaging): only when the
      # dispatch set rust=true, so an empty list skips the job.
      matrix: ${{ fromJSON(needs.plan.outputs.long_matrix) }}
    cache-mode: write
    # Kept as ./ : the policy workflow pins and matches this exact form for protected reusable calls.
    uses: ./.github/workflows/macos-validation-concern.yml  # zizmor: ignore[self-repository]
    # Exactly the reviewed source-reader key is passed, by name; no other secret reaches the callee.
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
    with:
      source_sha: ${{ inputs.source_sha }}
      concern: ${{ matrix.concern }}
      flavor: ${{ inputs.flavor }}

  validate-long-untrusted:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/untrusted' && needs.cache-audit.result == 'success' && join(fromJSON(needs.plan.outputs.long_matrix).concern, '') != ''
    needs: [plan, cache-audit]
    strategy:
      fail-fast: false
      # The long-pole concerns from the `plan` job (rust-app-*, rust-db, rust-packaging): only when the
      # dispatch set rust=true, so an empty list skips the job.
      matrix: ${{ fromJSON(needs.plan.outputs.long_matrix) }}
    cache-mode: read
    # Kept as ./ : the policy workflow pins and matches this exact form for protected reusable calls.
    uses: ./.github/workflows/macos-validation-concern.yml  # zizmor: ignore[self-repository]
    # Exactly the reviewed source-reader key is passed, by name; no other secret reaches the callee.
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
    with:
      source_sha: ${{ inputs.source_sha }}
      concern: ${{ matrix.concern }}
      flavor: ${{ inputs.flavor }}

  # The concerns that are not long poles.
  validate-main:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' && join(fromJSON(needs.plan.outputs.short_matrix).concern, '') != ''
    needs: plan
    strategy:
      fail-fast: false
      # The concern list comes from the `plan` job: the TypeScript concerns always,
      # plus the Rust crate-test concerns (rust-domain, rust-db, rust-net, rust-ovpn, rust-app-1/2,
      # one runner each so a slow one cannot hold the others back) only when the
      # dispatch set rust=true. They are the macOS counterparts of the Linux
      # rust-* concerns. rust-dbx is not repeated here: the dbx member crates'
      # engine and protocol tests are platform-neutral and stay on Linux;
      # dbx-core's OS-keyring feature is opt-in (no default build enables it),
      # its Postgres tests need a Docker daemon that macOS hosted runners do
      # not have, and its vendored OpenSSL is a from-source C build with no
      # macOS-only code. This OS compiles the keyring half through the
      # `rust-domain` library check.
      matrix: ${{ fromJSON(needs.plan.outputs.short_matrix) }}
    cache-mode: write
    # Kept as ./ : the policy workflow pins and matches this exact form for protected reusable calls.
    uses: ./.github/workflows/macos-validation-concern.yml  # zizmor: ignore[self-repository]
    # Exactly the reviewed source-reader key is passed, by name; no other secret reaches the callee.
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
    with:
      source_sha: ${{ inputs.source_sha }}
      concern: ${{ matrix.concern }}
      flavor: ${{ inputs.flavor }}

  validate-untrusted:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/untrusted' && needs.cache-audit.result == 'success' && join(fromJSON(needs.plan.outputs.short_matrix).concern, '') != ''
    needs: [plan, cache-audit]
    strategy:
      fail-fast: false
      # The concern list comes from the `plan` job: the TypeScript concerns always,
      # plus the Rust crate-test concerns (rust-domain, rust-db, rust-net, rust-ovpn, rust-app-1/2,
      # one runner each so a slow one cannot hold the others back) only when the
      # dispatch set rust=true. They are the macOS counterparts of the Linux
      # rust-* concerns. rust-dbx is not repeated here: the dbx member crates'
      # engine and protocol tests are platform-neutral and stay on Linux;
      # dbx-core's OS-keyring feature is opt-in (no default build enables it),
      # its Postgres tests need a Docker daemon that macOS hosted runners do
      # not have, and its vendored OpenSSL is a from-source C build with no
      # macOS-only code. This OS compiles the keyring half through the
      # `rust-domain` library check.
      matrix: ${{ fromJSON(needs.plan.outputs.short_matrix) }}
    cache-mode: read
    # Kept as ./ : the policy workflow pins and matches this exact form for protected reusable calls.
    uses: ./.github/workflows/macos-validation-concern.yml  # zizmor: ignore[self-repository]
    # Exactly the reviewed source-reader key is passed, by name; no other secret reaches the callee.
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
    with:
      source_sha: ${{ inputs.source_sha }}
      concern: ${{ matrix.concern }}
      flavor: ${{ inputs.flavor }}

  # After the untrusted source jobs: the scope must still be empty. A planting attempt that a
  # blocked save would only log as a warning is reported here (a detector, not a lock).
  cache-audit-after:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/untrusted' && needs.cache-audit.result == 'success' }}
    needs: [cache-audit, validate-long-untrusted, validate-untrusted]
    name: Audit the untrusted cache scope after the run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse any entry in the untrusted cache scope
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/cache-scope-audit  # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}
          phase: after

  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') }}
    needs: [validate-long-main, validate-long-untrusted, validate-main, validate-untrusted]
    name: Timings
    runs-on: ubuntu-24.04
    # Reporting only: a queued, slow or cancelled timings job must never fail a run whose
    # concerns all passed (run 37342723559 was cancelled while waiting for a runner).
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Tabulate timings against the baseline
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: table
          label: macOS
          baseline-seconds: '{"rust-app-1":2600,"rust-app-2":2600,"rust-db":1287,"rust-domain":772,"rust-ovpn":229,"rust-net":160,"rust-packaging":1009,"rust-tls-openssl":71,"desktop-shard-1":532,"desktop-shard-2":629,"desktop-quality":235,"mobile":182,"bundle-budget":145,"orchestrate-skill":241}'
          # No untrusted baseline yet: no cold untrusted macOS set has been measured, so an untrusted run
          # keeps the main baseline above (the timings action falls back when none is given). Add
          # baseline-seconds-untrusted from the first measured cold set.
          name-pattern: '^validate(-long)?-(main|untrusted) \(.+\) / macOS (?<concern>.+) validation$'
          github-token: ${{ github.token }}

  # One verdict for the dispatch: every possible concern is listed, those that did not
  # run as "not selected" (never as passed), and the run fails if any concern that ran
  # did not succeed. PASS (full) is the only verdict that admits a merge.
  result:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') && needs.plan.result == 'success' }}
    needs: [plan, validate-long-main, validate-long-untrusted, validate-main, validate-untrusted, cache-audit, cache-audit-after]
    name: Result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Write the run verdict
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/run-result  # zizmor: ignore[self-repository]
        with:
          label: macOS
          expected-concerns: '["desktop-shard-1","desktop-shard-2","desktop-quality","mobile","bundle-budget","orchestrate-skill","rust-domain","rust-db","rust-net","rust-ovpn","rust-app-1","rust-app-2","rust-packaging","rust-tls-openssl"]'
          required-concerns: ${{ toJSON(fromJSON(needs.plan.outputs.matrix).concern) }}
          name-pattern: '^validate(-long)?-(main|untrusted) \(.+\) / macOS (?<concern>.+) validation$'
          source-sha: ${{ inputs.source_sha }}
          selection-mode: ${{ inputs.rust && 'full' || 'partial' }}
          github-token: ${{ github.token }}
          blocking-failures: ${{ (contains(fromJSON('["failure","cancelled"]'), needs.cache-audit.result) || contains(fromJSON('["failure","cancelled"]'), needs.cache-audit-after.result)) && '1' || '0' }}
