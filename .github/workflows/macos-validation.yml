name: macOS source validation (protected)

# Manual, protected, source-bearing validation. Pull requests and pushes never
# enter the source-read environment or receive a private-source token.
#
# Cadence. The Rust compile-and-test concerns are the slow part of this
# workflow (a cold build of the whole closure on a three-core runner, up to 120
# minutes), so they run only when the dispatch asks for them with `-f rust=true`.
# Intended use: Linux validation on every dispatch (Rust always on there);
# macOS and Windows Rust with `rust=true` for a plan tip before its develop PR,
# for every develop/uat/main tip, and for any branch that touches native or
# OS-specific Rust. A dispatch without it runs the TypeScript concerns exactly
# as before and reports the Rust concerns as "not requested", never as passed.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      rust:
        description: Run the Rust compile+test concerns
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: macos-validation-${{ github.workflow }}-${{ inputs.source_sha }}
  # Never cancel a source-bearing run: cancellation can interrupt the cleanup
  # step that revokes the short-lived private-source token.
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  # Builds the concern matrix from the `rust` input and reports the choice. It
  # holds no source, token or environment: it only emits the list of concerns
  # to schedule, so an unrequested Rust concern never gets a runner at all.
  plan:
    permissions: {}
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Plan macOS concerns
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select the concerns and report the Rust cadence
        id: plan
        shell: bash
        env:
          RUST_REQUESTED: ${{ inputs.rust }}
        run: |
          set -euo pipefail
          base='"desktop-shard-1","desktop-shard-2","desktop-quality","mobile","bundle-budget","orchestrate-skill"'
          rust='"rust-domain","rust-db","rust-net","rust-ovpn","rust-app"'
          {
            echo '## macOS Rust concerns'
            echo
            if [[ "${RUST_REQUESTED}" == true ]]; then
              echo "matrix={\"concern\":[${base},${rust}]}" >> "${GITHUB_OUTPUT}"
              echo '- Requested (rust=true): rust-domain, rust-db, rust-net, rust-ovpn and rust-app are scheduled.'
            else
              echo "matrix={\"concern\":[${base}]}" >> "${GITHUB_OUTPUT}"
              echo '- **Not requested** (rust=false): rust-domain, rust-db, rust-net, rust-ovpn and rust-app were not scheduled. They are neither passed nor failed on this run; dispatch with -f rust=true to run them.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    needs: plan
    name: macOS ${{ matrix.concern }} validation
    environment: source-read
    runs-on: macos-15
    # The TypeScript concerns stay on the reviewed 45. The Rust concerns compile
    # their closure cold on a three-core runner, because compiled output is never
    # cached in this control plane (only third-party crate sources are): `rust-app` carries DuckDB's C++ amalgamation, Tauri and
    # over a hundred test binaries (about 40 minutes on the four-core Linux
    # runner), `rust-db` the same drivers' offline suites (about 10 there).
    timeout-minutes: ${{ matrix.concern == 'rust-app' && 120 || matrix.concern == 'rust-db' && 90 || startsWith(matrix.concern, 'rust-') && 60 || 45 }}
    strategy:
      fail-fast: false
      # The concern list comes from the `plan` job: the TypeScript concerns always,
      # plus the Rust crate-test concerns (rust-domain, rust-db, rust-net, rust-ovpn, rust-app,
      # one runner each so a slow one cannot hold the others back) only when the
      # dispatch set rust=true. They are the macOS counterparts of the Linux
      # rust-* concerns. rust-dbx is not repeated here: dbx-core's engine and
      # protocol tests are platform-neutral and stay on Linux; its OS-keyring
      # feature is opt-in (not built by `npm run test:dbx-core`), its Postgres
      # tests need a Docker daemon that macOS hosted runners do not have, and its
      # vendored OpenSSL is a from-source C build with no macOS-only code.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Start the concern timer
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo "CONCERN_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"
          echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected dispatch input
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'macos-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Mint read-only private-source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          # Deliberate: the token is revoked explicitly by the next verification step, before any project command, and that step fails closed; the action's own end-of-job revoke would leave it live while project code runs.
          skip-token-revoke: true  # zizmor: ignore[github-app]

      - name: Check out exact private source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY_OWNER }}/${{ env.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          path: src
          submodules: false
          lfs: false

      - name: Verify identity, exact checkout, and revoke source token
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          failed=0
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo 'No source token was minted; refusing to continue' >&2
            exit 1
          fi
          if ! identity="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
            echo 'The configured source repository identity could not be resolved' >&2
            failed=1
          elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
            echo 'The configured source repository identity did not match' >&2
            failed=1
          fi
          if ! checked_out_sha="$(git -C src rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"; then
            echo 'The private source checkout did not complete' >&2
            failed=1
          elif [[ "${checked_out_sha}" != "${requested_sha}" ]]; then
            echo 'The checked-out commit does not match source_sha' >&2
            failed=1
          fi
          if ! api_sha="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/${requested_sha}" | jq -er '.sha | ascii_downcase')" || [[ "${api_sha}" != "${requested_sha}" ]]; then
            echo 'The requested source SHA was not resolved from the configured repository' >&2
            failed=1
          fi
          if ! curl --fail --silent --show-error --retry 2 -X DELETE -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/installation/token"; then
            echo 'Source token revocation failed; refusing to execute project code' >&2
            failed=1
          fi
          unset SOURCE_TOKEN
          git -C src config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all credential.helper 2>/dev/null || true
          find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
          (( failed == 0 ))

      # The Rust concerns need no node_modules, so they skip Node and the three
      # `npm ci` runs, as the Linux ones do. They still need the vendor fetch
      # (their own step below): the workspace root path-depends on
      # vendor/boringtun, and no cargo command loads without it.
      - name: Set up the pinned Node.js release
        if: ${{ !startsWith(matrix.concern, 'rust-') }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Install locked JavaScript dependencies
        if: ${{ !startsWith(matrix.concern, 'rust-') }}
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"
            shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              # Keep source-bearing logs private while leaving an actionable,
              # non-sensitive failure class in the public run summary.
              local reason='command returned non-zero'
              if grep -Eiq 'out of memory|heap out of memory|JavaScript heap' "${log}"; then
                reason='memory exhaustion'
              elif grep -Eiq '(^|[^[:alnum:]])(command not found|is not recognized)' "${log}"; then
                reason='missing command'
              elif grep -Eiq '(^|[^[:alnum:]])(cannot find module|module not found|no such file or directory)' "${log}"; then
                reason='missing dependency or file'
              elif grep -Eiq 'typescript|ts[0-9]{4}|type error' "${log}"; then
                reason='TypeScript compilation failure'
              elif grep -Eiq 'vendor-openvpn3:|fatal:|sha256|does not apply|could not download' "${log}"; then
                reason='pinned vendor fetch or verification failure'
              elif grep -Eiq 'test failed|assertion|failed [0-9]+ test|vitest' "${log}"; then
                reason='test failure'
              fi
              echo "${label}: failed (${reason}; detailed output withheld)" >&2
              if [[ "${label}" == desktop-vite-build ]]; then
                # Vite's top-level error line is safe to publish after absolute
                # workspace paths are removed; source excerpts and full logs
                # remain private on the ephemeral runner.
                sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' "${log}" |
                  sed -E 's#/Users/.*#<private-path>#g; s#/home/runner/work/.*#<private-path>#g; s#(gh[pousr]_|github_pat_)[A-Za-z0-9_]+#<redacted>#g; s#Bearer [A-Za-z0-9._~+/=-]+#Bearer <redacted>#g' |
                  grep -Ei '(vite|rollup|tailwind|oxide|error|failed|could not|cannot|npm (err|error|warn)|node:internal|module_not_found|enoent|command not found|not cached)' |
                  head -20 >&2 || true
              fi
              exit 1
            fi
          }
          run_quiet npm-root npm ci --include=optional --ignore-scripts
          run_quiet npm-desktop npm --prefix taurine-desktop ci --include=optional --ignore-scripts
          run_quiet npm-mobile npm --prefix taurine-mobile ci --include=optional --ignore-scripts
          # The private workspace's Cargo.toml patches boringtun to a verified
          # local tree. The vendor directory is intentionally ignored, so every
          # hosted source checkout must materialize it before any Rust-aware
          # package build or test can load Cargo metadata.
          run_quiet vendor-fetch bash scripts/vendor-openvpn3.sh fetch

      - name: Set up the Rust toolchain and native dependencies
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        shell: bash
        env:
          CONCERN: ${{ matrix.concern }}
        run: |
          # Homebrew's own bottles, from homebrew-core only (as ios-validation already
          # does for llvm). Homebrew cannot pin a formula version, so these float with
          # the runner image's tap snapshot; each bottle is sha256-verified by brew.
          # Analytics and the auto-update of the tap are off.
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 HOMEBREW_NO_ENV_HINTS=1

          rustc --version
          cargo --version

          # taurine-scripting's rquickjs `bindgen` feature needs the standalone libclang
          # dylib at build-script runtime, the same reason ios-validation installs llvm.
          brew list llvm >/dev/null 2>&1 || brew install llvm
          llvm_prefix="$(brew --prefix llvm)"
          [[ -f "${llvm_prefix}/lib/libclang.dylib" ]] || { echo 'libclang dylib is unavailable' >&2; exit 1; }
          echo "LIBCLANG_PATH=${llvm_prefix}/lib" >> "${GITHUB_ENV}"

          # openssl@3 and pkg-config: any crate that links the system OpenSSL finds it
          # through pkg-config, and Homebrew's openssl@3 is keg-only (not on the default
          # search path), so its pkgconfig directory is handed over explicitly.
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig" >> "${GITHUB_ENV}"

          # taurine-ovpn-sys compiles vendored openvpn3-core C++ against these; the list
          # is the private docs/architecture/vendored-openvpn3.md macOS install line.
          # `rust-ovpn` builds that crate directly and `rust-net` builds it through
          # taurine-net-conformance, which depends on it, so both concerns take this setup.
          if [[ "${CONCERN}" == rust-ovpn || "${CONCERN}" == rust-net ]]; then
            brew install asio fmt jsoncpp lz4 xxhash

            # openvpn3-core is C++20 and the formulae above are current releases, so it
            # needs a current Apple libc++ too. The macos-14 image's default Xcode is
            # older than the libc++ those headers have been built against, so select the
            # newest Xcode the image ships (version sort over /Applications/Xcode_*.app),
            # for this concern only. The toolchain versions are printed (public tool and
            # formula versions, nothing from the private source) so a failure here is
            # attributable to a compiler or a formula version from the run summary alone.
            newest_xcode="$(printf '%s\n' /Applications/Xcode_*.app | sort -V | tail -n 1)"
            if [[ -d "${newest_xcode}" ]]; then
              sudo xcode-select -s "${newest_xcode}/Contents/Developer"
            fi
            xcodebuild -version | head -n 1
            xcrun clang++ --version | head -n 1
            brew list --versions asio fmt jsoncpp lz4 xxhash openssl@3
          fi

          # Same settings as the Linux crate-test concerns, about the runner not the
          # code: no incremental state (nothing is cached, so it would be written and
          # never read) and no debug info for tests and their dependencies (this
          # workflow publishes no backtrace, and `rust-app` links over a hundred
          # binaries that each carry the whole command tier).
          {
            echo 'CARGO_INCREMENTAL=0'
            echo 'CARGO_PROFILE_DEV_DEBUG=0'
            echo 'CARGO_PROFILE_TEST_DEBUG=0'
          } >> "${GITHUB_ENV}"

          # Disk. A hosted macOS runner is short of space for the heaviest closure, and
          # the Android SDK is the largest thing on the image that no Rust concern reads.
          # Removed only when free space is under 30 GiB, and only for rust-app. Free
          # space is printed either way so a first run measures it.
          df -h "${GITHUB_WORKSPACE}"
          if [[ "${CONCERN}" == rust-app ]]; then
            avail_kib="$(df -k "${GITHUB_WORKSPACE}" | awk 'NR==2 {print $4}')"
            if [[ "${avail_kib}" -lt 31457280 && -d "${HOME}/Library/Android" ]]; then
              rm -rf "${HOME}/Library/Android"
              df -h "${GITHUB_WORKSPACE}"
            fi
          fi

          # taurine-crypt's `keychain` feature talks to the real macOS Keychain, and its
          # callers treat a locked or missing keychain as a miss, so a bare runner would
          # pass with the keychain path never exercised. A throwaway, already unlocked
          # keychain in RUNNER_TEMP becomes the user's only search keychain and default,
          # so the real Keychain API is exercised without touching the runner's login
          # keychain, no dialog can wait for an unlock, and nothing outlives the job.
          # The passphrase is random, used on three commands and never printed.
          keychain="${RUNNER_TEMP}/taurine-ci.keychain-db"
          keychain_secret="$(uuidgen)"
          security create-keychain -p "${keychain_secret}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_secret}" "${keychain}"
          unset keychain_secret
          security list-keychains -d user -s "${keychain}"
          security default-keychain -d user -s "${keychain}"
          security show-keychain-info "${keychain}"

      - name: Fetch pinned vendored sources
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        shell: bash
        run: |
          set -euo pipefail
          # `fetch` verifies each download against the sha256 pinned in vendor.lock and
          # applies the reviewed boringtun zeroize patch, so this is a supply-chain check
          # as much as a prerequisite.
          # Up to three attempts: the fetch is idempotent (a partial tree is removed and
          # boringtun is built in a temporary directory), and the four Rust concerns fetch
          # the same three public sources at the same moment, so a throttled or reset
          # download is transient. A failure after the last attempt is classified into a
          # fixed one-line reason; the raw output stays withheld.
          vendor_ok=0
          for attempt in 1 2 3; do
            if bash scripts/vendor-openvpn3.sh fetch >"${RUNNER_TEMP}/vendor-fetch.log" 2>&1; then
              vendor_ok=1
              break
            fi
            echo "vendor-fetch: attempt ${attempt} failed" >&2
            sleep $((attempt * 10))
          done
          if [[ "${vendor_ok}" != 1 ]]; then
            if grep -qE 'could not download' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='boringtun download failed'
            elif grep -qE 'has sha256' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='boringtun checksum mismatch'
            elif grep -qE 'could not extract' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='boringtun extraction failed'
            elif grep -qE 'does not apply' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='boringtun patch did not apply'
            elif grep -qE 'crossbeam-epoch' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='boringtun lock refresh failed'
            elif grep -qE '^fatal:|^error: RPC|unable to access' "${RUNNER_TEMP}/vendor-fetch.log"; then reason='git fetch of a pinned source failed'
            else reason='unclassified'
            fi
            echo "vendor-fetch: failed after 3 attempts (${reason}; detailed output withheld)" >&2
            exit 1
          fi
          echo 'vendor-fetch: passed'

      # Third-party crate sources only: cargo's registry index, the downloaded
      # `.crate` archives and the git dependency databases. Never `target/`, never
      # an extracted source tree, never anything under the checked-out private
      # source, so no compiled or private code ever enters a cache. The key is the
      # OS, the concern and a hash of the private Cargo.lock files, which reveals
      # nothing about their contents.
      - name: Locate Cargo home for the third-party source cache
        id: cargo-home
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        shell: bash
        run: |
          set -euo pipefail
          dir="${CARGO_HOME:-${HOME}/.cargo}"
          if command -v cygpath >/dev/null 2>&1; then
            dir="$(cygpath -m "${dir}")"
          fi
          echo "dir=${dir}" >> "${GITHUB_OUTPUT}"

      - name: Restore cached third-party crate sources
        id: cargo-sources
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cargo-home.outputs.dir }}/registry/index
            ${{ steps.cargo-home.outputs.dir }}/registry/cache
            ${{ steps.cargo-home.outputs.dir }}/git/db
          key: cargo-sources-${{ runner.os }}-${{ matrix.concern }}-${{ hashFiles('src/Cargo.lock', 'src/taurine-backend/*/Cargo.lock', 'src/taurine-backend/vendor/*/Cargo.lock', 'src/vendor/*/Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-${{ matrix.concern }}-

      # Defence in depth: do not rely on cargo alone to notice a tampered archive.
      # Every restored `.crate` must hash to the checksum recorded for it in a
      # private Cargo.lock; anything that does not match, or is not in a lock at
      # all, is deleted before cargo runs. Only counts are printed.
      - name: Verify restored crate archives against Cargo.lock
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        shell: bash
        env:
          CARGO_SOURCES_DIR: ${{ steps.cargo-home.outputs.dir }}
          CACHE_HIT: ${{ steps.cargo-sources.outputs.cache-hit }}
          OS_LABEL: macOS
        run: |
          set -euo pipefail
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          expected="${RUNNER_TEMP}/crate-checksums.txt"
          : > "${expected}"
          while IFS= read -r lock; do
            tr -d '\r' < "${lock}" | awk '
              /^\[\[package\]\]/ { n = ""; v = ""; next }
              /^name = /     { gsub(/"/, "", $3); n = $3 }
              /^version = /  { gsub(/"/, "", $3); v = $3 }
              /^checksum = / { gsub(/"/, "", $3); if (n != "" && v != "") print n "-" v ".crate " $3 }
            ' >> "${expected}"
          done < <(find . -name Cargo.lock -not -path '*/node_modules/*' -not -path '*/target/*')
          kept=0
          dropped=0
          cache_dir="${CARGO_SOURCES_DIR}/registry/cache"
          if [[ -d "${cache_dir}" ]]; then
            find "${cache_dir}" -type f ! -name '*.crate' -delete
            while IFS= read -r -d '' crate; do
              want="$(awk -v f="$(basename "${crate}")" '$1 == f { print $2; exit }' "${expected}")"
              if [[ -n "${want}" && "$(sha256_of "${crate}")" == "${want}" ]]; then
                kept=$((kept + 1))
              else
                rm -f "${crate}"
                dropped=$((dropped + 1))
              fi
            done < <(find "${cache_dir}" -type f -name '*.crate' -print0)
          fi
          case "${CACHE_HIT}" in
            true) state='exact hit' ;;
            false) state='restored from an earlier lockfile' ;;
            *) state='miss' ;;
          esac
          echo "cargo-sources: ${state}; ${kept} archives verified, ${dropped} dropped"
          echo "- ${OS_LABEL} Cargo source cache: ${state} (${kept} verified, ${dropped} dropped)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Run isolated macOS validation concern
        if: ${{ !startsWith(matrix.concern, 'rust-') }}
        shell: bash
        env:
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"
            shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              local reason='command returned non-zero'
              if grep -Eiq 'out of memory|heap out of memory|JavaScript heap' "${log}"; then
                reason='memory exhaustion'
              elif grep -Eiq '(^|[^[:alnum:]])(command not found|is not recognized)' "${log}"; then
                reason='missing command'
              elif grep -Eiq '(^|[^[:alnum:]])(cannot find module|module not found|no such file or directory)' "${log}"; then
                reason='missing dependency or file'
              elif grep -Eiq 'typescript|ts[0-9]{4}|type error' "${log}"; then
                reason='TypeScript compilation failure'
              elif grep -Eiq 'vendor-openvpn3:|fatal:|sha256|does not apply|could not download' "${log}"; then
                reason='pinned vendor fetch or verification failure'
              elif grep -Eiq 'test failed|assertion|failed [0-9]+ test|vitest' "${log}"; then
                reason='test failure'
              fi
              echo "${label}: failed (${reason}; detailed output withheld)" >&2
              if [[ "${label}" == desktop-vite-build ]]; then
                # Publish only a redacted tool/runtime diagnostic.  Restrict
                # this to known error markers so source-bearing build output
                # never enters the public log.
                sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' "${log}" |
                  sed -E 's#/Users/.*#<private-path>#g; s#/home/runner/work/.*#<private-path>#g; s#(gh[pousr]_|github_pat_)[A-Za-z0-9_]+#<redacted>#g; s#Bearer [A-Za-z0-9._~+/=-]+#Bearer <redacted>#g' |
                  grep -Ei '(^|[[:space:]])(error|failed|cannot|could not|not found|enoent|rollup|vite|npm (err|error))([:[:space:]]|$)' |
                  head -20 >&2 || true
              fi
              exit 1
            fi
          }
          case "${CONCERN}" in
            desktop-shard-1)
              run_quiet desktop-tests-shard-1 npm --prefix taurine-desktop run test -- --shard=1/2 --maxWorkers=1 --minWorkers=1 \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/desktop-shard-1.json"
              ;;
            desktop-shard-2)
              run_quiet desktop-tests-shard-2 npm --prefix taurine-desktop run test -- --shard=2/2 --maxWorkers=1 --minWorkers=1 \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/desktop-shard-2.json"
              ;;
            desktop-quality)
              run_quiet desktop-typecheck-build npm --prefix taurine-desktop run typecheck
              run_quiet vite-preflight bash -c 'test -f taurine-desktop/node_modules/vite/bin/vite.js && test -x taurine-desktop/node_modules/.bin/vite'
              run_quiet vite-native-preflight bash -c 'cd taurine-desktop && node -e '\''require("vite"); require("rollup"); require("rollup/dist/native.js"); require("@tailwindcss/oxide")'\'''
              run_quiet desktop-vite-build bash -c 'cd taurine-desktop && NODE_OPTIONS=--max-old-space-size=8192 node ./node_modules/vite/bin/vite.js build'
              run_quiet desktop-typecheck npm --prefix taurine-desktop run typecheck
              run_quiet desktop-lint npm --prefix taurine-desktop run lint
              ;;
            mobile)
              run_quiet mobile-build npm --prefix taurine-mobile run build
              run_quiet mobile-tests npm --prefix taurine-mobile run test -- --maxWorkers=1 --minWorkers=1 \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/mobile.json"
              run_quiet mobile-typecheck npm --prefix taurine-mobile run typecheck
              run_quiet mobile-lint npm --prefix taurine-mobile run lint
              ;;
            bundle-budget)
              # The checker compares both frontend dist trees. Build them on
              # this isolated runner instead of passing private artifacts.
              run_quiet desktop-vite-build bash -c 'cd taurine-desktop && NODE_OPTIONS=--max-old-space-size=8192 node ./node_modules/vite/bin/vite.js build'
              run_quiet mobile-build npm --prefix taurine-mobile run build
              run_quiet bundle-budget npm run check:bundle
              ;;
            orchestrate-skill)
              run_quiet contracts npm run check:contracts
              run_quiet wire npm run check:wire
              run_quiet packages-tests npm run test:packages -- \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/packages.json"
              run_quiet dashboard-contracts node --test --test-concurrency=1 skills/orchestrate/scripts/__tests__/dashboard.test.mjs
              run_quiet orchestrate-verification node skills/orchestrate/scripts/verify.mjs --json
              ;;
            *)
              echo "Unknown macOS validation concern: ${CONCERN}" >&2
              exit 1
              ;;
          esac

      - name: Run isolated macOS Rust concern
        if: ${{ startsWith(matrix.concern, 'rust-') }}
        shell: bash
        env:
          CONCERN: ${{ matrix.concern }}
          OS_LABEL: macOS
        run: |
          set -euo pipefail

          # The helpers below are the Linux `rust-*` concerns' own (see
          # linux-validation-concern.yml, which is where the reasoning for each lives),
          # with the changes a macOS or Windows runner needs and nothing else:
          # - carriage returns are stripped before any pattern runs, because Windows
          #   tools end lines with CRLF and the anchored patterns below would never match;
          # - the path rules also cover a Windows drive path, the `\\?\` prefix and the
          #   registry checkout of a dependency, so no absolute runner path is published;
          # - the failure classes a Windows or macOS test binary can add (a missing entry
          #   point or DLL, a stack overflow, a dynamic library that would not load) and a
          #   vcpkg port build failure get their own fixed one-line classification.
          # Everything else, including what is and is not published, is unchanged: only
          # failing test names, `error[Ennnn]` headers with their location, and cargo's
          # own fixed failure shapes leave this runner.
          workspace_strip='s#^$##'
          if [[ "${GITHUB_WORKSPACE}" != *\\* ]]; then
            workspace_strip="s#${GITHUB_WORKSPACE}/src/##g"
          fi

          cargo_sanitize() {
            tr -d '\r' <"$1" |
              sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' |
              sed -E 's#\\\\\?\\##g' |
              sed -E 's#[^ ]*[\\/]registry[\\/]src[\\/][^\\/ ]+[\\/]#<registry>/#g' |
              sed -E "${workspace_strip}" |
              sed -E 's#[A-Za-z]:\\ct\\#<target>/#g; s#[A-Za-z]:\\.*#<private-path>#g' |
              sed -E 's#/Users/.*#<private-path>#g; s#/private/.*#<private-path>#g; s#/home/runner/work/.*#<private-path>#g; s#(gh[pousr]_|github_pat_)[A-Za-z0-9_]+#<redacted>#g; s#Bearer [A-Za-z0-9._~+/=-]+#Bearer <redacted>#g' |
              cut -c1-200
          }

          # A failed test's captured output (`---- name stdout ----` up to the next
          # `failures:`) is dropped whole, compiler warnings are dropped, an
          # `error[Ennnn]` header is published with its `-->` location, and an uncoded
          # `error:` line only when it is followed by a `-->` location or is one of
          # cargo's own fixed shapes. `error: building <port>:<triplet> failed` is
          # vcpkg's own fixed line naming a public third-party port, never private code.
          cargo_test_detail() {
            cargo_sanitize "$1" | awk '
              /^---- .* (stdout|stderr) ----$/ { in_output = 1; next }
              /^failures:$/ { in_output = 0; next }
              in_output { next }
              /^warning: / { block = "warning"; pending = ""; next }
              /^error\[E[0-9]+\]: / { block = "error"; pending = ""; print; next }
              /^error: building [A-Za-z0-9_.+-]+:[A-Za-z0-9_-]+ failed/ { block = "vcpkg"; pending = ""; print; next }
              /^error: / {
                block = "error"; pending = ""
                if ($0 ~ /^error: (could not compile|test failed, to rerun pass|[0-9]+ targets? failed:|failed to run custom build command for|workspace member |the lock file |linking with |failed to (download|select|get|load|parse|fetch)|no matching package|package ID specification)/) print
                else pending = $0
                next
              }
              /^[[:space:]]*--> / {
                if (block == "error") { if (pending != "") print pending; pending = ""; print }
                next
              }
              /^test .* FAILED$/ || /^test result: FAILED/ || /^[[:space:]]+`-p [^`]+`$/ { print }
            ' | head -80 >&2 || true
          }

          cargo_test_reason() {
            local log="$1"
            if grep -qE '^error: workspace member ' "${log}"; then echo "a workspace member is assigned to no ${OS_LABEL} Rust test concern"
            elif grep -qE 'needs to be updated but --locked was passed|lock file .* needs to be updated' "${log}"; then echo 'committed Cargo.lock is out of date (refused by --locked)'
            elif grep -qE '^error: building .* failed|vcpkg install failed|error: vcpkg' "${log}"; then echo 'vcpkg dependency install failure'
            elif grep -qE 'Unable to find libclang|libclang.*[Nn]o such file' "${log}"; then echo 'libclang or bindgen failure'
            elif grep -qE 'failed to run custom build command' "${log}"; then echo 'dependency or crate build script failure'
            elif grep -qE 'No space left on device|not enough space on the disk|os error 112' "${log}"; then echo 'runner disk exhaustion'
            elif grep -qE '^error: linking with ' "${log}"; then echo 'link failure (missing system library or resource exhaustion)'
            elif grep -qE 'signal: 9|SIGKILL' "${log}"; then echo 'a process was killed (likely memory exhaustion)'
            elif grep -qE '0xc0000139|STATUS_ENTRYPOINT_NOT_FOUND|0xc0000135|STATUS_DLL_NOT_FOUND|Library not loaded' "${log}"; then echo 'a test binary could not start (missing entry point, DLL or dynamic library)'
            elif grep -qE '0xc00000fd|STATUS_STACK_OVERFLOW|has overflowed its stack' "${log}"; then echo 'a test binary overflowed its stack'
            elif grep -qE 'test result: FAILED|^error: test failed|^error: [0-9]+ targets? failed' "${log}"; then echo 'test failure'
            elif grep -qE '^error(\[E[0-9]{4}\])?: |could not compile' "${log}"; then echo 'compilation failure'
            elif grep -qE 'failed to (download|select|get|load|parse|fetch)' "${log}"; then echo 'dependency download or resolution failure'
            else echo 'command returned non-zero'
            fi
          }

          run_quiet() {
            local label="$1"; shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              tr -d '\r' <"${log}" >"${log}.lf" && mv "${log}.lf" "${log}"
              echo "${label}: failed ($(cargo_test_reason "${log}"); sanitized detail below)" >&2
              cargo_test_detail "${log}"
              exit 1
            fi
          }

          # Every sub-step runs and is reported, as in the Linux concerns: the sub-steps
          # are independent, so stopping at the first failure would hide results.
          deferred_results=()
          deferred_failed=0
          run_deferred() {
            local label="$1"; shift
            local status
            set +e
            ( set -e; run_quiet "${label}" "$@" )
            status=$?
            set -e
            if [[ "${status}" -eq 0 ]]; then
              deferred_results+=("${label}|passed")
            else
              deferred_results+=("${label}|failed: $(cargo_test_reason "${RUNNER_TEMP}/${label}.log")")
              deferred_failed=1
            fi
          }

          finish_deferred() {
            local entry
            {
              echo "## ${OS_LABEL} ${CONCERN} sub-steps"
              echo
              echo '| Sub-step | Result |'
              echo '| --- | --- |'
              for entry in "${deferred_results[@]}"; do
                echo "| \`${entry%%|*}\` | ${entry#*|} |"
              done
              echo
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "${CONCERN} sub-step results:"
            for entry in "${deferred_results[@]}"; do
              echo "  ${entry%%|*}: ${entry#*|}"
            done
            df -h / 2>/dev/null || true
            if [[ "${deferred_failed}" -ne 0 ]]; then
              echo "${CONCERN}: failed (one or more sub-steps failed; each is listed above)" >&2
              exit 1
            fi
          }

          # Which workspace crates each Rust concern tests on this OS. Every member of the
          # private workspace belongs to a concern, and `rust_coverage_check` (run by
          # `rust-domain`) fails when a member is in none of them, so a crate added later
          # cannot go untested by omission. The database family needs no list: `rust-db`
          # selects it with cargo's own `taurine-db*` package glob.
          rust_domain_packages=(
            taurine-model taurine-atomic taurine-auth taurine-crypt taurine-store
            taurine-repo taurine-replicate taurine-sync taurine-notes taurine-core
            taurine-exec taurine-scripting taurine-mock taurine-git
            taurine-transport-fs taurine-transport-git taurine-transport-wifi
            taurine-cli
          )

          rust_net_packages=(taurine-peer-sys taurine-net taurine-net-conformance)
          rust_ovpn_packages=(taurine-ovpn-sys)
          rust_app_packages=(taurine-app taurine-desktop taurine-mobile)

          rust_coverage_check() {
            local members member missing=0
            if ! members="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | tr -d '\r' | sort -u)" || [[ -z "${members}" ]]; then
              echo 'error: failed to load the workspace member list' >&2
              return 1
            fi
            while IFS= read -r member; do
              case " ${rust_domain_packages[*]} ${rust_net_packages[*]} ${rust_ovpn_packages[*]} ${rust_app_packages[*]} " in
                *" ${member} "*) continue ;;
              esac
              [[ "${member}" == taurine-db* ]] && continue
              echo "error: workspace member ${member} is tested by no ${OS_LABEL} Rust concern" >&2
              missing=1
            done <<<"${members}"
            return "${missing}"
          }

          # `--locked`: the committed Cargo.lock is what was reviewed and what the Linux
          # contracts concern's advisory sweep audits. `--no-fail-fast`: every failing
          # target is reported in one dispatch. No `--features`: each crate is tested as
          # its manifest builds it, as on Linux. Env-gated live suites print SKIPPED and
          # pass when their variable is unset; the live servers belong to live-proofs.yml.
          case "${CONCERN}" in
            rust-domain)
              # The same crates as Linux, plus taurine-cli, whose exit codes and paths
              # are the part a user on this OS can observe. taurine-crypt links the real
              # macOS Keychain here (its default `keychain` feature, apple-native) against
              # the throwaway keychain the toolchain step created, then is tested again
              # without the feature, which is the build a machine with no keychain gets.
              run_deferred rust-coverage rust_coverage_check
              run_deferred rust-crypt-no-keychain-tests \
                cargo test --locked --no-fail-fast --package taurine-crypt --no-default-features
              run_deferred rust-domain-tests \
                cargo test --locked --no-fail-fast "${rust_domain_packages[@]/#/--package=}"
              ;;
            rust-db)
              # Every `taurine-db*` crate. Platform-neutral engines, but the family has
              # `#[cfg(unix)]` socket paths (mongo, mysql, sidecar, engine) that Linux
              # also takes and macOS-only linking of its bundled C (sqlite, duckdb,
              # libsql), which only a macOS compile proves.
              run_deferred rust-db-tests \
                cargo test --locked --no-fail-fast --package 'taurine-db*'
              ;;
            rust-net)
              # The dialer, the egress verifier and the conformance suites. The latter
              # depend on the vendored openvpn3 shim, so this concern gets the same C++
              # setup as `rust-ovpn`, which tests the shim crate on its own.
              run_deferred rust-net-tests \
                cargo test --locked --no-fail-fast "${rust_net_packages[@]/#/--package=}"
              ;;
            rust-ovpn)
              # The vendored openvpn3 shim. On macOS openvpn3 compiles its own platform
              # integration (MacDNSWatchdog, ReachabilityTracker, MacSleep) against
              # CoreFoundation, SystemConfiguration, IOKit and Security, which no Linux
              # run can compile. The OpenVPN lab tests are `#[ignore]`d: they need the
              # local lab's servers.
              run_deferred rust-ovpn-tests \
                cargo test --locked --no-fail-fast "${rust_ovpn_packages[@]/#/--package=}"
              ;;
            rust-app)
              # The command tier both shells call and the two shells' own unit tests.
              # Tauri's `test` feature drives the commands through its mock runtime, so
              # no window or WebView process is started; AppKit and WKWebView are what
              # the crates link.
              run_deferred rust-app-tests \
                cargo test --locked --no-fail-fast "${rust_app_packages[@]/#/--package=}"
              ;;
            *)
              echo "Unsupported macOS Rust concern: ${CONCERN}" >&2
              exit 2
              ;;
          esac
          finish_deferred

      # Saved only from the protected main branch (every job here already refuses to
      # run elsewhere; the condition repeats it so the write permission is explicit)
      # and only on a miss, so a key is written once and never overwritten.
      - name: Save verified third-party crate sources
        if: ${{ always() && github.ref == 'refs/heads/main' && startsWith(matrix.concern, 'rust-') && steps.cargo-sources.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cargo-home.outputs.dir }}/registry/index
            ${{ steps.cargo-home.outputs.dir }}/registry/cache
            ${{ steps.cargo-home.outputs.dir }}/git/db
          key: cargo-sources-${{ runner.os }}-${{ matrix.concern }}-${{ hashFiles('src/Cargo.lock', 'src/taurine-backend/*/Cargo.lock', 'src/taurine-backend/vendor/*/Cargo.lock', 'src/vendor/*/Cargo.lock') }}

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## macOS ${CONCERN} validation"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo '- Isolated concern passed; no other concern relies on this runner'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The sanitized proof above says validation passed; this section names the
      # tests that passed, so a public run shows exactly which tests a SHA
      # exercised. The inventory is repo-relative file paths and test titles,
      # plus status and duration — never test source, fixtures, data values or
      # environment details. The collector (checked out with the source it
      # reports on) re-scans every path and title with the repository's own
      # secret-shape rules and drops rather than publishes anything that
      # matches; it builds the whole section in memory and writes it once, so
      # nothing reaches the summary unless the sanitized render completed. The
      # runner's raw reporter JSON stays in RUNNER_TEMP and is not uploaded.
      - name: Publish test identities exercised by this concern
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          # Only the concerns that ran a JavaScript test suite have an
          # inventory; every other concern leaves its summary as it was.
          case "${CONCERN}" in
            desktop-shard-1|desktop-shard-2|mobile|orchestrate-skill) ;;
            *) exit 0 ;;
          esac
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          # The collector exits zero even when it cannot collect (fail closed:
          # a fixed "unavailable" line instead of an error or a partial list),
          # but if the collector itself fails to run, publish the same fixed
          # line rather than letting the step turn a green concern red. The
          # section goes to the step log as well as the summary: the summary is
          # what a reader sees, the log is the greppable record of exactly
          # which identities were published to this run.
          section_file="${RUNNER_TEMP}/test-ids/summary-section.md"
          if ! TAURINE_TEST_IDS_DIR="${RUNNER_TEMP}/test-ids" \
            TAURINE_TEST_IDS_ROOT="${GITHUB_WORKSPACE}/src" \
            taurine-desktop/node_modules/.bin/vite-node scripts/ci/collect-test-ids.ts \
            > "${section_file}"; then
            {
              echo "### Tests exercised by this run"
              echo
              echo "Test inventory unavailable: the collector did not complete."
            } > "${section_file}"
          fi
          cat "${section_file}" >> "${GITHUB_STEP_SUMMARY}"
          cat "${section_file}"

      # The concern's own wall-clock time from its first step, so the summary shows it
      # next to the result. Queue time is not included. The dispatcher's timings job
      # tabulates every concern and compares it with a committed baseline.
      - name: Report concern duration
        if: ${{ always() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          started="${CONCERN_STARTED_AT:-}"
          [[ -n "${started}" ]] || exit 0
          elapsed=$(( $(date +%s) - started ))
          printf '### Concern duration\n\n%dm%02ds from the first step, excluding runner queue time.\n' \
            $((elapsed / 60)) $((elapsed % 60)) >> "${GITHUB_STEP_SUMMARY}"

  # Tabulates every concern's duration and conclusion for this run and warns when a
  # concern took more than 25% (and more than two minutes) longer than the committed
  # baseline below, in minutes, taken from recent hosted runs. Warning only: it never
  # fails the run, calls no service beyond this repository's own run API with the
  # run's read-only token, and publishes no artifact. A concern with no baseline is
  # listed without a comparison; update the table when a run is a new normal.
  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' }}
    needs: [validate]
    name: Concern timings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Tabulate concern timings against the baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OS_LABEL: macOS
          BASELINE_MINUTES: '{"rust-app":31,"rust-db":15,"rust-domain":5,"rust-ovpn":2,"desktop-shard-1":9,"desktop-shard-2":10,"desktop-quality":5,"mobile":3,"bundle-budget":2,"orchestrate-skill":3}'
          NAME_PATTERN: '^macOS (?<concern>.+) validation$'
        run: |
          set -euo pipefail
          rows="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            | jq -r --arg re "${NAME_PATTERN}" '.jobs[]
              | select(.started_at != null and .completed_at != null)
              | select(.name | test($re))
              | [(.name | capture($re).concern), (.conclusion // "unknown"),
                 (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor)]
              | @tsv' | sort)"
          {
            echo "## ${OS_LABEL} concern timings"
            echo
            echo '| Concern | Duration | Baseline | Conclusion |'
            echo '| --- | --- | --- | --- |'
          } >> "${GITHUB_STEP_SUMMARY}"
          while IFS=$'\t' read -r concern conclusion seconds; do
            [[ -n "${concern}" ]] || continue
            base="$(jq -r --arg c "${concern}" '.[$c] // empty' <<<"${BASELINE_MINUTES}")"
            shown='none'
            if [[ -n "${base}" ]]; then
              shown="${base}m"
              limit=$(( base * 60 * 125 / 100 ))
              if (( seconds > limit && seconds > base * 60 + 120 )); then
                echo "::warning title=Slow concern::${OS_LABEL} ${concern} took $((seconds / 60))m$((seconds % 60))s against a baseline of ${base}m (more than 25% slower)"
                shown="${base}m (SLOWER)"
              fi
            fi
            printf '| %s | %dm%02ds | %s | %s |\n' "${concern}" $((seconds / 60)) $((seconds % 60)) "${shown}" "${conclusion}" >> "${GITHUB_STEP_SUMMARY}"
          done <<<"${rows}"
