name: Orchestrate skill and dashboard validation (protected)

# This is a trusted, manually dispatched source-bearing job. It intentionally
# has no pull-request, push, reusable, or repository-dispatch trigger. The
# source-read environment is the only place where the App key is available.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string

permissions: {}

concurrency:
  group: orchestrate-validation-${{ github.workflow }}-${{ inputs.source_sha }}
  cancel-in-progress: true

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  validate:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Orchestrate ${{ matrix.concern }} validation
    environment: source-read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        concern:
          - dashboard
          - release-verification
    defaults:
      run:
        working-directory: src
    steps:
      - name: Start the concern timer
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo "CONCERN_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"
          echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected dispatch input
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'orchestrate-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Check out the exact private source SHA
        id: verified-source
        # Kept as ./ : the policy matches this exact form for the private-source action.
        uses: ./.github/actions/source-checkout  # zizmor: ignore[self-repository]
        with:
          source-sha: ${{ inputs.source_sha }}
          app-client-id: ${{ vars.SOURCE_READER_APP_ID }}
          app-private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          repository-id: ${{ env.SOURCE_REPOSITORY_ID }}
          repository-owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repository-name: ${{ env.SOURCE_REPOSITORY_NAME }}

      - name: Set up the pinned Node.js release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Run dashboard contract tests
        if: matrix.concern == 'dashboard'
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/orchestrate-dashboard-tests.log"
          if node --test --test-concurrency=1 skills/orchestrate/scripts/__tests__/dashboard.test.mjs >"${log}" 2>&1; then
            echo 'dashboard-contract-tests: passed'
          else
            echo 'dashboard-contract-tests: failed' >&2
            exit 1
          fi

      - name: Run complete orchestrate release verification
        if: matrix.concern == 'release-verification'
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/orchestrate-release-verification.log"
          if node skills/orchestrate/scripts/verify.mjs --json >"${log}" 2>&1; then
            echo 'orchestrate-release-verification: passed'
          else
            echo 'orchestrate-release-verification: failed' >&2
            exit 1
          fi

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="${REQUESTED_SOURCE_SHA,,}"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## Orchestrate ${CONCERN} validation"
            echo
            echo 'The protected workflow validated the requested exact private SHA.'
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            if [[ "${CONCERN}" == 'dashboard' ]]; then
              echo '- Dashboard contract suite: passed'
            else
              echo '- Full release verification: passed'
            fi
            echo '- Source token: revoked before project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The job's own wall-clock time from its first step, shown next to its result;
      # the timings job tabulates it against a committed baseline.
      - name: Report concern duration
        if: ${{ always() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          started="${CONCERN_STARTED_AT:-}"
          [[ -n "${started}" ]] || exit 0
          elapsed=$(( $(date +%s) - started ))
          printf '### Concern duration\n\n%dm%02ds from the first step, excluding runner queue time.\n' \
            $((elapsed / 60)) $((elapsed % 60)) >> "${GITHUB_STEP_SUMMARY}"

  # Tabulates the duration and conclusion of every concern in this run and warns
  # when one took more than 25% (and more than two minutes) longer than the committed
  # baseline below, in seconds, from the most recent successful hosted run. Warning
  # only: it never fails the run, uses only this run's own read-only API token, and
  # publishes no artifact. An entry with no baseline is listed without a comparison.
  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' }}
    needs: [validate]
    name: Timings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Tabulate timings against the baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: Orchestrate
          BASELINE_SECONDS: '{"release-verification":172,"dashboard":16}'
          NAME_PATTERN: '^Orchestrate (?<concern>.+) validation$'
        run: |
          set -euo pipefail
          rows="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            | jq -r --arg re "${NAME_PATTERN}" '.jobs[]
              | select(.started_at != null and .completed_at != null)
              | select(.name | test($re))
              | [(.name | capture($re).concern), (.conclusion // "unknown"),
                 (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor)]
              | @tsv' | sort)"
          {
            echo "## ${LABEL} timings"
            echo
            echo '| Concern | Duration | Baseline | Conclusion |'
            echo '| --- | --- | --- | --- |'
          } >> "${GITHUB_STEP_SUMMARY}"
          while IFS=$'\t' read -r concern conclusion seconds; do
            [[ -n "${concern}" ]] || continue
            base="$(jq -r --arg c "${concern}" '.[$c] // empty' <<<"${BASELINE_SECONDS}")"
            shown='none'
            if [[ -n "${base}" ]]; then
              shown="$((base / 60))m$(printf '%02d' $((base % 60)))s"
              if (( seconds > base * 125 / 100 && seconds > base + 120 )); then
                echo "::warning title=Slow job::${LABEL} ${concern} took $((seconds / 60))m$((seconds % 60))s against a baseline of ${shown} (more than 25% slower)"
                shown="${shown} (SLOWER)"
              fi
            fi
            printf '| %s | %dm%02ds | %s | %s |\n' "${concern}" $((seconds / 60)) $((seconds % 60)) "${shown}" "${conclusion}" >> "${GITHUB_STEP_SUMMARY}"
          done <<<"${rows}"
