name: Live database proofs (protected)
run-name: Taurine validation ${{ inputs.source_sha }} ${{ inputs.dispatch_key }}

# This is deliberately manual and protected, like source-read. Public pull
# requests never enter this workflow and therefore never receive the
# source-read environment secret.
#
# What it does: against each selected engine's real single-node Docker server,
# run the env-gated conformance/live suite the private repository carries for
# that engine, at an exact private commit. These are the runs the private repo's
# `live_servers.rs` and the IBM live tests describe as owed: the servers are
# too large for the local lab's disk cap, but fit a hosted runner. The runs
# exist to find real driver defects; a red run here is the lane working.
#
# This file is only the dispatcher: input validation, the arm roster (one
# definition per arm, below) and one call of live-proof-arm.yml per selected arm.
# The arm workflow owns the private checkout; the .github/actions/live-* composites
# own the servers (digest pins, ports, readiness) and the build, run and summary.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to prove (doris | starrocks | db2 | informix | rocketmq | iris | postgres | pg-dbx | mysql | mssql | pgtls | bastion), a comma-separated list of them, or all
        required: true
        type: string
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      dispatch_key:
        description: Full SHA-256 key for this exact control revision and normalized dispatch inputs
        required: true
        type: string

permissions: {}

# Proof runs are never cancelled automatically: the whole point is to let a slow server
# finish. Each run has its own group (below), so two selections prove concurrently and none is
# replaced while pending.
concurrency:
  # Each run has its own group: GitHub keeps only one PENDING run per group, so a shared per-SHA
  # group let a later dispatch silently cancel an earlier pending one. Runs are never
  # deduplicated or cancelled; check for an existing run before dispatching (docs/how-ci-works.md).
  # Nothing is shared between runs that a group would protect: caches are first-writer-wins on an
  # exact key, so a race is harmless.
  group: live-proofs-${{ inputs.engine }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    permissions:
      actions: read
      contents: read
    # workflow_dispatch can be selected on another branch in the UI. Fail
    # closed unless this exact workflow came from the protected default branch.
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    name: Plan the live proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      arms: ${{ steps.select.outputs.arms }}
      roster: ${{ steps.select.outputs.roster }}
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before any job enters source-read: its deployment branches must be exactly main and
      # untrusted (docs/how-ci-works.md, "Repository settings the owner applies").
      - name: Verify the source-read deployment branches
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/environment-preflight  # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}

      - name: Verify the coordinator dispatch identity
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CI_WORKFLOW_PATH: .github/workflows/live-proofs.yml
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CI_NORMALIZED_INPUTS: ${{ format('{{"engine":{0},"source_sha":{1}}}', toJSON(inputs.engine), toJSON(inputs.source_sha)) }}
          CI_DISPATCH_CONTRACT_JSON: ''
          CI_GENERATE_ONLY: 'false'
          CI_CONTROL_REPOSITORY: ${{ github.repository }}
          CI_CONTROL_SHA: ${{ github.sha }}
          CI_CONTROL_REF: ${{ github.ref }}
        run: ruby .github/policy/dispatch-identity.rb

      # One dispatch identity, one run: a queued or in-progress run of this
      # workflow carrying the same dispatch key means the same source SHA and
      # inputs are already being validated, so this duplicate stops here,
      # before any token is minted. Nothing shared with the existing run is
      # changed; it can never be cancelled or evicted by this check. The
      # coordinator's ledger remains the primary dispatch discipline.
      - name: Refuse a duplicate dispatch
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_PATH: .github/workflows/live-proofs.yml
          CI_SOURCE_SHA: ${{ inputs.source_sha }}
          CI_DISPATCH_KEY: ${{ inputs.dispatch_key }}
          CI_RUN_ID: ${{ github.run_id }}
        run: ruby .github/policy/refuse-duplicate-dispatch.rb


      - name: Validate the dispatch input and select the arms
        id: select
        shell: bash
        env:
          REQUESTED_ENGINE: ${{ inputs.engine }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi
          # The roster: one definition per arm, in the order the arms are
          # listed. `suites` (multi-suite arms) are the cargo suites the private
          # repository's scripts/check-db.sh lists for that engine, one per
          # entry: "<package> <test targets, comma separated> [test-name filter]".
          # An arm without suites runs one conformance test `target`, narrowed by
          # `filter` (none for rocketmq: both tests in its file are the proof).
          # `report` says the arm's suite prints the conformance report whose
          # header the verdict reads. `blurb` is the image line the summary shows.
          cat > "${RUNNER_TEMP}/roster.json" <<'TCI_LIVE_ROSTER'
          [
            {"engine": "doris", "target": "live_servers", "filter": "doris_passes_every_check", "report": true,
             "blurb": "Images: apache/doris:fe-2.1.8 + apache/doris:be-2.1.8 (single fe + single be; digest-pinned, see resolved images)"},
            {"engine": "starrocks", "target": "live_servers", "filter": "starrocks_passes_every_check", "report": true,
             "blurb": "Image: starrocks/allin1-ubuntu 3.2.3 (all-in-one fe + be)"},
            {"engine": "db2", "target": "db2_live", "filter": "db2_passes_every_check_against_a_live_server", "report": true,
             "blurb": "Image: icr.io/db2_community/db2:11.5.9.0 (privileged, amd64)"},
            {"engine": "informix", "target": "informix_live", "filter": "informix_passes_every_check_against_a_live_server", "report": true,
             "blurb": "Image: ibmcom/informix-developer-database:14.10.FC7W1DE (privileged, amd64)"},
            {"engine": "rocketmq", "target": "rocketmq_live", "filter": "", "report": true,
             "blurb": "Images: apache/rocketmq:5.3.2 (NameServer + broker, brokerIP1 pinned to 127.0.0.1)"},
            {"engine": "iris", "target": "live_servers", "filter": "iris_passes_every_check", "report": true,
             "blurb": "Image: containers.intersystems.com/intersystems/iris-community:2025.3 (pinned by digest, amd64; Atelier REST on the private web server)"},
            {"engine": "postgres", "report": true,
             "suites": ["taurine-db-conformance live_servers postgres_passes_every_check",
                        "taurine-db-postgres live_catalog,live_blob,live_ddl,live_depth,live_explain,live_notices,cancel",
                        "taurine-db-engine live_postgres"],
             "blurb": "Image: postgres 17-alpine (pinned by digest); suites: conformance + taurine-db-postgres live + engine live_postgres"},
            # The same pinned PostgreSQL 17 server, dialled through the Dbx
            # route — plan 25 task 2.5, PG2's live evidence for the Stage-2
            # pilot. The route is selected by the private repository's own
            # Dbx-route suites the way every conformance run selects it: the
            # suite hands the engine's connect walk the adapter family built
            # over the legacy registration (the conformance crate compiles the
            # engine's `dbx-pg` feature), and the walk carries both routes
            # through the same `connect_routed` seam. No environment switch
            # exists or is needed — the dev-only `database.engine.override`
            # stays a compiled-in developer setting, not a dispatch input.
            # Every compiled route row still defaults to Legacy; this arm
            # proves the Dbx route BEFORE the flip decision (PG2), it does not
            # flip anything. The legacy-TLS proof (tls-legacy: PG 12/13 and
            # the PG 17 RSA-kex peer) follows once the private repository
            # lands its PG9 live suite — the SKIPPED=fail law forbids adding
            # an arm whose suites do not exist yet.
            {"engine": "pg-dbx", "report": true,
             "suites": ["taurine-db-conformance dbx_pg_live,dbx_shadow_pg"],
             "blurb": "Image: postgres 17-alpine (pinned by digest, the postgres arm's image); suites: the conformance suite and the shadow diff through the Dbx route"},
            {"engine": "mysql", "report": true,
             "suites": ["taurine-db-conformance live_servers mysql_passes_every_check",
                        "taurine-db-mysql live_blob,live_cancel,live_depth,live_explain,live_notices,live_param_types,live_reset",
                        "taurine-db-engine live_mysql_tls"],
             "blurb": "Image: mysql 8.4 (pinned by digest); suites: conformance + taurine-db-mysql live + engine live_mysql_tls"},
            {"engine": "mssql", "report": true,
             "suites": ["taurine-db-conformance live_servers sql_server_passes_every_check",
                        "taurine-db-mssql live_blob,live_ddl,live_depth,live_explain,live_notices,live_reset,cancel,udt"],
             "blurb": "Image: mssql/server 2022-latest (pinned by digest); suites: conformance + taurine-db-mssql live"},
            {"engine": "pgtls", "report": false,
             "suites": ["taurine-db-postgres live_tls"],
             "blurb": "Images: postgres 17-alpine x2 (pinned by digest): ssl=on with a per-run certificate, and ssl=off"},
            {"engine": "bastion", "report": false,
             "suites": ["taurine-app dbx_connect_live"],
             "blurb": "Images: postgres 17-alpine and the lab bastion (alpine 3.20 base pinned by digest; apk openssh-server unpinned); suite: taurine-app dbx_connect_live"}
          ]
          TCI_LIVE_ROSTER
          names="$(jq -r 'map(.engine) | join(", ")' "${RUNNER_TEMP}/roster.json")"
          requested="$(printf '%s' "${REQUESTED_ENGINE}" | tr -d '[:space:]')"
          if [[ "${requested}" == "all" ]]; then
            wanted="$(jq -c 'map(.engine)' "${RUNNER_TEMP}/roster.json")"
          else
            wanted="$(printf '%s' "${requested}" | jq -Rc 'split(",") | map(select(. != ""))')"
          fi
          if ! jq -en --argjson wanted "${wanted}" --slurpfile roster "${RUNNER_TEMP}/roster.json" \
            '($wanted | length) > 0 and ($wanted | all(. as $w | $roster[0] | any(.engine == $w)))' >/dev/null; then
            echo "engine must be one of: ${names}; a comma-separated list of them, or all" >&2
            exit 1
          fi
          # Selected arms, in roster order and without duplicates.
          arms="$(jq -nc --argjson wanted "${wanted}" --slurpfile roster "${RUNNER_TEMP}/roster.json" \
            '[$roster[0][] | select(.engine as $e | $wanted | index($e)) | .engine]')"
          echo "arms=${arms}" >> "${GITHUB_OUTPUT}"
          echo "roster=$(jq -c 'map({(.engine): .}) | add' "${RUNNER_TEMP}/roster.json")" >> "${GITHUB_OUTPUT}"
          printf 'Requested engine: %s\nSelected arms: %s\nRequested source SHA: %s\n' \
            "${REQUESTED_ENGINE}" "${arms}" "${REQUESTED_SOURCE_SHA,,}"

  prove:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    needs: [plan]
    strategy:
      fail-fast: false
      matrix:
        arm: ${{ fromJSON(needs.plan.outputs.arms) }}
    # Kept as ./ : the policy matches this exact form for protected reusable calls.
    uses: ./.github/workflows/live-proof-arm.yml  # zizmor: ignore[self-repository]
    # Exactly one secret, the source-reader App key, passed by name: the policy
    # requires this for every protected dispatcher and forbids secrets: inherit.
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
    with:
      source_sha: ${{ inputs.source_sha }}
      engine: ${{ matrix.arm }}
      config: ${{ toJSON(fromJSON(needs.plan.outputs.roster)[matrix.arm]) }}

  # Tabulates every arm's duration and conclusion for this run and warns when an
  # arm took more than 25% (and more than two minutes) longer than the committed
  # baseline below, in seconds, taken from recent hosted runs. Warning only: it
  # never fails the run, calls no service beyond this repository's own run API
  # with the run's read-only token, and publishes no artifact. An arm with no
  # baseline is listed without a comparison.
  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') }}
    needs: [prove]
    name: Timings
    runs-on: ubuntu-24.04
    # Reporting only: a queued, slow or cancelled timings job must never fail a run whose
    # concerns all passed (run 37342723559 was cancelled while waiting for a runner).
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Tabulate timings against the baseline
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: table
          label: Live proof
          baseline-seconds: '{"iris":944,"rocketmq":1023,"informix":826,"db2":981,"starrocks":836,"doris":941}'
          name-pattern: '^prove \(.+\) / Live proof — (?<concern>.+)$'
          github-token: ${{ github.token }}
