name: Live database proofs (protected)

# This is deliberately manual and protected, like source-read. Public pull
# requests never enter this workflow and therefore never receive the
# source-read environment secret.
#
# What it does: against one engine's real single-node Docker server, run the
# env-gated conformance/live suite the private repository carries for that
# engine, at an exact private commit. These are the runs the private repo's
# `live_servers.rs` and the IBM live tests describe as owed: the servers are
# too large for the local lab's disk cap, but fit a hosted runner. The runs
# exist to find real driver defects; a red run here is the lane working.
#
# Per-engine quirks are recorded beside each engine's start step below.
on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine to prove (doris | starrocks | db2 | informix | rocketmq | iris)
        required: true
        type: string
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string

permissions: {}

# One engine per group, so two engines can prove concurrently without
# colliding, and a re-dispatch of the same engine queues behind the running
# one instead of cancelling a proof half-done. Proof runs are never cancelled
# automatically: the whole point is to let a slow server finish.
concurrency:
  group: live-proofs-${{ inputs.engine }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  prove:
    permissions:
      contents: read
    # workflow_dispatch can be selected on another branch in the UI. Fail
    # closed unless this exact workflow came from the protected default branch.
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Live proof — ${{ inputs.engine }}
    environment: source-read
    runs-on: ubuntu-24.04
    # Generous by design: the engine servers are slow guests. The Db2 image
    # needs up to ~20 minutes on first boot alone; the Doris BE registers and
    # reports tablets for minutes after its container starts; the Rust test
    # binary builds cold (this control plane caches nothing).
    timeout-minutes: 120
    defaults:
      run:
        working-directory: src
    steps:
      - name: Start the concern timer
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo "CONCERN_STARTED_AT=$(date +%s)" >> "${GITHUB_ENV}"
          echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected dispatch input
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_ENGINE: ${{ inputs.engine }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'live-proofs must run only from the protected main branch' >&2
            exit 1
          fi
          case "${REQUESTED_ENGINE}" in
            doris|starrocks|db2|informix|rocketmq|iris) ;;
            *) echo "engine must be one of: doris, starrocks, db2, informix, rocketmq, iris" >&2; exit 1 ;;
          esac
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi
          printf 'Requested engine: %s\nRequested source SHA: %s\n' "${REQUESTED_ENGINE}" "${REQUESTED_SOURCE_SHA,,}"

      - name: Mint read-only private-source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          # Deliberate: the token is revoked explicitly by the next verification step, before any project command, and that step fails closed; the action's own end-of-job revoke would leave it live while project code runs.
          skip-token-revoke: true  # zizmor: ignore[github-app]

      - name: Check out exact private source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY_OWNER }}/${{ env.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          path: src
          submodules: false
          lfs: false

      - name: Verify identity, exact checkout, and revoke source token
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          verification_failed=0
          requested_sha="${REQUESTED_SOURCE_SHA,,}"
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo 'No source token was minted; refusing to continue' >&2
            exit 1
          fi
          if ! identity="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
            echo 'The configured source repository identity could not be resolved' >&2
            verification_failed=1
          elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || \
            "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || \
            "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
            echo 'The configured source repository identity did not match' >&2
            verification_failed=1
          fi
          if ! checked_out_sha="$(git -C src rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"; then
            echo 'The private source checkout did not complete' >&2
            verification_failed=1
          elif [[ "${checked_out_sha}" != "${requested_sha}" ]]; then
            echo 'The checked-out commit does not match source_sha' >&2
            verification_failed=1
          fi
          if ! api_sha="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/${requested_sha}" |
            jq -er '.sha | ascii_downcase')" || [[ "${api_sha}" != "${requested_sha}" ]]; then
            echo 'The requested source SHA was not resolved from the configured repository' >&2
            verification_failed=1
          fi
          if ! curl --fail --silent --show-error --retry 2 \
            -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/installation/token"; then
            echo 'Source token revocation failed; refusing to execute project code' >&2
            verification_failed=1
          fi
          unset SOURCE_TOKEN
          git -C src config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all credential.helper 2>/dev/null || true
          find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
          (( verification_failed == 0 ))

      # The four proof servers are large guests. The preinstalled hosted
      # toolchains they do not need (an Android SDK, dotnet, GHC, CodeQL) are
      # the first thing to go, so the fe+be image pair and the cold Rust build
      # never fight for the last few gigabytes. A cached-build control plane
      # starts every run from nothing, so nothing here is worth keeping.
      - name: Free disk for the server image
        shell: bash
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/share/swift \
            /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1

      - name: Set up the Rust toolchain and pinned vendored sources
        shell: bash
        run: |
          set -euo pipefail
          # The runner's own rustup, not a third-party action: this control
          # plane adds no action it does not have to.
          rustup --version >/dev/null
          # `[patch.crates-io]` in the workspace root points at `vendor/`
          # by path, and cargo refuses to load a manifest that is not there —
          # so *every* cargo command in this repository fails on a fresh
          # checkout until the script has run. `fetch` verifies each download
          # against the sha256 pinned in vendor.lock.
          if ! bash scripts/vendor-openvpn3.sh fetch >"${RUNNER_TEMP}/vendor-fetch.log" 2>&1; then
            echo 'vendor-fetch: failed (detailed output withheld)' >&2
            exit 1
          fi
          echo 'vendor-fetch: passed'

      - name: Build the engine's proof test binary
        shell: bash
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          set -euo pipefail
          cargo_sanitize() {
            sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' "$1" |
              sed -E "s#${GITHUB_WORKSPACE}/src/##g" |
              sed -E 's#/home/runner/work/[^ ]+#<private-path>#g' |
              cut -c1-200
          }
          cargo_detail() {
            cargo_sanitize "$1" |
              grep -E '^(error(\[E[0-9]{4}\])?|warning): |^[[:space:]]*--> |^test result: |^failures:$' |
              head -40 >&2 || true
          }
          case "${ENGINE}" in
            doris|starrocks|iris) target_args=(--test live_servers) ;;
            db2)             target_args=(--test db2_live) ;;
            informix)        target_args=(--test informix_live) ;;
            rocketmq)        target_args=(--test rocketmq_live) ;;
            *) echo "Unsupported engine: ${ENGINE}" >&2; exit 2 ;;
          esac
          if ! cargo test -p taurine-db-conformance "${target_args[@]}" --no-run \
            >"${RUNNER_TEMP}/build.log" 2>&1; then
            echo 'proof-build: failed; sanitized detail below' >&2
            cargo_detail "${RUNNER_TEMP}/build.log"
            exit 1
          fi
          echo 'proof-build: passed'

      # ── Per-engine servers ────────────────────────────────────────────────
      #
      # Every engine below starts its documented single-node container, waits
      # for the server's own readiness signal (not a fixed sleep), records the
      # server version, and exports the exact environment variables the
      # private suite's gates read. Credentials are throwaways for a loopback
      # container that dies with the runner; the Db2 password is generated at
      # run time so nothing credential-shaped is committed here.
      - name: Start the engine server and wait for readiness
        shell: bash
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mysql-client >/dev/null
          ready=0

          case "${ENGINE}" in
            doris)
              # Apache Doris fe + be, the pair the official quick-start
              # compose brings up (FE keeps the MySQL wire on 9030; the BE is
              # reached by the FE over the docker network, never from the
              # host). fe+be are ~3.9 GB compressed. The BE needs minutes to
              # register and report its tablets after its container starts —
              # the wait below polls the FE for a live backend and allows
              # 15 minutes before giving up. Root ships with an empty
              # password.
              docker network create --subnet=172.20.80.0/24 dbx-doris-net
              docker run -d --name dbx-doris-fe --hostname fe \
                --network dbx-doris-net --ip 172.20.80.2 \
                -e FE_SERVERS=fe1:172.20.80.2:9010 -e FE_ID=1 \
                -p 127.0.0.1:9030:9030 \
                apache/doris:fe-2.1.8
              docker run -d --name dbx-doris-be --hostname be \
                --network dbx-doris-net --ip 172.20.80.3 \
                -e FE_SERVERS=fe1:172.20.80.2:9010 -e BE_ADDR=172.20.80.3:9050 \
                apache/doris:be-2.1.8
              for _ in $(seq 1 60); do
                if mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW BACKENDS\G' 2>/dev/null | grep -q 'Alive: true'; then
                  ready=1
                  break
                fi
                sleep 15
              done
              if (( ready == 0 )); then
                echo 'doris: no live backend after 15 minutes; fe log tail below' >&2
                docker logs dbx-doris-fe 2>&1 | tail -20 >&2 || true
                docker logs dbx-doris-be 2>&1 | tail -20 >&2 || true
                exit 1
              fi
              # Two lab facts a fresh single-BE cluster needs pinned, the way
              # db-lab creates `payments` and sets compatibility knobs for
              # the engines it hosts: modern Doris ships no `default`
              # database, and a table's default replication of 3 cannot be
              # satisfied by one backend. Both are measured, not assumed.
              mysql -h127.0.0.1 -P9030 -uroot -e 'CREATE DATABASE IF NOT EXISTS `default`'
              mysql -h127.0.0.1 -P9030 -uroot -e 'ADMIN SET FRONTEND CONFIG ("force_olap_table_replication_num" = "1")'
              version="$(mysql -h127.0.0.1 -P9030 -uroot -N -e 'select version()' 2>/dev/null | head -1)"
              {
                echo "TAURINE_TEST_DORIS=127.0.0.1:9030"
                echo "PROOF_SERVER_VERSION=${version}"
              } >> "${GITHUB_ENV}"
              ;;

            starrocks)
              # StarRocks all-in-one (FE + BE in one container, supervisord).
              # The image is ~3.6 GB compressed and the docs ask for at least
              # 4 GB of RAM for Docker; the hosted runner provides more. Same
              # readiness shape as Doris: poll the FE's MySQL wire on 9030
              # for a live backend, 20 minutes budget. Root ships with an
              # empty password. A fresh cluster has no `default` database
              # (neither engine ships one any more), so create it — the
              # suite's flavour qualifies table paths by database.
              docker run -d --name dbx-starrocks --hostname dbx-sr \
                -p 127.0.0.1:9030:9030 \
                starrocks/allin1-ubuntu:3.2.3
              for _ in $(seq 1 80); do
                if mysql -h127.0.0.1 -P9030 -uroot -e 'SHOW BACKENDS\G' 2>/dev/null | grep -q 'Alive: true'; then
                  ready=1
                  break
                fi
                sleep 15
              done
              if (( ready == 0 )); then
                echo 'starrocks: no live backend after 20 minutes; log tail below' >&2
                docker logs dbx-starrocks 2>&1 | tail -30 >&2 || true
                exit 1
              fi
              mysql -h127.0.0.1 -P9030 -uroot -e 'CREATE DATABASE IF NOT EXISTS `default`' 2>/dev/null
              version="$(mysql -h127.0.0.1 -P9030 -uroot -N -e 'select version()' 2>/dev/null | head -1)"
              {
                echo "TAURINE_TEST_STARROCKS=127.0.0.1:9030"
                echo "PROOF_SERVER_VERSION=${version}"
              } >> "${GITHUB_ENV}"
              ;;

            db2)
              # IBM Db2 Community on the amd64-only icr.io image. Requires a
              # privileged container and ~10 minutes on first boot while the
              # instance and the DBNAME database are created; IBM's own docs
              # say readiness is the "Setup has completed" line in the
              # container log. Database names are limited to 8 bytes, hence
              # `taurine`. The instance password is generated at run time and
              # handed to the suite through the environment — never printed.
              db2_pass="ci-$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              docker run -d --name dbx-db2 --privileged \
                -p 127.0.0.1:50000:50000 \
                -e LICENSE=accept -e DB2INST1_PASSWORD="${db2_pass}" -e DBNAME=taurine \
                icr.io/db2_community/db2:11.5.9.0
              for _ in $(seq 1 90); do
                if docker logs dbx-db2 2>&1 | grep -q 'Setup has completed'; then
                  ready=1
                  break
                fi
                sleep 15
              done
              if (( ready == 0 )); then
                echo 'db2: setup did not complete in 22 minutes; log tail below' >&2
                docker logs dbx-db2 2>&1 | tail -20 >&2 || true
                exit 1
              fi
              for _ in $(seq 1 12); do
                if (exec 3<>/dev/tcp/127.0.0.1/50000) 2>/dev/null; then
                  ready=2
                  break
                fi
                sleep 5
              done
              if (( ready != 2 )); then
                echo 'db2: setup reported completion but port 50000 never opened' >&2
                exit 1
              fi
              version="$(docker exec dbx-db2 su - db2inst1 -c db2level 2>/dev/null | grep -m1 'DB2 v' || true)"
              {
                echo "TAURINE_TEST_DB2=127.0.0.1:50000"
                echo "TAURINE_TEST_DB2_DB=taurine"
                echo "TAURINE_TEST_DB2_USER=db2inst1"
                echo "TAURINE_TEST_DB2_PASS=${db2_pass}"
                echo "PROOF_SERVER_VERSION=${version}"
              } >> "${GITHUB_ENV}"
              ;;

            informix)
              # IBM Informix Developer Edition, the amd64-only community
              # image (the icr.io community repository needs IBM
              # entitlement; this Docker Hub image is the anonymously
              # pullable one the driver's descriptor names). Privileged, and
              # run with a TTY as its documentation recommends. Readiness is
              # the server's own onstat reporting the engine online — run by
              # binary path with the environment spelled out, because `su -
              # informix` demands a password this image's account cannot
              # answer (measured: every readiness probe silently failed
              # auth while the server had been online for twenty minutes).
              # The developer image ships no empty application database, so
              # the lane creates a logged database for the suite, the way
              # the local lab creates `payments` for other engines. The
              # password is the image's published default for user
              # `informix`.
              # onstat/dbaccess need three variables the image's own layout
              # implies and no login profile exports to `docker exec`.
              docker run -d -t --name dbx-informix --hostname dbx-ifx --privileged \
                -p 127.0.0.1:9088:9088 -p 127.0.0.1:9089:9089 \
                -e LICENSE=accept \
                ibmcom/informix-developer-database:14.10.FC7W1DE
              # Two readiness signals, either of which proves the server is
              # open for business: the engine's own onstat by binary path,
              # and the SQLI listener dialled **inside the container** — the
              # host-mapped port is useless here, because docker's userland
              # proxy accepts a connection the moment the mapping exists,
              # before the server listens (measured: a 250-millisecond-old
              # container "passed" that probe and the lane sailed past a
              # server that had not finished init). The listener probe
              # exists because the exec probe failed for twenty minutes on
              # one runner while the container log showed the server online
              # since minute one — the probe, not the server, was the
              # suspect, and a single signal makes a twenty-minute round
              # trip the only way to learn that.
              # `onstat` exits non-zero as a status bitmask even while the
              # server is On-Line (exit 5 measured on 14.10.FC7W1DE), so the
              # answer is what it prints, never what it returns — and with
              # `pipefail` its exit code must not reach the probe. The same
              # bitmask killed the version capture below through `set -e`:
              # the server came up, the database was created, and the step
              # died mid-assignment without a word.
              informix_online=""
              for _ in $(seq 1 90); do
                informix_online="$(docker exec dbx-informix bash -c 'INFORMIXDIR=/opt/ibm/informix INFORMIXSERVER=informix ONCONFIG=onconfig /opt/ibm/informix/bin/onstat -' 2>/dev/null | grep -E -- '-- On-?Line' || true)"
                if [[ -n "${informix_online}" ]]; then
                  ready=1
                  break
                fi
                if docker exec dbx-informix bash -c 'exec 3<>/dev/tcp/127.0.0.1/9088' 2>/dev/null; then
                  echo 'informix: onstat did not answer but the SQLI listener is accepting (in-container)'
                  ready=2
                  break
                fi
                sleep 20
              done
              if (( ready == 0 )); then
                echo 'informix: not online after 30 minutes' >&2
                echo 'the onstat probe said:' >&2
                docker exec dbx-informix bash -c 'INFORMIXDIR=/opt/ibm/informix INFORMIXSERVER=informix ONCONFIG=onconfig /opt/ibm/informix/bin/onstat -' 2>&1 | tail -5 >&2 || echo '  (the probe itself could not run)' >&2
                docker exec dbx-informix bash -c 'echo exec-alive' 2>&1 | tail -1 >&2 || echo '  (docker exec itself failed)' >&2
                echo 'container log tail:' >&2
                docker logs dbx-informix 2>&1 | tail -30 >&2 || true
                exit 1
              fi
              if ! printf 'create database taurine with log;\n' |
                docker exec -i dbx-informix bash -c 'INFORMIXDIR=/opt/ibm/informix INFORMIXSERVER=informix ONCONFIG=onconfig /opt/ibm/informix/bin/dbaccess -' >/dev/null 2>&1; then
                echo 'informix: creating the proof database failed; dbaccess output below' >&2
                printf 'create database taurine with log;\n' |
                  docker exec -i dbx-informix bash -c 'INFORMIXDIR=/opt/ibm/informix INFORMIXSERVER=informix ONCONFIG=onconfig /opt/ibm/informix/bin/dbaccess -' 2>&1 | tail -10 >&2 || true
                exit 1
              fi
              version="$(docker exec dbx-informix bash -c 'INFORMIXDIR=/opt/ibm/informix INFORMIXSERVER=informix ONCONFIG=onconfig /opt/ibm/informix/bin/onstat -' 2>/dev/null | grep -m1 'IBM Informix' || true)"
              {
                echo "TAURINE_TEST_INFORMIX=127.0.0.1:9088"
                echo "TAURINE_TEST_INFORMIX_DB=taurine"
                echo "TAURINE_TEST_INFORMIX_USER=informix"
                echo "TAURINE_TEST_INFORMIX_PASS=in4mix"
                echo "PROOF_SERVER_VERSION=${version}"
              } >> "${GITHUB_ENV}"
              ;;

            rocketmq)
              # Apache RocketMQ 5.3.2, the NameServer-plus-broker pair the
              # official quick start describes, on a docker network (the
              # image is a few hundred MB compressed — the smallest guest
              # this workflow hosts). The one RocketMQ quirk a loopback lab
              # has is the broker's *advertised* address: what the broker
              # registers with the NameServer is the address the client
              # dials next, so it must be one the host can reach — hence the
              # mounted broker.conf pinning brokerIP1 to 127.0.0.1 with the
              # broker port published beside it. Readiness is the admin
              # conversation itself (mqadmin clusterList answering with the
              # broker), 10 minutes budget. The lane pre-creates the two
              # fixtures the suite names — a topic and a consumer group —
              # because a pristine broker legitimately answers an empty
              # group table, and a run that cannot tell "empty because
              # fresh" from "folder answered with real content" proves
              # nothing about the folder.
              docker network create dbx-rocketmq-net
              printf '%s\n' \
                'brokerClusterName = DefaultCluster' \
                'brokerName = broker-a' \
                'brokerId = 0' \
                'brokerRole = ASYNC_MASTER' \
                'flushDiskType = ASYNC_FLUSH' \
                'brokerIP1 = 127.0.0.1' \
                'listenPort = 10911' \
                'autoCreateTopicEnable = false' \
                > "${RUNNER_TEMP}/broker.conf"
              docker run -d --name dbx-rocketmq-namesrv --hostname namesrv \
                --network dbx-rocketmq-net \
                -p 127.0.0.1:9876:9876 \
                -e JAVA_OPT_EXT="-Xms256m -Xmx256m" \
                apache/rocketmq:5.3.2 sh mqnamesrv
              docker run -d --name dbx-rocketmq-broker --hostname broker \
                --network dbx-rocketmq-net \
                -p 127.0.0.1:10911:10911 -p 127.0.0.1:10909:10909 \
                -v "${RUNNER_TEMP}/broker.conf:/home/rocketmq/conf/broker.conf" \
                -e JAVA_OPT_EXT="-Xms512m -Xmx512m" \
                apache/rocketmq:5.3.2 sh mqbroker -n namesrv:9876 -c /home/rocketmq/conf/broker.conf
              for _ in $(seq 1 30); do
                if docker exec dbx-rocketmq-broker sh mqadmin clusterList -n namesrv:9876 2>/dev/null | grep -q 'broker-a'; then
                  ready=1
                  break
                fi
                sleep 20
              done
              if (( ready == 0 )); then
                echo 'rocketmq: no live broker after 10 minutes; log tails below' >&2
                docker logs dbx-rocketmq-namesrv 2>&1 | tail -20 >&2 || true
                docker logs dbx-rocketmq-broker 2>&1 | tail -30 >&2 || true
                exit 1
              fi
              docker exec dbx-rocketmq-broker sh mqadmin updateTopic -n namesrv:9876 -c DefaultCluster -t taurine_proof_topic >/dev/null
              docker exec dbx-rocketmq-broker sh mqadmin updateSubGroup -n namesrv:9876 -c DefaultCluster -g taurine_proof_group >/dev/null
              version="$(docker exec dbx-rocketmq-broker sh mqadmin clusterList -n namesrv:9876 2>/dev/null | awk 'NR>1 && $2 == "broker-a" {print $5; exit}')"
              {
                echo "TAURINE_TEST_ROCKETMQ=127.0.0.1:9876"
                echo "TAURINE_TEST_ROCKETMQ_TOPIC=taurine_proof_topic"
                echo "TAURINE_TEST_ROCKETMQ_GROUP=taurine_proof_group"
                echo "PROOF_SERVER_VERSION=Apache RocketMQ ${version}"
              } >> "${GITHUB_ENV}"
              ;;

            iris)
              # InterSystems IRIS Community from InterSystems' own registry
              # (anonymous pull), pinned by the multi-arch index digest of
              # tag 2025.3 (amd64 layers measured 1.15 GB compressed from the
              # registry manifest, inside the 2 GB per-engine cap). The driver
              # speaks Atelier REST (/api/atelier/v1) on the image's private
              # web server, port 52773, plain HTTP; the superserver is not
              # published because nothing here uses it. A fresh image forces a
              # password change for its predefined accounts, so the lane hands
              # the entrypoint a throwaway generated per run through its
              # documented `--password-file` flag (the instance consumes the
              # file at first start). The password is masked before it is
              # written anywhere and reaches the suite only through the
              # environment. Readiness is the endpoint the driver's connect
              # probe uses — an authenticated namespace read answering 200 —
              # not a fixed sleep, 10 minutes budget.
              iris_pass="ci$(head -c 12 /dev/urandom | od -An -tx1 | tr -d ' \n')"
              echo "::add-mask::${iris_pass}"
              printf '%s\n' "${iris_pass}" > "${RUNNER_TEMP}/iris-password.txt"
              chmod 644 "${RUNNER_TEMP}/iris-password.txt"
              docker run -d --name dbx-iris \
                -p 127.0.0.1:52773:52773 \
                -v "${RUNNER_TEMP}/iris-password.txt:/tmp/iris-password.txt" \
                containers.intersystems.com/intersystems/iris-community@sha256:00a19ce756e96775c3f04514f8a6f0636122d25bdc22a53e01b57eef12dcaed9 \
                --password-file /tmp/iris-password.txt
              iris_code=000
              for _ in $(seq 1 60); do
                iris_code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
                  -u "SuperUser:${iris_pass}" http://127.0.0.1:52773/api/atelier/v1/USER 2>/dev/null || true)"
                if [[ "${iris_code}" == "200" ]]; then
                  ready=1
                  break
                fi
                sleep 10
              done
              if (( ready == 0 )); then
                echo "iris: Atelier namespace read never answered 200 in 10 minutes (last HTTP ${iris_code}); log tail below" >&2
                docker logs dbx-iris 2>&1 | tail -30 >&2 || true
                exit 1
              fi
              version="$(curl --silent --max-time 10 -u "SuperUser:${iris_pass}" http://127.0.0.1:52773/api/atelier/ 2>/dev/null | jq -r '.result.content.version // empty' 2>/dev/null || true)"
              {
                echo "TAURINE_TEST_IRIS=127.0.0.1:52773"
                echo "TAURINE_TEST_IRIS_PASSWORD=${iris_pass}"
                echo "PROOF_SERVER_VERSION=${version}"
              } >> "${GITHUB_ENV}"
              ;;

            *)
              echo "Unsupported engine: ${ENGINE}" >&2
              exit 2
              ;;
          esac

          docker ps --format '{{.Names}} {{.Status}}'

      # The suite output goes to a runner-local log, and only the sanitized
      # inventory below is ever published: the report's header line, each
      # check's outcome label and title, and cargo's own result line. The
      # detail lines a FAIL carries (expected-versus-got of the driver's
      # answer) and the raw log never leave the runner.
      - name: Run the engine's live proof
        shell: bash
        env:
          ENGINE: ${{ inputs.engine }}
        run: |
          set -euo pipefail
          case "${ENGINE}" in
            doris)     target=live_servers;   filter=doris_passes_every_check ;;
            starrocks) target=live_servers;   filter=starrocks_passes_every_check ;;
            iris)      target=live_servers;   filter=iris_passes_every_check ;;
            db2)       target=db2_live;       filter=db2_passes_every_check_against_a_live_server ;;
            informix)  target=informix_live;  filter=informix_passes_every_check_against_a_live_server ;;
            # Both tests in the file are the proof: the admin-surface run and
            # the refusal run, so no filter — the whole file runs.
            rocketmq)  target=rocketmq_live;  filter="" ;;
            *) echo "Unsupported engine: ${ENGINE}" >&2; exit 2 ;;
          esac
          set +e
          filter_args=()
          [[ -n "${filter}" ]] && filter_args=("${filter}")
          cargo test -p taurine-db-conformance --test "${target}" "${filter_args[@]}" -- --nocapture \
            >"${RUNNER_TEMP}/live-proof.log" 2>&1
          status=$?
          set -e
          echo "cargo test exited ${status}; sanitized report follows in the summary step"
          exit "${status}"

      - name: Publish sanitized live-proof summary
        if: always()
        shell: bash
        env:
          ENGINE: ${{ inputs.engine }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/live-proof.log"
          checked_out_sha="$(git rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"
          echo "engine=${ENGINE} log_exists=$(test -f "${log}" && echo yes || echo no) sha=${checked_out_sha}"
          if [[ ! -f "${log}" ]]; then
            echo 'No proof log was produced; the run step did not execute' >&2
            exit 1
          fi
          header="$(grep -E '^[a-z0-9]+.*[0-9]+ checks: [0-9]+ passed' "${log}" | tail -1 || true)"
          # A FAIL or INVL carries a detail line under its title — the
          # expected-versus-got that names the driver defect, or the setup
          # step that proved nothing. Published beside the label: the content
          # is the suite's own synthetic constants and server error strings,
          # never credentials or captured data. Paths are redacted below.
          outcomes="$(grep -E '^  (PASS|SKIP|FAIL|INVL)  |^        ' "${log}" | sed -E 's/[[:space:]]+$//' | sed -E 's#/home/runner/work/[^ ]+#<private-path>#g' | cut -c1-200 || true)"
          result="$(grep -E '^test result: ' "${log}" | tail -1 || true)"
          test_line="$(grep -E '^test [a-z_]+ \.\.\. (ok|FAILED)' "${log}" | tail -3 || true)"
          # The panic block carries the assertion that named the failure: the
          # connect outcome, the suite's report header, the sign-off's counts.
          # Paths are redacted and lines cut before anything is published; the
          # content is server error strings and the suite's own synthetic
          # constants, never credentials or captured data.
          panicked="$(grep -B2 -A30 'panicked at' "${log}" | head -80 | sed -E 's#/home/runner/work/[^ ]+#<private-path>#g' | cut -c1-200 || true)"
          {
            echo "## Live proof — ${ENGINE}"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo "- Server: ${PROOF_SERVER_VERSION:-version unavailable}"
            case "${ENGINE}" in
              doris)     echo '- Images: apache/doris:fe-2.1.8 + apache/doris:be-2.1.8 (single fe + single be)' ;;
              starrocks) echo '- Image: starrocks/allin1-ubuntu:3.2.3 (all-in-one fe + be)' ;;
              db2)       echo '- Image: icr.io/db2_community/db2:11.5.9.0 (privileged, amd64)' ;;
              informix)  echo '- Image: ibmcom/informix-developer-database:14.10.FC7W1DE (privileged, amd64)' ;;
              rocketmq)  echo '- Images: apache/rocketmq:5.3.2 (NameServer + broker, brokerIP1 pinned to 127.0.0.1)' ;;
              iris)      echo '- Image: containers.intersystems.com/intersystems/iris-community:2025.3 (pinned by digest, amd64; Atelier REST on the private web server)' ;;
            esac
            echo "- Source token: revoked before any project command"
            echo "- Runner: $(nproc) vCPU, $(free -m | awk '/^Mem:/{print $2}') MB RAM, $(df -BG --output=avail / | tail -1 | tr -d ' ') GB disk free after the run"
            echo
            if [[ -z "${header}" ]]; then
              echo '**The suite produced no report** — the proof is not evidence either way.'
              echo
            else
              echo "Suite report (sanitized — check titles only, never data values):"
              echo
              echo '```'
              echo "${header}"
              echo "${outcomes}"
              echo '```'
              echo
            fi
            if [[ -n "${test_line}" ]]; then
              echo '```'
              echo "${test_line}"
              echo "${result}"
              echo '```'
            fi
            if [[ -n "${panicked}" ]]; then
              echo 'Failure block (paths redacted, truncated):'
              echo
              echo '```'
              printf '%s\n' "${panicked}"
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
          # The greppable copy, so the published identities are visible in the
          # log alongside the summary.
          {
            echo "live-proof header: ${header}"
            echo "${outcomes}"
            echo "live-proof ${test_line}"
            echo "live-proof ${result}"
          } || true
          # Fail closed: a log without a report line proves nothing, exactly
          # like a report of nothing but skips.
          [[ -n "${header}" && "${header}" == *", 0 failed, "* && "${header}" == *", 0 invalid"* ]]

      # The job's own wall-clock time from its first step, shown next to its result;
      # the timings job tabulates it against a committed baseline.
      - name: Report concern duration
        if: ${{ always() }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          started="${CONCERN_STARTED_AT:-}"
          [[ -n "${started}" ]] || exit 0
          elapsed=$(( $(date +%s) - started ))
          printf '### Concern duration\n\n%dm%02ds from the first step, excluding runner queue time.\n' \
            $((elapsed / 60)) $((elapsed % 60)) >> "${GITHUB_STEP_SUMMARY}"

  # Tabulates the duration and conclusion of every engine in this run and warns
  # when one took more than 25% (and more than two minutes) longer than the committed
  # baseline below, in seconds, from the most recent successful hosted run. Warning
  # only: it never fails the run, uses only this run's own read-only API token, and
  # publishes no artifact. An entry with no baseline is listed without a comparison.
  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' }}
    needs: [prove]
    name: Timings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Tabulate timings against the baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: Live proof
          BASELINE_SECONDS: '{"iris":944,"rocketmq":1023,"informix":826,"db2":981,"starrocks":836,"doris":941}'
          NAME_PATTERN: '^Live proof — (?<concern>.+)$'
        run: |
          set -euo pipefail
          rows="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            | jq -r --arg re "${NAME_PATTERN}" '.jobs[]
              | select(.started_at != null and .completed_at != null)
              | select(.name | test($re))
              | [(.name | capture($re).concern), (.conclusion // "unknown"),
                 (((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) | floor)]
              | @tsv' | sort)"
          {
            echo "## ${LABEL} timings"
            echo
            echo '| Engine | Duration | Baseline | Conclusion |'
            echo '| --- | --- | --- | --- |'
          } >> "${GITHUB_STEP_SUMMARY}"
          while IFS=$'\t' read -r concern conclusion seconds; do
            [[ -n "${concern}" ]] || continue
            base="$(jq -r --arg c "${concern}" '.[$c] // empty' <<<"${BASELINE_SECONDS}")"
            shown='none'
            if [[ -n "${base}" ]]; then
              shown="$((base / 60))m$(printf '%02d' $((base % 60)))s"
              if (( seconds > base * 125 / 100 && seconds > base + 120 )); then
                echo "::warning title=Slow job::${LABEL} ${concern} took $((seconds / 60))m$((seconds % 60))s against a baseline of ${shown} (more than 25% slower)"
                shown="${shown} (SLOWER)"
              fi
            fi
            printf '| %s | %dm%02ds | %s | %s |\n' "${concern}" $((seconds / 60)) $((seconds % 60)) "${shown}" "${conclusion}" >> "${GITHUB_STEP_SUMMARY}"
          done <<<"${rows}"
