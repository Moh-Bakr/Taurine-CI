name: iOS source validation (protected)

# Manual, protected, source-bearing validation. Pull requests and pushes never
# enter the source-read environment or receive a private-source token.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      rust:
        description: Run the mobile Rust test-target build
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: ios-validation-${{ github.workflow }}-${{ inputs.source_sha }}
  # Never cancel a source-bearing run mid-revocation; let the active token
  # cleanup boundary complete before another dispatch starts.
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  # Builds the concern matrix from the `rust` input and reports the choice. It
  # holds no source, token or environment. The mobile Rust test-target build is
  # opt-in, as the Rust concerns are on macOS and Windows: dispatch with
  # `-f rust=true` for plan tips, develop/uat/main tips and mobile-touching branches.
  plan:
    permissions: {}
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: Plan iOS concerns
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Select the concerns and report the Rust cadence
        id: plan
        shell: bash
        env:
          RUST_REQUESTED: ${{ inputs.rust }}
        run: |
          set -euo pipefail
          base='"ios-native"'
          {
            echo '## iOS Rust concern'
            echo
            echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown} (${RUNNER_OS} ${RUNNER_ARCH})"
            if [[ "${RUST_REQUESTED}" == true ]]; then
              echo "matrix={\"concern\":[${base},\"ios-rust\"]}" >> "${GITHUB_OUTPUT}"
              echo '- Requested (rust=true): ios-rust is scheduled.'
            else
              echo "matrix={\"concern\":[${base}]}" >> "${GITHUB_OUTPUT}"
              echo '- **Not requested** (rust=false): ios-rust was not scheduled. It is neither passed nor failed on this run; dispatch with -f rust=true to run it.'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  validate:
    needs: plan
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: iOS ${{ matrix.concern }} validation
    environment: source-read
    # The generated Xcode project uses objectVersion 77, which requires the
    # Xcode toolchain shipped on macos-15. macos-14's older Xcode rejects it
    # before Tauri can compile the Rust framework.
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # ios-rust (the mobile crate's test targets, compile-only) is added by the
      # `plan` job when rust=true. The iOS simulator target's test binaries are
      # built and linked but not executed: running them needs a booted simulator
      # and a test runner such as cargo-dinghy, which this control plane does not
      # install.
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Start the concern timer
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: start

      - name: Validate protected dispatch input
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'ios-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Check out the exact private source SHA
        id: verified-source
        # Kept as ./ : the policy matches this exact form for the private-source action.
        uses: ./.github/actions/source-checkout  # zizmor: ignore[self-repository]
        with:
          source-sha: ${{ inputs.source_sha }}
          app-client-id: ${{ vars.SOURCE_READER_APP_ID }}
          app-private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          repository-id: ${{ env.SOURCE_REPOSITORY_ID }}
          repository-owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repository-name: ${{ env.SOURCE_REPOSITORY_NAME }}

      - name: Start the egress audit
        # Audit only: records outbound destinations, never blocks, never fails the job.
        continue-on-error: true
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/egress-audit  # zizmor: ignore[self-repository]
        with:
          phase: start

      - name: Install the shared sanitizers
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/sanitize  # zizmor: ignore[self-repository]

      - name: Set up Node.js and install the locked JavaScript dependencies
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/node-setup  # zizmor: ignore[self-repository]
        with:
          root: ${{ matrix.concern != 'ios-rust' }}
          desktop: false
          mobile: ${{ matrix.concern != 'ios-rust' }}
          vendor-fetch: ${{ matrix.concern == 'ios-native' || matrix.concern == 'ios-rust' }}

      - name: Install the mobile failure reporter
        shell: bash
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/taurine-ci/mobile-report.sh" <<'TCI_MOBILE_REPORT_LIBRARY'
          # shellcheck shell=bash
          # Mobile failure reporting. Sourced after the shared sanitize library. A failed command
          # publishes one fixed classification, its exit status, and (for Rust errors) the error
          # code with its repository-relative file:line. Message text, source excerpts, symbol
          # names and tool output are never published.

          mobile_reason() {
            local log="$1" reason
            reason="$(cargo_test_reason "${log}")"
            if [[ "${reason}" != 'command returned non-zero' ]]; then echo "${reason}"
            elif grep -qE 'SDK location not found|No version of NDK matched' "${log}"; then echo 'Android SDK or NDK not found'
            elif grep -qE 'Could not (resolve|download|GET)|UnknownHostException|Connection (reset|timed out)' "${log}"; then echo 'dependency download failure (network)'
            elif grep -qE '^> Task [^[:space:]]+ FAILED$|^FAILURE: Build failed' "${log}"; then echo 'Gradle build failure'
            elif grep -qE 'Undefined symbols for architecture' "${log}"; then echo 'link failure: undefined symbols'
            elif grep -qiE 'no such module' "${log}"; then echo 'Swift module not found'
            elif grep -qiE 'code ?sign|provisioning profile' "${log}"; then echo 'code signing or provisioning failure'
            elif grep -qE '[*][*] (BUILD|ARCHIVE) FAILED [*][*]' "${log}"; then echo 'xcodebuild build failure'
            elif grep -qiE 'ETIMEDOUT|ECONNRESET|EAI_AGAIN' "${log}"; then echo 'network failure'
            else echo 'command returned non-zero'
            fi
          }

          # `error[Ennnn]` as the code, with the repository-relative file:line of its `-->` location.
          mobile_error_sites() {
            local sites
            sites="$(sanitize_stream <"$1" | strip_excerpts | awk '
              match($0, /error\[E[0-9][0-9]*\]/) { code = substr($0, RSTART + 6, RLENGTH - 7); next }
              match($0, /--> [^ ]*:[0-9][0-9]*:[0-9][0-9]*/) {
                if (code != "") {
                  n = split(substr($0, RSTART + 4, RLENGTH - 4), a, ":")
                  print "  " code " " a[1] ":" a[2]
                  code = ""
                }
              }
            ' | awk '!seen[$0]++' | head -30)"
            if [[ -n "${sites}" ]]; then
              echo 'Rust errors (code and file:line; messages withheld):' >&2
              printf '%s\n' "${sites}" >&2
            fi
          }

          # Gradle names the failed task on a fixed shape of line; task names are build structure.
          mobile_failed_tasks() {
            local tasks
            tasks="$(tr -d '\r' <"$1" | grep -E '^> Task [^[:space:]]+ FAILED$' | head -10 || true)"
            if [[ -n "${tasks}" ]]; then
              echo 'Gradle tasks that failed:' >&2
              printf '%s\n' "${tasks}" >&2
            fi
          }

          # One command, one published line. Output stays in a runner-local log. A caller may define
          # mobile_extra_detail <label> <log> for fixed, count-only diagnostics of one label.
          mobile_run() {
            local label="$1"; shift
            local log="${RUNNER_TEMP}/${label}.log" rc=0
            "$@" >"${log}" 2>&1 || rc=$?
            if [[ "${rc}" -eq 0 ]]; then
              echo "${label}: passed"
              return 0
            fi
            tr -d '\r' <"${log}" >"${log}.lf" && mv "${log}.lf" "${log}"
            echo "${label}: failed ($(mobile_reason "${log}"); exit ${rc}; sanitized detail below)" >&2
            mobile_error_sites "${log}"
            mobile_failed_tasks "${log}"
            # Tauri refuses mismatched npm/crate pairs; package names and versions only.
            tauri_version_mismatch "${log}" >&2 || true
            if declare -F mobile_extra_detail >/dev/null; then mobile_extra_detail "${label}" "${log}"; fi
            exit 1
          }
          TCI_MOBILE_REPORT_LIBRARY

      - name: Locate libclang in the Xcode toolchain
        if: matrix.concern == 'ios-native' || matrix.concern == 'ios-rust'
        shell: bash
        run: |
          set -euo pipefail
          # rquickjs's bindgen needs the standalone libclang dylib. It comes from the
          # Xcode toolchain of the runner image (the image version and Xcode release are
          # recorded in the job summary), so no formula or archive is installed and
          # nothing floats: a Homebrew llvm would be whichever release brew serves today.
          toolchain_lib="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
          [[ -f "${toolchain_lib}/libclang.dylib" ]] || { echo 'libclang dylib is unavailable in the Xcode toolchain' >&2; exit 1; }
          {
            echo "LIBCLANG_PATH=${toolchain_lib}"
            # rquickjs 0.9 constructs its own bindgen `--target` argument from Cargo's
            # simulator triple and does not consume BINDGEN_EXTRA_*. Keep a global override
            # for bindgen implementations that do honor it; the patch step below applies the
            # equivalent runner-local workaround to rquickjs without changing the source.
            echo 'BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-apple-ios'
            # Cargo names the Rust simulator target `aarch64-apple-ios-sim`, but that suffix
            # is not a valid clang target triple. Bindgen only needs the Apple ABI while
            # Cargo/Xcode still selects the simulator SDK.
            echo 'BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim=--target=aarch64-apple-ios'
          } >> "${GITHUB_ENV}"

      - name: Generate the ephemeral iOS project
        if: matrix.concern == 'ios-native'
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
          source "${RUNNER_TEMP}/taurine-ci/mobile-report.sh"
          # Keep native outputs runner-local.  The checked-in Xcode project is
          # intentionally source-only; Tauri recreates the generated Rust
          # framework inputs during the build.
          mobile_run ios-init npm --prefix taurine-mobile run ios:init -- --ci --skip-targets-install
          # The current project has no third-party pods. Calling `pod install`
          # here adds a hosted-machine/Xcode-license dependency and creates a
          # workspace that Tauri does not consume. Install the exact simulator
          # Rust target required by the explicit build below instead.
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
          # swift-rs 1.0.8 under Xcode >= 27 promotes Swift static-archive
          # @_cdecl exports with llvm-objcopy; the rustup llvm-tools
          # component ships it in the sysroot the private build script
          # probes. Missing it fails the app link with undefined arm64
          # symbols (_register_plugin and friends).
          rustup component add llvm-tools
          # hickory-resolver's Apple system-configuration reader (feature-
          # unified in via mongodb's dns-resolver) binds SystemConfiguration
          # through a cargo build-script flag that Xcode's libapp.a link
          # drops. Declare the framework in the generated project so the
          # app link keeps it, then regenerate the project.
          # Newer sources declare the framework themselves (tauri.conf.json
          # bundle.iOS.frameworks); only older ones need it inserted here.
          if ! grep -q 'SystemConfiguration.framework' taurine-mobile/src-tauri/gen/apple/project.yml \
            && ! grep -q 'SystemConfiguration' taurine-mobile/src-tauri/tauri.conf.json; then
          python3 - <<'PY'
          p = 'taurine-mobile/src-tauri/gen/apple/project.yml'
          s = open(p).read()
          needle = '      - sdk: UIKit.framework'
          assert needle in s, 'UIKit framework entry not found in project.yml'
          s = s.replace(needle, '      - sdk: SystemConfiguration.framework\n' + needle, 1)
          open(p, 'w').write(s)
          PY
          fi
          # XcodeGen is a pinned release archive verified against its SHA-256 (the
          # digest GitHub publishes for the release asset), never a Homebrew formula.
          xcodegen_version='2.46.0'
          xcodegen_sha256='4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806'
          xcodegen_zip="${RUNNER_TEMP}/xcodegen.zip"
          curl --fail --silent --show-error --location --retry 3 -o "${xcodegen_zip}" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${xcodegen_version}/xcodegen.zip"
          echo "${xcodegen_sha256}  ${xcodegen_zip}" | shasum -a 256 --check --status
          unzip -q "${xcodegen_zip}" -d "${RUNNER_TEMP}/xcodegen-${xcodegen_version}"
          xcodegen_bin="${RUNNER_TEMP}/xcodegen-${xcodegen_version}/xcodegen/bin/xcodegen"
          [[ -x "${xcodegen_bin}" ]] || { echo 'pinned xcodegen is unavailable' >&2; exit 1; }
          echo "${xcodegen_bin%/*}" >> "${GITHUB_PATH}"
          (cd taurine-mobile/src-tauri/gen/apple && "${xcodegen_bin}" generate)
          test -f taurine-mobile/src-tauri/gen/apple/taurine-mobile.xcodeproj/project.pbxproj

      - name: Prepare the iOS simulator Rust target for the test-target build
        if: matrix.concern == 'ios-rust'
        shell: bash
        run: |
          set -euo pipefail
          # The Rust half of the native concern's setup, without the Xcode project: the
          # simulator target. libclang and the bindgen target override come from the
          # toolchain step above.
          rustup target add aarch64-apple-ios-sim

      - name: Patch rquickjs simulator bindgen target on runner
        if: matrix.concern == 'ios-native' || matrix.concern == 'ios-rust'
        shell: bash
        run: |
          set -euo pipefail
          # A source that carries its own fork of rquickjs-sys (vendor/rquickjs-sys) has the
          # fix built in; the runner-side patch of the registry copy is only for older
          # sources that still use the published crate.
          if [[ -d vendor/rquickjs-sys ]]; then
            echo 'rquickjs: the source carries its own rquickjs-sys; no runner patch needed'
            exit 0
          fi
          # rquickjs-sys 0.9.0 hard-codes TARGET into its bindgen flags. The
          # Cargo simulator target is valid to Rust but Apple clang rejects
          # its `-sim` suffix. Fetch the already-locked dependency and patch
          # only the ephemeral registry copy; no private source is published.
          cargo fetch --manifest-path taurine-mobile/src-tauri/Cargo.toml --target aarch64-apple-ios-sim >/dev/null
          registry_root="${CARGO_HOME:-${HOME}/.cargo}/registry/src"
          rquickjs_build="$(find "${registry_root}" -path '*/rquickjs-sys-0.9.0/build.rs' -print -quit)"
          [[ -n "${rquickjs_build}" ]] || { echo 'rquickjs-sys build script was not fetched' >&2; exit 1; }
          python3 - "${rquickjs_build}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old = '    let mut cflags = vec![format!("--target={}", target)];'
          new = '''    let clang_target = if target == "aarch64-apple-ios-sim" {
              "aarch64-apple-ios"
          } else {
              target.as_str()
          };
          let mut cflags = vec![format!("--target={}", clang_target)];'''
          if old not in text:
              raise SystemExit('unexpected rquickjs-sys build script; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run isolated iOS validation concern
        shell: bash
        env:
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/taurine-ci/sanitize.sh"
          source "${RUNNER_TEMP}/taurine-ci/mobile-report.sh"
          # A failed link names its undefined symbols, which can be private function
          # names, so none are published. What is published is the toolchain (public)
          # and counts: how many symbols, of which kinds, and which static archives
          # referenced them, which is enough to tell a Swift plugin problem from a
          # missing platform framework.
          mobile_extra_detail() {
            local label="$1" log="$2" symbols swift_symbols objc_symbols
            [[ "${label}" == ios-build ]] || return 0
            xcodebuild -version 2>/dev/null | tr '\n' ' ' >&2 || true
            echo >&2
            symbols="$(grep -cE '^[[:space:]]+"[^"]+", referenced from:' "${log}" || true)"
            swift_symbols="$(grep -cE '^[[:space:]]+"_?[$]s' "${log}" || true)"
            objc_symbols="$(grep -cE '^[[:space:]]+"_?[_]?OBJC_' "${log}" || true)"
            echo "ios-build link diagnostics: ${symbols} undefined symbols (${swift_symbols} Swift, ${objc_symbols} Objective-C)" >&2
            grep -oE ' in [A-Za-z0-9_.+-]+[.]a[(]' "${log}" | sort | uniq -c | sort -rn | head -10 | sed -E 's/[(]$//' >&2 || true
            grep -ohE "auto-linked framework '[A-Za-z0-9_]+'" "${log}" | sort -u >&2 || true
          }
          case "${CONCERN}" in
            ios-native)
              mobile_run ios-build npm --prefix taurine-mobile run ios:build -- --ci --no-sign --target aarch64-sim
              ;;
            ios-rust)
              # Compile-only: build and link every test target of the mobile crate for
              # the iOS simulator triple, so the `cfg(target_os = "ios")` code and its
              # tests are type-checked and linked on a hosted runner. Not executed.
              mobile_run ios-test-targets cargo test --locked --no-run --package taurine-mobile --target aarch64-apple-ios-sim
              ;;
            *)
              echo "Unknown iOS validation concern: ${CONCERN}" >&2
              exit 1
              ;;
          esac

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## iOS ${CONCERN} validation"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown} (${RUNNER_OS} ${RUNNER_ARCH}, $(sw_vers -productName) $(sw_vers -productVersion))"
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- libclang: ${LIBCLANG_PATH:-not used}"
            echo "- Node.js: $(node --version); Rust: $(rustc --version)"
            echo '- Isolated concern passed; no private artifacts were shared between runners'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The job's own wall-clock time, shown next to its result; the timings job
      # tabulates it against a committed baseline.
      - name: Report concern duration
        if: ${{ always() }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: report

      - name: Report observed egress
        if: always()
        continue-on-error: true
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/egress-audit  # zizmor: ignore[self-repository]
        with:
          phase: report

  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' }}
    needs: [validate]
    name: Timings
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record the runner image
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Runner'
            echo
            echo "- Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "- Runner: ${RUNNER_OS} ${RUNNER_ARCH}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Tabulate timings against the baseline
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: table
          label: iOS
          baseline-seconds: '{"ios-native":1113}'
          name-pattern: '^iOS (?<concern>.+) validation$'
          github-token: ${{ github.token }}

  # One verdict for the dispatch: every possible concern is listed, those that did not
  # run as "not selected" (never as passed), and the run fails if any concern that ran
  # did not succeed. PASS (full) is the only verdict that admits a merge.
  result:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main' }}
    needs: [validate]
    name: Result
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record the runner image
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Runner'
            echo
            echo "- Image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            echo "- Runner: ${RUNNER_OS} ${RUNNER_ARCH}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write the run verdict
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/run-result  # zizmor: ignore[self-repository]
        with:
          label: iOS
          expected-concerns: '["ios-native","ios-rust"]'
          name-pattern: '^iOS (?<concern>.+) validation$'
          source-sha: ${{ inputs.source_sha }}
          github-token: ${{ github.token }}
