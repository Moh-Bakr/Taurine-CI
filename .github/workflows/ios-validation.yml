name: iOS source validation (protected)

# Manual, protected, source-bearing validation. Pull requests and pushes never
# enter the source-read environment or receive a private-source token.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-validation-${{ github.workflow }}-${{ inputs.source_sha }}
  # Never cancel a source-bearing run mid-revocation; let the active token
  # cleanup boundary complete before another dispatch starts.
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  validate:
    if: github.repository == 'Moh-Bakr/Taurine-CI' && github.ref == 'refs/heads/main'
    name: iOS ${{ matrix.concern }} validation
    environment: source-read
    # The generated Xcode project uses objectVersion 77, which requires the
    # Xcode toolchain shipped on macos-15. macos-14's older Xcode rejects it
    # before Tauri can compile the Rust framework.
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        concern:
          - ios-native
          - mobile-quality
          - bundle-budget
          - orchestrate-skill
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected dispatch input
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'ios-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Mint read-only private-source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact private source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY_OWNER }}/${{ env.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify identity, exact checkout, and revoke source token
        if: always()
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          failed=0
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo 'No source token was minted; refusing to continue' >&2
            exit 1
          fi
          if ! identity="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
            echo 'The configured source repository identity could not be resolved' >&2
            failed=1
          elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
            echo 'The configured source repository identity did not match' >&2
            failed=1
          fi
          if ! checked_out_sha="$(git rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"; then
            echo 'The private source checkout did not complete' >&2
            failed=1
          elif [[ "${checked_out_sha}" != "${requested_sha}" ]]; then
            echo 'The checked-out commit does not match source_sha' >&2
            failed=1
          fi
          if ! api_sha="$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/${requested_sha}" | jq -er '.sha | ascii_downcase')" || [[ "${api_sha}" != "${requested_sha}" ]]; then
            echo 'The requested source SHA was not resolved from the configured repository' >&2
            failed=1
          fi
          if ! curl --fail --silent --show-error --retry 2 -X DELETE -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${SOURCE_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "${GITHUB_API_URL}/installation/token"; then
            echo 'Source token revocation failed; refusing to execute project code' >&2
            failed=1
          fi
          unset SOURCE_TOKEN
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all credential.helper 2>/dev/null || true
          find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
          (( failed == 0 ))

      - name: Set up the pinned Node.js release
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      - name: Install locked JavaScript dependencies
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"; shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              echo "${label}: failed" >&2
              # Keep diagnostics useful without publishing source snippets or full logs.
              grep -E '^(error(\[[^]]+\])?:|failed to build|could not compile|Caused by:|xcodebuild: error:|BUILD FAILED)' "${log}" | tail -20 >&2 || true
              exit 1
            fi
          }
          run_quiet npm-root npm ci --ignore-scripts
          # The shared package test runner uses taurine-desktop's Vitest binary.
          run_quiet npm-desktop npm --prefix taurine-desktop ci --ignore-scripts
          run_quiet npm-mobile npm --prefix taurine-mobile ci --ignore-scripts
          # Cargo.toml patches boringtun to a pinned, locally fetched crate.
          # vendor/ is intentionally ignored and therefore absent from the
          # private checkout; materialize and verify the pinned dependencies on
          # this ephemeral runner before Cargo resolves the mobile workspace.
          if [[ "${{ matrix.concern }}" == 'ios-native' ]]; then
            run_quiet vendor-fetch bash scripts/vendor-openvpn3.sh
          fi

      - name: Generate the ephemeral iOS project
        if: matrix.concern == 'ios-native'
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/ios-init.log"
          # Keep native outputs runner-local.  The checked-in Xcode project is
          # intentionally source-only; Tauri recreates the generated Rust
          # framework inputs during the build.
          if npm --prefix taurine-mobile run ios:init -- --ci --skip-targets-install >"${log}" 2>&1; then
            echo 'ios-init: passed'
          else
            echo 'ios-init: failed' >&2
            exit 1
          fi
          # The current project has no third-party pods. Calling `pod install`
          # here adds a hosted-machine/Xcode-license dependency and creates a
          # workspace that Tauri does not consume. Install the exact simulator
          # Rust target required by the explicit build below instead.
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
          # rquickjs bindgen is shared by the mobile Rust target. Xcode ships
          # clang, but the bindgen loader needs the standalone libclang dylib.
          brew list llvm >/dev/null 2>&1 || brew install llvm
          llvm_prefix="$(brew --prefix llvm)"
          [[ -f "${llvm_prefix}/lib/libclang.dylib" ]] || { echo 'libclang dylib is unavailable' >&2; exit 1; }
          echo "LIBCLANG_PATH=${llvm_prefix}/lib" >> "${GITHUB_ENV}"
          # rquickjs 0.9 constructs its own bindgen `--target` argument from
          # Cargo's simulator triple and does not consume BINDGEN_EXTRA_*.
          # Keep a global override for bindgen implementations that do honor
          # it; the next step applies the equivalent runner-local workaround
          # to rquickjs without changing the private source checkout.
          echo 'BINDGEN_EXTRA_CLANG_ARGS=--target=aarch64-apple-ios' >> "${GITHUB_ENV}"
          # Cargo names the Rust simulator target `aarch64-apple-ios-sim`, but
          # that suffix is not a valid clang target triple. Bindgen only needs
          # the Apple ABI while Cargo/Xcode still selects the simulator SDK.
          echo 'BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim=--target=aarch64-apple-ios' >> "${GITHUB_ENV}"
          test -f taurine-mobile/src-tauri/gen/apple/taurine-mobile.xcodeproj/project.pbxproj

      - name: Patch rquickjs simulator bindgen target on runner
        if: matrix.concern == 'ios-native'
        shell: bash
        run: |
          set -euo pipefail
          # rquickjs-sys 0.9.0 hard-codes TARGET into its bindgen flags. The
          # Cargo simulator target is valid to Rust but Apple clang rejects
          # its `-sim` suffix. Fetch the already-locked dependency and patch
          # only the ephemeral registry copy; no private source is published.
          cargo fetch --manifest-path taurine-mobile/src-tauri/Cargo.toml --target aarch64-apple-ios-sim >/dev/null
          registry_root="${CARGO_HOME:-${HOME}/.cargo}/registry/src"
          rquickjs_build="$(find "${registry_root}" -path '*/rquickjs-sys-0.9.0/build.rs' -print -quit)"
          [[ -n "${rquickjs_build}" ]] || { echo 'rquickjs-sys build script was not fetched' >&2; exit 1; }
          python3 - "${rquickjs_build}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()
          old = '    let mut cflags = vec![format!("--target={}", target)];'
          new = '''    let clang_target = if target == "aarch64-apple-ios-sim" {
              "aarch64-apple-ios"
          } else {
              target.as_str()
          };
          let mut cflags = vec![format!("--target={}", clang_target)];'''
          if old not in text:
              raise SystemExit('unexpected rquickjs-sys build script; refusing to patch')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Run isolated iOS validation concern
        shell: bash
        env:
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"; shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              echo "${label}: failed" >&2
              # Keep hosted diagnostics actionable while redacting workspace
              # paths and excluding compiler/source output from the public log.
              sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' "${log}" |
              sed -E 's#/Users/[^ ]+#/private/workspace#g; s#/home/runner/work/[^ ]+#/workspace#g' |
                grep -Ei '(^|[[:space:]])(error|fatal|failed|caused by|no such file|not found|xcodebuild|cargo|clang|target)' |
                tail -30 >&2 || true
              if [[ "${label}" == mobile-tests ]]; then
                # Preserve only test names and assertion metadata needed to
                # diagnose hosted-only failures; never publish source lines.
                sed -E $'s/\\033\\[[0-9;]*[[:alpha:]]//g' "${log}" |
                  sed -E 's#/Users/[^ ]+#/private/workspace#g; s#/home/runner/work/[^ ]+#/workspace#g' |
                  grep -Ei '(failed tests|test files|tests[[:space:]]+|assertionerror|expected|received|(^|[[:space:]])(FAIL|PASS)[[:space:]])' |
                  tail -80 >&2 || true
              fi
              if [[ "${label}" == bundle-budget ]]; then
                # Keep only package names and budget arithmetic; the public
                # log must not include generated/private file contents.
                sed -E $'s/\\033\\[[0-9;]*[[:alpha:]]//g' "${log}" |
                  sed -E 's#/Users/[^ ]+#/private/workspace#g; s#/home/runner/work/[^ ]+#/workspace#g' |
                  grep -Ei '(budget|ceiling|exceeded|package|dist|bytes|allowed|actual)' |
                  tail -80 >&2 || true
              fi
              exit 1
            fi
          }
          case "${CONCERN}" in
            ios-native)
              run_quiet ios-build npm --prefix taurine-mobile run ios:build -- --ci --no-sign --target aarch64-sim
              ;;
            mobile-quality)
              run_quiet mobile-build npm --prefix taurine-mobile run build
              run_quiet mobile-tests npm --prefix taurine-mobile run test -- --maxWorkers=1 --minWorkers=1
              run_quiet mobile-typecheck npm --prefix taurine-mobile run typecheck
              run_quiet mobile-lint npm --prefix taurine-mobile run lint
              ;;
            bundle-budget)
              run_quiet desktop-typecheck-build npm --prefix taurine-desktop run typecheck
              run_quiet vite-preflight bash -c 'test -f taurine-desktop/node_modules/vite/bin/vite.js && test -x taurine-desktop/node_modules/.bin/vite'
              run_quiet desktop-vite-build bash -c 'cd taurine-desktop && NODE_OPTIONS=--max-old-space-size=8192 node ./node_modules/vite/bin/vite.js build'
              run_quiet mobile-build npm --prefix taurine-mobile run build
              run_quiet bundle-budget npm run check:bundle
              ;;
            orchestrate-skill)
              run_quiet contracts npm run check:contracts
              run_quiet wire npm run check:wire
              run_quiet packages-tests npm run test:packages
              run_quiet dashboard-contracts node --test --test-concurrency=1 skills/orchestrate/scripts/__tests__/dashboard.test.mjs
              run_quiet orchestrate-verification node skills/orchestrate/scripts/verify.mjs --json
              ;;
            *)
              echo "Unknown iOS validation concern: ${CONCERN}" >&2
              exit 1
              ;;
          esac

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ matrix.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="$(printf '%s' "${REQUESTED_SOURCE_SHA}" | tr '[:upper:]' '[:lower:]')"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## iOS ${CONCERN} validation"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo '- Isolated concern passed; no private artifacts were shared between runners'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"
