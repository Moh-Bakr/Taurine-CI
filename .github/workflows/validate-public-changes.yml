name: Validate public CI policy

# The policy gate for this public repository. It has no OIDC permission, secrets, private
# checkout, cache access or artifact upload, and validates only this repository. Each check
# is a script under .github/policy/ (one responsibility each, read the script header for the
# rule and its rationale); this file only sequences them. Its job name, "Validate workflow
# policy", is the required status check on main.
#
# A pull request carries its own copy of .github/policy/, so the policy it brings could be the
# weakened one that lets it pass. On pull_request the same job therefore also checks out the
# BASE commit's policy and runs every base check against the pull request's tree: a change must
# pass both its own policy (so new fixtures run) and the base's. A legitimate policy change
# that the base policy rejects lands in two steps: first a change that makes the rule
# permissive (or adds the new rule beside the old one), then the change that relies on it
# (docs/how-ci-works.md, "Changing the policy").
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# No job caches unless it declares its own cache-mode; the reviewed split is validate-main (write,
# main only) and validate-untrusted (read) (docs/untrusted-readonly-cache.md, section 4.1).
cache-mode: none

concurrency:
  group: public-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required status check, and nothing else: an aggregate. It runs no checkout and none of this
  # pull request's scripts, only the two guards below, so the result it reports cannot be changed by
  # anything the pull request carries. It needs the base pass (below) and every policy shard, and
  # fails unless each ended in success; a skipped, cancelled or failed job is not a pass. All of them
  # run at the same time, so the gate costs the longest of them, not their sum.
  policy:
    permissions: {}
    name: Validate workflow policy
    needs: [base-pass, policy-evidence, policy-fixtures, policy-mutations, policy-structure]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # FIRST, before the checkout and before any step that runs this pull request's scripts, and no
      # such step may follow it in this job: those can append to GITHUB_ENV or GITHUB_PATH (BASH_ENV,
      # PATH, RUBYOPT) and so change how any LATER step's shell behaves, this guard included. The
      # base-policy pass runs in its own workflow (below), so the result it reached cannot be influenced
      # by anything the checks export; this step keeps the required status check honest: it fails when
      # that workflow did not pass. It needs nothing from the repository. test-base-policy-result.sh
      # pins its position.
      - name: Require the base-policy workflow to have passed
        if: ${{ always() }}
        shell: bash
        env:
          BASE_PASS_RESULT: ${{ needs.base-pass.result }}
        run: |
          set -euo pipefail
          if [[ "${BASE_PASS_RESULT}" != 'success' ]]; then
            echo "::error::the base-policy workflow did not pass (result: ${BASE_PASS_RESULT})"
            exit 1
          fi
          echo 'base policy: the base-policy workflow passed'

      # The same rule for this pull request's own policy, which runs in the four shards: every one must
      # have succeeded, so a shard that is skipped, cancelled, failed or dropped from `needs` cannot pass.
      - name: Require every policy check shard to have passed
        if: ${{ always() }}
        shell: bash
        env:
          POLICY_EVIDENCE_RESULT: ${{ needs.policy-evidence.result }}
          POLICY_FIXTURES_RESULT: ${{ needs.policy-fixtures.result }}
          POLICY_MUTATIONS_RESULT: ${{ needs.policy-mutations.result }}
          POLICY_STRUCTURE_RESULT: ${{ needs.policy-structure.result }}
        run: |
          set -euo pipefail
          failed=0
          for pair in "evidence:${POLICY_EVIDENCE_RESULT}" "fixtures:${POLICY_FIXTURES_RESULT}" "mutations:${POLICY_MUTATIONS_RESULT}" "structure:${POLICY_STRUCTURE_RESULT}"; do
            if [[ "${pair#*:}" != 'success' ]]; then
              echo "::error::the policy ${pair%%:*} shard did not pass (result: ${pair#*:})"
              failed=1
            fi
          done
          [[ "${failed}" -eq 0 ]] || exit 1
          echo 'policy checks: every policy shard passed'

  # This pull request's own policy, shard 1: repository contents, lint, universal and
  # structure rules.
  # Needs no other job: it runs beside the base pass and holds no authority;
  # only `policy` decides the required check.
  policy-structure:
    permissions:
      contents: read
    name: Policy structure and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out public policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Repository contents: no private source, credential material or unexpected path.
      - name: Reject private-source and credential material
        shell: bash
        run: bash .github/policy/check-repository.sh

      # Pinned actionlint and zizmor release binaries, verified against committed SHA-256s.
      # zizmor's online audits use this run's read-only token.
      - name: Lint workflows with pinned actionlint and zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/policy/lint.sh

      # Rules for every workflow and composite: SHA pins, permissions: {}, no
      # pull_request_target, no secrets: inherit, source-checkout first in protected jobs.
      - name: Check the universal workflow rules and the Action references
        shell: bash
        run: |
          ruby .github/policy/check-universal.rb
          bash .github/policy/test-structure.sh
          bash .github/policy/test-action-uses.sh
          bash .github/policy/test-policy-batching.sh

      # Dedicated and exactly one command (check-strict-structure.rb asserts it): the strict form of the
      # structure check, where a transitional alternative left in the manifest is an error.
      - name: Check the control-plane structure, strictly
        shell: bash
        run: ruby .github/policy/check-structure.rb --strict

      # Every policy step is present once, runs its pinned command and sits in its pinned job. --exact: this
      # tree's own table must match exactly (main's copy, run by the base pass, accepts shape-checked extras).
      - name: Check that every policy step is present, exact and in its job
        shell: bash
        run: ruby .github/policy/check-policy-steps.rb --exact

      # Trust tiers: reviewed Actions, token revocation order, cache, secrets, dispatchers.
      - name: Enforce immutable reviewed Actions and safe workflow features
        shell: bash
        run: bash .github/policy/check-workflows.sh

      # More than 800 lines fails, more than 400 warns.
      - name: Check workflow and composite file sizes
        shell: bash
        run: bash .github/policy/check-sizes.sh

      # Fixture tests: the universal rules and size limits accept and reject what they should.
      - name: Test the policy rules against fixtures
        shell: bash
        run: bash .github/policy/test-policy.sh

      # Keep block-scalar condition refusal in policy even when YAML chomping removes newlines.
      - name: Test rule N's block-scalar if refusal
        shell: bash
        run: bash .github/policy/test-rule-n-if-shape.sh

  # Shard 2: fixture and unit tests of the policy scripts, selectors, dispatch contracts and live-proof pins.
  # Needs no other job: it runs beside the base pass and holds no authority;
  # only `policy` decides the required check.
  policy-fixtures:
    permissions:
      contents: read
    name: Policy fixtures and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The environment pre-flight composite, run against stub API answers: only custom branch
      # policies of exactly main and untrusted pass.
      - name: Test the environment pre-flight against stub endpoints
        shell: bash
        run: bash .github/policy/test-preflight.sh

      # The untrusted cache scope audit, run against a stub curl: it passes only on a readable,
      # empty scope and refuses entries, bad answers, other statuses and other refs.
      - name: Test the untrusted cache scope audit against stub endpoints
        shell: bash
        run: bash .github/policy/test-cache-scope-audit.sh

      # The three steps that hold the source token, run against stub curl, git and date: each
      # revokes on every path, calls only the reviewed endpoints and refuses what it must.
      - name: Test the source-token revoke against stub endpoints
        shell: bash
        run: bash .github/policy/test-revoke.sh

      - name: Test the weekly openssl-src patch cadence
        shell: bash
        run: bash .github/policy/test-weekly-cadence.sh

      # Sanitizers and failure-detail extractors, run over path, token and message fixtures.
      - name: Test the sanitizer expressions against path and token fixtures
        shell: bash
        run: bash .github/policy/test-sanitizers.sh

      # The OpenSSL door's shell checks: gate, artefact proof, built graph, binding, the
      # base-policy toolchain copy and the Windows build tools. Its own step, not a sub-run of
      # another test, because it reads the real workflows that the mutation fixtures replace.
      - name: Test the OpenSSL door's shell checks
        shell: bash
        run: bash .github/policy/test-shell-artefact.sh

      - name: Test the compiled dependency cache strip against hostile outputs
        shell: bash
        run: bash .github/policy/test-rust-target-cache.sh

      - name: Test the failure-detail extractors against fixtures
        shell: bash
        run: bash .github/policy/test-extractors.sh

      - name: Test the cargo-deny step's exit-code labels and counts against a stub
        shell: bash
        run: bash .github/policy/test-scan-deny.sh

      - name: Test unsound advisory enforcement and protected reporting against a stub
        shell: bash
        run: bash .github/policy/test-cargo-audit.sh

      - name: Test that the base-pass step is found in either public policy workflow
        shell: bash
        run: bash .github/policy/test-base-pass-locate.sh

      - name: Test that the base pass stays on the required status check
        shell: bash
        run: bash .github/policy/test-base-policy-result.sh

      - name: Test that the aggregate policy layout stays fail-closed
        shell: bash
        run: bash .github/policy/test-policy-aggregate.sh

      - name: Test sanitized build-failure category classification
        shell: bash
        run: bash .github/policy/test-build-failure-category.sh

      # The concern table, the dispatcher's matrix and the result check agree.
      - name: Check the concern table against the dispatcher
        shell: bash
        run: bash .github/policy/check-concern-table.sh

      - name: Test the concern selector on a synthetic repository
        shell: bash
        run: bash .github/policy/test-selector.sh

      - name: Test explicit run-result selection mode
        shell: bash
        run: bash .github/policy/test-run-result.sh

      # The reviewed candidate universe and coverage dispositions are immutable public policy.
      - name: Test the feature-suite catalog contract
        shell: bash
        run: bash .github/policy/test-suite-catalog.sh

      - name: Test the exact suite-selection policy on synthetic changes
        shell: bash
        run: bash .github/policy/test-suite-selection.sh

      - name: Test the sanitized feature-suite evidence contract
        shell: bash
        run: bash .github/policy/test-suite-evidence.sh

      - name: Test the trusted suite-evidence collector on synthetic reports
        shell: bash
        run: bash .github/policy/test-suite-collector.sh

      - name: Test the aggregate feature-suite overview
        shell: bash
        run: bash .github/policy/test-suite-overview.sh

      # The shadow selection review: the concern contract under a shadow
      # payload, the honest not-collected state of the evidence step, and the
      # dispatcher's fail-closed selection-review step.
      - name: Test the suite-selection dispatch review
        shell: bash
        run: bash .github/policy/test-suite-dispatch-review.sh

      - name: Test canonical dispatch identity and input defaults
        shell: bash
        run: bash .github/policy/test-dispatch-identity.sh

      # The roster the plan step selects is exactly what runs: no matrix filter, literal output
      # or skipped arm step between them.
      - name: Pin the live-proof fan-out from roster to arm runs
        shell: bash
        run: ruby .github/policy/check-live-proof-fanout.rb

      - name: Test the live-proof fan-out pin on arm-dropping fixtures
        shell: bash
        run: bash .github/policy/test-live-proof-fanout.sh

      - name: Test live-proof roster selection and JSON validity
        shell: bash
        run: bash .github/policy/test-live-roster.sh

      - name: Require every registered live-proof arm
        shell: bash
        run: ruby .github/policy/check-live-arm-coverage.rb

      - name: Test the live-arm coverage guard on weakened fixtures
        shell: bash
        run: ruby .github/policy/test-live-arm-coverage.rb

      - name: Parse PostgreSQL fixture action shell blocks without executing them
        shell: bash
        run: bash .github/policy/test-live-start-pg-shell.sh

      - name: Test control-owned PostgreSQL TLS fixtures without certificates or containers
        shell: bash
        run: bash .github/policy/test-pgtls-control-fixtures.sh

      - name: Test registered DBX feature coverage and old-source compatibility
        shell: bash
        run: bash .github/policy/test-dbx-feature-coverage.sh

      - name: Test PG8 measurement parsers on adversarial fixtures
        shell: bash
        run: python3 .github/policy/test-pg8-measurement.py

      - name: Test the dispatch contract policy against weakened fixtures
        shell: bash
        run: bash .github/policy/test-dispatch-contracts.sh

      # Release-installed tools are listed with their pins; Dependabot covers the Actions.
      - name: Check the tool pin list and Dependabot coverage
        shell: bash
        run: bash .github/policy/check-tools.sh

      # Every egress allow-list entry has a known scope, a host pattern and a reason.
      - name: Check the egress allow-list
        shell: bash
        run: bash .github/policy/check-egress-allowlist.sh

      # Last in its shard on purpose: main's step check (superset mode) accepts a step it has no row for only
      # after the last pinned step of its job, and only when its script exists in main's policy directory.
      - name: Test the rustfmt enforcement default against a stub cargo
        shell: bash
        run: bash .github/policy/test-lint-enforce.sh

      - name: Test the all-locks advisory helper wiring and reporting against a stub
        shell: bash
        run: bash .github/policy/test-all-locks-audit.sh

  # Shard 3: the case-evidence contract, producers and Playwright parity tests.
  # Needs no other job: it runs beside the base pass and holds no authority;
  # only `policy` decides the required check.
  policy-evidence:
    permissions:
      contents: read
    name: Policy case-evidence tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out public policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The case-evidence contract and its producers. These ran nowhere before:
      # the scripts were in the tree but no policy step invoked them.
      - name: Test the case-evidence structural contract
        shell: bash
        run: bash .github/policy/test-case-evidence-contract.sh

      - name: Test the case-evidence trust boundary against forged claims
        shell: bash
        run: bash .github/policy/test-case-evidence-trust-boundary.sh

      - name: Test the Playwright case-evidence producer against a fake runner
        shell: bash
        run: bash .github/policy/test-playwright-case-evidence-producer.sh

      # No committed asset may carry an absolute path: the recorded reports are
      # real runner output, and a real report is full of them.
      - name: Check the case-evidence assets for absolute paths
        shell: bash
        run: ruby .github/policy/check-case-evidence-assets.rb

      - name: Test the case-evidence asset path guard
        shell: bash
        run: bash .github/policy/test-case-evidence-assets.sh

      - name: Test the pinned Playwright parity fixtures
        shell: bash
        run: ruby .github/policy/test-playwright-case-parity-fixtures.rb

      - name: Test the pinned Playwright parity producer against a fake runner
        shell: bash
        run: bash .github/policy/test-playwright-pinned-parity-producer.sh

      # The admission-path producer: an exact discovery/execution match passes,
      # and every way the two can disagree blocks.
      - name: Test the case-evidence admission reconciliation
        shell: bash
        run: bash .github/policy/test-case-evidence-admission.sh

  # Shard 4: every reviewed weakening applied to a copy of the tree and rejected.
  # Needs no other job: it runs beside the base pass and holds no authority;
  # only `policy` decides the required check.
  policy-mutations:
    permissions:
      contents: read
    name: Policy mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out public policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Every weakening an independent review found is applied to a copy of the tree and must be
      # rejected, including a pull request that weakens its own policy.
      - name: Prove each reviewed weakening fails the policy
        shell: bash
        run: bash .github/policy/test-mutations.sh


  # The base commit's policy run against this pull request's tree, and the fixtures that test the
  # step that runs it, in base-policy.yml (see its header). `policy` requires this call's result.
  base-pass:
    permissions:
      contents: read
    name: Base policy
    # The policy gate never restores or saves a cache, whatever the trigger.
    cache-mode: none
    # Kept as ./ : the policy matches this exact form for protected reusable calls.
    uses: ./.github/workflows/base-policy.yml  # zizmor: ignore[self-repository]
