name: Validate public CI policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# This workflow intentionally has no OIDC permission, secrets, private checkout,
# cache access, or artifact upload. It validates only this public repository.
permissions: {}

concurrency:
  group: public-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    permissions:
      contents: read
    name: Validate workflow policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject private-source and credential material
        shell: bash
        run: |
          set -euo pipefail

          forbidden_path_re='(^|/)(src|target|node_modules|vendor|taurine-desktop|taurine-mobile)(/|$)|\.(rs|ts|tsx|js|jsx|json|toml|lock|pem|p12|pfx|jks|keystore)$'
          forbidden_name_re='(^|/)(README|SECURITY|CODEOWNERS|LICENSE)(\.|$)'

          while IFS= read -r -d '' path; do
            if [[ "$path" == .github/workflows/* ]]; then
              continue
            fi
            # Local composite actions (action.yml only) and the one machine-readable
            # concern table. Both are scanned by the checks below; nothing else may
            # live under .github/actions, and no other JSON is allowed anywhere.
            if [[ "$path" =~ ^\.github/actions/[a-z0-9-]+/action\.yml$ ]]; then
              continue
            fi
            if [[ "$path" == .github/ci-matrix.json ]]; then
              continue
            fi
            if [[ "$path" == .gitignore ]]; then
              continue
            fi
            echo "Unexpected tracked path in the public CI repository: $path" >&2
            exit 1
          done < <(git ls-files -z)

          if git ls-files | grep -vxF '.github/ci-matrix.json' | grep -E "$forbidden_path_re|$forbidden_name_re"; then
            echo "The public repository contains a forbidden source, credential, or starter-document path." >&2
            exit 1
          fi

          if git grep -nI -E 'GH_APP_PRIVATE_KEY|TAURINE_(PAT|TOKEN|PRIVATE_KEY)|GITHUB_TOKEN[[:space:]]*[:=]|TAURI_SIGNING_PRIVATE_KEY|DEPLOY_KEY|BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY|secrets\.(TAURINE|GH_APP|PAT|DEPLOY|SIGNING)' -- . ':!*.lock' ':!.github/workflows/validate-public-changes.yml'; then
            echo "A reusable source, signing, or deployment credential pattern was found." >&2
            exit 1
          fi

      # actionlint and zizmor, as pinned release binaries downloaded from their
      # projects' GitHub releases and verified against a committed SHA-256 (the
      # same shape as the other pinned tool downloads here; no third-party Action,
      # nothing cached). Both run over this repository's own workflows only.
      # zizmor's online audits (impostor commits, known-vulnerable Actions) use
      # this run's read-only token.
      #
      # Every finding is fixed or explicitly justified:
      # - actionlint's shellcheck integration is run with SC2016 and SC2129
      #   ignored. SC2016 (info) fires on single-quoted text that is meant to be
      #   literal (awk and jq programs, `$'...'` patterns, echoed `${VAR}` text);
      #   SC2129 (style) asks for grouped redirects in scripts that append to
      #   GITHUB_ENV and GITHUB_PATH a line at a time. Neither is a defect, and
      #   rewriting dozens of long, passing scripts to satisfy them would risk
      #   more than it protects. Every other shellcheck code (including the
      #   warning-level ones) fails the check.
      # - zizmor findings are suppressed inline, one reason above each, only
      #   for: `github-app` (skip-token-revoke is deliberate; an explicit step
      #   revokes the token before project code and fails closed),
      #   `secrets-inherit` (the callee is this repository's own protected
      #   reusable workflow, and the policy below requires that form) and
      #   `self-repository` (the policy matches the `./` form). The keeldock-*
      #   workflows are linted like every other workflow.
      - name: Lint workflows with pinned actionlint and zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/lint-tools"
          mkdir -p "${tools}"
          fetch() {
            local url="$1" want="$2" out="$3"
            curl --fail --silent --show-error --location --retry 3 -o "${out}" "${url}"
            got="$(sha256sum "${out}" | cut -d' ' -f1)"
            if [[ "${got}" != "${want}" ]]; then
              echo "Checksum mismatch for ${url}" >&2
              exit 1
            fi
          }
          fetch https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "${tools}/actionlint.tar.gz"
          fetch https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz \
            e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a "${tools}/zizmor.tar.gz"
          tar xzf "${tools}/actionlint.tar.gz" -C "${tools}" actionlint
          tar xzf "${tools}/zizmor.tar.gz" -C "${tools}" zizmor
          "${tools}/actionlint" -version | head -n 1
          "${tools}/actionlint" -ignore 'SC2016:' -ignore 'SC2129:'
          workflows=()
          while IFS= read -r -d '' file; do
            workflows+=("${file}")
          done < <(find .github/workflows .github/actions -type f -name '*.yml' -print0 2>/dev/null | sort -z)
          "${tools}/zizmor" --format plain "${workflows[@]}"

      # The sanitizers that scrub private paths from published failure detail are
      # inline sed programs in the protected workflows. This step extracts every one
      # of them and runs it over fixtures: a path containing a space (the old
      # `[^ ]+` rules published everything after the space), a Windows drive path, a
      # macOS /private/var path and GitHub token shapes. A program may only claim a
      # root it names; every root it names must be scrubbed completely. The
      # keeldock-* workflows are owned by the Keel Dock lane and join this list when
      # that lane has moved its sanitizers onto the same rules.
      - name: Test the sanitizer expressions against path and token fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixtures="${RUNNER_TEMP}/sanitizer-fixtures"
          mkdir -p "${fixtures}"
          printf '%s\n' 'error: failed to read /Users/alice/Secret SPACEDIR/src/lib.rs:1:2 boom' > "${fixtures}/users.txt"
          printf '%s\n' 'at /home/runner/work/x/x/My SPACEDIR/y.rs:3 in module' > "${fixtures}/home.txt"
          printf '%s\n' 'C:\Users\Jo Bloggs\SPACEDIR\x.rs:3' > "${fixtures}/windows.txt"
          printf '%s\n' '/private/var/folders/ab/SPACEDIR dir/T/x trailing' > "${fixtures}/private.txt"
          printf '%s\n' 'ghp_abcdefghijklmnopqrstuvwxyz0123456789 ghs_Xyz123abc github_pat_11ABC_def456 Authorization: Bearer abc.DEF-123' > "${fixtures}/tokens.txt"
          forbidden='SPACEDIR|alice|Jo Bloggs|Secret|ghp_abc|ghs_Xyz|github_pat_11|abc\.DEF'
          sanitizer_files=()
          while IFS= read -r -d '' file; do
            sanitizer_files+=("${file}")
          done < <(find .github/workflows .github/actions -name '*.yml' -not -name 'keeldock-*' -print0)
          backslash=$'\\'
          count=0
          while IFS= read -r expr; do
            [[ -n "${expr}" ]] || continue
            count=$((count + 1))
            checks=()
            [[ "${expr}" == */Users/* ]] && checks+=(users)
            [[ "${expr}" == */home/runner/work/* ]] && checks+=(home)
            [[ "${expr}" == *"${backslash}"* ]] && checks+=(windows)
            [[ "${expr}" == *'s#/private/['* || "${expr}" == *'s#/private/.'* ]] && checks+=(private)
            [[ "${expr}" == *redacted* ]] && checks+=(tokens)
            for name in "${checks[@]}"; do
              if sed -E "${expr}" "${fixtures}/${name}.txt" | grep -qE "${forbidden}"; then
                echo "A sanitizer expression leaks the ${name} fixture: ${expr}" >&2
                exit 1
              fi
            done
          done < <(grep -hoE "sed -E 's#[^']*'" "${sanitizer_files[@]}" | cut -c9- | sed 's/.$//' | grep -E 'private-path|private/workspace' | sort -u)
          [[ "${count}" -gt 0 ]] || { echo 'No sanitizer expressions were found to test' >&2; exit 1; }
          echo "sanitizer fixtures: ${count} expressions checked"

      - name: Enforce immutable reviewed Actions and safe workflow features
        shell: bash
        run: |
          set -euo pipefail

          # Token-revocation ordering, checked structurally from the parsed YAML. In every
          # job that enters the source-read environment, a step that revokes the
          # short-lived source token (it calls the installation/token endpoint) must
          # exist, must run under `if: always()` (so a failed earlier step can never leave
          # the token live), and every step before it may only check out, mint the token
          # or run non-project shell: no package manager, compiler, build tool or project
          # script may run while the token is still valid. Ruby is on the runner image
          # and its YAML parser is in the standard library.
          check_revocation_order() {
            ruby - "$1" <<'RUBY'
          require 'yaml'
          workflow = ARGV[0]
          doc = YAML.safe_load(File.read(workflow), aliases: false)
          project_command = /^\s*(sudo\s+)?(npm|npx|pnpm|yarn|node|cargo|rustup|rustc|dotnet|nuget|xcodebuild|xcrun|gradle|gradlew|make|cmake|pip|pip3|python|python3|ruby|brew|docker|choco|vcpkg|bash\s+scripts\/|sh\s+scripts\/|\.\/scripts\/)(\s|$)/
          allowed_before = [
            /\Aactions\/checkout@/,
            /\Aactions\/create-github-app-token@/
          ]
          failures = []
          (doc['jobs'] || {}).each do |job_id, job|
            env = job['environment']
            env_name = env.is_a?(Hash) ? env['name'] : env
            next unless env_name == 'source-read'
            steps = job['steps'] || []
            revoke_at = steps.index { |st| st['run'].to_s.include?('installation/token') }
            # The source-checkout composite performs mint, checkout, verification and
            # revocation as one step; its own structure is enforced separately.
            revoke_at ||= steps.index { |st| st['uses'].to_s == './.github/actions/source-checkout' }
            if revoke_at.nil?
              failures << "job #{job_id}: no step revokes the source token (installation/token)"
              next
            end
            revoke = steps[revoke_at]
            unless revoke['uses'].to_s == './.github/actions/source-checkout' || revoke['if'].to_s.include?('always()')
              failures << "job #{job_id}: the revocation step #{revoke['name'].inspect} is not conditioned on always()"
            end
            steps[0...revoke_at].each do |st|
              if st['uses'] && allowed_before.none? { |re| re.match?(st['uses']) }
                failures << "job #{job_id}: step #{st['name'].inspect} uses #{st['uses']} before the token is revoked"
              end
              st['run'].to_s.each_line do |line|
                next if line.strip.start_with?('#')
                if project_command.match?(line)
                  failures << "job #{job_id}: step #{st['name'].inspect} runs a project command before the token is revoked: #{line.strip[0, 60]}"
                end
              end
            end
          end
          unless failures.empty?
            warn failures.join("\n")
            exit 1
          end
          RUBY
          }

          # Local composite actions. Held to the same rules as workflows where they
          # apply (the Action allow-list and SHA pins run for every file below), plus:
          # a composite may not use secrets or variables (it receives them as inputs),
          # may not use OIDC, artifacts or any cache (until a reviewed composite needs
          # the cache exception, which would extend this function), must be
          # `runs.using: composite`, every run step must name its shell, and no run
          # script may contain an inline GitHub expression (inputs reach scripts
          # through env: only, so an input can never be interpreted as shell code).
          check_composite_action() {
            if grep -nE 'secrets\.|vars\.|id-token:|actions/(upload|download)-artifact|actions/cache' "$1"; then
              echo "A composite action may not use secrets, variables, OIDC, artifacts or a cache: $1" >&2
              return 1
            fi
            ruby - "$1" <<'RUBY'
          require 'yaml'
          file = ARGV[0]
          doc = YAML.safe_load(File.read(file), aliases: false)
          failures = []
          if file == '.github/actions/source-checkout/action.yml'
            # The private-source action: mint, then check out, then verify and revoke
            # under always(), no project command anywhere in it, skip-token-revoke on
            # the mint (the explicit step owns revocation) and no outputs at all, so
            # the token can never leave the action.
            steps = (doc['runs'] || {})['steps'] || []
            mint = steps.index { |st| st['uses'].to_s.start_with?('actions/create-github-app-token@') }
            checkout = steps.index { |st| st['uses'].to_s.start_with?('actions/checkout@') }
            revoke = steps.index { |st| st['run'].to_s.include?('installation/token') }
            if mint.nil? || checkout.nil? || revoke.nil? || !(mint < checkout && checkout < revoke)
              failures << "#{file}: steps must be mint, then checkout, then the revoking step"
            else
              failures << "#{file}: the revoking step must run under always()" unless steps[revoke]['if'].to_s.include?('always()')
              failures << "#{file}: the mint step must set skip-token-revoke: true" unless steps[mint].dig('with', 'skip-token-revoke') == true
            end
            failures << "#{file}: must not declare outputs" if doc.key?('outputs')
            steps.each do |st|
              st['run'].to_s.each_line do |line|
                failures << "#{file}: project command in the source-checkout action: #{line.strip[0, 50]}" if line =~ /^\s*(npm|npx|cargo|dotnet|xcodebuild|gradle|make|pip|brew|bash\s+scripts\/)(\s|$)/
              end
            end
          end
          runs = doc['runs'] || {}
          failures << "#{file}: runs.using must be composite" unless runs['using'] == 'composite'
          (runs['steps'] || []).each_with_index do |st, i|
            label = st['name'] || "step #{i + 1}"
            if st['run']
              failures << "#{file}: #{label.inspect} has no shell" unless st['shell']
              failures << "#{file}: #{label.inspect} interpolates an expression inside run (use env:)" if st['run'].include?('$' + '{{')
            end
          end
          unless failures.empty?
            warn failures.join("\n")
            exit 1
          end
          RUBY
          }

          # Keep workflow entrypoints directly under .github/workflows: GitHub
          # does not discover nested workflow files. The explicit trust-tier
          # lists separate the public policy gate from source-bearing jobs and
          # make adding a new protected lane an auditable policy change.
          public_policy_workflow=".github/workflows/validate-public-changes.yml"
          protected_source_workflows=(
            ".github/workflows/source-read.yml"
            ".github/workflows/linux-validation-concern.yml"
            ".github/workflows/macos-validation.yml"
            ".github/workflows/windows-validation-concern.yml"
            ".github/workflows/android-validation.yml"
            ".github/workflows/ios-validation.yml"
            ".github/workflows/orchestrate-validation.yml"
            # Second private source: Moh-Bakr/keeldock-cloud rather than Taurine.
            ".github/workflows/keeldock-validation-concern.yml"
            # Env-gated live database proofs: dispatch-only, checks out the
            # exact private SHA, runs one engine's conformance suite against
            # its documented single-node Docker server, publishes only a
            # sanitized summary (check titles and counts, never data values).
            ".github/workflows/live-proofs.yml"
          )
          reusable_protected_workflows=(
            ".github/workflows/windows-validation-concern.yml"
            ".github/workflows/linux-validation-concern.yml"
            ".github/workflows/keeldock-validation-concern.yml"
          )
          protected_dispatch_workflows=(
            ".github/workflows/windows-validation.yml"
            ".github/workflows/linux-validation.yml"
            ".github/workflows/keeldock-validation.yml"
          )

          # Windows is intentionally app-only. The full skill verifier is
          # required in the protected Ubuntu lane, while macOS retains a
          # cross-platform smoke check; it must not be reintroduced as a
          # Windows concern that duplicates native process fixtures.
          if grep -nE '^[[:space:]]*-[[:space:]]*orchestrate-skill[[:space:]]*$|^[[:space:]]*orchestrate-skill\)' \
            .github/workflows/windows-validation.yml \
            .github/workflows/windows-validation-concern.yml; then
            echo 'Windows validation must remain app-only; orchestrate-skill is covered by Ubuntu/macOS workflows.' >&2
            exit 1
          fi
          for skill_workflow in \
            .github/workflows/orchestrate-validation.yml \
            .github/workflows/macos-validation.yml; do
            if ! grep -q 'skills/orchestrate/scripts/verify.mjs --json' "${skill_workflow}"; then
              echo "Required orchestrate skill coverage is missing from ${skill_workflow}." >&2
              exit 1
            fi
          done

          while IFS= read -r -d '' workflow; do
            if grep -nE '^\s*uses:\s*[^#[:space:]]+@(v[0-9]|main|master|stable|latest|[[:alnum:]_.-]+)$' "$workflow"; then
              echo "Every Action reference must use a full 40-character commit SHA: $workflow" >&2
              exit 1
            fi

            while IFS= read -r reference; do
              case "$reference" in
                actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1) ;;
                # The one reviewed cache exception (actions/cache v4.3.0), split
                # into restore and save so each use is explicit. See the cache
                # policy block below for the only paths either may touch.
                actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830) ;;
                actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830) ;;
                actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1) ;;
                actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020) ;;
                actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68) ;;
                ./.github/workflows/windows-validation-concern.yml) ;;
                # Local composite actions are reviewed in this repository; each one is added
                # here deliberately and held to the composite rules below.
                ./.github/actions/source-checkout) ;;
                ./.github/actions/sanitize) ;;
                ./.github/workflows/linux-validation-concern.yml) ;;
                ./.github/workflows/keeldock-validation-concern.yml) ;;
                '') ;;
                *)
                  echo "Unreviewed or mutable Action reference in $workflow: $reference" >&2
                  exit 1
                  ;;
              esac
            done < <(sed -nE 's/^[[:space:]]*uses:[[:space:]]*([^#[:space:]]+).*/\1/p' "$workflow")

            if [[ "$workflow" == .github/actions/*/action.yml ]]; then
              check_composite_action "$workflow" || { echo "Composite action policy violated: $workflow" >&2; exit 1; }
              continue
            fi

            # Scheduled SHA resolver: a separate, narrower trust tier. It is the only
            # workflow allowed a `schedule` trigger together with the source-read
            # environment, because it never touches project code: it mints the same
            # reviewed read-only contents token, asks the GitHub API which commit the
            # private `develop` branch points at, revokes the token, and then
            # dispatches the protected validation workflows (which keep every
            # protection of their own) with that SHA using the run's own token. So
            # instead of the dispatch-only rules above, this tier is held to: no
            # checkout of any repository, no project command, no cache or artifact,
            # only the reviewed secret and variable, an explicit revoke, and exactly
            # two permissions (contents: read on the resolver, actions: write on the
            # dispatcher, which holds no secret and no environment).
            if [[ "$workflow" == ".github/workflows/weekly-validation.yml" ]]; then
              if ! grep -qE '^[[:space:]]+schedule:[[:space:]]*$' "$workflow" || ! grep -qE '^[[:space:]]+workflow_dispatch:[[:space:]]*$' "$workflow"; then
                echo "The scheduled resolver must declare schedule and workflow_dispatch: $workflow" >&2
                exit 1
              fi
              if grep -nE '^[[:space:]]+(pull_request|pull_request_target|push|workflow_run|repository_dispatch|workflow_call):' "$workflow"; then
                echo "The scheduled resolver has an unapproved trigger: $workflow" >&2
                exit 1
              fi
              if ! grep -qE '^permissions:[[:space:]]*\{\}[[:space:]]*$' "$workflow"; then
                echo "The scheduled resolver must deny permissions by default at the top level: $workflow" >&2
                exit 1
              fi
              if grep -nE '^      [a-z-]+:[[:space:]]+(read|write)[[:space:]]*$' "$workflow" | grep -vE ':      (contents:[[:space:]]+read|actions:[[:space:]]+write)[[:space:]]*$'; then
                echo "The scheduled resolver may only use contents: read and actions: write: $workflow" >&2
                exit 1
              fi
              if grep -nE 'actions/(checkout|cache|upload-artifact|download-artifact)|id-token:[[:space:]]*write|secrets\[[^]]+\]|^[[:space:]]+repository:' "$workflow"; then
                echo "The scheduled resolver must not check out code, cache, upload artifacts or index secrets: $workflow" >&2
                exit 1
              fi
              if grep -nE '(^|[^A-Za-z-])(npm|npx|pnpm|yarn|cargo|rustc|dotnet|xcodebuild|gradle|gradlew|make|pip|docker)[[:space:]]' "$workflow" | grep -vE '^[0-9]+:[[:space:]]*#'; then
                echo "The scheduled resolver must run no project command: $workflow" >&2
                exit 1
              fi
              if ! grep -qE '^    environment:[[:space:]]+source-read[[:space:]]*$' "$workflow" \
                || ! grep -qE 'SOURCE_REPOSITORY_ID:[[:space:]]*['"'"']?[0-9]{7,}['"'"']?[[:space:]]*$' "$workflow" \
                || ! grep -qE 'permission-contents:[[:space:]]*read' "$workflow" \
                || ! grep -qE 'skip-token-revoke:[[:space:]]*true' "$workflow" \
                || ! grep -qE 'installation/token' "$workflow"; then
                echo "The scheduled resolver must use the source-read environment, a pinned repository ID, a contents-read token and explicit revocation: $workflow" >&2
                exit 1
              fi
              if [[ "$(grep -oE 'secrets\.[A-Za-z0-9_]+' "$workflow" | sort -u)" != "secrets.SOURCE_READER_PRIVATE_KEY" ]] \
                || [[ "$(grep -oE 'vars\.[A-Za-z0-9_]+' "$workflow" | sort -u)" != "vars.SOURCE_READER_APP_ID" ]]; then
                echo "The scheduled resolver references an unapproved secret or variable: $workflow" >&2
                exit 1
              fi
              while IFS= read -r dispatched; do
                case "$dispatched" in
                  linux-validation.yml|macos-validation.yml|windows-validation.yml) ;;
                  *)
                    echo "The scheduled resolver may only dispatch the protected validation workflows, not: $dispatched" >&2
                    exit 1
                    ;;
                esac
              done < <(grep -oE 'gh workflow run [^[:space:]]+' "$workflow" | awk '{print $4}')
              check_revocation_order "$workflow" || { echo "Token revocation ordering violated: $workflow" >&2; exit 1; }
              continue
            fi

            protected_source=0
            for protected_workflow in "${protected_source_workflows[@]}"; do
              if [[ "$workflow" == "$protected_workflow" || "$workflow" == "./$protected_workflow" ]]; then
                protected_source=1
                break
              fi
            done

            if (( protected_source )); then
              check_revocation_order "$workflow" || { echo "Token revocation ordering violated: $workflow" >&2; exit 1; }
              reusable_protected=0
              for reusable_workflow in "${reusable_protected_workflows[@]}"; do
                if [[ "$workflow" == "$reusable_workflow" || "$workflow" == "./$reusable_workflow" ]]; then
                  reusable_protected=1
                  break
                fi
              done
              if (( reusable_protected )); then
                if ! grep -qE '^on:[[:space:]]*$' "$workflow" || ! grep -qE '^[[:space:]]+workflow_call:[[:space:]]*$' "$workflow"; then
                  echo "The protected reusable workflow must be workflow_call-only: $workflow" >&2
                  exit 1
                fi
                if grep -nE '^[[:space:]]+(pull_request|pull_request_target|push|schedule|workflow_run|repository_dispatch|workflow_dispatch):' "$workflow"; then
                  echo "The protected reusable workflow has an unapproved trigger: $workflow" >&2
                  exit 1
                fi
              else
                if ! grep -qE '^on:[[:space:]]*$' "$workflow" || ! grep -qE '^[[:space:]]+workflow_dispatch:[[:space:]]*$' "$workflow"; then
                  echo "The protected source workflow must be workflow_dispatch-only: $workflow" >&2
                  exit 1
                fi
                if grep -nE '^[[:space:]]+(pull_request|pull_request_target|push|schedule|workflow_run|repository_dispatch|workflow_call):' "$workflow"; then
                  echo "The source-read workflow has an unapproved trigger: $workflow" >&2
                  exit 1
                fi
              fi
              if ! grep -qE '^    environment:[[:space:]]+source-read[[:space:]]*$' "$workflow"; then
                echo "The protected source workflow must use the protected source-read environment: $workflow" >&2
                exit 1
              fi
              if ! grep -qE 'SOURCE_REPOSITORY_ID:[[:space:]]*['"'"']?[0-9]{7,}['"'"']?[[:space:]]*$' "$workflow"; then
                echo "The source-read workflow must pin a numeric source repository ID: $workflow" >&2
                exit 1
              fi
              # A job that uses the source-checkout composite gets the SHA validation, the
              # identity check and the revocation from it (and the composite's own
              # structure is enforced in check_composite_action); only a workflow with
              # its own inline checkout must show them in its own text.
              uses_source_checkout=0
              if grep -qE '^[[:space:]]+uses:[[:space:]]+\./\.github/actions/source-checkout([[:space:]]|$)' "$workflow"; then
                uses_source_checkout=1
              fi
              if ! grep -qE '^[[:space:]]+source_sha:' "$workflow" \
                || { (( ! uses_source_checkout )) && ! grep -qE '\^\[0-9a-fA-F\]\{40\}' "$workflow"; }; then
                echo "The source-read workflow must require and validate a full source SHA: $workflow" >&2
                exit 1
              fi
              if ! grep -qE 'SOURCE_READER_PRIVATE_KEY' "$workflow" || ! grep -qE 'SOURCE_READER_APP_ID' "$workflow"; then
                echo "The protected source workflow must use only the reviewed source-reader settings: $workflow" >&2
                exit 1
              fi
              if grep -nE 'id-token:[[:space:]]*write|actions/(upload|download)-artifact|secrets\[[^]]+\]' "$workflow"; then
                echo "The source-read workflow contains an unsafe secret, OIDC, or artifact pattern: $workflow" >&2
                exit 1
              fi
              # Cache policy (a deliberate, narrow exception). Source-bearing
              # jobs may use ONLY actions/cache/restore and actions/cache/save
              # (never the combined actions/cache, whose implicit post-step save
              # cannot be conditioned or audited), and ONLY for cargo's
              # downloaded third-party sources: the registry index, the registry
              # `.crate` archives and the git dependency databases under Cargo
              # home. Compiled output (target/), extracted sources and anything
              # under the checked-out private source must never be cached: a
              # cache entry is readable by later runs, and compiled private code
              # must not leave the runner. Third-party archives are re-verified
              # against the private Cargo.lock checksums after every restore
              # (the verify step below), and the save step is limited to main.
              if grep -nE 'actions/cache([^/]|$)|actions/cache/(restore|save)@' "$workflow" | grep -vE 'actions/cache/(restore|save)@0057852bfaa89a56745cba8c7296529d2fc39830 # v4\.3\.0$'; then
                echo "Only the reviewed pinned actions/cache/restore and actions/cache/save are allowed in source-bearing workflows: $workflow" >&2
                exit 1
              fi
              if grep -nE 'actions/cache/' "$workflow" | grep -vE 'actions/cache/(restore|save)@'; then
                echo "Unreviewed actions/cache sub-action in $workflow" >&2
                exit 1
              fi
              if grep -qE 'actions/cache/' "$workflow"; then
                cache_paths_ok=1
                # Every line of every cache step that names a path must be one of
                # the three allowed Cargo-home locations; the `with:` of each cache
                # step is inspected line by line from its `uses:` to the next step.
                while IFS= read -r cache_line; do
                  case "$cache_line" in
                    *'steps.cargo-home.outputs.dir }}/registry/index'|*'steps.cargo-home.outputs.dir }}/registry/cache'|*'steps.cargo-home.outputs.dir }}/git/db') ;;
                    # The KeelDock concern caches only NuGet's downloaded third-party
                    # package folder (restored packages, their .nupkg archives and
                    # metadata): never bin/, obj/, publish output or anything under the
                    # checked-out private source. Each restored package is re-verified
                    # against the private packages.lock.json hashes before use. No other
                    # workflow may name this path.
                    [~]/.nuget/packages)
                      if [[ "$workflow" != ".github/workflows/keeldock-validation-concern.yml" && "$workflow" != "./.github/workflows/keeldock-validation-concern.yml" ]]; then
                        cache_paths_ok=0; echo "NuGet cache path outside the KeelDock concern: $cache_line" >&2
                      fi
                      ;;
                    *) cache_paths_ok=0; echo "Disallowed cache path line: $cache_line" >&2 ;;
                  esac
                done < <(awk '
                  /^      - name:/ { in_cache = 0; in_path = 0 }
                  /uses:[[:space:]]*actions\/cache\// { in_cache = 1; next }
                  in_cache && /^[[:space:]]+path:/ { in_path = 1; next }
                  in_cache && in_path && /^[[:space:]]+(key|restore-keys|enableCrossOsArchive|fail-on-cache-miss|lookup-only):/ { in_path = 0 }
                  in_cache && in_path && NF { sub(/^[[:space:]]+/, ""); print "            " $0 }
                ' "$workflow" | sed -E 's/^ +//')
                if (( ! cache_paths_ok )); then
                  echo "Cache steps may only name registry/index, registry/cache and git/db under the located Cargo home: $workflow" >&2
                  exit 1
                fi
                if grep -nE 'enableCrossOsArchive|fail-on-cache-miss|lookup-only' "$workflow"; then
                  echo "Unexpected cache option in $workflow" >&2
                  exit 1
                fi
                # Every save must be conditioned on the protected main branch, and
                # every restore must be followed by the Cargo.lock verification.
                if ! grep -qE "github\.ref == 'refs/heads/main' &&.*cache-hit != 'true'" "$workflow"; then
                  echo "actions/cache/save must be guarded by the main branch and a cache miss: $workflow" >&2
                  exit 1
                fi
                # The save condition is a conjunction: main must be a top-level term. An
                # `||` outside parentheses would let one alternative skip the main guard
                # (the bug `A && B && C || D && E` had), so it is rejected outright.
                while IFS= read -r save_if; do
                  flat="$save_if"
                  while [[ "$flat" =~ \([^()]*\) ]]; do
                    flat="${flat//${BASH_REMATCH[0]}/}"
                  done
                  if [[ "$save_if" != *"github.ref == 'refs/heads/main'"* || "$flat" == *'||'* ]]; then
                    echo "The cache save condition must require the main branch as a top-level term, with no unparenthesised ||: $save_if" >&2
                    exit 1
                  fi
                done < <(awk '/^      - name:/ { cond = "" } /^[[:space:]]+if:/ { cond = $0 } /uses:[[:space:]]*actions\/cache\/save@/ { print cond }' "$workflow")
                if [[ "$workflow" == ".github/workflows/keeldock-validation-concern.yml" || "$workflow" == "./.github/workflows/keeldock-validation-concern.yml" ]]; then
                  if ! grep -q 'Verify restored NuGet packages against the lock files' "$workflow"; then
                    echo "A restored NuGet cache must be verified against packages.lock.json before use: $workflow" >&2
                    exit 1
                  fi
                  if grep -nE '^[[:space:]]+path:.*(bin|obj|publish|artifacts)([/[:space:]]|$)' "$workflow"; then
                    echo "The KeelDock cache must never name build or publish output: $workflow" >&2
                    exit 1
                  fi
                elif ! grep -q 'Verify restored crate archives against Cargo.lock' "$workflow"; then
                  echo "A restored cache must be verified against Cargo.lock before use: $workflow" >&2
                  exit 1
                fi
              fi
              while IFS= read -r secret_reference; do
                case "$secret_reference" in
                  secrets.SOURCE_READER_PRIVATE_KEY) ;;
                  '') ;;
                  *)
                    echo "The source-read workflow references an unapproved secret: $secret_reference" >&2
                    exit 1
                    ;;
                esac
              done < <(grep -oE 'secrets\.[A-Za-z0-9_]+' "$workflow" | sort -u)
              while IFS= read -r variable_reference; do
                case "$variable_reference" in
                  vars.SOURCE_READER_APP_ID) ;;
                  '') ;;
                  *)
                    echo "The source-read workflow references an unapproved variable: $variable_reference" >&2
                    exit 1
                    ;;
                esac
              done < <(grep -oE 'vars\.[A-Za-z0-9_]+' "$workflow" | sort -u)
              if (( ! uses_source_checkout )) && { ! grep -qE 'skip-token-revoke:[[:space:]]*true' "$workflow" || ! grep -qE 'installation/token' "$workflow"; }; then
                echo "The source-read workflow must explicitly revoke its token before project code: $workflow" >&2
                exit 1
              fi
              # KeelDock Cloud, the second private source: its own, stricter checks.
              # The generic checks above prove the shape of a source-read workflow; these
              # pin the facts that make THIS one safe to run project code in.
              if [[ "$workflow" == ".github/workflows/keeldock-validation-concern.yml" || "$workflow" == "./.github/workflows/keeldock-validation-concern.yml" ]]; then
                # The source identity is the numeric repository id, owner and name, checked
                # against the API after checkout. A changed constant would point the whole
                # lane, and its token, at a different repository.
                for constant in \
                  "SOURCE_REPOSITORY_ID: '1377321992'" \
                  "SOURCE_REPOSITORY_OWNER: Moh-Bakr" \
                  "SOURCE_REPOSITORY_NAME: keeldock-cloud"; do
                  if ! grep -qxF "  ${constant}" "$workflow"; then
                    echo "The KeelDock concern must pin the reviewed source identity constant (${constant}): $workflow" >&2
                    exit 1
                  fi
                done
                if ! grep -qE '^    environment:[[:space:]]+source-read[[:space:]]*$' "$workflow"; then
                  echo "The KeelDock concern must run in the protected source-read environment: $workflow" >&2
                  exit 1
                fi
                if grep -nE 'upload-artifact|download-artifact|actions/cache@' "$workflow"; then
                  echo "The KeelDock concern must not upload, download or cache source-bearing artifacts: $workflow" >&2
                  exit 1
                fi
                # Step order. Every step must be named so the order can be read. The steps
                # before the verify-and-revoke step may only be the reviewed pre-source ones:
                # anything else (a setup action, a project command, a script) would run before
                # the token is verified and destroyed.
                verify_name='Verify identity, exact checkout, and revoke source token'
                if (( $(grep -cE '^      - ' "$workflow") != $(grep -cE '^      - name:' "$workflow") )); then
                  echo "Every KeelDock concern step must be named so its order can be verified: $workflow" >&2
                  exit 1
                fi
                if (( $(grep -cE "^      - name: ${verify_name}\$" "$workflow") != 1 )); then
                  echo "The KeelDock concern must have exactly one verify-and-revoke step: $workflow" >&2
                  exit 1
                fi
                if ! awk -v verify="${verify_name}" '
                  /^      - / { in_verify = ($0 == "      - name: " verify) }
                  in_verify && /^        if:[[:space:]]+always\(\)[[:space:]]*$/ { ok = 1 }
                  END { exit !ok }
                ' "$workflow"; then
                  echo "The KeelDock verify-and-revoke step must run with if: always(): $workflow" >&2
                  exit 1
                fi
                while IFS= read -r step_name; do
                  case "$step_name" in
                    'Start the concern timer'|'Check out public control plane'|'Validate protected call input'|'Mint read-only private-source token'|'Check out exact private source SHA') ;;
                    "${verify_name}") break ;;
                    *)
                      echo "Step '${step_name}' precedes the KeelDock token revoke; project code and setup actions must run only after it: $workflow" >&2
                      exit 1
                      ;;
                  esac
                done < <(sed -nE 's/^      - name:[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\1/p' "$workflow")
                # Nothing project-shaped may sit in the reviewed pre-source steps, and the
                # source checkout must be the only step that names the private repository.
                if awk -v verify="${verify_name}" '
                  /^      - name:/ { name = substr($0, 15) }
                  name == verify { exit }
                  /^        run:/ && name != "Validate protected call input" && name != "Start the concern timer" { bad = 1 }
                  /^          (npm|dotnet|bash scripts|cargo) / { bad = 1 }
                  END { exit !bad }
                ' "$workflow"; then
                  echo "A KeelDock step before the token revoke runs project-shaped commands: $workflow" >&2
                  exit 1
                fi
              fi
            else
              protected_dispatch=0
              for dispatch_workflow in "${protected_dispatch_workflows[@]}"; do
                if [[ "$workflow" == "$dispatch_workflow" || "$workflow" == "./$dispatch_workflow" ]]; then
                  protected_dispatch=1
                  break
                fi
              done
              if (( ! protected_dispatch )); then
                if [[ "$workflow" != "$public_policy_workflow" && "$workflow" != "./$public_policy_workflow" ]] && \
                  grep -nE 'pull_request_target:|workflow_run:|workflow_call:|actions/(upload|download)-artifact|actions/cache|id-token:[[:space:]]*write|secrets\.' "$workflow"; then
                  echo "Unsafe trigger, artifact/cache path, OIDC grant, or Actions secret found in public policy workflows: $workflow" >&2
                  exit 1
                fi
                continue
              fi
              if ! grep -qE '^on:[[:space:]]*$' "$workflow" || ! grep -qE '^[[:space:]]+workflow_dispatch:[[:space:]]*$' "$workflow"; then
                echo "The protected dispatcher must be workflow_dispatch-only: $workflow" >&2
                exit 1
              fi
              if grep -nE '^[[:space:]]+(pull_request|pull_request_target|push|schedule|workflow_run|repository_dispatch|workflow_call):' "$workflow"; then
                echo "The protected dispatcher has an unapproved trigger: $workflow" >&2
                exit 1
              fi
              if ! grep -qE '^[[:space:]]+source_sha:' "$workflow" || ! grep -qE '\^\[0-9a-fA-F\]\{40\}' "$workflow"; then
                echo "The protected dispatcher must require a full source SHA: $workflow" >&2
                exit 1
              fi
              if ! grep -qE '^[[:space:]]+secrets:[[:space:]]+inherit[[:space:]]*(#.*)?$' "$workflow"; then
                echo "The protected dispatcher must explicitly pass reviewed secrets to the concern workflow: $workflow" >&2
                exit 1
              fi
              if [[ "$workflow" == ".github/workflows/windows-validation.yml" ]] && ! grep -qE 'uses:[[:space:]]+\./\.github/workflows/windows-validation-concern\.yml' "$workflow"; then
                echo "The protected Windows dispatcher must call the reviewed concern workflow: $workflow" >&2
                exit 1
              fi
              if [[ "$workflow" == ".github/workflows/keeldock-validation.yml" ]] && ! grep -qE 'uses:[[:space:]]+\./\.github/workflows/keeldock-validation-concern\.yml' "$workflow"; then
                echo "The protected KeelDock dispatcher must call the reviewed concern workflow: $workflow" >&2
                exit 1
              fi
              if [[ "$workflow" == ".github/workflows/linux-validation.yml" ]] && ! grep -qE 'uses:[[:space:]]+\./\.github/workflows/linux-validation-concern\.yml' "$workflow"; then
                echo "The protected Linux dispatcher must call the reviewed concern workflow: $workflow" >&2
                exit 1
              fi
            fi
          done < <(find .github/workflows .github/actions -type f \( -name '*.yml' -o -name '*.yaml' \) -print0 2>/dev/null)

          if find . -type f -not -path './.git/*' -not -path './.github/workflows/*' -not -path './.github/actions/*/action.yml' -not -path './.github/ci-matrix.json' -not -name '.gitignore' -print -quit | grep -q .; then
            echo "Only workflow files (and an optional .gitignore) may be tracked at this bootstrap phase." >&2
            exit 1
          fi
