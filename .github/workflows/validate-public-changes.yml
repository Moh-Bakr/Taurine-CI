name: Validate public CI policy

# The policy gate for this public repository. It has no OIDC permission, secrets, private
# checkout, cache access or artifact upload, and validates only this repository. Each check
# is a script under .github/policy/ (one responsibility each, read the script header for the
# rule and its rationale); this file only sequences them. Its job name, "Validate workflow
# policy", is the required status check on main.
#
# A pull request carries its own copy of .github/policy/, so the policy it brings could be the
# weakened one that lets it pass. On pull_request the same job therefore also checks out the
# BASE commit's policy and runs every base check against the pull request's tree: a change must
# pass both its own policy (so new fixtures run) and the base's. A legitimate policy change
# that the base policy rejects lands in two steps: first a change that makes the rule
# permissive (or adds the new rule beside the old one), then the change that relies on it
# (docs/how-ci-works.md, "Changing the policy").
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: public-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required status check. It waits for the base-policy job and fails when that job did not
  # pass, so moving the base pass into its own job does not move it off the required check.
  # `always()` keeps this job running when base-policy is skipped, which it is outside a pull
  # request.
  policy:
    permissions:
      contents: read
    name: Validate workflow policy
    needs: [base-policy, base-policy-fixtures]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Repository contents: no private source, credential material or unexpected path.
      - name: Reject private-source and credential material
        shell: bash
        run: bash .github/policy/check-repository.sh

      # Pinned actionlint and zizmor release binaries, verified against committed SHA-256s.
      # zizmor's online audits use this run's read-only token.
      - name: Lint workflows with pinned actionlint and zizmor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/policy/lint.sh

      # Rules for every workflow and composite: SHA pins, permissions: {}, no
      # pull_request_target, no secrets: inherit, source-checkout first in protected jobs.
      - name: Check the universal workflow rules
        shell: bash
        run: ruby .github/policy/check-universal.rb

      # Trust tiers: reviewed Actions, token revocation order, cache, secrets, dispatchers.
      - name: Enforce immutable reviewed Actions and safe workflow features
        shell: bash
        run: bash .github/policy/check-workflows.sh

      # More than 800 lines fails, more than 400 warns.
      - name: Check workflow and composite file sizes
        shell: bash
        run: bash .github/policy/check-sizes.sh

      # Fixture tests: the universal rules and size limits accept and reject what they should.
      - name: Test the policy rules against fixtures
        shell: bash
        run: bash .github/policy/test-policy.sh

      # The environment pre-flight composite, run against stub API answers: only custom branch
      # policies of exactly main and untrusted pass.
      - name: Test the environment pre-flight against stub endpoints
        shell: bash
        run: bash .github/policy/test-preflight.sh

      # The three steps that hold the source token, run against stub curl, git and date: each
      # revokes on every path, calls only the reviewed endpoints and refuses what it must.
      - name: Test the source-token revoke against stub endpoints
        shell: bash
        run: bash .github/policy/test-revoke.sh

      # Every weakening an independent review found is applied to a copy of the tree and must be
      # rejected, including a pull request that weakens its own policy.
      - name: Prove each reviewed weakening fails the policy
        shell: bash
        run: bash .github/policy/test-mutations.sh

      # Sanitizers and failure-detail extractors, run over path, token and message fixtures.
      - name: Test the sanitizer expressions against path and token fixtures
        shell: bash
        run: bash .github/policy/test-sanitizers.sh

      - name: Test the compiled dependency cache strip against hostile outputs
        shell: bash
        run: bash .github/policy/test-rust-target-cache.sh

      - name: Test the failure-detail extractors against fixtures
        shell: bash
        run: bash .github/policy/test-extractors.sh

      - name: Test sanitized build-failure category classification
        shell: bash
        run: bash .github/policy/test-build-failure-category.sh

      # The concern table, the dispatcher's matrix and the result check agree.
      - name: Check the concern table against the dispatcher
        shell: bash
        run: bash .github/policy/check-concern-table.sh

      - name: Test the concern selector on a synthetic repository
        shell: bash
        run: bash .github/policy/test-selector.sh

      - name: Test explicit run-result selection mode
        shell: bash
        run: bash .github/policy/test-run-result.sh

      # The reviewed candidate universe and coverage dispositions are immutable public policy.
      - name: Test the feature-suite catalog contract
        shell: bash
        run: bash .github/policy/test-suite-catalog.sh

      - name: Test the exact suite-selection policy on synthetic changes
        shell: bash
        run: bash .github/policy/test-suite-selection.sh

      - name: Test the sanitized feature-suite evidence contract
        shell: bash
        run: bash .github/policy/test-suite-evidence.sh

      - name: Test the trusted suite-evidence collector on synthetic reports
        shell: bash
        run: bash .github/policy/test-suite-collector.sh

      - name: Test the aggregate feature-suite overview
        shell: bash
        run: bash .github/policy/test-suite-overview.sh

      # The shadow selection review: the concern contract under a shadow
      # payload, the honest not-collected state of the evidence step, and the
      # dispatcher's fail-closed selection-review step.
      - name: Test the suite-selection dispatch review
        shell: bash
        run: bash .github/policy/test-suite-dispatch-review.sh

      - name: Test canonical dispatch identity and input defaults
        shell: bash
        run: bash .github/policy/test-dispatch-identity.sh

      # The roster the plan step selects is exactly what runs: no matrix filter, literal output
      # or skipped arm step between them.
      - name: Pin the live-proof fan-out from roster to arm runs
        shell: bash
        run: ruby .github/policy/check-live-proof-fanout.rb

      - name: Test the live-proof fan-out pin on arm-dropping fixtures
        shell: bash
        run: bash .github/policy/test-live-proof-fanout.sh

      - name: Test live-proof roster selection and JSON validity
        shell: bash
        run: bash .github/policy/test-live-roster.sh

      - name: Require every registered live-proof arm
        shell: bash
        run: ruby .github/policy/check-live-arm-coverage.rb

      - name: Test the live-arm coverage guard on weakened fixtures
        shell: bash
        run: ruby .github/policy/test-live-arm-coverage.rb

      - name: Parse PostgreSQL fixture action shell blocks without executing them
        shell: bash
        run: bash .github/policy/test-live-start-pg-shell.sh

      - name: Test control-owned PostgreSQL TLS fixtures without certificates or containers
        shell: bash
        run: bash .github/policy/test-pgtls-control-fixtures.sh

      - name: Test registered DBX feature coverage and old-source compatibility
        shell: bash
        run: bash .github/policy/test-dbx-feature-coverage.sh

      - name: Test PG8 measurement parsers on adversarial fixtures
        shell: bash
        run: python3 .github/policy/test-pg8-measurement.py

      - name: Test the dispatch contract policy against weakened fixtures
        shell: bash
        run: bash .github/policy/test-dispatch-contracts.sh


      # Release-installed tools are listed with their pins; Dependabot covers the Actions.
      - name: Check the tool pin list and Dependabot coverage
        shell: bash
        run: bash .github/policy/check-tools.sh

      # Every egress allow-list entry has a known scope, a host pattern and a reason.
      - name: Check the egress allow-list
        shell: bash
        run: bash .github/policy/check-egress-allowlist.sh
      # The base-policy pass is a separate job (below), so the result it reached cannot be
      # influenced by anything the checks above exported. This step keeps the required status
      # check honest: it fails when that job did not pass.
      - name: Require the base-policy fixtures job to have passed
        if: ${{ always() }}
        shell: bash
        env:
          FIXTURES_RESULT: ${{ needs.base-policy-fixtures.result }}
        run: |
          set -euo pipefail
          if [[ "${FIXTURES_RESULT}" != 'success' ]]; then
            echo "::error::the base-policy fixtures job did not pass (result: ${FIXTURES_RESULT})"
            exit 1
          fi
          echo 'base policy: the base-policy fixtures job passed'

      - name: Require the base-policy job to have passed
        if: ${{ always() && github.event_name == 'pull_request' }}
        shell: bash
        env:
          BASE_RESULT: ${{ needs.base-policy.result }}
        run: |
          set -euo pipefail
          if [[ "${BASE_RESULT}" != 'success' ]]; then
            echo "::error::the base-policy job did not pass (result: ${BASE_RESULT})"
            exit 1
          fi
          echo 'base policy: the separate base-policy job passed'

  # The base commit's policy, run against this pull request's tree (see the header), in a job of
  # its own.
  #
  # Its own job because the checks in `policy` run this pull request's scripts, and any of them can
  # append to GITHUB_ENV or GITHUB_PATH, write into RUNNER_TEMP, or leave a process running. In one
  # job the base pass had to defend against all of that from inside the same environment. In a
  # separate job it starts on a fresh runner with a fresh RUNNER_TEMP, so nothing those checks
  # exported or left behind reaches it.
  #
  # That is not the same as no pull-request code running here: some base tests extract and run
  # steps from this pull request's own copy of this workflow, inside this job. The steps below
  # limit what that code can do. And because the pull request's copy of this file defines this job
  # too, none of this defends against a pull request that edits it -- review is the control for
  # that (docs/how-ci-works.md).
  #
  # `policy` requires this job's result, so splitting it out does not take it off the required
  # status check.
  # The fixtures that execute the base-policy step. They have a job of their own because that step
  # refuses to run while passwordless sudo is available, and the `policy` job keeps it. Here the
  # sudo rule is shown first, while root is still present, and then root is removed and every other
  # fixture runs, as the step itself would run in the base-policy job.
  base-policy-fixtures:
    permissions:
      contents: read
    name: Test the base-policy step
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before drop-root, while passwordless sudo is still there: the step must refuse to run.
      # --require makes this fail rather than skip if it cannot exercise that.
      - name: Test that the base-policy step refuses to run with passwordless sudo
        shell: bash
        run: bash .github/policy/test-base-policy-sudo.sh --require

      - name: Remove root before the remaining fixtures
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/drop-root  # zizmor: ignore[self-repository]

      # Rejecting fixtures with RUBYOPT, RUBYLIB, BASH_ENV and a PATH shim planted: the step must
      # still reject.
      - name: Test that planted environment cannot make the base policy pass
        shell: bash
        run: bash .github/policy/test-base-policy-env.sh

      # The pin, process containment and loader scrub, each broken by its own fixture. /proc exists
      # here, so the daemon-escape fixture runs rather than reporting that it could not.
      - name: Test the base-policy job's pin, process containment and loader scrub
        shell: bash
        run: bash .github/policy/test-base-policy-isolation.sh

  base-policy:
    permissions:
      contents: read
    name: Validate against the base policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public policy repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Check out the base commit's policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-policy
          fetch-depth: 1
          persist-credentials: false

      # Base tests extract and execute steps from this pull request's copy of the workflow, so
      # pull-request code runs inside this job. Take away the runner's passwordless sudo and
      # Docker before any of it does, with the same composite the source-validation jobs use
      # before project code; the step below asserts sudo is gone.
      - name: Remove root before the base policy runs
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/drop-root  # zizmor: ignore[self-repository]

      # The shell is named by absolute path and started in privileged mode with the startup files
      # skipped, so nothing can steer it through BASH_ENV, ENV, SHELLOPTS, an exported function
      # (BASH_FUNC_*), the loader variables, or a bash on a GITHUB_PATH directory before this
      # script runs. The script then pins its own command lookup and guards each base script.
      - name: Run the base commit's policy against this pull request
        shell: /usr/bin/env -u BASH_ENV -u ENV -u LD_PRELOAD -u LD_LIBRARY_PATH -u LD_AUDIT /bin/bash --noprofile --norc -p -eo pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          PATH=/usr/bin:/bin:/usr/sbin:/sbin
          set -euo pipefail
          base="${RUNNER_TEMP}/base-policy"
          rm -rf "${base}"
          mv base-policy "${base}"
          # The base scripts the loop below selects, counted in the base checkout before the copy, so a
          # copy or a loop that quietly does nothing is a failure and not a pass.
          count_scripts() {
            local n=0 f
            for f in "$1"/check-*.rb "$1"/check-*.sh "$1"/lint.sh "$1"/test-*.sh "$1"/test-*.rb; do
              if [[ -f "${f}" ]]; then n=$((n + 1)); fi
            done
            echo "${n}"
          }
          expected="$(count_scripts "${base}/.github/policy")"
          [[ "${expected}" -gt 0 ]] || { echo "::error::the base commit has no policy scripts to run"; exit 1; }
          rm -rf .github/policy
          cp -R "${base}/.github/policy" .github/policy
          diff -rq "${base}/.github/policy" .github/policy > /dev/null || { echo "::error::the base policy was not copied faithfully"; exit 1; }

          # Only the allow-listed names reach a base script, or any command this step runs on its
          # behalf. The loader variables are named here because they change what every process
          # loads before its first instruction, and are asserted absent below rather than merely
          # left out of the list.
          ruby_bin=/usr/bin/ruby
          bash_bin=/bin/bash
          for tool in "${ruby_bin}" "${bash_bin}" /usr/bin/env /usr/bin/git; do
            [[ -x "${tool}" ]] || { echo "::error::${tool} is missing, so the base policy cannot run in a clean environment"; exit 1; }
          done
          clean_home="${RUNNER_TEMP}/base-policy-home"
          mkdir -p "${clean_home}"
          scrub=(/usr/bin/env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin "HOME=${clean_home}" LANG=C.UTF-8 LC_ALL=C.UTF-8)
          for name in CI GITHUB_ACTIONS GITHUB_API_URL GITHUB_EVENT_NAME GITHUB_REF GITHUB_REPOSITORY GITHUB_SERVER_URL GITHUB_SHA GITHUB_WORKSPACE RUNNER_ARCH RUNNER_OS RUNNER_TEMP; do
            [[ -z "${!name+x}" ]] || scrub+=("${name}=${!name}")
          done
          # Root was removed by the drop-root step before this one. Hosted runners give the job
          # user passwordless sudo, and PR code that a base test executes could otherwise use it to
          # write /etc/ld.so.preload or replace ruby. Fail closed if it is still there.
          if /usr/bin/sudo -n true 2>/dev/null; then
            echo "::error::passwordless sudo is still available, so a base script could act as root"
            exit 1
          fi
          # Defence in depth: `env -i` above already starts every base script with nothing but the
          # allow-listed names, so no loader variable can reach one. This asserts it rather than
          # relying on it.
          loaders="$("${scrub[@]}" /usr/bin/env | grep -E '^(LD_|DYLD_)' || true)"
          [[ -z "${loaders}" ]] || { echo "::error::loader variables reached the base policy environment: ${loaders%%=*}"; exit 1; }

          # What the base policy is, pinned to the base commit's own git objects rather than to
          # whatever is on disk: SHA-256 over each blob's bytes, read out of the base checkout's
          # object store. HEAD of that checkout is the base commit, because the step above checked
          # it out at `ref: base.sha`; reading the commit from the checkout rather than from an
          # expression keeps this script free of template interpolation.
          #
          # The manifest is re-verified before every script, so a base script that rewrote a later
          # one -- or anything it spawned that did -- is caught between them. It is held in this
          # shell's memory and handed to the verifier on stdin, never written to disk: a base script
          # runs as the same user and can see RUNNER_TEMP, so a manifest file there is one more file
          # it could rewrite to match its own edit. It is built and checked by the pinned ruby in
          # the same scrubbed environment as the base scripts, so RUBYOPT cannot steer the check
          # that pins them either.
          # The pin is only as good as the commit it reads, so the checkout's HEAD must be the base
          # commit this pull request names. Arrives through the environment, never interpolated
          # into the script.
          [[ "${BASE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the base commit is not a full SHA"; exit 1; }
          checked_out="$("${scrub[@]}" /usr/bin/git -C "${base}" rev-parse --verify HEAD)"
          [[ "${checked_out}" == "${BASE_SHA}" ]] || { echo "::error::the base checkout is ${checked_out}, not the base commit ${BASE_SHA}"; exit 1; }
          pins="$("${scrub[@]}" "${ruby_bin}" -e '
            require "digest"
            require "open3"
            base = ARGV.fetch(0)
            listing, status = Open3.capture2("/usr/bin/git", "-C", base, "ls-tree", "-r", "-z", "HEAD", "--", ".github/policy")
            abort("::error::cannot read the base commit tree") unless status.success?
            rows = listing.split("\0").reject(&:empty?).map do |entry|
              meta, path = entry.split("\t", 2)
              oid = meta.split(" ").fetch(2)
              blob, blob_status = Open3.capture2("/usr/bin/git", "-C", base, "cat-file", "blob", oid)
              abort("::error::cannot read #{path} from the base commit") unless blob_status.success?
              [Digest::SHA256.hexdigest(blob), path]
            end
            abort("::error::the base commit lists no policy files to pin") if rows.empty?
            print rows.sort_by(&:last).map { |digest, path| "#{digest}  #{path}\n" }.join
          ' "${base}")"
          pinned="$(printf '%s\n' "${pins}" | wc -l | tr -d ' ')"
          verify_manifest() {
            printf '%s\n' "${pins}" | "${scrub[@]}" "${ruby_bin}" -e '
              require "digest"
              pinned = STDIN.read.lines.map { |line| line.chomp.split("  ", 2) }.reject { |pair| pair.length != 2 }.to_h { |d, p| [p, d] }
              # FNM_DOTMATCH, so an added hidden file is reported like any other.
              present = Dir.glob(".github/policy/**/*", File::FNM_DOTMATCH).select { |path| File.file?(path) }.sort
              missing = pinned.keys.sort - present
              extra = present - pinned.keys.sort
              unless missing.empty? && extra.empty?
                warn "::error::the base policy on disk does not match the files the base commit pinned" \
                  " (missing: #{missing.join(", ")}; unexpected: #{extra.join(", ")})"
                exit 1
              end
              changed = pinned.reject { |path, digest| Digest::SHA256.hexdigest(File.binread(path)) == digest }
              unless changed.empty?
                warn "::error::a base policy file no longer matches the base commit it was pinned to: #{changed.keys.join(", ")}"
                exit 1
              end
            '
          }
          verify_manifest || exit 1

          # Each base script runs in a session of its own, so whatever it starts is in that session
          # too, and the session is torn down when the script returns. A base script that leaves a
          # listener or a watcher behind cannot outlive its own check.
          #
          # The session is created by the already-pinned ruby rather than by setsid: one fewer
          # binary to depend on, and setsid is not present on every machine these fixtures run on.
          # env and ruby both exec rather than fork, so the pid this shell started is the pid that
          # calls Process.setsid and then becomes the base script: it names the session and its
          # group. It is taken from `$!`, never from a file, because a base script could rewrite a
          # file to point the teardown at some other group and keep its own child alive.
          #
          # Leaving a process behind is a failure, not a warning: a base script has no reason to,
          # and a process that outlives its check can act on the next one. Two ways out are
          # watched.
          #
          # A process still in the script's session when it returns is found through the group.
          #
          # A process that left the session -- a double fork and setsid, as Process.daemon does --
          # is in no group the teardown can kill. It is found by a marker instead: each script
          # runs with a fresh random TAURINE_BASE_GUARD value in its environment, which every
          # process it starts inherits through fork, exec and daemon alike. Anything still alive
          # with that value once the script has returned has outlived it. An earlier version
          # diffed the runner user's process list instead; that cannot tell an escapee from an
          # unrelated process the same user started meanwhile, and it failed closed on exactly
          # that in testing. The marker is per script, so it does not have that problem.
          marked_pids() {
            local marker="TAURINE_BASE_GUARD=$1" found=''
            if [[ -d /proc/self ]]; then
              local environ
              for environ in /proc/[0-9]*/environ; do
                if tr '\0' '\n' < "${environ}" 2>/dev/null | grep -Fxq -- "${marker}"; then
                  found+="${environ//[^0-9]/} "
                fi
              done
            else
              # No /proc: read each process's environment through ps. Exclude this shell's own
              # descendants, which carry the marker only as an argument to the search itself.
              found="$(ps -E -A -o pid=,ppid=,command= | awk -v me="$$" -v needle="${marker}" '
                { parent[$1] = $2; line[$1] = $0 }
                END {
                  for (p in line) {
                    if (index(line[p], needle) == 0) continue
                    q = p
                    while (q != me && q > 1 && (q in parent)) q = parent[q]
                    if (q != me) printf "%s ", p
                  }
                }')"
            fi
            printf '%s' "${found}"
          }
          process_failure=0
          run_guarded() {
            local status=0 leader guard survivors
            guard="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            "${scrub[@]}" ${token[@]+"${token[@]}"} "TAURINE_BASE_GUARD=${guard}" "${ruby_bin}" -e '
              Process.setsid
              exec(*ARGV)
            ' "$@" &
            leader=$!
            wait "${leader}" || status=$?
            if kill -0 -- "-${leader}" 2>/dev/null; then
              kill -TERM -- "-${leader}" 2>/dev/null || true
              sleep 1
              kill -KILL -- "-${leader}" 2>/dev/null || true
              echo "::error::base policy: ${check##*/} left a process running in its session when it returned; it was killed"
              process_failure=1
            fi
            survivors="$(marked_pids "${guard}")"
            if [[ -n "${survivors// /}" ]]; then
              # shellcheck disable=SC2086
              kill -KILL ${survivors} 2>/dev/null || true
              echo "::error::base policy: ${check##*/} left a process that escaped its session (pid ${survivors% }); it was killed"
              process_failure=1
            fi
            return "${status}"
          }

          status=0
          executed=0
          for check in .github/policy/check-*.rb .github/policy/check-*.sh .github/policy/lint.sh .github/policy/test-*.sh .github/policy/test-*.rb; do
            [[ -f "${check}" ]] || continue
            verify_manifest || { status=1; break; }
            executed=$((executed + 1))
            token=()
            if [[ "${check##*/}" == lint.sh && -n "${GH_TOKEN+x}" ]]; then token=("GH_TOKEN=${GH_TOKEN}"); fi
            echo "::group::base policy: ${check##*/}"
            case "${check}" in
              *.rb) run_guarded "${ruby_bin}" "${check}" || { echo "::error::The base commit's ${check##*/} rejects this pull request"; status=1; } ;;
              *) run_guarded "${bash_bin}" --noprofile --norc "${check}" || { echo "::error::The base commit's ${check##*/} rejects this pull request"; status=1; } ;;
            esac
            echo '::endgroup::'
          done
          [[ "${executed}" -eq "${expected}" ]] || { echo "::error::ran ${executed} of ${expected} base policy scripts"; exit 1; }
          [[ "${process_failure}" -eq 0 ]] || status=1
          verify_manifest || status=1
          echo "base policy: ${executed} scripts run against ${pinned} pinned files"
          exit "${status}"
