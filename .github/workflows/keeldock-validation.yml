name: KeelDock Cloud source validation (protected)

# The second private source this control plane validates.
#
# `Moh-Bakr/keeldock-cloud` is private, and GitHub refuses to start Actions jobs on this account's
# private repositories (a billing or spending-limit block), so the source's own `.github/workflows/ci.yml`
# cannot run there. This lane is where its gates execute: the concerns follow that file's gate order and
# discover suites the way `scripts/run-tests.sh` does, instead of keeping a second suite list. This
# repository is public, so its minutes are free; the source-read pattern checks out an exact private SHA
# and destroys the token before project code runs.
#
# A run is a clean checkout on all three operating systems, which is also the evidence the source's
# Phase 0 record lacked ("clean-machine topology start on macOS, Windows and Linux").
#
# **Scope, stated honestly.** Every run executes build-format, structural, unit and
# contracts-publish-smoke on Linux, macOS and Windows, plus two Linux-only concerns: db-containers (the
# Testcontainers suites) and supply-chain (vulnerable packages, SBOM and licence gate). Together they
# prove the solution restores from its lock files, builds, passes its structural and unit gates
# everywhere, passes its database-backed gates and a real-PostgreSQL Migrator proof on Linux, and ships no
# known-vulnerable or denied-licence package. The Aspire AppHost cold start (`apphost-cold-start`, a
# fourteenth job) is opt-in: dispatch with `apphost: true`.
#
# **Making the vulnerable-package scan blocking.** It is warn-only by default. Dispatch with
# `vulnerability_gate: high` (fail on High and Critical) or `critical` (Critical only); to change the
# default, edit `default:` of that input below, in a reviewed commit. The denied-licence list is
# `SBOM_DENIED_LICENSES` in keeldock-validation-concern.yml.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private keeldock-cloud
        required: true
        type: string
      vulnerability_gate:
        description: Vulnerable-package scan severity that fails the supply-chain concern (none = warn-only)
        required: false
        default: none
        type: choice
        options: [none, high, critical]
      apphost:
        description: Also run the Aspire AppHost cold-start concern (experimental, Linux; off by default)
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  # Each run has its own group: GitHub keeps only one PENDING run per group, so a shared per-SHA
  # group let a later dispatch silently cancel an earlier pending one. Runs are never
  # deduplicated or cancelled; check for an existing run before dispatching (docs/how-ci-works.md).
  # Nothing is shared between runs that a group would protect: caches are first-writer-wins on an
  # exact key, so a race is harmless.
  group: keeldock-validation-${{ inputs.source_sha }}-${{ github.run_id }}
  # Never cancel a source-bearing run: cancellation can interrupt the cleanup
  # step that revokes the short-lived private-source token.
  cancel-in-progress: false

jobs:
  validate-input:
    permissions:
      actions: read
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    name: Validate protected dispatch input
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Before any job enters source-read: its deployment branches must be exactly main and
      # untrusted (docs/how-ci-works.md, "Repository settings the owner applies").
      - name: Verify the source-read deployment branches
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/environment-preflight  # zizmor: ignore[self-repository]
        with:
          github-token: ${{ github.token }}

      - name: Validate exact source SHA
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}" >> "${GITHUB_STEP_SUMMARY}"
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

  validate:
    permissions:
      contents: read
    if: github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted')
    needs: validate-input
    strategy:
      # Each concern on each operating system is independent evidence. A Windows
      # path-separator bug must not hide the Linux result, a slow database suite must
      # not hold the build result hostage, and a failing concern says which gate
      # failed without opening a log.
      fail-fast: false
      matrix:
        include:
          - { concern: build-format, platform: linux }
          - { concern: build-format, platform: macos }
          - { concern: build-format, platform: windows }
          - { concern: structural, platform: linux }
          - { concern: structural, platform: macos }
          - { concern: structural, platform: windows }
          - { concern: unit, platform: linux }
          - { concern: unit, platform: macos }
          - { concern: unit, platform: windows }
          - { concern: contracts-publish-smoke, platform: linux }
          - { concern: contracts-publish-smoke, platform: macos }
          - { concern: contracts-publish-smoke, platform: windows }
          # Only the Ubuntu runner has a Docker daemon, so the Testcontainers suites
          # (including the extraction-fitness gates) are Linux-only evidence.
          - { concern: db-containers, platform: linux }
          - { concern: supply-chain, platform: linux }
          - { concern: apphost-cold-start, platform: linux }
    uses: ./.github/workflows/keeldock-validation-concern.yml  # zizmor: ignore[self-repository]
    # Exactly one secret is named: the App private key. SOURCE_READER_PRIVATE_KEY is an
    # ENVIRONMENT secret of `source-read` (the repository has no repository-level secrets), and
    # the called job enters that environment, which supplies the value to that job only.
    # The reference below resolves in the caller's context, where no repository secret exists, so it
    # passes an empty value that the environment secret overrides inside the called job; nothing
    # else is inherited.
    # The App id (SOURCE_READER_APP_ID) is a variable of the named environment, which only the
    # called job can read, so it is not passed here.
    # To move Keel Dock to its own GitHub App: create the environment keeldock-source-read
    # with the variable SOURCE_READER_APP_ID and the environment secret
    # KEELDOCK_SOURCE_READER_PRIVATE_KEY, then change the secret reference below and the
    # environment name (the policy allows exactly these names).
    secrets:
      SOURCE_READER_PRIVATE_KEY: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
    with:
      # The one place the environment is named. To move Keel Dock to its own GitHub App,
      # create the environment `keeldock-source-read` (see the setup notes in the pull request
      # that introduced this) and change this one value to keeldock-source-read.
      environment: source-read
      source_sha: ${{ inputs.source_sha }}
      platform: ${{ matrix.platform }}
      concern: ${{ matrix.concern }}
      apphost: ${{ inputs.apphost }}
      vulnerability_gate: ${{ inputs.vulnerability_gate }}

  # Tabulates every concern's duration and conclusion for this run and warns when a concern took more
  # than 25% (and more than two minutes) longer than the committed baseline, in seconds, keyed
  # `<os> <concern>` (measured from run 37232233167). Warning only, never fails the run, publishes no
  # artifact, and uses only this repository's own run API with the run's read-only token. A concern with
  # no baseline (supply-chain, until measured) is listed without a comparison.
  timings:
    if: ${{ always() && github.repository == 'Moh-Bakr/Taurine-CI' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/untrusted') }}
    needs: [validate]
    name: Concern timings
    runs-on: ubuntu-24.04
    # Reporting only: a queued, slow or cancelled timings job must never fail a run whose
    # concerns all passed (run 37342723559 was cancelled while waiting for a runner).
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Record the runner image
        shell: bash
        run: |
          echo "- Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}" >> "${GITHUB_STEP_SUMMARY}"
      - name: Tabulate concern timings against the baseline
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: table
          label: KeelDock
          github-token: ${{ github.token }}
          baseline-seconds: '{"linux build-format":408,"linux structural":257,"linux unit":172,"linux contracts-publish-smoke":182,"linux db-containers":854,"macos build-format":432,"macos structural":315,"macos unit":246,"macos contracts-publish-smoke":135,"windows build-format":425,"windows structural":272,"windows unit":274,"windows contracts-publish-smoke":253}'
          name-pattern: '^validate \(.+\) / KeelDock (?<concern>(linux|macos|windows) .+)$'
