name: Linux app validation concern (protected)

# Each concern gets a clean hosted runner and performs its own exact private
# checkout. No source-bearing artifact, cache, or output crosses job boundaries.
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      concern:
        description: Independent Linux validation concern to execute
        required: true
        type: string

permissions:
  contents: read

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  validate:
    name: Linux ${{ inputs.concern }}
    environment: source-read
    runs-on: ubuntu-24.04
    # The browser tiers start a dev server, download a browser and drive a
    # real page; the unit and contract concerns stay on the reviewed 30.
    # 45 for the Rust concern. Nothing is cached — no job in this control plane
    # caches anything, and `target/` could not be cached anyway because it holds
    # compiled private source — so every run compiles rquickjs, which builds C
    # and generates bindings through libclang, plus reqwest's TLS stack, cold.
    #
    # The `rust-*` crate-test concerns get the browser tiers' 60: each compiles
    # its whole closure cold for the same reason. `rust-app` and `rust-dbx` get
    # 90. `rust-app` links one test binary per file under `taurine-app/tests/`
    # (over a hundred), each carrying the full command tier plus Tauri, DuckDB's
    # C++ amalgamation and every driver; the private `docs/testing-baseline.md`
    # measured `cargo test -p taurine-app` at 708 s cold on a ten-core
    # workstation before the command tier doubled. `rust-dbx` compiles the
    # adopted `dbx-core` tree, whose own manifest records it as roughly 490
    # crates.
    timeout-minutes: ${{ (inputs.concern == 'rust-app' || inputs.concern == 'rust-dbx') && 90 || (startsWith(inputs.concern, 'e2e-') || startsWith(inputs.concern, 'rust-')) && 60 || (inputs.concern == 'taurine-cli' && 45 || 30) }}
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate protected call input
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'linux-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      - name: Mint read-only private-source token
        id: source-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SOURCE_READER_APP_ID }}
          private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repositories: ${{ env.SOURCE_REPOSITORY_NAME }}
          permission-contents: read
          skip-token-revoke: true

      - name: Check out exact private source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SOURCE_REPOSITORY_OWNER }}/${{ env.SOURCE_REPOSITORY_NAME }}
          ref: ${{ inputs.source_sha }}
          token: ${{ steps.source-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Verify identity, exact checkout, and revoke source token
        if: always()
        shell: bash
        env:
          SOURCE_TOKEN: ${{ steps.source-token.outputs.token }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          set +x
          failed=0
          requested_sha="${REQUESTED_SOURCE_SHA,,}"
          if [[ -z "${SOURCE_TOKEN}" ]]; then
            echo 'No source token was minted; refusing to continue' >&2
            exit 1
          fi
          if ! identity="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repositories/${SOURCE_REPOSITORY_ID}")"; then
            echo 'The configured source repository identity could not be resolved' >&2
            failed=1
          elif [[ "$(jq -r '.id' <<<"${identity}")" != "${SOURCE_REPOSITORY_ID}" || \
            "$(jq -r '.owner.login' <<<"${identity}")" != "${SOURCE_REPOSITORY_OWNER}" || \
            "$(jq -r '.name' <<<"${identity}")" != "${SOURCE_REPOSITORY_NAME}" ]]; then
            echo 'The configured source repository identity did not match' >&2
            failed=1
          fi
          if ! checked_out_sha="$(git rev-parse --verify HEAD 2>/dev/null | tr '[:upper:]' '[:lower:]')"; then
            echo 'The private source checkout did not complete' >&2
            failed=1
          elif [[ "${checked_out_sha}" != "${requested_sha}" ]]; then
            echo 'The checked-out commit does not match source_sha' >&2
            failed=1
          fi
          if ! api_sha="$(curl --fail --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${SOURCE_REPOSITORY_OWNER}/${SOURCE_REPOSITORY_NAME}/commits/${requested_sha}" |
            jq -er '.sha | ascii_downcase')" || [[ "${api_sha}" != "${requested_sha}" ]]; then
            echo 'The requested source SHA was not resolved from the configured repository' >&2
            failed=1
          fi
          if ! curl --fail --silent --show-error --retry 2 \
            -X DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${SOURCE_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/installation/token"; then
            echo 'Source token revocation failed; refusing to execute project code' >&2
            failed=1
          fi
          unset SOURCE_TOKEN
          git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git config --global --unset-all credential.helper 2>/dev/null || true
          find "${RUNNER_TEMP}" -type f -path '*/_runner_file_commands/set_output_*' -exec sh -c ': > "$1"' _ {} \;
          (( failed == 0 ))

      # The Rust concerns (`taurine-cli` and every `rust-*`) skip this and the
      # dependency install below. `rust-dbx` does call `npm run`, but only to
      # resolve a root `package.json` script to the cargo command it names;
      # that needs no node_modules, and the runner image's own Node runs it.
      - name: Set up Node.js
        if: inputs.concern != 'taurine-cli' && !startsWith(inputs.concern, 'rust-')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0

      # The Rust concerns need no node_modules, so they skip three `npm ci` runs.
      # They still need the vendor fetch below: `[patch.crates-io]` in the
      # workspace root points at `vendor/boringtun` by path, and cargo refuses to
      # load a manifest that is not there — so *every* cargo command in this
      # repository fails on a fresh checkout until the script has run. That is
      # documented in `vendor.lock` and is not specific to this workflow.
      - name: Install locked JavaScript dependencies
        if: inputs.concern != 'taurine-cli' && !startsWith(inputs.concern, 'rust-')
        shell: bash
        run: |
          set -euo pipefail
          run_quiet() {
            local label="$1"; shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              local reason='command returned non-zero'
              if grep -Eiq 'command not found|is not recognized' "${log}"; then reason='missing command';
              elif grep -Eiq 'cannot find module|module not found|no such file or directory' "${log}"; then reason='missing dependency or file';
              elif grep -Eiq 'typescript|ts[0-9]{4}|type error' "${log}"; then reason='TypeScript compilation failure';
              elif grep -Eiq 'out of memory|heap out of memory|JavaScript heap' "${log}"; then reason='memory exhaustion';
              elif grep -Eiq 'vendor-openvpn3:|fatal:|sha256|does not apply|could not download' "${log}"; then reason='pinned vendor fetch or verification failure';
              elif grep -Eiq 'test failed|assertion|failed [0-9]+ test|vitest' "${log}"; then reason='test failure'; fi
              echo "${label}: failed (${reason}; detailed output withheld)" >&2
              exit 1
            fi
          }
          run_quiet npm-root npm ci --include=optional --ignore-scripts
          run_quiet npm-desktop npm --prefix taurine-desktop ci --include=optional --ignore-scripts
          run_quiet npm-mobile npm --prefix taurine-mobile ci --include=optional --ignore-scripts
          run_quiet vendor-fetch bash scripts/vendor-openvpn3.sh fetch

      - name: Set up the Rust toolchain
        if: inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-')
        shell: bash
        env:
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          # The runner's own rustup, not a third-party action: android-validation
          # and ios-validation already do it this way, and this control plane
          # adds no action it does not have to.
          rustup component add rustfmt clippy

          # taurine-scripting depends on rquickjs with the `bindgen` feature, so
          # this concern needs libclang at build-script runtime. The hosted image
          # ships clang but not reliably the shared library bindgen loads, and
          # the failure surfaces only as an unhelpful `No such file or directory`
          # from Cargo. android-validation carries the same block for the same
          # reason. The crate-test concerns take it too: rquickjs is in the
          # domain and app closures and libsql's bindgen build in the db and app
          # ones, and one shared install is simpler than a per-concern guess.
          #
          # The crate-test concerns reach system libraries `taurine-cli` does
          # not, each named here with the crate that needs it, all from the
          # image's own Ubuntu archive. Measured from the private lockfile and
          # build scripts, not guessed:
          # - libdbus-1-dev: taurine-crypt's default `keychain` feature takes
          #   keyring's `sync-secret-service`, whose libdbus-sys has no vendored
          #   build and finds dbus-1 through pkg-config (store, repo and app
          #   reach it through crypt).
          # - the openvpn3 set: taurine-ovpn-sys compiles vendored openvpn3-core
          #   C++ against these; the list is copied from the private
          #   `docs/architecture/vendored-openvpn3.md` and `ovpn-core.yml`, which
          #   is where it was proven on ubuntu.
          # - the Tauri set: taurine-app and the two shells link wry, i.e.
          #   webkit2gtk-4.1 (which brings gtk3, libsoup3 and javascriptcore),
          #   plus libxdo for muda's accelerators; the list is Tauri's own Linux
          #   prerequisites less the tray indicator, which nothing enables.
          # - fontconfig/freetype/openssl: dbx-core's default `system-fonts`
          #   feature (font-kit) and its tokio-openssl transport.
          extra_packages=()
          case "${CONCERN}" in
            rust-domain) extra_packages=(libdbus-1-dev pkg-config) ;;
            rust-net) extra_packages=(libasio-dev libfmt-dev libjsoncpp-dev liblz4-dev libxxhash-dev libssl-dev pkg-config) ;;
            rust-app) extra_packages=(libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev libssl-dev libdbus-1-dev pkg-config) ;;
            rust-dbx) extra_packages=(libfontconfig1-dev libfreetype-dev libssl-dev pkg-config) ;;
          esac
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang libclang-dev "${extra_packages[@]}"
          # Debian/Ubuntu commonly expose this as libclang-18.so.1 rather than an
          # unversioned libclang.so symlink.
          libclang_file="$(find /usr/lib -type f \( -name 'libclang.so*' -o -name 'libclang-*.so*' \) -print -quit)"
          [[ -n "${libclang_file}" ]] || { echo 'libclang shared library is unavailable' >&2; exit 1; }
          echo "LIBCLANG_PATH=$(dirname "${libclang_file}")" >> "${GITHUB_ENV}"

          # The crate-test concerns only, so `taurine-cli` builds exactly as it
          # did. Three settings, all about the runner rather than the code:
          # - no incremental state: nothing is cached, so it is written and
          #   never read again;
          # - no debug info for tests and their dependencies: the repository's
          #   profiles keep line tables for local backtraces, but this workflow
          #   publishes no backtrace (see `cargo_test_detail` below), and
          #   `rust-app` alone links over a hundred binaries that each carry the
          #   whole command tier — that is the disk and link time it saves;
          # - `target/` on the runner's second disk when it has one: hosted
          #   Ubuntu runners mount a larger scratch disk at /mnt, and
          #   `rust-app`/`rust-db` compile closures that crowd the root disk.
          #   It stays on this ephemeral runner like everything else here — it
          #   is never uploaded or cached — and the root disk is the fallback.
          if [[ "${CONCERN}" == rust-* ]]; then
            {
              echo 'CARGO_INCREMENTAL=0'
              echo 'CARGO_PROFILE_DEV_DEBUG=0'
              echo 'CARGO_PROFILE_TEST_DEBUG=0'
            } >> "${GITHUB_ENV}"
            if mountpoint -q /mnt; then
              sudo mkdir -p /mnt/cargo-target
              sudo chown "$(id -u):$(id -g)" /mnt/cargo-target
              echo 'CARGO_TARGET_DIR=/mnt/cargo-target' >> "${GITHUB_ENV}"
            fi
            df -h / /mnt 2>/dev/null || df -h /
          fi

      - name: Fetch pinned vendored sources
        if: inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-')
        shell: bash
        run: |
          set -euo pipefail
          # `fetch` verifies each download against the sha256 pinned in
          # vendor.lock and applies the reviewed boringtun zeroize patch, so this
          # is a supply-chain check as much as a prerequisite.
          if ! bash scripts/vendor-openvpn3.sh fetch >"${RUNNER_TEMP}/vendor-fetch.log" 2>&1; then
            echo 'vendor-fetch: failed (detailed output withheld)' >&2
            exit 1
          fi
          echo 'vendor-fetch: passed'

      - name: Install the pinned Playwright browser
        if: startsWith(inputs.concern, 'e2e-')
        shell: bash
        run: |
          set -euo pipefail
          # --no-install keeps the CLI resolving from the locked devDependency
          # rather than fetching a floating one from the registry; the browser
          # build it then downloads is the one that version pins. Only Chromium:
          # every Playwright project in the suite uses Desktop Chrome.
          if ! (cd taurine-desktop && npx --no-install playwright install --with-deps chromium) \
            >"${RUNNER_TEMP}/playwright-install.log" 2>&1; then
            echo 'playwright-install: failed (detailed output withheld)' >&2
            exit 1
          fi
          echo 'playwright-install: passed'

      - name: Run isolated Linux validation concern
        shell: bash
        env:
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail

          # Why the Rust labels are sanitized rather than withheld outright.
          #
          # `cargo fmt --check` and `cargo clippy -- --deny warnings` are the
          # first style and lint gates this crate has ever had, so the failures
          # nobody can predict are exactly their first ones. A bare "failed"
          # tells a reader outside the private repository nothing they can act
          # on — not even whether the cause was a lint, a broken build script,
          # a missing toolchain component or a crate that would not compile —
          # and the private source is not readable from here to work it out.
          #
          # So the headline diagnostic, its file and line, and the note naming
          # the lint are published. What cargo prints *around* those is not:
          # the quoted source excerpt, the `help:` rewrite and rustfmt's diff
          # body are the private source itself, and none of them pass the
          # allow-list below. The same rule the e2e branch already follows —
          # publish what names the failure, never what the failure was in.
          cargo_sanitize() {
            sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' "$1" |
              sed -E "s#${GITHUB_WORKSPACE}/##g" |
              sed -E 's#/home/runner/work/[^ ]+#<private-path>#g; s#/Users/[^ ]+#<private-path>#g' |
              cut -c1-200
          }

          cargo_detail() {
            cargo_sanitize "$1" |
              grep -E '^(error(\[E[0-9]{4}\])?|warning): |^[[:space:]]*--> |^[[:space:]]*= note: .*(lint level|-D |-W |deny\(|warn\()|^Diff in |^test .* FAILED$|^test result: |^failures:$|^smoke: ' |
              head -40 >&2 || true
          }

          # One line saying which kind of failure it was, so the classification
          # survives even when no diagnostic line clears the allow-list above.
          cargo_reason() {
            local log="$1"
            if grep -qE '^smoke: ' "${log}"; then echo 'the built binary did not meet its documented contract'
            elif grep -qE 'no such command|not installed for the toolchain|clippy-driver' "${log}"; then echo 'missing Rust toolchain component'
            elif grep -qE '^Diff in ' "${log}"; then echo 'rustfmt formatting difference'
            elif grep -qE 'clippy::[a-z_]+' "${log}"; then echo 'clippy lint promoted to an error by --deny warnings'
            elif grep -qE 'implied by .-D warnings.|requested on the command line with .-D warnings.' "${log}"; then echo 'rustc warning promoted to an error by --deny warnings'
            elif grep -qE 'Unable to find libclang|libclang.*[Nn]o such file' "${log}"; then echo 'libclang or bindgen failure'
            elif grep -qE 'failed to run custom build command' "${log}"; then echo 'dependency build script failure'
            elif grep -qE 'test result: FAILED|^failures:$' "${log}"; then echo 'test failure'
            elif grep -qE '^error(\[E[0-9]{4}\])?: |could not compile' "${log}"; then echo 'compilation failure'
            elif grep -qE 'failed to (download|select|get|load|parse)' "${log}"; then echo 'dependency download or resolution failure'
            elif grep -qE 'No space left on device' "${log}"; then echo 'runner disk exhaustion'
            else echo 'command returned non-zero'
            fi
          }

          # The crate-test concerns publish under a narrower rule than the
          # lint lane above, because a test run prints things a lint run does
          # not: the captured output of every failed test, and the raw stderr of
          # any subprocess a test starts (git, docker, a sidecar agent). Either
          # can carry data values, and neither names the failure any better
          # than the test's own name does. So:
          # - a failed test's captured output (`---- name stdout ----` up to the
          #   next `failures:`) is dropped whole, panic message included;
          # - compiler *warnings* are dropped, so their locations cannot crowd
          #   the failures out of the published head;
          # - an `error[Ennnn]` header is published with its `-->` location,
          #   and an uncoded `error:` line only when it is either followed by a
          #   `-->` location (a rustc diagnostic) or is one of cargo's own fixed
          #   shapes (which crate failed to compile or build, which test target
          #   failed). Anything else that merely starts with `error:` — git's
          #   stderr, a test's own `eprintln!` — is withheld;
          # - `test <name> ... FAILED`, `test result: FAILED`, and the
          #   `-p <crate> --test <target>` lines cargo lists at the end of a
          #   `--no-fail-fast` run are published: they are the names.
          cargo_test_detail() {
            cargo_sanitize "$1" | sed -E 's#/mnt/cargo-target#<target>#g' | awk '
              /^---- .* (stdout|stderr) ----$/ { in_output = 1; next }
              /^failures:$/ { in_output = 0; next }
              in_output { next }
              /^warning: / { block = "warning"; pending = ""; next }
              /^error\[E[0-9]+\]: / { block = "error"; pending = ""; print; next }
              /^error: / {
                block = "error"; pending = ""
                if ($0 ~ /^error: (could not compile|test failed, to rerun pass|[0-9]+ targets? failed:|failed to run custom build command for|workspace member |the lock file |linking with |failed to (download|select|get|load|parse|fetch)|no matching package|package ID specification)/) print
                else pending = $0
                next
              }
              /^[[:space:]]*--> / {
                if (block == "error") { if (pending != "") print pending; pending = ""; print }
                next
              }
              /^test .* FAILED$/ || /^test result: FAILED/ || /^[[:space:]]+`-p [^`]+`$/ { print }
            ' | head -80 >&2 || true
          }

          # The crate-test counterpart of `cargo_reason`, ordered for a test
          # log: a failing test's quoted source can contain `clippy::`, which
          # the lint lane's ordering would misread as a lint failure.
          cargo_test_reason() {
            local log="$1"
            if grep -qE '^error: workspace member ' "${log}"; then echo 'a workspace member is assigned to no Linux Rust test concern'
            elif grep -qE 'needs to be updated but --locked was passed|lock file .* needs to be updated' "${log}"; then echo 'committed Cargo.lock is out of date (refused by --locked)'
            elif grep -qE 'Unable to find libclang|libclang.*[Nn]o such file' "${log}"; then echo 'libclang or bindgen failure'
            elif grep -qE 'failed to run custom build command' "${log}"; then echo 'dependency or crate build script failure'
            elif grep -qE 'No space left on device' "${log}"; then echo 'runner disk exhaustion'
            elif grep -qE '^error: linking with ' "${log}"; then echo 'link failure (missing system library or resource exhaustion)'
            elif grep -qE 'signal: 9|SIGKILL' "${log}"; then echo 'a process was killed (likely memory exhaustion)'
            elif grep -qE 'test result: FAILED|^error: test failed|^error: [0-9]+ targets? failed' "${log}"; then echo 'test failure'
            elif grep -qE '^error(\[E[0-9]{4}\])?: |could not compile' "${log}"; then echo 'compilation failure'
            elif grep -qE 'failed to (download|select|get|load|parse|fetch)' "${log}"; then echo 'dependency download or resolution failure'
            else echo 'command returned non-zero'
            fi
          }

          # On failure the advisory findings are published: the RUSTSEC/CVE
          # id, the crate, and the locked version are public registry facts
          # that name the finding — the same rule the Rust concern follows,
          # publish what names the failure, never what the failure was in.
          # Everything cargo-audit prints around them (the dependency-graph
          # context, the advisory-db fetch log, local paths) stays withheld.
          cargo_audit_detail() {
            sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' "$1" |
              sed -E 's#/home/runner/work/[^ ]+#<private-path>#g; s#/Users/[^ ]+#<private-path>#g' |
              grep -E '^error: |^warning: |^Crate: |^Version: |^ID: |^Warning: |^Severity: |^URL: |RUSTSEC-[0-9]{4}-[0-9]{4,}|CVE-[0-9]{4}-[0-9]+' |
              head -40 >&2 || true
          }

          run_quiet() {
            local label="$1"; shift
            local log="${RUNNER_TEMP}/${label}.log"
            if "$@" >"${log}" 2>&1; then
              echo "${label}: passed"
            else
              if [[ "${label}" == cli-* ]]; then
                echo "${label}: failed ($(cargo_reason "${log}"); sanitized detail below)" >&2
                cargo_detail "${log}"
              elif [[ "${label}" == rust-* ]]; then
                echo "${label}: failed ($(cargo_test_reason "${log}"); sanitized detail below)" >&2
                cargo_test_detail "${log}"
              elif [[ "${label}" == cargo-audit ]]; then
                echo "${label}: failed (advisory findings below; remaining output withheld)" >&2
                cargo_audit_detail "${log}"
              else
                echo "${label}: failed (detailed output withheld)" >&2
              fi
              if [[ "${label}" == mobile-tests || "${label}" == e2e-* ]]; then
                # The keyword grep below can match a vitest or Playwright
                # code-frame line whose quoted source happens to contain a
                # keyword (an assertion over an `expected`/`received` value),
                # which would publish a private test-source line. The excerpt
                # shapes are therefore dropped before the allow-list: a
                # numbered source line (`12 | code`), the babel/vitest
                # code-frame form whose failing line is marked with a `>`
                # gutter (`> 12 | code`), a caret/underline annotation
                # (`| ^^^^`, `| ___^`, `| |___`), and the bare separator (`|`).
                # The assertion library's own expected/received VALUE lines
                # and pass/fail headers are test expectations, not app
                # source, so they are the publishable diagnostic and stay;
                # only the adjacent raw source lines are removed. Location
                # lines carry no source text and survive.
                strip_excerpts() {
                  sed -E '/^[[:space:]]*([>][[:space:]]*)?[0-9]+[[:space:]]*[|]/d;
                          /^[[:space:]]*[|][[:space:]]*[_^|+>-]/d;
                          /^[[:space:]]*[|][[:space:]]*$/d'
                }
                # Keep hosted-only diagnostics useful without publishing
                # private source paths or compiler/test output.
                sed -E $'s/\033\[[0-9;]*[[:alpha:]]//g' "${log}" |
                  sed -E 's#/Users/[^ ]+#<private-path>#g; s#/home/runner/work/[^ ]+#<private-path>#g' |
                  strip_excerpts |
                  grep -Ei '(failed tests|test files|tests[[:space:]]+|assertionerror|expected|received|timed out|(^|[[:space:]])[0-9]+ (passed|failed|flaky|skipped)|(^|[[:space:]])(FAIL|PASS)[[:space:]])' |
                  tail -80 >&2 || true
              fi
              exit 1
            fi
          }
          # Which workspace crates each Rust concern tests. Every member of the
          # private workspace belongs to exactly one concern, and
          # `rust_coverage_check` (run by `rust-domain`) fails when a member is
          # in none of them — so a crate added later cannot go untested by
          # omission. The database family needs no list: `rust-db` selects it
          # with cargo's own `taurine-db*` package glob, so a new driver crate
          # is in it the day it joins the workspace.
          rust_domain_packages=(
            taurine-model taurine-atomic taurine-auth taurine-crypt taurine-store
            taurine-repo taurine-replicate taurine-sync taurine-notes taurine-core
            taurine-exec taurine-scripting taurine-mock taurine-git
            taurine-transport-fs taurine-transport-git taurine-transport-wifi
          )
          rust_net_packages=(taurine-peer-sys taurine-net taurine-ovpn-sys taurine-net-conformance)
          rust_app_packages=(taurine-app taurine-desktop taurine-mobile)

          rust_coverage_check() {
            local members member missing=0
            if ! members="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[].name' | sort -u)" || [[ -z "${members}" ]]; then
              echo 'error: failed to load the workspace member list' >&2
              return 1
            fi
            while IFS= read -r member; do
              case " taurine-cli ${rust_domain_packages[*]} ${rust_net_packages[*]} ${rust_app_packages[*]} " in
                *" ${member} "*) continue ;;
              esac
              [[ "${member}" == taurine-db* ]] && continue
              echo "error: workspace member ${member} is tested by no Linux Rust concern" >&2
              missing=1
            done <<<"${members}"
            return "${missing}"
          }

          if [[ "${CONCERN}" == e2e-* ]]; then cd taurine-desktop; fi
          case "${CONCERN}" in
            contracts)
              run_quiet contracts npm run check:contracts
              run_quiet wire npm run check:wire
              run_quiet packages-tests npm run test:packages -- \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/packages.json"

              # Supply-chain sweep (milestone-1 audit, tooling-gap finding;
              # coverage widened per the 2026-10-02 security conformance
              # audit): the RustSec advisory database is swept against EVERY
              # Cargo.lock committed to the private source on every
              # contracts concern. The
              # scanner is the RustSec project's own release tarball, pinned
              # here to an exact version AND an exact sha256 recorded in this
              # file — a changed or moved release fails the checksum gate
              # instead of being silently installed, so this step cannot
              # float. No Rust toolchain is pulled in for it: a scanner that
              # could compile anything is also a step that could execute
              # anything, and this one only needs to read a lock file.
              # Unmaintained-crate warnings (rustls-pemfile, paste) are
              # recorded acceptances tracked in the private repository and do
              # not fail the concern; only vulnerabilities do.
              run_quiet cargo-audit-install bash -c '
                set -euo pipefail
                bin_dir="${RUNNER_TEMP}/cargo-audit-bin"
                mkdir -p "${bin_dir}"
                tgz="${RUNNER_TEMP}/cargo-audit-v0.22.2.tgz"
                curl --fail --silent --show-error --retry 2 --location \
                  --output "${tgz}" \
                  "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz"
                echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  ${tgz}" | sha256sum --check --status
                tar -xzf "${tgz}" -C "${bin_dir}"
                "${bin_dir}/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" --version
              '
              # Accepted advisories are recorded in exactly one place: the
              # reviewed `.cargo/audit.toml` committed at the root of the
              # private source, which cargo-audit picks up automatically from
              # its working directory. This workflow hard-codes no advisory
              # ids, so the suppression list and its review record cannot
              # drift apart across the repository boundary: an entry removed
              # from that baseline un-suppresses CI on the next run (fail
              # closed), and a finding the baseline does not name fails the
              # concern. Each entry's crate, locked version, dependency path,
              # rationale and review-by note live in the baseline itself,
              # beside the lock it qualifies — the reachability record and
              # the suppression are the same artifact.
              #
              # Why every lock, not just the root one: vendored forks and
              # sub-workspaces commit their own resolved pins (the backend
              # sub-workspaces and the vendored rumqttc fork each carry a
              # Cargo.lock), so sweeping only the workspace root leaves whole
              # dependency sets unscanned. The enumeration is `find`,
              # excluding only build output (target/) and npm's installed
              # tree (node_modules/, gitignored — a lock an npm package
              # ships there is not this repository's resolution). All
              # discovered locks are audited even after one fails, so a
              # single run names every failing lock, and on failure the
              # findings are published exactly as the single-lock sweep
              # published them.
              run_quiet cargo-audit bash -c '
                set -euo pipefail
                audit_bin="${RUNNER_TEMP}/cargo-audit-bin/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit"
                failed=0
                while IFS= read -r lock; do
                  if "${audit_bin}" audit --file "${lock}"; then
                    echo "cargo-audit: ${lock}: passed"
                  else
                    echo "error: unaccepted advisory findings in ${lock}" >&2
                    failed=1
                  fi
                done < <(find . -name Cargo.lock -not -path "*/target/*" -not -path "*/node_modules/*" | sort)
                if [[ "${failed}" -ne 0 ]]; then
                  echo "error: the committed Cargo.lock advisory sweep failed" >&2
                fi
                exit "${failed}"
              '
              ;;
            frontend-build-budget)
              run_quiet desktop-typecheck-build npm --prefix taurine-desktop run typecheck
              run_quiet vite-preflight bash -c 'test -f taurine-desktop/node_modules/vite/bin/vite.js && test -x taurine-desktop/node_modules/.bin/vite'
              run_quiet desktop-vite-build bash -c 'cd taurine-desktop && npm exec --offline -- vite build'
              run_quiet mobile-build npm --prefix taurine-mobile run build
              run_quiet bundle-budget npm run check:bundle
              ;;
            desktop-shard-1)
              run_quiet desktop-tests-shard-1 npm --prefix taurine-desktop run test -- --shard=1/2 --maxWorkers=1 --minWorkers=1 \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/desktop-shard-1.json"
              ;;
            desktop-shard-2)
              run_quiet desktop-tests-shard-2 npm --prefix taurine-desktop run test -- --shard=2/2 --maxWorkers=1 --minWorkers=1 \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/desktop-shard-2.json"
              ;;
            desktop-quality)
              run_quiet desktop-typecheck npm --prefix taurine-desktop run typecheck
              run_quiet desktop-lint npm --prefix taurine-desktop run lint
              ;;
            e2e-critical)
              # The three narrow tiers together: they share a dev server start,
              # and splitting 156 tests across three runners would spend more on
              # `npm ci` than on testing.
              #
              # The JSON reporter writes the per-test inventory (file, title,
              # status, duration) to RUNNER_TEMP for the publishing step below;
              # it is read by `scripts/ci/collect-test-ids.ts` from the checked
              # out source and sanitized there. It never leaves this runner
              # unsanitized. The console reporter stays `github`, so the log and
              # its failure diagnostics are exactly what they were before.
              export PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/test-ids/e2e-critical.json"
              run_quiet e2e-critical npx --no-install playwright test \
                --reporter=github --reporter=json \
                --project=smoke --project=critical --project=shell-browser
              ;;
            e2e-a11y)
              # Serial by the project's own config: axe walks the whole tree, and
              # two of them racing on one dev server produced a timeout rather
              # than a finding.
              export PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/test-ids/e2e-a11y.json"
              run_quiet e2e-a11y npx --no-install playwright test \
                --reporter=github --reporter=json --project=a11y
              ;;
            e2e-regression-1|e2e-regression-2|e2e-regression-3|e2e-regression-4)
              # Playwright's own sharding, so a rebalanced suite does not need a
              # workflow edit. The shard index is the concern's own suffix.
              export PLAYWRIGHT_JSON_OUTPUT_NAME="${RUNNER_TEMP}/test-ids/${CONCERN}.json"
              run_quiet "${CONCERN}" npx --no-install playwright test \
                --reporter=github --reporter=json \
                --project=regression --shard="${CONCERN##*-}/4"
              ;;
            taurine-cli)
              # Format and lint first: they are seconds and need almost nothing
              # compiled, so a style failure does not arrive after a full build.
              run_quiet cli-fmt cargo fmt --package taurine-cli -- --check

              # `--keep-going` because this lane is dispatched, not pushed, and
              # every dispatch costs the whole matrix. Cargo stops the build at
              # the first unit that errors, so a denied lint anywhere in the
              # closure hides every lint behind it and each one costs another
              # full run to discover. Keeping going reports them all at once;
              # the exit status is unchanged, so the gate is no weaker.
              #
              # The closure, not just this package: `cargo clippy` wraps every
              # *workspace* member with clippy-driver and clippy-driver applies
              # the trailing `--deny warnings` to each of them, so `--package
              # taurine-cli` still lints the sibling crates it depends on. That
              # is why a failure here can name a file outside `taurine-cli`.
              run_quiet cli-clippy cargo clippy --package taurine-cli --all-targets --keep-going -- --deny warnings
              run_quiet cli-tests cargo test --package taurine-cli
              run_quiet cli-build cargo build --package taurine-cli --release

              # The binary's documented contract, exercised on the artifact that
              # was just built rather than on the library behind it. Both cases
              # are hermetic: no network, no fixture server, no collection that
              # could drift. `taurine-cli` unit tests cover report shapes; what
              # they cannot cover is whether the produced executable still
              # starts and still exits with the codes CI pipelines branch on.
              # Each expectation says what it observed when it fails. A bare
              # `test` under `set -e` exits silently, which would leave
              # `cli-smoke: failed` with an empty log and nothing to read. Exit
              # codes and flag names are the binary's documented contract, not
              # source, so they are safe to print.
              run_quiet cli-smoke bash -c '
                set -euo pipefail
                bin=target/release/taurine
                if [ ! -x "$bin" ]; then
                  echo "smoke: the release build produced no executable at the expected path" >&2
                  exit 1
                fi

                # --help must succeed: a pipeline that probes for the CLI would
                # otherwise read a non-zero exit as "not installed".
                set +e
                "$bin" --help >/dev/null 2>&1
                help_status=$?
                set -e
                if [ "$help_status" -ne 0 ]; then
                  echo "smoke: --help exited $help_status, expected 0" >&2
                  exit 1
                fi

                # An unreadable collection must exit 2, not 1. The difference is
                # load-bearing: 1 means tests failed and 2 means the run never
                # started, and a pipeline that confuses them reports a broken
                # config as a failing test suite.
                set +e
                "$bin" test /nonexistent/collection.json >/dev/null 2>&1
                missing_status=$?
                set -e
                if [ "$missing_status" -ne 2 ]; then
                  echo "smoke: a missing collection exited $missing_status, expected 2" >&2
                  exit 1
                fi

                # Malformed JSON is the same class of failure and must agree.
                tmp="$(mktemp -d)"
                printf "{ not json" > "$tmp/bad.json"
                set +e
                "$bin" test "$tmp/bad.json" >/dev/null 2>&1
                bad_status=$?
                set -e
                rm -rf "$tmp"
                if [ "$bad_status" -ne 2 ]; then
                  echo "smoke: a malformed collection exited $bad_status, expected 2" >&2
                  exit 1
                fi
              '
              ;;
            # The crate-test concerns. Shared by all four workspace ones:
            # - `--locked`: the committed Cargo.lock is what was reviewed and
            #   what the contracts concern's advisory sweep audits, so a test
            #   run must not quietly resolve anything else;
            # - `--no-fail-fast`: the `--keep-going` argument above, for tests.
            #   Every failing target is reported in one dispatch; the exit
            #   status is unchanged;
            # - no `--features`/`--all-features`: each crate is tested as its
            #   manifest builds it. That leaves `taurine-app`'s opt-in `openvpn`
            #   and `dbx-breadth` code paths out, as `cargo test --workspace`
            #   does.
            # Env-gated live suites (`TAURINE_TEST_<ENGINE>=host:port`) print
            # SKIPPED and pass when the variable is unset, and `#[ignore]`d lab
            # tests stay ignored; the live servers belong to live-proofs.yml.
            rust-domain)
              # The application's storage, sync, scripting and git core — every
              # crate below the command tier that is not a database or network
              # crate. taurine-crypt is run a second time without its default
              # `keychain` feature: that is the build a machine with no OS
              # keychain gets, and the private CI plan lists it beside the
              # workspace run.
              run_quiet rust-crypt-no-keychain-tests \
                cargo test --locked --no-fail-fast --package taurine-crypt --no-default-features
              run_quiet rust-domain-tests \
                cargo test --locked --no-fail-fast "${rust_domain_packages[@]/#/--package=}"
              run_quiet rust-coverage rust_coverage_check
              ;;
            rust-db)
              # Every `taurine-db*` crate: the model, the engine and its law
              # tests, the HTTP and sidecar machinery, each driver's offline
              # unit and mapping tests, and taurine-db-conformance's offline
              # suites (sqlite, duckdb, turso, the recorded fixtures, the
              # falsification and transfer runs). Only the conformance suite's
              # live targets need a server, and they skip without one.
              run_quiet rust-db-tests \
                cargo test --locked --no-fail-fast --package 'taurine-db*'
              ;;
            rust-net)
              # The dialer, the egress verifier and the vendored openvpn3 shim.
              # The OpenVPN lab tests are `#[ignore]`d: they need a TUN device
              # and the local lab's servers, which a hosted runner does not have.
              run_quiet rust-net-tests \
                cargo test --locked --no-fail-fast "${rust_net_packages[@]/#/--package=}"
              ;;
            rust-app)
              # The command tier both shells call, and the two shells' own unit
              # tests. Tauri's `test` feature drives the commands through its
              # mock runtime, so no display or WebView process is started; the
              # webkit2gtk install above is only what the crates link.
              run_quiet rust-app-tests \
                cargo test --locked --no-fail-fast "${rust_app_packages[@]/#/--package=}"
              ;;
            rust-dbx)
              # The trees the root manifest excludes from the workspace, each
              # with its own committed Cargo.lock. `dbx-core` runs through the
              # root `package.json` script so the stack size it needs is set in
              # one place; its Postgres-backed tests start a disposable
              # container when Docker answers, which it does on this runner.
              # `dbx-sqlite-worker` is compiled here as dbx-core's path
              # dependency, but its own tests are not run: it commits no
              # Cargo.lock, so a standalone run would resolve dependency
              # versions nobody reviewed. `vendor/boringtun`'s standalone run is
              # left out for the same reason (its lock is generated, not
              # fetched); the patched copy the product links is exercised by
              # taurine-net under the workspace lock.
              run_quiet rust-dbx-core-tests \
                npm run --silent test:dbx-core -- --locked --no-fail-fast
              run_quiet rust-dbx-mongo-shell-tests \
                cargo test --locked --no-fail-fast --manifest-path taurine-backend/dbx-mongo-shell/Cargo.toml
              ;;
            mobile-quality)
              run_quiet mobile-tests npm --prefix taurine-mobile run test -- --maxWorkers=1 --minWorkers=1 \
                --reporter=default --reporter=json \
                --outputFile.json="${RUNNER_TEMP}/test-ids/mobile.json"
              run_quiet mobile-typecheck npm --prefix taurine-mobile run typecheck
              run_quiet mobile-lint npm --prefix taurine-mobile run lint
              ;;
            *)
              echo "Unsupported Linux validation concern: ${CONCERN}" >&2
              exit 2
              ;;
          esac

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="${REQUESTED_SOURCE_SHA,,}"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## Linux ${CONCERN} validation"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo '- Validation passed on an isolated hosted runner.'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The sanitized proof above says validation passed; this section names the
      # tests that passed, so a public run shows exactly which tests a SHA
      # exercised. The inventory is repo-relative file paths and test titles,
      # plus status and duration — never test source, fixtures, data values or
      # environment details. The collector (checked out with the source it
      # reports on) re-scans every path and title with the repository's own
      # secret-shape rules and drops rather than publishes anything that
      # matches; it builds the whole section in memory and writes it once, so
      # nothing reaches the summary unless the sanitized render completed. The
      # runner's raw reporter JSON stays in RUNNER_TEMP and is not uploaded.
      - name: Publish test identities exercised by this concern
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          # Only the concerns that ran a JavaScript test suite have an
          # inventory; every other concern leaves its summary as it was.
          case "${CONCERN}" in
            contracts|desktop-shard-1|desktop-shard-2|mobile-quality|e2e-*) ;;
            *) exit 0 ;;
          esac
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="${REQUESTED_SOURCE_SHA,,}"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          # The collector exits zero even when it cannot collect (fail closed:
          # a fixed "unavailable" line instead of an error or a partial list),
          # but if the collector itself fails to run, publish the same fixed
          # line rather than letting the step turn a green concern red. The
          # section goes to the step log as well as the summary: the summary is
          # what a reader sees, the log is the greppable record of exactly
          # which identities were published to this run.
          section_file="${RUNNER_TEMP}/test-ids/summary-section.md"
          if ! TAURINE_TEST_IDS_DIR="${RUNNER_TEMP}/test-ids" \
            TAURINE_TEST_IDS_ROOT="${GITHUB_WORKSPACE}" \
            taurine-desktop/node_modules/.bin/vite-node scripts/ci/collect-test-ids.ts \
            > "${section_file}"; then
            {
              echo "### Tests exercised by this run"
              echo
              echo "Test inventory unavailable: the collector did not complete."
            } > "${section_file}"
          fi
          cat "${section_file}" >> "${GITHUB_STEP_SUMMARY}"
          cat "${section_file}"
