name: Linux app validation concern (protected)

# Each concern gets a clean hosted runner and performs its own exact private
# checkout. No source-bearing artifact, cache, or output crosses job boundaries.
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      concern:
        description: Independent Linux validation concern to execute
        required: true
        type: string
      timeout_minutes:
        description: Job timeout in minutes, from ci-matrix.json
        required: false
        default: 60
        type: number
    secrets:
      SOURCE_READER_PRIVATE_KEY:
        description: The source-reader App private key, passed explicitly by the dispatcher (never inherited)
        required: true

permissions: {}

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  validate:
    permissions:
      contents: read
    name: Linux ${{ inputs.concern }}
    environment: source-read
    runs-on: ubuntu-24.04
    # The visual tier runs inside the same pinned Playwright image the Linux baselines were
    # generated in (Playwright 1.62.0, Ubuntu noble, linux/amd64; see the private
    # docs/visual-baselines.md), so hosted and local rendering are identical. Every other
    # concern runs on the runner image directly.
    # Deliberate: the image is pinned by digest; zizmor cannot see through the expression form.
    container: ${{ inputs.concern == 'e2e-visual' && fromJSON('{"image":"mcr.microsoft.com/playwright@sha256:02bbb2155cd7109e3e9c741941097ed1608cf8b6fa44ee2595896da2bdc1f471","options":"--ipc=host"}') || null }}  # zizmor: ignore[unpinned-images]
    # The browser tiers start a dev server, download a browser and drive a
    # real page; the unit and contract concerns stay on the reviewed 30.
    # 45 for the Rust concern. Compiled output is never cached — `target/` holds
    # compiled private source — so every run compiles rquickjs, which builds C
    # and generates bindings through libclang, plus reqwest's TLS stack, cold.
    # Only cargo's downloaded third-party sources are cached (see the cache steps).
    #
    # The `rust-*` crate-test concerns get the browser tiers' 60: each compiles
    # its whole closure cold for the same reason. `rust-app` and `rust-dbx` get
    # 90. `rust-app` links one test binary per file under `taurine-app/tests/`
    # (over a hundred), each carrying the full command tier plus Tauri, DuckDB's
    # C++ amalgamation and every driver; the private `docs/testing-baseline.md`
    # measured `cargo test -p taurine-app` at 708 s cold on a ten-core
    # workstation before the command tier doubled. `rust-dbx` compiles the
    # adopted `dbx-core` tree, whose own manifest records it as roughly 490
    # crates.
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Start the concern timer
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: start

      - name: Validate protected call input
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'linux-validation must run only from the protected main branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      # The pinned Playwright image lacks jq (curl, git, bash and sha256sum are present), which
      # the shared composites use. Installed from the image's own Ubuntu noble archive, as root,
      # pinned to the 1.7.1 release line; it holds no source and runs before the checkout.
      - name: Install jq in the visual container
        if: inputs.concern == 'e2e-visual'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends 'jq=1.7.1-3ubuntu0.24.04.*'
          # The source-checkout composite needs these too; present in the pinned image, and
          # installed only if a future image drops one.
          for tool in git curl; do
            command -v "${tool}" >/dev/null 2>&1 || apt-get install -y --no-install-recommends "${tool}"
          done
          jq --version
          git --version
          curl --version | head -n 1

      - name: Check out the exact private source SHA
        id: verified-source
        # Kept as ./ : the policy matches this exact form for the private-source action.
        uses: ./.github/actions/source-checkout  # zizmor: ignore[self-repository]
        with:
          source-sha: ${{ inputs.source_sha }}
          app-client-id: ${{ vars.SOURCE_READER_APP_ID }}
          app-private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          repository-id: ${{ env.SOURCE_REPOSITORY_ID }}
          repository-owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repository-name: ${{ env.SOURCE_REPOSITORY_NAME }}

      - name: Install the shared sanitizers
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/sanitize  # zizmor: ignore[self-repository]

      - name: Install the shared concern reporting
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/concern-report  # zizmor: ignore[self-repository]

      - name: Set up Node.js and install the locked JavaScript dependencies
        if: (inputs.concern != 'taurine-cli' && !startsWith(inputs.concern, 'rust-') && !startsWith(inputs.concern, 'scan-')) || inputs.concern == 'scan-security' || inputs.concern == 'rust-packaging'
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/node-setup  # zizmor: ignore[self-repository]
        with:
          root: true
          desktop: true
          mobile: true
          # The browser tiers are frontend-only: they do not need the vendored OpenVPN3 sources.
          vendor-fetch: ${{ inputs.concern != 'scan-security' && inputs.concern != 'rust-packaging' && !startsWith(inputs.concern, 'e2e-') }}

      - name: Set up the Rust toolchain
        if: inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security'
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/rust-toolchain  # zizmor: ignore[self-repository]
        with:
          # The clippy scan compiles the workspace, so it takes the same system libraries
          # as the rust-app concern (webkit, dbus, openssl).
          concern: ${{ inputs.concern == 'scan-security' && 'rust-app' || inputs.concern }}

      - name: Fetch pinned vendored sources
        if: inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security'
        shell: bash
        run: |
          set -euo pipefail
          # `fetch` verifies each download against the sha256 pinned in
          # vendor.lock and applies the reviewed boringtun zeroize patch, so this
          # is a supply-chain check as much as a prerequisite.
          if ! bash scripts/vendor-openvpn3.sh fetch >"${RUNNER_TEMP}/vendor-fetch.log" 2>&1; then
            echo 'vendor-fetch: failed (detailed output withheld)' >&2
            exit 1
          fi
          echo 'vendor-fetch: passed'

      # Third-party crate sources only: cargo's registry index, the downloaded
      # `.crate` archives and the git dependency databases. Never `target/`, never
      # an extracted source tree, never anything under the checked-out private
      # source, so no compiled or private code ever enters a cache. The key is the
      # OS, the concern and a hash of the private Cargo.lock files, which reveals
      # nothing about their contents.
      - name: Locate Cargo home for the third-party source cache
        id: cargo-home
        if: ${{ inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security' }}
        shell: bash
        run: |
          set -euo pipefail
          dir="${CARGO_HOME:-${HOME}/.cargo}"
          if command -v cygpath >/dev/null 2>&1; then
            dir="$(cygpath -m "${dir}")"
          fi
          echo "dir=${dir}" >> "${GITHUB_OUTPUT}"

      - name: Restore cached third-party crate sources
        id: cargo-sources
        if: ${{ inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cargo-home.outputs.dir }}/registry/index
            ${{ steps.cargo-home.outputs.dir }}/registry/cache
            ${{ steps.cargo-home.outputs.dir }}/git/db
          key: cargo-sources-${{ runner.os }}-${{ inputs.concern }}-${{ hashFiles('src/Cargo.lock', 'src/taurine-backend/*/Cargo.lock', 'src/taurine-backend/vendor/*/Cargo.lock', 'src/vendor/*/Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ runner.os }}-${{ inputs.concern }}-

      # Defence in depth: do not rely on cargo alone to notice a tampered archive.
      # Every restored `.crate` must hash to the checksum recorded for it in a
      # private Cargo.lock; anything that does not match, or is not in a lock at
      # all, is deleted before cargo runs. Only counts are printed.
      - name: Verify restored crate archives against Cargo.lock
        if: ${{ inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security' }}
        shell: bash
        env:
          CARGO_SOURCES_DIR: ${{ steps.cargo-home.outputs.dir }}
          CACHE_HIT: ${{ steps.cargo-sources.outputs.cache-hit }}
          OS_LABEL: Linux
        run: |
          set -euo pipefail
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum < "$1" | cut -d' ' -f1
            else
              shasum -a 256 < "$1" | cut -d' ' -f1
            fi
          }
          expected="${RUNNER_TEMP}/crate-checksums.txt"
          : > "${expected}"
          while IFS= read -r lock; do
            tr -d '\r' < "${lock}" | awk '
              /^\[\[package\]\]/ { n = ""; v = ""; next }
              /^name = /     { gsub(/"/, "", $3); n = $3 }
              /^version = /  { gsub(/"/, "", $3); v = $3 }
              /^checksum = / { gsub(/"/, "", $3); if (n != "" && v != "") print n "-" v ".crate " $3 }
            ' >> "${expected}"
          done < <(find . -name Cargo.lock -not -path '*/node_modules/*' -not -path '*/target/*')
          kept=0
          dropped=0
          cache_dir="${CARGO_SOURCES_DIR}/registry/cache"
          if [[ -d "${cache_dir}" ]]; then
            find "${cache_dir}" -type f ! -name '*.crate' -delete
            while IFS= read -r -d '' crate; do
              want="$(awk -v f="$(basename "${crate}")" '$1 == f { print $2; exit }' "${expected}")"
              if [[ -n "${want}" && "$(sha256_of "${crate}")" == "${want}" ]]; then
                kept=$((kept + 1))
              else
                rm -f "${crate}"
                dropped=$((dropped + 1))
              fi
            done < <(find "${cache_dir}" -type f -name '*.crate' -print0)
          fi
          case "${CACHE_HIT}" in
            true) state='exact hit' ;;
            false) state='restored from an earlier lockfile' ;;
            *) state='miss' ;;
          esac
          echo "cargo-sources: ${state}; ${kept} archives verified, ${dropped} dropped"
          echo "- ${OS_LABEL} Cargo source cache: ${state} (${kept} verified, ${dropped} dropped)" >> "${GITHUB_STEP_SUMMARY}"

      - name: Install the pinned Playwright browser
        # e2e-visual runs in the Playwright image, whose browsers are preinstalled.
        if: startsWith(inputs.concern, 'e2e-') && inputs.concern != 'e2e-visual'
        shell: bash
        run: |
          set -euo pipefail
          # --no-install keeps the CLI resolving from the locked devDependency
          # rather than fetching a floating one from the registry; the browser
          # build it then downloads is the one that version pins. Only Chromium:
          # every Playwright project in the suite uses Desktop Chrome.
          if ! (cd taurine-desktop && npx --no-install playwright install --with-deps chromium) \
            >"${RUNNER_TEMP}/playwright-install.log" 2>&1; then
            echo 'playwright-install: failed (detailed output withheld)' >&2
            exit 1
          fi
          echo 'playwright-install: passed'

      - name: Run the scanner
        if: inputs.concern == 'scan-security'
        # One job, five scanners (gitleaks, npm audit, Semgrep, cargo-deny, clippy): each runs as
        # its own step with its own report, so one failing scanner does not hide the others.
        # Clippy, the slow one, runs last.
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/scan-concern  # zizmor: ignore[self-repository]
        with:
          scanner: all

      - name: Run the isolated Linux JavaScript concern
        id: concern-js
        if: ${{ contains(fromJSON('["contracts","frontend-build-budget","desktop-shard-1","desktop-shard-2","desktop-quality","mobile-quality"]'), inputs.concern) }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/linux-concern-js  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}

      - name: Run the isolated Linux browser concern
        id: concern-e2e
        if: ${{ startsWith(inputs.concern, 'e2e-') }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/linux-concern-e2e  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}

      - name: Run the isolated Linux Rust concern
        id: concern-rust
        if: ${{ inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/linux-concern-rust  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}

      # A concern no family above handles must fail loudly, never pass by omission.
      - name: Reject an unsupported concern
        if: ${{ inputs.concern != 'scan-security' && !(contains(fromJSON('["contracts","frontend-build-budget","desktop-shard-1","desktop-shard-2","desktop-quality","mobile-quality"]'), inputs.concern) || startsWith(inputs.concern, 'e2e-') || inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-')) }}
        shell: bash
        env:
          CONCERN: ${{ inputs.concern }}
        run: |
          echo "Unsupported Linux validation concern: ${CONCERN}" >&2
          exit 2

      # Saved only from the protected main branch (every job here already refuses to
      # run elsewhere; the condition repeats it so the write permission is explicit)
      # and only on a miss, so a key is written once and never overwritten.
      - name: Save verified third-party crate sources
        if: ${{ always() && github.ref == 'refs/heads/main' && (inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security') && steps.cargo-sources.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cargo-home.outputs.dir }}/registry/index
            ${{ steps.cargo-home.outputs.dir }}/registry/cache
            ${{ steps.cargo-home.outputs.dir }}/git/db
          key: cargo-sources-${{ runner.os }}-${{ inputs.concern }}-${{ hashFiles('src/Cargo.lock', 'src/taurine-backend/*/Cargo.lock', 'src/taurine-backend/vendor/*/Cargo.lock', 'src/vendor/*/Cargo.lock') }}

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="${REQUESTED_SOURCE_SHA,,}"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## Linux ${CONCERN} validation"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo '- Validation passed on an isolated hosted runner.'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"

      # The sanitized proof above says validation passed; this section names the
      # tests that ran, including failures, so a public run shows which tests a SHA
      # exercised. The inventory is repo-relative file paths and test titles,
      # plus status and duration — never test source, fixtures, data values or
      # environment details. The collector (checked out with the source it
      # reports on) re-scans every path and title with the repository's own
      # secret-shape rules and drops rather than publishes anything that
      # matches; it builds the whole section in memory and writes it once, so
      # nothing reaches the summary unless the sanitized render completed. The
      # runner's raw reporter JSON stays in RUNNER_TEMP and is not uploaded.
      - name: Publish test identities exercised by this concern
        # Failed validation still owns useful sanitized identities. Never run
        # private collector code without successful exact-source verification
        # and token revocation, or after cancellation/setup-only failures.
        if: ${{ always() && !cancelled() && steps.verified-source.outcome == 'success' && (contains(fromJSON('["success","failure"]'), steps.concern-js.outcome) || contains(fromJSON('["success","failure"]'), steps.concern-e2e.outcome) || contains(fromJSON('["success","failure"]'), steps.concern-rust.outcome)) }}
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          # Only the concerns that ran a JavaScript test suite have an
          # inventory; every other concern leaves its summary as it was.
          case "${CONCERN}" in
            contracts|desktop-shard-1|desktop-shard-2|mobile-quality|e2e-*) ;;
            *) exit 0 ;;
          esac
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="${REQUESTED_SOURCE_SHA,,}"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          # The collector exits zero even when it cannot collect (fail closed:
          # a fixed "unavailable" line instead of an error or a partial list),
          # but if the collector itself fails to run, publish the same fixed
          # line rather than letting the step turn a green concern red. The
          # section goes to the step log as well as the summary: the summary is
          # what a reader sees, the log is the greppable record of exactly
          # which identities were published to this run.
          mkdir -p "${RUNNER_TEMP}/test-ids"
          section_file="${RUNNER_TEMP}/test-ids/summary-section.md"
          if ! TAURINE_TEST_IDS_DIR="${RUNNER_TEMP}/test-ids" \
            TAURINE_TEST_IDS_ROOT="${GITHUB_WORKSPACE}/src" \
            taurine-desktop/node_modules/.bin/vite-node scripts/ci/collect-test-ids.ts \
            > "${section_file}" 2> "${RUNNER_TEMP}/test-ids/collector-private.log"; then
            {
              echo "### Tests exercised by this run"
              echo
              echo "Test inventory unavailable: the collector did not complete."
              # Fallback from the runner's own JSON reports, so a failing run still names its
              # failing specs: counts per status and, for each non-passing test, its project,
              # repo-relative spec file:line and title. The collector's own error is reduced to
              # fixed class names (an Error type or ERR_ code), never its message.
              echo
              echo "collector error class: $(grep -ohE '\b[A-Z][A-Za-z]*Error\b|\bERR_[A-Z_]+\b' "${RUNNER_TEMP}/test-ids/collector-private.log" 2>/dev/null | head -1 || true)"
              for report in "${RUNNER_TEMP}"/test-ids/*.json; do
                [[ -f "${report}" ]] || continue
                echo
                echo "#### $(basename "${report}" .json) (fallback, from the runner report)"
                jq -r '
                  [ (.suites // [])[] | recurse(.suites[]?) | .specs[]? as $s | $s.tests[]? as $t
                    | { status: ($t.status // "?"), project: ($t.projectName // "?"), file: ($s.file // "?"), line: ($s.line // 0), title: ($s.title // "?") } ] as $all
                  | "- tests: \($all | length); " + ([$all | group_by(.status)[] | "\(.[0].status) \(length)"] | join(", ")),
                    ($all[] | select(.status != "expected" and .status != "skipped") | "- FAIL [\(.project)] \(.file):\(.line) > \(.title) (\(.status))")
                ' "${report}" 2>/dev/null | sed -E 's#(gh[pousr]_|github_pat_)[A-Za-z0-9_]+#<redacted>#g' | cut -c1-220 | head -80 || true
              done
            } > "${section_file}"
          fi
          cat "${section_file}" >> "${GITHUB_STEP_SUMMARY}"
          cat "${section_file}"

      # The job's own wall-clock time, shown next to its result; the timings job
      # tabulates it against a committed baseline.
      - name: Report concern duration
        if: ${{ always() }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: report
