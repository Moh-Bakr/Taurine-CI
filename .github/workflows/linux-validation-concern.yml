name: Linux app validation concern (protected)

# Each concern gets a clean hosted runner and performs its own exact private
# checkout. No source-bearing artifact, cache, or output crosses job boundaries.
on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact 40-character commit SHA to validate from private Taurine
        required: true
        type: string
      concern:
        description: Independent Linux validation concern to execute
        required: true
        type: string
      timeout_minutes:
        description: Job timeout in minutes, from ci-matrix.json
        required: false
        default: 60
        type: number
    secrets:
      SOURCE_READER_PRIVATE_KEY:
        description: The source-reader App private key, passed explicitly by the dispatcher (never inherited)
        required: true

permissions: {}

env:
  SOURCE_REPOSITORY_ID: '1330267721'
  SOURCE_REPOSITORY_OWNER: Moh-Bakr
  SOURCE_REPOSITORY_NAME: Taurine

jobs:
  validate:
    permissions:
      contents: read
    name: Linux ${{ inputs.concern }}
    environment: source-read
    runs-on: ubuntu-24.04
    # The visual tier runs inside the same pinned Playwright image the Linux baselines were
    # generated in (Playwright 1.62.0, Ubuntu noble, linux/amd64; see the private
    # docs/visual-baselines.md), so hosted and local rendering are identical. Every other
    # concern runs on the runner image directly.
    # Deliberate: the image is pinned by digest; zizmor cannot see through the expression form.
    container: ${{ inputs.concern == 'e2e-visual' && fromJSON('{"image":"mcr.microsoft.com/playwright@sha256:02bbb2155cd7109e3e9c741941097ed1608cf8b6fa44ee2595896da2bdc1f471","options":"--ipc=host"}') || null }}  # zizmor: ignore[unpinned-images]
    # The browser tiers start a dev server, download a browser and drive a
    # real page; the unit and contract concerns stay on the reviewed 30.
    # 45 for the Rust concern. Compiled private source is never cached; only the
    # rust-app build restores compiled third-party crates (see the cache steps), so
    # the other Rust concerns compile their whole closure cold.
    #
    # The `rust-*` crate-test concerns get the browser tiers' 60: each compiles
    # its whole closure cold for the same reason. `rust-app` and `rust-dbx` get
    # 90. `rust-app` links one test binary per file under `taurine-app/tests/`
    # (over a hundred), each carrying the full command tier plus Tauri, DuckDB's
    # C++ amalgamation and every driver; the private `docs/testing-baseline.md`
    # measured `cargo test -p taurine-app` at 708 s cold on a ten-core
    # workstation before the command tier doubled. `rust-dbx` compiles the
    # adopted `dbx-core` tree, whose own manifest records it as roughly 490
    # crates.
    timeout-minutes: ${{ inputs.timeout_minutes }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Check out public control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Start the concern timer
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: start

      - name: Validate protected call input
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY}" != "Moh-Bakr/Taurine-CI" || ( "${GITHUB_REF}" != "refs/heads/main" && "${GITHUB_REF}" != "refs/heads/untrusted" ) ]]; then
            echo 'linux-validation must run only from the protected main or untrusted branch' >&2
            exit 1
          fi
          if [[ ! "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo 'source_sha must be a full 40-character hexadecimal commit SHA' >&2
            exit 1
          fi

      # The pinned Playwright image lacks jq (curl, git, bash and sha256sum are present), which
      # the shared composites use. Installed from the image's own Ubuntu noble archive, as root,
      # pinned to the 1.7.1 release line; it holds no source and runs before the checkout.
      - name: Install jq in the visual container
        if: inputs.concern == 'e2e-visual'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends 'jq=1.7.1-3ubuntu0.24.04.*'
          # The source-checkout composite needs these too; present in the pinned image, and
          # installed only if a future image drops one.
          for tool in git curl; do
            command -v "${tool}" >/dev/null 2>&1 || apt-get install -y --no-install-recommends "${tool}"
          done
          jq --version
          git --version
          curl --version | head -n 1

      - name: Check out the exact private source SHA
        id: verified-source
        # Kept as ./ : the policy matches this exact form for the private-source action.
        uses: ./.github/actions/source-checkout  # zizmor: ignore[self-repository]
        with:
          source-sha: ${{ inputs.source_sha }}
          app-client-id: ${{ vars.SOURCE_READER_APP_ID }}
          app-private-key: ${{ secrets.SOURCE_READER_PRIVATE_KEY }}
          repository-id: ${{ env.SOURCE_REPOSITORY_ID }}
          repository-owner: ${{ env.SOURCE_REPOSITORY_OWNER }}
          repository-name: ${{ env.SOURCE_REPOSITORY_NAME }}
          # Gates every cache save below: only a SHA on a protected private branch may write.
          check-protected-ancestry: 'true'

      # The concern's egress mode, from ci-matrix.json (`egress`): block enforces the
      # allow-list from the enforce step below; audit only records. The policy requires block
      # for every concern without Docker unless the table records the audit exception's reason.
      - name: Select the egress mode
        id: egress-mode
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          mode="$(jq -r --arg c "${CONCERN}" '.concerns.linux[$c].egress // empty' .github/ci-matrix.json)"
          case "${mode}" in
            audit|block) ;;
            *) echo "ci-matrix.json: concern ${CONCERN} has no egress mode (audit or block)" >&2; exit 1 ;;
          esac
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "egress mode: ${mode}"

      - name: Start the egress audit
        # Records outbound destinations; never fails the job.
        continue-on-error: true
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/egress-audit  # zizmor: ignore[self-repository]
        with:
          phase: start
          mode: ${{ steps.egress-mode.outputs.mode }}

      # Semgrep runs from its digest-pinned image and so needs the Docker daemon, which is
      # root-equivalent and closes at drop-root. Only the container runs here, over the fresh
      # checkout and before any project code; the scanner step below reads its report.
      - name: Run the Semgrep container before root is removed
        if: inputs.concern == 'scan-security'
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/scan-concern  # zizmor: ignore[self-repository]
        with:
          scanner: semgrep-container

      # Every step that needs root runs here, before root is removed and before any project
      # code (finding H2; see the root-setup and drop-root composites).
      - name: Run the privileged setup
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/root-setup  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}

      # Block mode: the filtering resolver and default-drop firewall go in here, after the
      # privileged setup has fetched its packages and before root is removed, so project code
      # can neither skip nor undo them. Deliberately no continue-on-error: a blocker that fails
      # to install fails the job instead of falling back to audit.
      - name: Enforce the egress allow-list
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/egress-audit  # zizmor: ignore[self-repository]
        with:
          phase: enforce
          mode: ${{ steps.egress-mode.outputs.mode }}

      - name: Remove root before project code
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/drop-root  # zizmor: ignore[self-repository]
        with:
          # The opt-in visual tier runs in a job container as root; recorded, not dropped.
          container-root: ${{ inputs.concern == 'e2e-visual' }}

      - name: Install the shared sanitizers
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/sanitize  # zizmor: ignore[self-repository]

      - name: Install the shared concern reporting
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/concern-report  # zizmor: ignore[self-repository]

      - name: Set up Node.js and install the locked JavaScript dependencies
        if: (inputs.concern != 'taurine-cli' && !startsWith(inputs.concern, 'rust-') && !startsWith(inputs.concern, 'scan-')) || inputs.concern == 'scan-security' || inputs.concern == 'rust-packaging'
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/node-setup  # zizmor: ignore[self-repository]
        with:
          root: true
          desktop: true
          mobile: true
          # The browser tiers are frontend-only: they do not need the vendored OpenVPN3 sources.
          vendor-fetch: ${{ inputs.concern != 'scan-security' && inputs.concern != 'rust-packaging' && !startsWith(inputs.concern, 'e2e-') }}

      - name: Set up the Rust toolchain
        if: inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security'
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/rust-toolchain  # zizmor: ignore[self-repository]
        with:
          # The clippy scan compiles the workspace, so it takes the same system libraries
          # as the rust-app concern (webkit, dbus, openssl).
          concern: ${{ inputs.concern == 'scan-security' && 'rust-app' || inputs.concern }}

      - name: Fetch pinned vendored sources
        if: inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security'
        shell: bash
        run: |
          set -euo pipefail
          # `fetch` verifies each download against the sha256 pinned in
          # vendor.lock and applies the reviewed boringtun zeroize patch, so this
          # is a supply-chain check as much as a prerequisite.
          if ! bash scripts/vendor-openvpn3.sh fetch >"${RUNNER_TEMP}/vendor-fetch.log" 2>&1; then
            echo 'vendor-fetch: failed (detailed output withheld)' >&2
            exit 1
          fi
          echo 'vendor-fetch: passed'

      # Third-party crate sources only: cargo's registry index, the downloaded
      # `.crate` archives and the git dependency databases. Never `target/`, never
      # an extracted source tree, never anything under the checked-out private
      # source, so no private code ever enters this cache. The key is the OS and a
      # hash of the private Cargo.lock files (which reveals nothing about their
      # contents), shared by every Rust concern on this OS: one entry per OS and
      # lockfile set, not one per concern. The fallback key is safe here because every
      # restored archive is re-verified against the lock checksums below.
      - name: Locate Cargo home for the third-party source cache
        id: cargo-home
        if: ${{ inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security' }}
        shell: bash
        run: |
          set -euo pipefail
          dir="${CARGO_HOME:-${HOME}/.cargo}"
          if command -v cygpath >/dev/null 2>&1; then
            dir="$(cygpath -m "${dir}")"
          fi
          echo "dir=${dir}" >> "${GITHUB_OUTPUT}"

      # Third-party crate source cache (restore, completion and save): main only, for a protected
      # source SHA (ref isolation, finding H1). A cache write needs only the runner's runtime token, so
      # any run's code can write its own ref's scope; feature-branch SHAs therefore run from the
      # untrusted ref, whose scope main never reads, and main runs only protected-ancestry SHAs (the
      # source checkout refuses any other). Each of the three steps carries both top-level terms
      # (github.ref == main, protected-ancestor == true) and the cache policy fails if one does not.
      - name: Restore cached third-party crate sources
        id: cargo-sources
        if: ${{ github.ref == 'refs/heads/main' && steps.verified-source.outputs.protected-ancestor == 'true' && (inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cargo-home.outputs.dir }}/registry/cache
          key: cargo-sources-v3-${{ runner.os }}-${{ hashFiles('src/Cargo.lock', 'src/taurine-backend/*/Cargo.lock', 'src/taurine-backend/vendor/*/Cargo.lock', 'src/vendor/*/Cargo.lock') }}
          restore-keys: |
            cargo-sources-v3-${{ runner.os }}-

      # Defence in depth: do not rely on cargo alone to notice a tampered archive.
      # Every restored `.crate` must hash to the checksum recorded for it in a
      # private Cargo.lock; anything that does not match, or is not in a lock at
      # all, is deleted before cargo runs. Only counts are printed.
      - name: Verify restored crate archives against Cargo.lock
        if: ${{ inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security' }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/verify-cargo-cache  # zizmor: ignore[self-repository]
        with:
          sources-dir: ${{ steps.cargo-home.outputs.dir }}
          cache-hit: ${{ steps.cargo-sources.outputs.cache-hit }}
          os-label: Linux

      # Saved before any project code runs, so nothing the private SHA's build scripts, proc
      # macros or tests do can reach what is saved: only from the protected main branch, only
      # for a source SHA on a protected private branch (the source-checkout ancestry answer),
      # only on a miss, and under the key the restore step computed (cache-primary-key), never
      # a hashFiles evaluated later. Only registry/cache is cached: every `.crate` in it is
      # re-hashed against Cargo.lock on restore, whereas the registry index and git databases
      # could not be verified, so cargo rebuilds them. The entry is shared by every Rust concern
      # on this OS, so the saver first fetches every crate each lockfile names (all platforms);
      # cargo verifies each download against the lock checksum and runs no build script.
      - name: Complete the third-party source set before saving
        if: ${{ github.ref == 'refs/heads/main' && (inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security') && steps.verified-source.outputs.protected-ancestor == 'true' && steps.cargo-sources.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r lock; do
            manifest="$(dirname "${lock}")/Cargo.toml"
            [[ -f "${manifest}" ]] || continue
            if ! cargo fetch --locked --manifest-path "${manifest}" >"${RUNNER_TEMP}/cargo-fetch.log" 2>&1; then
              echo 'cargo-fetch: one lockfile could not be fetched completely (detail withheld)'
            fi
          done < <(find . -name Cargo.lock -not -path '*/node_modules/*' -not -path '*/target/*' | sort)
          echo 'cargo-fetch: done'

      - name: Save verified third-party crate sources
        if: ${{ github.ref == 'refs/heads/main' && (inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') || inputs.concern == 'scan-security') && steps.verified-source.outputs.protected-ancestor == 'true' && steps.cargo-sources.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cargo-home.outputs.dir }}/registry/cache
          key: ${{ steps.cargo-sources.outputs.cache-primary-key }}

      # Compiled third-party dependency cache: main only, for a protected source SHA (ref isolation,
      # finding H1). cargo never re-verifies a compiled .rlib, so an entry is only as trustworthy as
      # whoever could write main's scope: since main runs only protected-ancestry SHAs (feature SHAs run
      # from the untrusted ref, whose scope main never reads), that is protected code only. Every
      # restore, strip and save step carries both top-level terms and the cache policy enforces it. The
      # locate step only computes the key and keeps the target directory outside the private checkout.
      - name: Locate the compiled dependency cache
        id: cargo-target
        if: ${{ startsWith(inputs.concern, 'rust-app-') }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/rust-target-cache  # zizmor: ignore[self-repository]
        with:
          mode: locate
          group: rust-app
          features: test-default+check-openvpn
          os-label: Linux

      - name: Restore compiled third-party dependencies
        id: cargo-target-cache
        if: ${{ github.ref == 'refs/heads/main' && steps.verified-source.outputs.protected-ancestor == 'true' && startsWith(inputs.concern, 'rust-app-') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cargo-target.outputs.dir }}/debug/deps
            ${{ steps.cargo-target.outputs.dir }}/debug/build
            ${{ steps.cargo-target.outputs.dir }}/debug/.fingerprint
          key: ${{ steps.cargo-target.outputs.key }}

      - name: Strip workspace crates from the restored dependency cache
        if: ${{ github.ref == 'refs/heads/main' && steps.verified-source.outputs.protected-ancestor == 'true' && startsWith(inputs.concern, 'rust-app-') }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/rust-target-cache  # zizmor: ignore[self-repository]
        with:
          mode: restored
          dir: ${{ steps.cargo-target.outputs.dir }}
          cache-hit: ${{ steps.cargo-target-cache.outputs.cache-hit }}
          os-label: Linux

      - name: Install the pinned Playwright browser
        # e2e-visual runs in the Playwright image, whose browsers are preinstalled.
        if: startsWith(inputs.concern, 'e2e-') && inputs.concern != 'e2e-visual'
        shell: bash
        run: |
          set -euo pipefail
          # --no-install keeps the CLI resolving from the locked devDependency
          # rather than fetching a floating one from the registry; the browser
          # build it then downloads is the one that version pins. Only Chromium:
          # every Playwright project in the suite uses Desktop Chrome. No
          # --with-deps: that would need root, which is gone by now; root-setup
          # installed the same Chromium host libraries before drop-root.
          if ! (cd taurine-desktop && npx --no-install playwright install chromium) \
            >"${RUNNER_TEMP}/playwright-install.log" 2>&1; then
            echo 'playwright-install: failed (detailed output withheld)' >&2
            exit 1
          fi
          echo 'playwright-install: passed'

      - name: Run the scanner
        if: inputs.concern == 'scan-security'
        # One job, five scanners (gitleaks, npm audit, Semgrep, cargo-deny, clippy): each runs as
        # its own step with its own report, so one failing scanner does not hide the others.
        # Clippy, the slow one, runs last.
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/scan-concern  # zizmor: ignore[self-repository]
        with:
          scanner: all

      - name: Run the isolated Linux JavaScript concern
        id: concern-js
        if: ${{ contains(fromJSON('["contracts","frontend-build-budget","desktop-shard-1","desktop-shard-2","desktop-quality","mobile-quality"]'), inputs.concern) }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/linux-concern-js  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}

      - name: Run the isolated Linux browser concern
        id: concern-e2e
        if: ${{ startsWith(inputs.concern, 'e2e-') }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/linux-concern-e2e  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}

      - name: Run the isolated Linux Rust concern
        id: concern-rust
        if: ${{ inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-') }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/linux-concern-rust  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}

      # A concern no family above handles must fail loudly, never pass by omission.
      - name: Reject an unsupported concern
        if: ${{ inputs.concern != 'scan-security' && !(contains(fromJSON('["contracts","frontend-build-budget","desktop-shard-1","desktop-shard-2","desktop-quality","mobile-quality"]'), inputs.concern) || startsWith(inputs.concern, 'e2e-') || inputs.concern == 'taurine-cli' || startsWith(inputs.concern, 'rust-')) }}
        shell: bash
        env:
          CONCERN: ${{ inputs.concern }}
        run: |
          echo "Unsupported Linux validation concern: ${CONCERN}" >&2
          exit 2

      # Disabled with the restore above (finding H1). When re-enabled: only the build that
      # runs everything the key covers saves it, only on a miss, only for a protected source
      # SHA, only after the concern passed and the strip-and-prove step succeeded.
      - name: Strip and prove the compiled dependency cache
        id: cargo-target-strip
        if: ${{ github.ref == 'refs/heads/main' && inputs.concern == 'rust-app-2' && steps.verified-source.outputs.protected-ancestor == 'true' && steps.cargo-target-cache.outputs.cache-hit != 'true' && steps.concern-rust.outcome == 'success' }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/rust-target-cache  # zizmor: ignore[self-repository]
        with:
          mode: save
          dir: ${{ steps.cargo-target.outputs.dir }}
          os-label: Linux

      - name: Save compiled third-party dependencies
        if: ${{ github.ref == 'refs/heads/main' && inputs.concern == 'rust-app-2' && steps.verified-source.outputs.protected-ancestor == 'true' && steps.cargo-target-cache.outputs.cache-hit != 'true' && steps.cargo-target-strip.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.cargo-target.outputs.dir }}/debug/deps
            ${{ steps.cargo-target.outputs.dir }}/debug/build
            ${{ steps.cargo-target.outputs.dir }}/debug/.fingerprint
          key: ${{ steps.cargo-target.outputs.key }}

      - name: Publish sanitized validation proof
        shell: bash
        env:
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          CONCERN: ${{ inputs.concern }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse --verify HEAD | tr '[:upper:]' '[:lower:]')"
          requested_sha="${REQUESTED_SOURCE_SHA,,}"
          [[ "${checked_out_sha}" == "${requested_sha}" ]]
          {
            echo "## Linux ${CONCERN} validation"
            echo
            echo "- Source SHA: \`${checked_out_sha}\`"
            echo '- Validation passed on an isolated hosted runner.'
            echo '- Source token: revoked before dependency installation and project commands'
            echo '- Outputs: no source files, logs, reports, or artifacts published'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Names the tests that ran, including failures (see the linux-test-identities composite:
      # sanitised repo-relative paths and titles only, collected after the token is revoked).
      - name: Publish test identities exercised by this concern
        # Failed validation still owns useful sanitized identities. Never run
        # private collector code without successful exact-source verification
        # and token revocation, or after cancellation/setup-only failures.
        if: ${{ always() && !cancelled() && steps.verified-source.outcome == 'success' && (contains(fromJSON('["success","failure"]'), steps.concern-js.outcome) || contains(fromJSON('["success","failure"]'), steps.concern-e2e.outcome) || contains(fromJSON('["success","failure"]'), steps.concern-rust.outcome)) }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/linux-test-identities  # zizmor: ignore[self-repository]
        with:
          concern: ${{ inputs.concern }}
          source-sha: ${{ inputs.source_sha }}

      # The job's own wall-clock time, shown next to its result; the timings job
      # tabulates it against a committed baseline.
      - name: Report concern duration
        if: ${{ always() }}
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/timings  # zizmor: ignore[self-repository]
        with:
          mode: report

      - name: Report observed egress
        if: always()
        continue-on-error: true
        # Kept as ./ : the policy matches this exact form for local actions.
        uses: ./.github/actions/egress-audit  # zizmor: ignore[self-repository]
        with:
          phase: report
          mode: ${{ steps.egress-mode.outputs.mode }}
